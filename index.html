<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="内化" />
  <meta name="theme-color" content="#F8F6F1" id="meta-theme-color" />
  <title>内化 · 双引擎认知助手</title>

  <!-- Inline SVG Favicon (Zero external dependency) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%234E6E5D'/%3E%3Cpath d='M19 42C19 27 31 19 45 19C45 34 34 45 19 42Z' fill='%23F8F6F1' fill-opacity='0.94'/%3E%3Ccircle cx='28' cy='34' r='3.2' fill='%234E6E5D'/%3E%3C/svg%3E" />

  <style>
    /* =====================================================================
       DESIGN TOKENS: Warm Paper Light Mode & Eye-Care Dark Mode
       ===================================================================== */
    :root {
      --bg: #F8F6F1;
      --surface: #FFFFFF;
      --surface-soft: #F1EDE5;
      --surface-subtle: #F5F2EB;
      --border: #E6E0D5;
      --border-soft: rgba(230, 224, 213, 0.65);
      --ink: #262422;
      --ink-secondary: #57524C;
      --ink-muted: #847D74;
      --sage: #4E6E5D;
      --sage-hover: #3F5B4C;
      --sage-soft: #EAF1ED;
      --sage-border: rgba(78, 110, 93, 0.22);
      --terra: #B57254;
      --terra-soft: #F8EDE7;
      --terra-border: rgba(181, 114, 84, 0.24);
      --shadow-sm: 0 2px 10px rgba(38, 36, 34, 0.04);
      --shadow-md: 0 10px 30px rgba(38, 36, 34, 0.08);
      --backdrop: rgba(22, 21, 19, 0.42);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 26px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html.dark {
      --bg: #161513;
      --surface: #21201D;
      --surface-soft: #2A2824;
      --surface-subtle: #1C1B18;
      --border: #33302B;
      --border-soft: rgba(51, 48, 43, 0.72);
      --ink: #EAE5DD;
      --ink-secondary: #C4BEB4;
      --ink-muted: #938C82;
      --sage: #7BA68F;
      --sage-hover: #8CB7A0;
      --sage-soft: #213028;
      --sage-border: rgba(123, 166, 143, 0.26);
      --terra: #D49172;
      --terra-soft: #33251E;
      --terra-border: rgba(212, 145, 114, 0.28);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 34px rgba(0, 0, 0, 0.45);
      --backdrop: rgba(0, 0, 0, 0.62);
    }

    /* =====================================================================
       BASE RESET & MOBILE-FIRST SMOOTH SCROLLING SHELL
       (Never put overflow-x: hidden or overscroll-behavior-y: none on html+body)
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      height: auto;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
      overflow-x: clip;
      touch-action: pan-y;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.modal-open {
      overflow: hidden;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      user-select: none;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.52;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
    }

    @media (min-width: 520px) {
      .shell {
        border-left: 1px solid var(--border-soft);
        border-right: 1px solid var(--border-soft);
      }
    }

    @media (min-width: 768px) {
      .shell.forest-wide {
        max-width: 1180px;
      }
      .shell.forest-wide .bottom-nav {
        max-width: 560px;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        border-top-left-radius: 18px;
        border-top-right-radius: 18px;
      }
    }

    /* =====================================================================
       ANIMATIONS
       ===================================================================== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .anim-up {
      animation: fadeUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-pulse {
      animation: pulseSoft 1.5s ease-in-out infinite;
    }

    /* =====================================================================
       COMMON UI COMPONENTS
       ===================================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .input, .textarea, .select {
      width: 100%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      font-size: 16px; /* Prevents iOS Safari auto-zoom */
      line-height: 1.55;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .input:focus, .textarea:focus, .select:focus {
      border-color: var(--sage);
      background: var(--surface);
    }

    .textarea {
      resize: vertical;
      min-height: 72px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 46px;
      padding: 11px 18px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 500;
      transition: transform 0.14s ease, opacity 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      min-height: 36px;
      padding: 7px 13px;
      font-size: 13px;
      border-radius: var(--radius-sm);
    }

    .btn-xs {
      min-height: 30px;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 10px;
    }

    .btn-primary {
      background: var(--sage);
      color: #FFFFFF;
    }

    html.dark .btn-primary {
      color: #161513;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--sage-hover);
    }

    .btn-ink {
      background: var(--ink);
      color: var(--bg);
    }

    .btn-ink:hover:not(:disabled) {
      opacity: 0.92;
    }

    .btn-soft {
      background: var(--surface-soft);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-terra {
      background: var(--terra-soft);
      color: var(--terra);
      border: 1px solid var(--terra-border);
    }

    .btn-sage-soft {
      background: var(--sage-soft);
      color: var(--sage);
      border: 1px solid var(--sage-border);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-muted);
      min-height: 34px;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--ink);
      background: var(--surface-soft);
    }

    .inline-notice {
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      line-height: 1.55;
      word-break: break-word;
    }

    .inline-notice.terra {
      background: var(--terra-soft);
      border: 1px solid var(--terra-border);
      color: var(--terra);
    }

    .inline-notice.sage {
      background: var(--sage-soft);
      border: 1px solid var(--sage-border);
      color: var(--sage);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      border-radius: 999px;
      background: var(--border);
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .switch.on {
      background: var(--sage);
    }

    .switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .switch.on .switch-knob {
      transform: translateX(20px);
    }

    /* Range Slider */
    input[type="range"] {
      width: 100%;
      accent-color: var(--sage);
      cursor: pointer;
    }

    /* Segmented View Switch */
    .seg-bar {
      display: inline-flex;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 12px;
      width: 100%;
    }

    .seg-btn {
      flex: 1;
      min-height: 34px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
      transition: all 0.18s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    /* =====================================================================
       AUTH WALL (PRIVATE GATE - ONLY RENDERED WHEN LOGGED OUT)
       ===================================================================== */
    #auth-wall {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(var(--safe-top) + 24px) 22px calc(var(--safe-bottom) + 32px);
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: var(--sage);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 8px 20px rgba(78, 110, 93, 0.22);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-title {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .auth-subtitle {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--ink-muted);
    }

    .auth-error {
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      background: var(--terra-soft);
      border: 1px solid var(--terra-border);
      color: var(--terra);
      font-size: 13px;
      line-height: 1.5;
    }

    .db-config-details {
      margin-top: 16px;
      border-top: 1px solid var(--border-soft);
      padding-top: 14px;
    }

    .db-config-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--ink-muted);
      padding: 4px 2px;
    }

    .db-config-summary::-webkit-details-marker {
      display: none;
    }

    .db-status-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink-muted);
    }

    .db-status-tag.ready {
      background: var(--sage-soft);
      color: var(--sage);
    }

    /* =====================================================================
       MAIN APP LAYOUT & BOTTOM NAVIGATION
       ===================================================================== */
    #app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .tab-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 96px);
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .page-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .page-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--ink-muted);
    }

    /* Ultra-thin progress bar */
    .progress-track {
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: var(--sage);
      border-radius: 999px;
      transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Sync indicator pill */
    .sync-dot-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-muted);
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sage);
      flex-shrink: 0;
    }

    .sync-dot.syncing {
      background: var(--terra);
      animation: pulseSoft 1s infinite;
    }

    .sync-dot.error {
      background: #C45B4D;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 30;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }

    html.dark .bottom-nav {
      background: rgba(33, 32, 29, 0.94);
    }

    .bottom-nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 62px;
      padding: 0 6px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 500;
      border-radius: 14px;
      transition: color 0.18s ease;
    }

    .nav-item.active {
      color: var(--sage);
    }

    .nav-item {
      position: relative;
    }

    .nav-badge-dot {
      position: absolute;
      top: 9px;
      right: calc(50% - 16px);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sage);
    }

    /* Floating Persistent Quick Capture FAB */
    .capture-fab {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 74px);
      right: max(16px, calc(50% - 224px));
      z-index: 32;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--sage);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      transition: transform 0.14s ease, opacity 0.18s ease, background-color 0.18s ease;
    }

    html.dark .capture-fab {
      color: #161513;
    }

    .capture-fab:active {
      transform: scale(0.96);
    }

    @media (min-width: 768px) {
      .shell.forest-wide .capture-fab {
        right: max(24px, calc(50% - 566px));
      }
    }

    /* =====================================================================
       2.0 IGNITION PAGE, UNIFIED CAPTURE, FOREST CANVAS, CABINET & OBSERVER LAB
       ===================================================================== */
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--sage-soft);
      color: var(--sage);
      border: 1px solid var(--sage-border);
    }

    .ignition-anchor-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px 20px;
      box-shadow: var(--shadow-sm);
    }

    .anchor-quote {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.72;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ign-anchor-picker {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      max-height: 168px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .ign-anchor-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      padding: 8px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      background: var(--surface-subtle);
      color: var(--ink-secondary);
      font-size: 13px;
      line-height: 1.45;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .ign-anchor-item.active {
      background: var(--sage-soft);
      border-color: var(--sage-border);
      color: var(--ink);
      font-weight: 500;
    }

    .ign-anchor-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--border);
    }

    .ign-anchor-item.active .ign-anchor-dot {
      background: var(--sage);
    }

    .ign-tag-btn {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink-muted);
      border: 1px solid transparent;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .ign-tag-btn.active {
      background: var(--sage-soft);
      color: var(--sage);
      border-color: var(--sage-border);
    }

    .evidence-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-soft);
    }

    .evidence-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-secondary);
      text-align: left;
      width: 100%;
    }

    .evidence-row.clickable {
      cursor: pointer;
      background: var(--sage-soft);
      color: var(--sage);
      border: 1px solid var(--sage-border);
      font-weight: 500;
    }

    .evidence-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-muted);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .evidence-row.clickable .evidence-tag {
      color: var(--sage);
    }

    .route-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .route-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      padding: 16px 15px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      text-align: left;
      transition: transform 0.14s ease, border-color 0.18s ease;
    }

    .route-card:active {
      transform: scale(0.98);
    }

    .route-card.primary-tint {
      border-color: var(--sage-border);
    }

    /* 3-Button Ming Cabinet Approval Bar */
    .tri-approve-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .tri-approve-keep {
      grid-column: 1 / -1;
    }

    /* Breakthrough Forest Workspace */
    .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.fuzzy {
      background: #B8B2A8;
      border: 1.5px solid var(--ink-muted);
    }

    .status-dot.active {
      background: #D99B4E;
    }

    .status-dot.solved {
      background: var(--sage);
    }

    .forest-cover {
      background: var(--surface);
      border: 1px solid var(--sage-border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .forest-canvas-shell {
      position: relative;
      width: 100%;
      height: 62vh;
      min-height: 400px;
      max-height: 760px;

      gap: 12px;

      font-size: 12px;

    .timeline-dot {

      left: -19px;
      top: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sage);

       SETTINGS TAB SPECIFICS
       ===================================================================== */
    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;

    .setting-row {

      flex-wrap: wrap;

      margin-bottom: 12px;

    .preset-chip {

      border-radius: 999px;
      font-size: 12px;

      color: var(--ink-secondary);
      border: 1px solid var(--border);
      transition: all 0.16s ease;

    .preset-chip.active {
      background: var(--sage-soft);
      color: var(--sage);
      border-color: var(--sage-border);

    .stat-grid {

      margin: 12px 0;

    .stat-box {

      margin-top: 2px;
    }

    .pw-wrap {
      position: relative;
    }

    }

    .pw-eye {

      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      border-radius: 8px;
    }

    /* =====================================================================
       MODAL & TOAST
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--backdrop);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: flex;
      align-items: flex-end;
      justify-content: center;

    @media (min-width: 520px) {

        padding: 16px;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;

    @media (min-width: 520px) {

        border-radius: 24px;
        border: 1px solid var(--border);
        padding: 22px;
      }
    }

    .toast-wrap {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      width: 90%;
      max-width: 400px;
      display: flex;
      justify-content: center;
      pointer-events: none;

      color: var(--bg);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      text-align: center;
      max-width: 100%;
      word-break: break-word;
    }

      // =====================================================================
      // 3. PWA ICON & DYNAMIC MANIFEST GENERATOR (ZERO EXTERNAL ASSETS)
      // =====================================================================
      function initPwaAssets() {
        try {
          const drawIconPng = (size) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            if (!ctx) return '';

            const r = size * 0.24;
            ctx.fillStyle = '#4E6E5D';
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(248, 246, 241, 0.95)';
            ctx.beginPath();
            ctx.moveTo(size * 0.29, size * 0.67);
            ctx.bezierCurveTo(size * 0.29, size * 0.42, size * 0.47, size * 0.29, size * 0.71, size * 0.29);
            ctx.bezierCurveTo(size * 0.71, size * 0.54, size * 0.54, size * 0.71, size * 0.29, size * 0.67);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#4E6E5D';
            ctx.beginPath();
            ctx.arc(size * 0.44, size * 0.53, size * 0.055, 0, Math.PI * 2);
            ctx.fill();

            return canvas.toDataURL('image/png');
          };

          const icon180 = drawIconPng(180);
          const icon512 = drawIconPng(512);

          if (icon180) {
            const appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            appleLink.sizes = '180x180';
            appleLink.href = icon180;
            document.head.appendChild(appleLink);
          }

          if (icon512) {
            const manifest = {
              name: '内化 · 轻量认知助手',
              short_name: '内化',
              description: '低认知负荷的遗忘曲线保鲜与认知螺旋内化工具',
              start_url: './',
              display: 'standalone',
              background_color: '#F8F6F1',
              theme_color: '#4E6E5D',
              icons: [
                { src: icon180, sizes: '180x180', type: 'image/png' },
                { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
              ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(blob);
            const mLink = document.createElement('link');
            mLink.rel = 'manifest';
            mLink.href = manifestUrl;
            document.head.appendChild(mLink);
          }
        } catch (_) {
          // Safe fallback if canvas/blob is restricted
        }
      }

      function showToast(message, duration = 2800) {
        const wrap = document.getElementById('toast-wrap');

      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => showToast('已复制到剪贴板'),
            () => fallbackCopy(text)
          );
          return true;
        }
        return fallbackCopy(text);
      }

      function fallbackCopy(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) {
            showToast('已复制到剪贴板');
            return true;
          }
        } catch (_) {}
        showToast('复制受限，请长按文本框手动复制');
        return false;
      }

      function downloadFile(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function localDateKey(d = new Date()) {
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }

      function startOfTodayMs() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      }

      function endOfTodayMs() {
        const d = new Date();
        d.setHours(23, 59, 59, 999);
        return d.getTime();
      }

      function formatTime(isoOrMs) {
        if (!isoOrMs) return '-';
        const d = new Date(isoOrMs);
        if (Number.isNaN(d.getTime())) return '-';
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function isValidUuid(str) {
        return typeof str === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(str);
      }

      function makeClientId() {
        return `c_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      }

      function normalizeDomainLabel(tag) {
        const cleaned = String(tag || '').trim().replace(/\s+/g, '');
        return cleaned ? cleaned.slice(0, 14) : UNCLASSIFIED_LABEL;
      }

      /**
       * Dynamically collect existing user categories ordered by card count DESC
       */
      function getExistingDomains(includeUnclassified = false) {
        const counts = new Map();
        for (const c of state.cards) {
          const dom = normalizeDomainLabel(c.domain_tag);
          if (!includeUnclassified && dom === UNCLASSIFIED_LABEL) continue;
          counts.set(dom, (counts.get(dom) || 0) + 1);
        }
        return Array.from(counts.entries())
          .sort((a, b) => {
            if (a[0] === UNCLASSIFIED_LABEL) return 1;
            if (b[0] === UNCLASSIFIED_LABEL) return -1;
            return b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN');
          })
          .map(([name, count]) => ({ name, count }));
      }

      function setSyncStatus(status) {
        state.syncStatus = status;
        const dot = document.getElementById('sync-dot');
        const txt = document.getElementById('sync-dot-text');
        if (!dot || !txt) return;
        const pending = state.syncQueue.length;
        dot.className = 'sync-dot' + (status === 'syncing' ? ' syncing' : (status === 'error' || pending > 0) ? ' error' : '');
        if (status === 'syncing') {
          txt.textContent = pending > 0 ? `同步中 (${pending})` : '同步中';
        } else if (status === 'error' || pending > 0) {
          txt.textContent = pending > 0 ? `待同步 (${pending})` : '待重试';
        } else {
          txt.textContent = '云端已同步';
        }
      }

      // =====================================================================
      // 5. VISIBILITY-AWARE STOPWATCH FOR REVIEW TIMING
      // =====================================================================
      function isInActiveReviewView() {
        return state.activeTab === 'preserve' && state.preserveSubTab === 'review';
      }

      function pauseActiveReviewTimer() {
        if (!isInActiveReviewView() || !state.review.segStartMs) return;
        const delta = Math.max(0, Date.now() - state.review.segStartMs);
        if (state.review.phase === 'front') state.review.frontAccMs += delta;
        else state.review.backAccMs += delta;
        state.review.segStartMs = 0;
      }

      function resumeActiveReviewTimer() {
        if (!isInActiveReviewView() || document.hidden) return;
        if (state.review.index < state.review.queue.length && !state.review.segStartMs) {
          state.review.segStartMs = Date.now();
        }
      }

      function getCurrentPhaseElapsedMs() {
        const extra = (!document.hidden && state.review.segStartMs)
          ? Math.max(0, Date.now() - state.review.segStartMs)
          : 0;
        const raw = (state.review.phase === 'front' ? state.review.frontAccMs : state.review.backAccMs) + extra;
        return clamp(Math.round(raw), 80, 300000);
      }

      // =====================================================================
      // 6. FSRS-4.5 FORGETTING CURVE (2-BUTTON BALANCED) & 4-TIER SCHEDULER
      // =====================================================================
      const FSRS_W = [
        0.4072, 1.1829, 3.1262, 15.4722,
        7.2102, 0.5316, 1.0651, 0.0234,
        1.616, 0.1544, 1.0824, 1.9813,
        0.0953, 0.2975, 2.2042, 0.2407, 2.9466
      ];
      const FSRS_FACTOR = 19 / 81;
      const FSRS_DECAY = -0.5;

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      /**
       * FSRS-4.5 Retrievability: R(t, S) = (1 + (19/81) * (t / S))^(-0.5)
       */
      function computeRetrievability(fsrsState, nowMs = Date.now()) {
        if (!fsrsState || !fsrsState.last_review) return 0.9;
        const lastMs = new Date(fsrsState.last_review).getTime();
        if (Number.isNaN(lastMs)) return 0.9;
        const elapsedDays = Math.max(0, (nowMs - lastMs) / MS_PER_DAY);
        const S = Math.max(0.15, Number(fsrsState.stability) || 1.0);
        return Math.pow(1 + FSRS_FACTOR * (elapsedDays / S), FSRS_DECAY);
      }

      /**
       * Create initial FSRS state for a newly captured card (tomorrow AND >= 6h later)
       */
      function createInitialFsrsState(nowMs = Date.now()) {
        const dueMs = Math.max(startOfTodayMs() + MS_PER_DAY, nowMs + MIN_FIRST_REVIEW_DELAY_MS);
        const dueIso = new Date(dueMs).toISOString();
        return {
          stability: 1.0,
          difficulty: 5.0,
          elapsed_days: 0,
          scheduled_days: 1,
          reps: 0,
          lapses: 0,
          state: 0, // 0=New, 1=Learning, 2=Review, 3=Relearning
          last_review: new Date(nowMs).toISOString(),
          due: dueIso
        };
      }

      /**
       * Balanced 2-button FSRS-4.5 scheduler (eliminates binary Ease/Difficulty Hell):
       * 'good' -> Rating 3 (想起来了)
       * 'again' -> Rating 1 (有点模糊)
       */
      function scheduleFsrsCard(prev, ratingKey, nowMs = Date.now()) {
        const G = ratingKey === 'good' ? 3 : 1;
        const base = prev && typeof prev === 'object' ? prev : createInitialFsrsState(nowMs - MS_PER_DAY);

        const lastMs = base.last_review ? new Date(base.last_review).getTime() : (nowMs - MS_PER_DAY);
        const elapsedDays = Number(Math.max(0, (nowMs - lastMs) / MS_PER_DAY).toFixed(2));
        const prevReps = Number(base.reps) || 0;
        const prevLapses = Number(base.lapses) || 0;

        let S, D, scheduledDays, nextState;

        if (prevReps === 0 || base.state === 0) {
          if (G === 3) {
            S = FSRS_W[2]; // ~3.13 days
            D = 5.0;       // Neutral midpoint for 2-button scale
            scheduledDays = Math.max(1, Math.round(S));
            nextState = 2;
          } else {
            S = FSRS_W[0]; // ~0.41 days
            D = 6.2;
            scheduledDays = 1;
            nextState = 1;
          }
        } else {
          const prevS = Math.max(0.25, Number(base.stability) || 1.0);
          const prevD = clamp(Number(base.difficulty) || 5.0, 1.5, 9.5);
          const R = Math.pow(1 + FSRS_FACTOR * (elapsedDays / prevS), FSRS_DECAY);

          if (G === 3) {
            // Smooth difficulty recovery & gentle mastery progression
            const targetD = 4.5;
            const stepBonus = prevD > 4.5 ? 0.25 : 0.12;
            D = clamp(0.18 * targetD + 0.82 * prevD - stepBonus, 1.5, 9.5);

            const inc = Math.exp(FSRS_W[8]) *
              (11 - D) *
              Math.pow(prevS, -FSRS_W[9]) *
              (Math.exp(FSRS_W[10] * (1 - R)) - 1);
            S = clamp(prevS * (1 + Math.max(0.25, inc)), 1.0, 365);
            const minNextDay = Math.min(365, Math.max(2, Math.round(prevS) + 1));
            scheduledDays = clamp(Math.round(S), minNextDay, 365);
            nextState = 2;
          } else {
            // Gentle lapse penalty without trapping card in permanent high difficulty
            D = clamp(prevD + 1.15, 1.5, 9.5);

            const sf = FSRS_W[11] *
              Math.pow(D, -FSRS_W[12]) *
              (Math.pow(prevS + 1, FSRS_W[13]) - 1) *
              Math.exp(FSRS_W[14] * (1 - R));
            S = clamp(Math.min(prevS * 0.7, sf), 0.35, 30);
            scheduledDays = 1;
            nextState = 3;
          }
        }

        const dueIso = new Date(startOfTodayMs() + scheduledDays * MS_PER_DAY).toISOString();
        return {
          stability: Number(S.toFixed(2)),
          difficulty: Number(D.toFixed(2)),
          elapsed_days: elapsedDays,
          scheduled_days: scheduledDays,
          reps: prevReps + 1,
          lapses: G === 1 ? prevLapses + 1 : prevLapses,
          state: nextState,
          last_review: new Date(nowMs).toISOString(),
          due: dueIso
        };
      }

      /**
       * Derive today's usage records strictly from cloud-backed activity_logs
       * (Survives page refreshes, PWA restarts, and multi-device switching)
       */
      function getTodayCloudStats() {
        const todayStart = startOfTodayMs();
        const todayKey = localDateKey();
        const reviewedTodayIds = new Set();
        let reviewedTodayCount = 0;
        let sunkenShownToday = 0;

        for (const log of state.activityLogs) {
          if (log.event_type !== 'review' || log._undone) continue;
          const p = log.payload || {};
          const matchDay = p.session_date
            ? p.session_date === todayKey
            : (log.created_at && new Date(log.created_at).getTime() >= todayStart);
          if (!matchDay) continue;

          reviewedTodayCount++;
          if (log.card_id) reviewedTodayIds.add(log.card_id);
          if (p.tier === 'tier4') sunkenShownToday++;
        }

        return {
          reviewedTodayCount,
          reviewedTodayIds,
          sunkenShownToday
        };
      }

      /**
       * Partition due cards into the 4 anti-avalanche priority tiers
       */
      function classifyTiers(excludeSet) {
        const now = Date.now();
        const todayStart = startOfTodayMs();
        const todayEnd = endOfTodayMs();

        const tier1 = []; // Due today & fresh (scheduled_days <= 7 or reps <= 2)
        const tier2 = []; // Due today & stable
        const tier3 = []; // Historical overdue reservoir, R >= 0.30 (semi-ripe)
        const tier4 = []; // Historical overdue reservoir, R < 0.30 (sunken)

        for (const card of state.cards) {
          if (excludeSet.has(card.id)) continue;
          const dueMs = card.due_at ? new Date(card.due_at).getTime() : todayStart;
          if (dueMs > todayEnd) continue; // Future card, not due yet

          const fsrs = card.fsrs_state || {};
          const sched = Number(fsrs.scheduled_days) || 1;
          const reps = Number(fsrs.reps) || 0;
          const R = computeRetrievability(fsrs, now);

          if (dueMs >= todayStart) {
            if (sched <= 7 || reps <= 2) {
              tier1.push({ card, sched, dueMs, R });
            } else {
              tier2.push({ card, sched, dueMs, R });
            }
          } else {
            if (R >= 0.30) {
              tier3.push({ card, R, dueMs });
            } else {
              tier4.push({ card, R, dueMs });
            }
          }
        }

        tier1.sort((a, b) => a.sched - b.sched || a.dueMs - b.dueMs);
        tier2.sort((a, b) => a.dueMs - b.dueMs);
        tier3.sort((a, b) => b.R - a.R);
        tier4.sort((a, b) => b.R - a.R);

        return {
          tier1: tier1.map(x => x.card),
          tier2: tier2.map(x => x.card),
          tier3: tier3.map(x => x.card),
          tier4: tier4.map(x => x.card)
        };
      }

      /**
       * Build today's clean queue honoring cloud-persisted daily cap,
       * post-break semi-ripe rescue, silent 1-in-4 mixing, and 1-2/day sunken revival.
       */
      function buildTodayQueue() {
        const cap = clamp(Number(state.prefs.daily_limit) || 50, 5, 150);
        const mix = Boolean(state.prefs.mix_backlog);
        const stats = getTodayCloudStats();
        const remainingQuota = Math.max(0, cap - stats.reviewedTodayCount);

        const { tier1, tier2, tier3, tier4 } = classifyTiers(stats.reviewedTodayIds);
        const allAvailableCount = tier1.length + tier2.length + tier3.length + tier4.length;

        state.review.inExtraBatch = false;

        if (remainingQuota === 0) {
          state.review.queue = [];
          state.review.index = 0;
          state.review.hasReservoir = allAvailableCount > 0;
          resetCardTurnState();
          return;
        }

        const todayDue = [
          ...tier1.map(c => ({ id: c.id, tier: 'tier1' })),
          ...tier2.map(c => ({ id: c.id, tier: 'tier2' }))
        ];

        const queue = [];
        let t3Idx = 0;
        let t4Idx = 0;
        let todayCount = 0;
        let sunkenPlanned = stats.sunkenShownToday;

        // 1. Add strictly today-due cards, silently mixing 1 Tier-3 every 4 cards
        for (const item of todayDue) {
          if (queue.length >= remainingQuota) break;
          queue.push({ id: item.id, tier: item.tier, extraBatch: false });
          todayCount++;
          if (mix && todayCount % 4 === 0 && t3Idx < tier3.length && queue.length < remainingQuota) {
            queue.push({ id: tier3[t3Idx++].id, tier: 'tier3', extraBatch: false });
          }
        }

        // 2. Valley-fill & Post-break rescue:
        //    - If returning after skipping days (todayDue == 0), gently rescue high-R semi-ripe cards up to 30% of cap (min 10)
        //    - Otherwise top up to 5-card minimum floor
        const targetFill = todayDue.length === 0
          ? Math.min(remainingQuota, Math.max(10, Math.round(cap * 0.3)))
          : Math.min(5, remainingQuota);

        while (queue.length < targetFill && t3Idx < tier3.length) {
          queue.push({ id: tier3[t3Idx++].id, tier: 'tier3', extraBatch: false });
        }

        // 3. Slow sunken revival: allow 1-2 Tier-4 sunken cards per day across sessions
        if (mix && tier4.length > 0 && sunkenPlanned < 2) {
          const sunkenAllowed = Math.min(2 - sunkenPlanned, tier4.length);
          for (let k = 0; k < sunkenAllowed; k++) {
            const sunkenItem = { id: tier4[t4Idx].id, tier: 'tier4', extraBatch: false };
            if (queue.length < remainingQuota) {
              // Place after initial warm-up cards if possible
              const insertPos = queue.length >= 4 ? queue.length - 1 : queue.length;
              queue.splice(insertPos, 0, sunkenItem);
              t4Idx++;
              sunkenPlanned++;
            } else if (queue.length >= 10) {
              // Gently swap one non-Tier-1 slot near the back so sunken cards actually revive
              let swapIdx = -1;
              for (let j = queue.length - 1; j >= 5; j--) {
                if (queue[j].tier === 'tier3' || queue[j].tier === 'tier2') {
                  swapIdx = j;
                  break;
                }
              }
              if (swapIdx >= 0) {
                queue[swapIdx] = sunkenItem;
                t4Idx++;
                sunkenPlanned++;
              }
            }
          }
        }

        // Boolean-only reservoir check (STRICTLY never expose overdue counts!)
        const queuedIds = new Set(queue.map(q => q.id));
        state.review.hasReservoir = [...tier1, ...tier2, ...tier3, ...tier4].some(c => !queuedIds.has(c.id));

        state.review.queue = queue;
        state.review.index = 0;
        resetCardTurnState();
      }

      /**
       * Voluntary extra batch: "顺手再捞 10 张"
       */
      function pullExtraTenCards() {
        const stats = getTodayCloudStats();
        const { tier1, tier2, tier3, tier4 } = classifyTiers(stats.reviewedTodayIds);
        const batch = [];
        let sunkenPlanned = stats.sunkenShownToday;

        for (const c of tier1) {
          if (batch.length >= 10) break;
          batch.push({ id: c.id, tier: 'tier1', extraBatch: true });
        }
        for (const c of tier2) {
          if (batch.length >= 10) break;
          batch.push({ id: c.id, tier: 'tier2', extraBatch: true });
        }
        for (const c of tier3) {
          if (batch.length >= 10) break;
          batch.push({ id: c.id, tier: 'tier3', extraBatch: true });
        }
        for (const c of tier4) {
          if (batch.length >= 10) break;
          if (sunkenPlanned >= 2) break;
          batch.push({ id: c.id, tier: 'tier4', extraBatch: true });
          sunkenPlanned++;
        }

        if (batch.length === 0) {
          state.review.hasReservoir = false;
          showToast('蓄水池暂时已经清空啦');
          renderReviewTab();
          return;
        }

        const picked = new Set(batch.map(x => x.id));
        state.review.hasReservoir = [...tier1, ...tier2, ...tier3, ...tier4].some(c => !picked.has(c.id));
        state.review.queue = batch;
        state.review.index = 0;
        state.review.inExtraBatch = true;
        trackActivity('preserve', 'extra_10_click', null, { count: batch.length });
        resetCardTurnState();
        renderReviewTab();
      }

      function resetCardTurnState() {
        state.review.phase = 'front';
        state.review.frontAccMs = 0;
        state.review.backAccMs = 0;
        state.review.segStartMs = (!document.hidden && isInActiveReviewView()) ? Date.now() : 0;
        state.review.editedThisReview = false;
        state.review.editedSlotIndex = null;
        state.review.editedHistoryIdx = null;
        state.review.activeTest = null;
        state.review.activeTestLoading = false;
        state.review.activeTestTriggered = false;
        state.review.activeTestExtraPrompt = '';
        state.review.scaffoldQuestions = null;
        state.review.scaffoldLoading = false;
        state.review.scaffoldTriggered = false;
        state.review.scaffoldExtraPrompt = '';
      }

      // =====================================================================
      // 7. NATIVE FETCH SUPABASE AUTH, POSTGREST & OPTIMISTIC SYNC QUEUE
      // =====================================================================
      function cleanBaseUrl(url) {
        return String(url || '').trim().replace(/\/+$/, '');
      }

      function translateSupabaseError(status, bodyText) {
        const msg = String(bodyText || '').toLowerCase();
        if (msg.includes('invalid login credentials') || msg.includes('invalid_grant')) {
          return '邮箱或密码不正确，请检查后再试。';
        }
        if (msg.includes('email not confirmed')) {
          return '该邮箱尚未在 Supabase 后台确认（勾选 Auto Confirm User 即可）。';
        }
        if (msg.includes('invalid api key') || status === 401) {
          return 'Supabase Anon Key 无效或登录已过期，请核对配置或重新登录。';
        }
        if (msg.includes('relation') && msg.includes('does not exist')) {
          return '数据库尚未建表，请先在 Supabase SQL Editor 运行建表脚本。';
        }
        if (msg.includes('row-level security') || status === 403) {
          return '没有权限操作数据，请检查 Supabase 的 RLS 安全策略是否已正确执行。';
        }
        if (status === 0) {
          return '网络连接失败，请检查 Supabase Project URL 格式或当前手机网络。';
        }
        return `云端请求失败 (${status})，请稍后重试。`;
      }

      async function sbPasswordLogin(url, anonKey, email, password) {
        const endpoint = `${cleanBaseUrl(url)}/auth/v1/token?grant_type=password`;
        let resp;
        try {
          resp = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'apikey': anonKey.trim(),
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email.trim(), password })
          });
        } catch (_) {
          throw new Error(translateSupabaseError(0, ''));
        }

        const text = await resp.text();
        if (!resp.ok) {
          throw new Error(translateSupabaseError(resp.status, text));
        }

        const data = JSON.parse(text);
        const expiresAt = data.expires_at
          ? data.expires_at * 1000
          : Date.now() + (data.expires_in || 3600) * 1000;

        return {
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          expires_at: expiresAt,
          user: {
            id: data.user?.id || '',
            email: data.user?.email || email.trim()
          }
        };
      }

      let refreshPromise = null;
      async function ensureValidAccessToken(forceRefresh = false) {
        if (!state.session || !state.sbConfig.url || !state.sbConfig.anonKey) {
          throw new Error('会话未就绪');
        }

        const now = Date.now();
        const needsRefresh = forceRefresh || !state.session.expires_at || (state.session.expires_at - now < 120000);
        if (!needsRefresh) return state.session.access_token;

        if (!state.session.refresh_token) {
          handleSessionExpired();
          throw new Error('登录已过期，请重新登录');
        }

        if (!refreshPromise) {
          refreshPromise = (async () => {
            const endpoint = `${cleanBaseUrl(state.sbConfig.url)}/auth/v1/token?grant_type=refresh_token`;
            const resp = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'apikey': state.sbConfig.anonKey,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ refresh_token: state.session.refresh_token })
            });
            if (!resp.ok) {
              handleSessionExpired();
              throw new Error('登录状态已失效，请重新登录');
            }
            const data = await resp.json();
            const expiresAt = data.expires_at
              ? data.expires_at * 1000
              : Date.now() + (data.expires_in || 3600) * 1000;

            state.session = {
              access_token: data.access_token,
              refresh_token: data.refresh_token || state.session.refresh_token,
              expires_at: expiresAt,
              user: {
                id: data.user?.id || state.session.user?.id || '',
                email: data.user?.email || state.session.user?.email || ''
              }
            };
            saveJsonStorage(STORAGE_KEYS.SESSION, state.session);
            return state.session.access_token;
          })().finally(() => {
            refreshPromise = null;
          });
        }

        return refreshPromise;
      }

      function resetPrivateMemoryState() {
        state.cards = [];
        state.forestNodes = [];
        state.desireAnchors = [];
        state.cabinetProposals = [];
        state.activityLogs = [];
        state.syncQueue = [];
        state.logBatchQueue = [];
        state.review.undoStack = [];
        state.forest.reorgPlan = null;
        state.ignition.selectedTag = '__recommended__';
        state.ignition.currentAnchorId = null;
        clearCaptureDraft();
        clearForestCaptureDraft();
        state.appMounted = false;
        document.querySelector('.shell')?.classList.remove('forest-wide');
      }

      function handleSessionExpired() {
        const uid = currentUserId();
        clearPrivateUserStorage(uid);
        state.session = null;
        localStorage.removeItem(STORAGE_KEYS.SESSION);
        resetPrivateMemoryState();
        showAuthWall('登录状态已过期，请重新安全登录。');
      }

      async function sbLogout() {
        const uid = currentUserId();
        try {
          if (state.session?.access_token && state.sbConfig.url && state.sbConfig.anonKey) {
            await fetch(`${cleanBaseUrl(state.sbConfig.url)}/auth/v1/logout`, {
              method: 'POST',
              headers: {
                'apikey': state.sbConfig.anonKey,
                'Authorization': `Bearer ${state.session.access_token}`
              }
            });
          }
        } catch (_) {}
        clearPrivateUserStorage(uid);
        state.session = null;
        localStorage.removeItem(STORAGE_KEYS.SESSION);
        resetPrivateMemoryState();
        showAuthWall();
        showToast('已安全退出登录');
      }

      async function sbRest(path, options = {}, retried = false) {
        const token = await ensureValidAccessToken(retried);
        const url = `${cleanBaseUrl(state.sbConfig.url)}/rest/v1/${path}`;
        const headers = {
          'apikey': state.sbConfig.anonKey,
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          ...(options.headers || {})
        };

        let resp;
        try {
          resp = await fetch(url, {
            method: options.method || 'GET',
            headers,
            body: options.body !== undefined ? JSON.stringify(options.body) : undefined
          });
        } catch (_) {
          setSyncStatus('error');
          throw new Error('网络不太顺畅，未能连接云端数据库');
        }

        if (resp.status === 401 && !retried) {
          return sbRest(path, options, true);
        }

        const text = await resp.text();
        if (!resp.ok) {
          setSyncStatus('error');
          throw new Error(translateSupabaseError(resp.status, text));
        }

        if (!text) return null;
        try {
          return JSON.parse(text);
        } catch (_) {
          return null;
        }
      }

      // --- Paginated Cloud Fetchers (Never truncated at 500 rows) ---
      async function fetchPaginatedTable(baseQuery, maxRows = 5000, pageSize = 1000) {
        const all = [];
        for (let offset = 0; offset < maxRows; offset += pageSize) {
          const sep = baseQuery.includes('?') ? '&' : '?';
          const chunk = await sbRest(`${baseQuery}${sep}limit=${pageSize}&offset=${offset}`);
          if (!Array.isArray(chunk) || chunk.length === 0) break;
          all.push(...chunk);
          if (chunk.length < pageSize) break;
        }
        return all;
      }

      function isMissingSchemaError(err) {
        const msg = String(err?.message || '').toLowerCase();
        return msg.includes('尚未建表') || msg.includes('does not exist') || msg.includes('404') || msg.includes('400') || msg.includes('pgrst');
      }

      async function fetchOptionalV2Table(query, fallback = []) {
        try {
          const rows = await fetchPaginatedTable(query, 3000, 1000);
          return { ok: true, rows: Array.isArray(rows) ? rows : [] };
        } catch (err) {
          if (isMissingSchemaError(err)) {
            state.v2SchemaReady = false;
            return { ok: false, rows: fallback };
          }
          throw err;
        }
      }

      async function fetchAllUserData() {
        setSyncStatus('syncing');
        const userId = state.session.user.id;
        state.v2SchemaReady = true;

        const [cardsData, prefsData, logsData, forestRes, anchorsRes, proposalsRes] = await Promise.all([

          fetchPaginatedTable('activity_logs?select=*&order=created_at.desc', 5000, 1000),
          fetchOptionalV2Table('forest_nodes?select=*&order=last_touched_at.desc', state.forestNodes),
          fetchOptionalV2Table('desire_anchors?select=*&order=created_at.desc', state.desireAnchors),
          fetchOptionalV2Table('cabinet_proposals?select=*&order=created_at.desc', state.cabinetProposals)
        ]);

        state.activityLogs = Array.isArray(logsData) ? logsData : [];
        if (forestRes.ok) state.forestNodes = forestRes.rows;
        if (anchorsRes.ok) state.desireAnchors = anchorsRes.rows;

            day_schedule: (p.day_schedule && typeof p.day_schedule === 'object')

      async function upsertV2RowDirect(table, row) {

            headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },

        } catch (err) {

      // --- Background Optimistic Sync Queue (1.0 + 2.0 Tables with Graceful Fallback) ---
      function enqueueSyncOp(op) {
        state.syncQueue.push({
          opId: makeClientId(),
          createdAt: Date.now(),
          ...op
        });
        persistSyncQueue();
        flushSyncQueue();
      }

            await sbRest('user_prefs?on_conflict=user_id', {

      async function insertActivityRowsWithFallback(rows) {
        try {
          return await sbRest('activity_logs', {
            method: 'POST',
            headers: { 'Prefer': 'return=representation' },
            body: rows.length === 1 ? rows[0] : rows
          });
        } catch (err) {
          if (isMissingSchemaError(err)) {
            state.v2SchemaReady = false;
            const downgraded = rows.map(r => ({
              user_id: r.user_id,
              event_type: r.event_type,
              card_id: r.card_id || null,
              payload: {
                ...(r.payload || {}),
                _v2_module: r.module,
                _v2_session_id: r.session_id,
                _v2_entity_id: r.entity_id,
                _v2_duration_ms: r.duration_ms
              }
            }));
            return await sbRest('activity_logs', {
              method: 'POST',
              headers: { 'Prefer': 'return=representation' },
              body: downgraded.length === 1 ? downgraded[0] : downgraded
            });
          }
          throw err;
        }
      }

      async function flushSyncQueue() {
        if (state.syncFlushing || !state.session?.access_token) return;
        if (state.syncQueue.length === 0) {
          setSyncStatus('ok');
          return;
        }

        state.syncFlushing = true;
        setSyncStatus('syncing');

        try {
          while (state.syncQueue.length > 0) {
            const op = state.syncQueue[0];
            if (op.type === 'patch_card') {
              await sbRest(`cards?id=eq.${encodeURIComponent(op.cardId)}`, {
                method: 'PATCH',
                body: op.patch
              });
            } else if (op.type === 'delete_card') {
              await sbRest(`cards?id=eq.${encodeURIComponent(op.cardId)}`, {
                method: 'DELETE'
              });
            } else if (op.type === 'upsert_table') {
              try {
                await sbRest(`${op.table}?on_conflict=id`, {
                  method: 'POST',
                  headers: { 'Prefer': 'resolution=merge-duplicates' },
                  body: op.row
                });
              } catch (err) {
                if (isMissingSchemaError(err)) {
                  state.v2SchemaReady = false;
                } else {
                  throw err;
                }
              }
            } else if (op.type === 'patch_table') {
              try {
                await sbRest(`${op.table}?id=eq.${encodeURIComponent(op.id)}`, {
                  method: 'PATCH',
                  body: op.patch
                });
              } catch (err) {
                if (isMissingSchemaError(err)) {
                  state.v2SchemaReady = false;
                } else {
                  throw err;
                }
              }
            } else if (op.type === 'delete_table') {
              try {
                await sbRest(`${op.table}?id=eq.${encodeURIComponent(op.id)}`, {
                  method: 'DELETE'
                });
              } catch (err) {
                if (isMissingSchemaError(err)) {
                  state.v2SchemaReady = false;
                } else {
                  throw err;
                }
              }
            } else if (op.type === 'insert_log') {
              const rows = await insertActivityRowsWithFallback([op.row]);
              const created = Array.isArray(rows) ? rows[0] : rows;
              if (created?.id && op.clientId) {
                const localLog = state.activityLogs.find(l => l._clientId === op.clientId);
                if (localLog) {
                  localLog.id = created.id;
                  if (localLog._undone) {
                    state.syncQueue.push({
                      opId: makeClientId(),
                      type: 'delete_log',
                      logId: created.id,
                      createdAt: Date.now()
                    });
                  }
                }
              }
            } else if (op.type === 'delete_log') {
              if (op.logId) {
                await sbRest(`activity_logs?id=eq.${encodeURIComponent(op.logId)}`, {
                  method: 'DELETE'
                });
              }
            } else if (op.type === 'save_prefs') {
              await savePrefsWithFallback();
            }

            state.syncQueue.shift();
            persistSyncQueue();
            persistUserCache();
          }
          setSyncStatus('ok');
        } catch (_) {
          setSyncStatus('error');
        } finally {
          state.syncFlushing = false;
        }
      }

      // --- 2.0 Optimistic Table CRUD Helpers (Forest, Desire Anchors, Cabinet Proposals) ---
      function createForestNodeOptimistic(fields) {
        const nowIso = new Date().toISOString();
        const node = {
          id: crypto.randomUUID ? crypto.randomUUID() : makeClientId(),
          user_id: currentUserId(),
          tree_label: String(fields.tree_label || '综合破局').trim() || '综合破局',
          is_meta: Boolean(fields.is_meta),
          parent_id: fields.parent_id || null,
          parallel_group: fields.parallel_group || null,
          short_title: String(fields.short_title || '未命名问题').trim().slice(0, 48),
          short_title_ai_draft: fields.short_title_ai_draft || null,
          raw_problem: String(fields.raw_problem || fields.short_title || '').trim(),
          refined_problem: fields.refined_problem || null,
          analysis_history: Array.isArray(fields.analysis_history) ? fields.analysis_history : [],
          next_micro_step: fields.next_micro_step || null,
          status: ['fuzzy', 'active', 'solved'].includes(fields.status) ? fields.status : 'fuzzy',
          pos_x: Number.isFinite(fields.pos_x) ? fields.pos_x : computeNextNodePos(fields.tree_label, fields.parent_id).x,
          pos_y: Number.isFinite(fields.pos_y) ? fields.pos_y : computeNextNodePos(fields.tree_label, fields.parent_id).y,
          last_touched_at: nowIso,
          created_at: nowIso,
          updated_at: nowIso
        };
        state.forestNodes.unshift(node);
        persistUserCache();
        enqueueSyncOp({ type: 'upsert_table', table: 'forest_nodes', row: node });
        return node;
      }

      function computeNextNodePos(treeLabel, parentId) {
        if (parentId) {
          const parent = state.forestNodes.find(n => n.id === parentId);
          if (parent) {
            const siblings = state.forestNodes.filter(n => n.parent_id === parentId);
            return {
              x: Math.round((Number(parent.pos_x) || 120) + (siblings.length - 0.5) * 240),
              y: Math.round((Number(parent.pos_y) || 64) + 166)
            };
          }
        }
        if (state.forestNodes.length > 0) {
          const maxX = Math.max(...state.forestNodes.map(n => Number(n.pos_x) || 60));
          return { x: Math.round(maxX + 260), y: 64 };
        }
        return { x: 80, y: 64 };
      }

      function updateForestNodeOptimistic(nodeId, patch) {
        const nowIso = new Date().toISOString();
        const body = { ...patch, updated_at: nowIso };
        const idx = state.forestNodes.findIndex(n => n.id === nodeId);
        if (idx >= 0) {
          state.forestNodes[idx] = { ...state.forestNodes[idx], ...body };
          persistUserCache();
        }
        enqueueSyncOp({ type: 'patch_table', table: 'forest_nodes', id: nodeId, patch: body });
        return idx >= 0 ? state.forestNodes[idx] : null;
      }

      function deleteForestNodeOptimistic(nodeId) {
        state.forestNodes = state.forestNodes.filter(n => n.id !== nodeId);
        state.forestNodes.forEach(n => {
          if (n.parent_id === nodeId) {
            n.parent_id = null;
            enqueueSyncOp({ type: 'patch_table', table: 'forest_nodes', id: n.id, patch: { parent_id: null } });
          }
        });
        state.desireAnchors.forEach(a => {
          if (a.linked_node_id === nodeId) a.linked_node_id = null;
        });
        persistUserCache();
        enqueueSyncOp({ type: 'delete_table', table: 'forest_nodes', id: nodeId });
      }

      function createDesireAnchorOptimistic(fields) {
        const nowIso = new Date().toISOString();
        const anchor = {
          id: crypto.randomUUID ? crypto.randomUUID() : makeClientId(),

      // --- 1.0 Card Operations (Backwards Compatible + Optional source_forest_node_id) ---
      async function insertCardToCloud(cardPayload) {

          });

          if (isMissingSchemaError(err) && Object.prototype.hasOwnProperty.call(body, 'source_forest_node_id')) {
            const fallbackBody = { ...body };

            rows = await sbRest('cards', {
              method: 'POST',

              body: fallbackBody
            });
          } else {

          }

      // --- 2.0 Full-Chain 6-Module Batched Silent Activity Tracking Engine ---
      function normalizeLogModule(log) {
        if (log.module) return log.module;
        if (log.payload?._v2_module) return log.payload._v2_module;
        const et = String(log.event_type || '');
        if (et.startsWith('ignition') || et === 'anchor_switch' || et === 'step_click' || et === 'meta_open') return 'ignition';
        if (et.startsWith('capture')) return 'capture';
        if (et.startsWith('node_') || et.startsWith('analysis_') || et.startsWith('micro_step') || et.startsWith('reorg_')) return 'forest';
        if (et.startsWith('ai_') || et.startsWith('collision_')) return 'cabinet';
        if (et.startsWith('session_') || et === 'space_switch') return 'system';
        return 'preserve';
      }

      function trackActivity(module, eventType, entityId = null, payload = {}, durationMs = null, immediate = false) {
        if (!state.session?.user?.id) return null;
        const clientId = makeClientId();
        const enrichedPayload = {
          time_slot: getCurrentTimeSlot(),
          device: getDeviceType(),
          ...(payload || {})
        };
        const row = {
          user_id: state.session.user.id,
          session_id: state.sessionId,
          module: module || 'preserve',
          event_type: eventType,
          card_id: (module === 'preserve' && isValidUuid(entityId)) ? entityId : null,
          entity_id: isValidUuid(entityId) ? entityId : null,
          duration_ms: Number.isFinite(durationMs) ? clamp(Math.round(durationMs), 0, 3600000) : null,
          payload: enrichedPayload
        };
        const localRecord = {
          ...row,
          _clientId: clientId,
          created_at: new Date().toISOString()
        };
        state.activityLogs.unshift(localRecord);
        persistUserCache();

        if (immediate) {
          enqueueSyncOp({ type: 'insert_log', row, clientId });
        } else {
          state.logBatchQueue.push({ row, clientId });
          persistLogBatchQueue();
          if (state.logBatchQueue.length >= 8) {
            flushLogBatchQueue();
          } else if (!state.logBatchTimer) {
            state.logBatchTimer = setTimeout(() => {
              state.logBatchTimer = null;
              flushLogBatchQueue();
            }, 4000);
          }
        }
        return clientId;
      }

      async function flushLogBatchQueue() {
        if (!state.session?.access_token || state.logBatchQueue.length === 0) return;
        const batch = state.logBatchQueue.splice(0, 25);
        persistLogBatchQueue();
        try {
          const rows = batch.map(item => item.row);
          const createdRows = await insertActivityRowsWithFallback(rows);
          if (Array.isArray(createdRows)) {
            createdRows.forEach((created, i) => {
              const cid = batch[i]?.clientId;
              if (created?.id && cid) {
                const localLog = state.activityLogs.find(l => l._clientId === cid);
                if (localLog) localLog.id = created.id;
              }
            });
            persistUserCache();
          }
        } catch (_) {
          // Offline or temporary network failure: put back at front for automatic retry on reconnect
          state.logBatchQueue = [...batch, ...state.logBatchQueue];
          persistLogBatchQueue();
        }
      }

      // Backwards-compatible wrapper used across 1.0 Preservation code
      function logActivityCloud(eventType, cardId, payload) {
        const mod = eventType === 'ai_usage' ? 'cabinet' : 'preserve';
        const dur = Number.isFinite(payload?.front_ms) ? (Number(payload.front_ms) + Number(payload.back_ms || 0)) : null;
        return trackActivity(mod, eventType, cardId, payload, dur, eventType === 'review');
      }

      function undoActivityLogCloud(clientId) {
        if (!clientId) return;
        const idx = state.activityLogs.findIndex(l => l._clientId === clientId);
        if (idx >= 0) {
          const log = state.activityLogs[idx];
          log._undone = true;
          const dbId = log.id;
          state.activityLogs.splice(idx, 1);
          persistUserCache();

          const pendingIdx = state.syncQueue.findIndex(op => op.type === 'insert_log' && op.clientId === clientId);
          if (pendingIdx >= 0) {
            state.syncQueue.splice(pendingIdx, 1);
            persistSyncQueue();
          } else {
            const batchIdx = state.logBatchQueue.findIndex(item => item.clientId === clientId);
            if (batchIdx >= 0) {
              state.logBatchQueue.splice(batchIdx, 1);
              persistLogBatchQueue();
            } else if (dbId) {
              enqueueSyncOp({ type: 'delete_log', logId: dbId });
            }
          }
        }
      }

      // Record post-ignition followup when user acts within 5 minutes of seeing Ignition anchor
      function recordIgnitionFollowupIfRecent(targetSpace, firstAction) {
        if (state.ignitionFollowupLogged || !state.lastIgnitionViewedAt) return;
        const elapsed = Date.now() - state.lastIgnitionViewedAt;

            anchor_id: state.lastIgnitionAnchorId,

      function extractJsonObject(raw) {
        const cleaned = String(raw || '')
          .replace(/^```json\s*/i, '')
          .replace(/^```\s*/i, '')
          .replace(/```\s*$/i, '')
          .trim();
        const start = cleaned.indexOf('{');
        const end = cleaned.lastIndexOf('}');
        if (start >= 0 && end > start) {
          return JSON.parse(cleaned.slice(start, end + 1));
        }
        return JSON.parse(cleaned);
      }

      function parseAiErrorDetail(status, rawText) {
        let serverMsg = '';
        try {
          const parsed = JSON.parse(rawText);
          serverMsg = parsed?.error?.message || parsed?.message || (typeof parsed?.error === 'string' ? parsed.error : '');
        } catch (_) {
          serverMsg = String(rawText || '').trim().slice(0, 160);
        }
        const suffix = serverMsg ? `：${serverMsg}` : '';
        if (status === 401) return `API Key 无效或未授权 (401)${suffix}`;
        if (status === 404) return `接口地址或模型不存在 (404)${suffix}`;
        if (status === 429) return `请求受限或额度不足 (429)${suffix}`;
        return `AI 接口异常 (${status})${suffix}`;
      }

      /**
       * Compatible with OpenAI GPT-6 (gpt-6.1-terra / gpt-6-luna), DeepSeek, Gemini, etc.
       * Strictly omits non-default temperature parameter so reasoning models default cleanly to 1.
       */
      async function callOpenAiCompatible(systemPrompt, userPrompt, expectJson = true) {
        if (!isAiConfigured()) {
          throw new Error('NO_AI_KEY');
        }
        const base = cleanBaseUrl(state.aiConfig.baseUrl);
        const endpoint = base.endsWith('/chat/completions') ? base : `${base}/chat/completions`;

        const sys = expectJson
          ? `${systemPrompt}\n\n严格要求：只返回一个合法的纯 JSON 对象，不要包含 Markdown 代码块、前缀或任何多余解释。`
          : systemPrompt;

        let resp;
        try {
          resp = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${state.aiConfig.apiKey.trim()}`
            },
            body: JSON.stringify({
              model: state.aiConfig.model.trim(),
              messages: [
                { role: 'system', content: sys },
                { role: 'user', content: userPrompt }
              ]
            })
          });
        } catch (netErr) {
          throw new Error(`无法连接 AI 接口（网络异常或浏览器跨域受限）：${netErr?.message || 'Failed to fetch'}`);
        }

        const text = await resp.text();
        if (!resp.ok) {
          throw new Error(parseAiErrorDetail(resp.status, text));
        }

        const data = JSON.parse(text);
        const content = data?.choices?.[0]?.message?.content;
        if (!content) throw new Error('AI 返回内容为空');
        return expectJson ? extractJsonObject(content) : content.trim();
      }

      // Shared Classification Rule: Classify by underlying discipline / core mechanism, NOT narrow surface topics!
      function buildDomainClassificationRule(existingDomains, isReorg = false) {
        const baseRule = `分类核心原则（极其重要）：
- 【穿透表层话题，按底层学科或核心机制归类】：严禁按具体故事、表层事件或过窄的动作话题起名（例如绝不要起“关系分层”“开会技巧”“买房踩坑”“社交指南”这类紧贴表层话题的窄词）。
- 【抽象层级参考】：先判断这段内容背后的底层原理属于哪门基础学科或高阶认知框架，提炼 2–5 字的上位学科/机制大类。参考颗粒度如：心理学、社会学、经济学、认知与决策、博弈与人性、组织与管理、商业逻辑、传播与表达、哲学与方法论等（仅作颗粒度参考，绝非固定列表，仍完全根据用户真实内容动态生长）。
- 【典型反例纠正】：例如内容虽然在聊“关系分层怎么处理”，但底层在展开“凡勃伦效应 / 炫耀性消费 / 社会地位信号”，就应该归入「经济学」「社会学」或「心理学」，而绝不能归入「关系分层」。`;

        if (isReorg) {
          return `${baseRule}\n- 【整理旧类】：如果卡片库里原本的旧类别偏表层、太碎（如“关系分层”），请主动向上抽象合并为更稳定、可跨场景复用的上位学科/机制大类。`;
        }
        if (existingDomains.length > 0) {
          return `${baseRule}\n- 【复用已有上位类】：用户当前已有类别：${existingDomains.join('、')}。如果其中已有贴合底层学科/机制的上位类别，优先复用避免碎片化；如果现有类别覆盖不了（或过于表层），请新建一个 2–5 字的上位学科/机制大类。`;

      // AI 4: Full-Library & Evolution-Aware Silent Cross-Domain Matcher
      function buildCrossDomainCandidatePool(targetCard, maxCandidates = 55) {
        const targetDom = normalizeDomainLabel(targetCard.domain_tag);
        const pool = state.cards.filter(c =>
          c.id !== targetCard.id &&
          normalizeDomainLabel(c.domain_tag) !== targetDom
        );
        if (pool.length <= maxCandidates) return pool;

        const withEvo = pool.filter(c => Array.isArray(c.evolution_tags) && c.evolution_tags.length > 0);
        const withoutEvo = pool.filter(c => !Array.isArray(c.evolution_tags) || c.evolution_tags.length === 0);

        const picked = [];
        const pickedIds = new Set();
        const addFrom = (arr, quota) => {
          if (arr.length <= quota) {
            arr.forEach(c => { if (!pickedIds.has(c.id)) { picked.push(c); pickedIds.add(c.id); } });
            return;
          }
          const step = arr.length / quota;
          for (let i = 0; i < quota; i++) {
            const c = arr[Math.min(arr.length - 1, Math.floor(i * step))];
            if (!pickedIds.has(c.id)) {
              picked.push(c);
              pickedIds.add(c.id);
            }
          }
        };

        addFrom(withEvo, Math.min(38, maxCandidates));
        addFrom(withoutEvo, maxCandidates - picked.length);
        return picked;
      }

      async function runSilentCrossDomainMatch(targetCard) {
        if (!isAiConfigured() || !targetCard?.id) return;
        const candidates = buildCrossDomainCandidatePool(targetCard, 55);
        if (candidates.length === 0) return;

        try {
          const sys = `你是后台静默跨界碰瓷器。判断目标卡片与不同领域的历史候选卡片中，是否存在底层机制或通用规律上的高度共振（尤其关注进化词条反映的深层规律）。
规则：
- 若存在令人惊喜的底层结构相似性，返回 {"match_id": "对应候选卡片id"}。
- 若没有足够强的底层相似性，切勿硬凑，返回 {"match_id": ""}。
- 严禁返回解释或剧透原因。`;
          const listStr = candidates.map(c =>
            `ID:${c.id} | 类别:${normalizeDomainLabel(c.domain_tag)} | 事实:${String(c.front_fact).slice(0, 52)} | 进化词条:${(c.evolution_tags || []).join('/') || '暂无'}`

          const prompt = `目标卡片（${normalizeDomainLabel(targetCard.domain_tag)}）：\n事实：${targetCard.front_fact}\n感受：${targetCard.back_anchor}\n最新进化词条：${(targetCard.evolution_tags || []).join(' / ') || '暂无'}\n\n不同领域候选：\n${listStr}`;

          const res = await callOpenAiCompatible(sys, prompt, true);

          customPrompt

        const res1 = await callOpenAiCompatible(stage1.sys, stage1.user, true);

        const categories = Array.isArray(res1.categories)
          ? Array.from(new Set(res1.categories.map(normalizeDomainLabel).filter(x => x && x !== UNCLASSIFIED_LABEL)))
          : [];
        const assignmentMap = new Map();

        if (Array.isArray(res1.assignments)) {
          res1.assignments.forEach(a => {
            if (a?.id && a?.domain_tag) {
              assignmentMap.set(a.id, normalizeDomainLabel(a.domain_tag));
            }
          });
        }

        if (restCards.length > 0 && categories.length > 0) {
          for (let i = 0; i < restCards.length; i += batchSize) {
            const chunk = restCards.slice(i, i + batchSize);
            const baseSysNext = `请将以下卡片严格按最新理解背后的底层学科/机制归入已确定的类别体系中：${categories.join('、')}。\n返回纯 JSON：{"assignments": [{"id": "卡片ID", "domain_tag": "类别名"}]}`;
            const stageNext = applyUserPriorityPrompt(baseSysNext, chunk.map(formatCardForPrompt).join('\n'), customPrompt);
            const resNext = await callOpenAiCompatible(stageNext.sys, stageNext.user, true);
            if (Array.isArray(resNext.assignments)) {
              resNext.assignments.forEach(a => {
                if (a?.id && a?.domain_tag) {
                  assignmentMap.set(a.id, normalizeDomainLabel(a.domain_tag));
                }
              });
            }
          }
        }

        return { categories, assignmentMap };
