      // Silent background preheat after any forest update so next morning opens in 0ms!
      function buildLocalFallbackEvidence() {
        const solvedCount = state.forestNodes.filter(n => n.status === 'solved').length;
        const activeNodes = state.forestNodes.filter(n => n.status !== 'solved' && !n.is_meta);
        const target = activeNodes[0] || state.forestNodes[0] || null;
        const totalHistory = state.forestNodes.reduce((s, n) => s + ((n.analysis_history || []).length), 0);
        return {
          lines: [
            { tag: '战果', text: totalHistory > 0 ? `森林里已留存 ${totalHistory} 条推进痕迹${solvedCount ? `、攻克 ${solvedCount} 个卡点` : ''}，不用从零硬扛。` : '元问题与双引擎已就位，把难题卸到画布上就能一层层剥开。' },
            { tag: '边界', text: target ? `今天只围绕「${target.short_title.slice(0, 14)}」动一小步，其余交给留白。` : '今天只挑 1 个最让你在意的念头落到纸面即可。' },
            { tag: '抓手', text: target?.next_micro_step || (target ? `打开「${target.short_title.slice(0, 14)}」花 10 分钟记下一句观察` : '打开破局森林，种下第一棵问题树') }
          ],
          linkedNodeId: target?.id || '',
          generatedAt: new Date().toISOString()
        };
      }

      let preheatDebounce = null;
      function scheduleIgnitionPreheat() {
        // Immediately update local fallback cache if empty so Ignition is always warm
        const prevStash = state.prefs.ignition_cache?.capture_stash || [];
        if (!state.prefs.ignition_cache?.lines) {
          state.prefs.ignition_cache = { ...buildLocalFallbackEvidence(), capture_stash: prevStash };
          persistUserCache();
        }
        if (!isAiConfigured()) {
          state.prefs.ignition_cache = { ...buildLocalFallbackEvidence(), capture_stash: prevStash };
          persistUserCache();
          enqueueSyncOp({ type: 'save_prefs' });
          return;
        }
        if (preheatDebounce) clearTimeout(preheatDebounce);
        preheatDebounce = setTimeout(async () => {
          try {
            const fresh = await aiGenerateIgnitionEvidence('');
            const stash = state.prefs.ignition_cache?.capture_stash || [];
            state.prefs.ignition_cache = { ...fresh, capture_stash: stash };
            persistUserCache();
            enqueueSyncOp({ type: 'save_prefs' });
            if (state.activeTab === 'ignition') renderIgnitionTab();
          } catch (_) {
            // Silent background preheat: never interrupt user
          }
        }, 1800);
      }

      // AI 11: Cabinet Council — Strict Two-Stage Periodic Cross-Engine Collision (宁缺毋滥 3-5 条)
      async function aiRunPeriodicCollision(customPrompt = '') {
        const t0 = Date.now();
        const forestPool = state.forestNodes.filter(n => !n.is_meta).slice(0, 60);
        const cardPool = state.cards.slice(0, 80);

        if (forestPool.length === 0 && cardPool.length === 0) {
          throw new Error('破局森林和每日保鲜里都还没有素材，先记几条再发起碰撞吧');
        }

        // STAGE 1: Lightweight Coarse Scan (short_title + evolution_tags ONLY!)
        const forestShort = forestPool.map(n =>
          `F:${n.id} | 树:${n.tree_label} | 状态:${n.status} | 标题:${n.short_title} | 推进数:${(n.analysis_history || []).length}`
        ).join('\n') || '暂无森林节点';

        const cardShort = cardPool.map(c =>
          `C:${c.id} | 类:${normalizeDomainLabel(c.domain_tag)} | 认识:${(c.evolution_tags || []).join('/') || '待孵化'} | 梗概:${String(c.front_fact).slice(0, 34)}`
        ).join('\n') || '暂无保鲜卡';

        const existingAnchors = state.desireAnchors.filter(a => !a.is_meta).slice(0, 15).map(a => a.raw_text.slice(0, 30)).join('；') || '暂无';

        const stage1Sys = `你是“内阁大议”第一阶段粗筛官。只用极轻的标题与词条做跨引擎扫描，挑选真正能产生强启发或高价值沉淀的候选组（总数严格限制 0 到 5 组，宁缺毋滥，没有真正火花宁可返回空数组 []！）。
三类管线：
1. "card_to_forest"（以保鲜解破局）：某张保鲜卡的底层规律能给某个活跃/模糊森林节点带来新视角。
2. "forest_to_anchor"（以破局喂渴望）：某个森林节点的真实痛点或愿景可提炼出直击内心的渴望锚点（避免和已有渴望重复）。
3. "forest_to_card"（以破局沉淀保鲜）：某个已克服或有扎实分析历史的森林节点，值得凝练成一张标准三层保鲜卡长期保鲜。

返回纯 JSON：
{
  "matches": [
    {"proposal_type": "card_to_forest", "card_id": "卡片ID(仅类型1填)", "node_id": "节点ID", "spark_hint": "15字内火花点"}
  ]
}`;

        const stage1User = `破局森林节点：\n${forestShort}\n\n每日保鲜卡片：\n${cardShort}\n\n已有渴望锚点概览：${existingAnchors}`;
        const s1 = applyUserPriorityPrompt(stage1Sys, stage1User, customPrompt);
        let matches = [];
        try {
          const res1 = await callOpenAiCompatible(s1.sys, s1.user, true);
          matches = Array.isArray(res1.matches) ? res1.matches.slice(0, 5) : [];
        } catch (err) {
          trackActivity('cabinet', 'collision_run', null, { ok: false, stage: 1, error: err.message }, Date.now() - t0);
          throw err;
        }

        // Validate matched IDs strictly
        const validMatches = matches.filter(m => {
          if (!m || !['card_to_forest', 'forest_to_anchor', 'forest_to_card'].includes(m.proposal_type)) return false;
          const hasNode = state.forestNodes.some(n => n.id === m.node_id);
          if (!hasNode) return false;
          if (m.proposal_type === 'card_to_forest') {
            return state.cards.some(c => c.id === m.card_id);
          }
          return true;
        });

        if (validMatches.length === 0) {
          trackActivity('cabinet', 'collision_run', null, { ok: true, produced: 0 }, Date.now() - t0);
          return [];
        }

        // STAGE 2: Deep Draft Generation ONLY for the 1–5 matched items
        const fullDetails = validMatches.map((m, idx) => {
          const node = state.forestNodes.find(n => n.id === m.node_id);
          const card = m.card_id ? state.cards.find(c => c.id === m.card_id) : null;
          const hist = (node?.analysis_history || []).slice(-4).map(h => h.content).join(' | ') || '暂无';
          return `[提案#${idx + 1} | 类型:${m.proposal_type} | 火花:${m.spark_hint || ''}]
- 森林节点(ID:${node.id} | 树:${node.tree_label}): 标题=${node.short_title}；原述=${node.raw_problem}；具象=${node.refined_problem || '无'}；历史=${hist}`
            + (card ? `\n- 保鲜卡(ID:${card.id} | 类:${normalizeDomainLabel(card.domain_tag)}): 事实=${card.front_fact}；感受=${card.back_anchor}；认识=${(card.evolution_tags || []).join('/')}` : '');
        }).join('\n\n');

        const existingDoms = getExistingDomains(false).map(d => d.name);
        const domainRule = buildDomainClassificationRule(existingDoms, false);

        const stage2Sys = `你是“内阁大议”第二阶段票拟执笔官。只针对已命中的高价值候选，为每条起草结构清晰、克制务实的提案草稿（绝不写长篇鸡汤）。
${domainRule}
返回纯 JSON：
{
  "proposals": [
    {
      "proposal_type": "card_to_forest 或 forest_to_anchor 或 forest_to_card",
      "node_id": "节点ID",
      "card_id": "卡片ID(仅card_to_forest有)",
      "summary": "1句不超过40字的碰撞启发摘要",
      "draft_payload": {
        "analysis_entry": "若 card_to_forest：准备追加进节点分析历史的精炼启发（<=80字）",
        "suggested_next_step": "若 card_to_forest：可选的一小步抓手",
        "anchor_raw_text": "若 forest_to_anchor：直击内心的鲜活画面渴望（大白话，<=45字）",
        "anchor_polished_text": "若 forest_to_anchor：可选凝练版",
        "scene_tags": ["清晨"],
        "front_fact": "若 forest_to_card：客观事实或实战场景（<=80字）",
        "back_anchor": "若 forest_to_card：大白话直觉与体悟（<=60字）",
        "evolution_tags": ["凝练关键词1"],
        "domain_tag": "按底层学科/机制归类的2-5字上位大类"
      }
    }
  ]
}`;

        const s2 = applyUserPriorityPrompt(stage2Sys, `请为以下 ${validMatches.length} 条命中候选起草内阁提案：\n\n${fullDetails}`, customPrompt);
        try {
          const res2 = await callOpenAiCompatible(s2.sys, s2.user, true);
          const drafts = Array.isArray(res2.proposals) ? res2.proposals.slice(0, 5) : [];
          const createdList = [];
          for (const d of drafts) {
            if (!d || !['card_to_forest', 'forest_to_anchor', 'forest_to_card'].includes(d.proposal_type)) continue;
            const node = state.forestNodes.find(n => n.id === d.node_id);
            if (!node) continue;
            const srcRefs = d.proposal_type === 'card_to_forest'
              ? [{ kind: 'card', id: d.card_id }]
              : [{ kind: 'forest_node', id: node.id, title: node.short_title }];
            const tgtRefs = d.proposal_type === 'card_to_forest'
              ? [{ kind: 'forest_node', id: node.id, title: node.short_title }]
              : d.proposal_type === 'forest_to_anchor'
                ? [{ kind: 'forest_tree', id: node.id, tree_label: node.tree_label }]
                : [{ kind: 'preserve_cards' }];
            const created = createCabinetProposalOptimistic({
              proposal_type: d.proposal_type,
              source_refs: srcRefs,
              target_refs: tgtRefs,
              summary: d.summary || '跨引擎启发提案',
              draft_payload: d.draft_payload || {}
            });
            createdList.push(created);
          }
          trackActivity('cabinet', 'collision_run', null, { ok: true, produced: createdList.length }, Date.now() - t0);
          return createdList;
        } catch (err) {
          trackActivity('cabinet', 'collision_run', null, { ok: false, stage: 2, error: err.message }, Date.now() - t0);
          throw err;
        }
      }

      function switchPreserveSubTab(sub) {

        document.getElementById('view-library')?.classList.toggle('hidden', state.preserveSubTab !== 'library');
        document.querySelectorAll('[data-pres-sub]').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-pres-sub') === state.preserveSubTab);
        });
        if (state.preserveSubTab === 'review') {
          renderReviewTab();
          resumeActiveReviewTimer();
        } else {
          renderLibraryTab();
        }
      }

      function openForestCapture(defaultTree = '') {
        const chosenTree = defaultTree || (state.forest.selectedTree !== '全部树' ? state.forest.selectedTree : '');
        if (chosenTree && !state.forestCapture.treeLabel && !state.forestCapture.problem && !state.forestCapture.raw) {
          state.forestCapture.treeLabel = chosenTree;
        }
        switchTab('capture-forest');
      }

      function switchTab(rawTab) {
        // Maintain 100% compatibility with existing calls like 'review', 'library', 'capture'
        let tab = rawTab;
        if (rawTab === 'review') {
          tab = 'preserve';
          state.preserveSubTab = 'review';
        } else if (rawTab === 'library') {
          tab = 'preserve';
          state.preserveSubTab = 'library';
        } else if (rawTab === 'capture') {
          tab = 'capture-card';
        }

        const prevTab = state.activeTab;
        if (prevTab !== tab) {
          const dwellMs = Math.max(0, Date.now() - (state.spaceEnterMs || Date.now()));
          if (prevTab) {
            trackActivity('system', 'space_switch', null, { from: prevTab, to: tab }, dwellMs);
          }
          if (prevTab === 'ignition' && (tab === 'forest' || tab === 'preserve' || tab === 'capture-card' || tab === 'capture-forest')) {
            recordIgnitionFollowupIfRecent(tab, 'enter_space');
          }
          state.spaceEnterMs = Date.now();
        }

        if (isInActiveReviewView() && tab !== 'preserve') {
          pauseActiveReviewTimer();
        }

        state.activeTab = tab;

        // Expand shell nicely on desktop when viewing Breakthrough Forest canvas
        const shellEl = document.querySelector('.shell');
        if (shellEl) {
          shellEl.classList.toggle('forest-wide', tab === 'forest');
        }

        ['ignition', 'forest', 'preserve', 'cabinet', 'capture-card', 'capture-forest', 'settings'].forEach(name => {
          const el = document.getElementById(`view-${name}`);
          if (el) el.classList.toggle('hidden', name !== tab);

        const navActiveTab = tab === 'capture-card' ? 'preserve' : (tab === 'capture-forest' ? 'forest' : tab);
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === navActiveTab);

          fab.setAttribute('aria-label', fabTip);
          fab.setAttribute('title', fabTip);
        }

        window.scrollTo(0, 0);

        if (tab === 'ignition') renderIgnitionTab();
        if (tab === 'forest') renderForestTab();
        if (tab === 'preserve') switchPreserveSubTab(state.preserveSubTab);
        if (tab === 'cabinet') renderCabinetTab();

        if (tab === 'settings') renderSettingsTab();
      }

      // =====================================================================
      // 10B. SPACE 1: 启动点火页 (IGNITION - PREHEATED 0MS FIRST SCREEN)
      // =====================================================================
      function getIgnitionAnchorTags() {
        const counts = new Map();
        let untaggedCount = 0;
        state.desireAnchors.forEach(a => {
          if (!a || !a.raw_text) return;
          const tags = Array.isArray(a.scene_tags) ? a.scene_tags.map(t => String(t).trim()).filter(Boolean) : [];
          if (tags.length === 0) {
            untaggedCount++;
          } else {
            const uniq = new Set(tags);
            uniq.forEach(t => counts.set(t, (counts.get(t) || 0) + 1));
          }
        });
        const list = Array.from(counts.entries())
          .map(([tag, count]) => ({ tag, count }))
          .sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag, 'zh-CN'));
        if (untaggedCount > 0 && list.length > 0) {
          list.push({ tag: '__untagged__', label: '未标标签', count: untaggedCount });
        }
        return list;
      }

      function getFilteredIgnitionAnchors(selectedTag = state.ignition.selectedTag) {
        const all = state.desireAnchors.filter(a => a && a.raw_text);
        if (!selectedTag || selectedTag === '__recommended__' || selectedTag === '__all__') {
          return all;
        }
        if (selectedTag === '__untagged__') {
          return all.filter(a => !Array.isArray(a.scene_tags) || a.scene_tags.map(t => String(t).trim()).filter(Boolean).length === 0);
        }
        return all.filter(a => Array.isArray(a.scene_tags) && a.scene_tags.some(t => String(t).trim() === selectedTag));
      }

      function pickWeightedDesireAnchor(excludeId = null, customPool = null) {
        const pool = (Array.isArray(customPool) ? customPool : state.desireAnchors).filter(a => a && a.raw_text);
        if (pool.length === 0) return null;
        if (pool.length === 1) return pool[0];

        const candidates = excludeId ? pool.filter(a => a.id !== excludeId) : pool;
        const list = candidates.length ? candidates : pool;
        const slot = getCurrentTimeSlot();
        const slotLabel = getTimeSlotLabel(slot);
        const slotKeywords = (state.prefs.day_schedule?.[slot] || []).map(x => String(x).toLowerCase());
        const now = Date.now();

        const weights = list.map(a => {
          let w = Math.max(0.3, Number(a.ignite_score) || 1.0);
          // Favor newly added or not-recently-shown anchors to fight habituation
          const lastMs = a.last_shown_at ? new Date(a.last_shown_at).getTime() : 0;
          const daysSince = lastMs ? Math.min(14, (now - lastMs) / MS_PER_DAY) : 10;
          w *= (1 + daysSince * 0.25);
          // Time-slot matching boost
          const tags = Array.isArray(a.scene_tags) ? a.scene_tags.map(t => String(t).toLowerCase()) : [];
          const matchesSlot = tags.some(t =>
            t.includes(slotLabel) ||
            t.includes(slot) ||
            slotKeywords.some(k => k && (t.includes(k) || k.includes(t)))
          );
          if (matchesSlot) w *= 2.4;
          // Give personal non-meta anchors slightly higher daily weight when user has added some
          if (!a.is_meta) w *= 1.35;
          return w;
        });

        const totalW = weights.reduce((s, x) => s + x, 0);
        let r = Math.random() * totalW;
        for (let i = 0; i < list.length; i++) {
          r -= weights[i];
          if (r <= 0) return list[i];
        }
        return list[0];
      }

          selected_tag: state.ignition.selectedTag

        document.getElementById('btn-go-forest').onclick = () => switchTab('forest');
        document.getElementById('btn-go-preserve').onclick = () => switchTab('review');

        const cabShortcut = document.getElementById('btn-ign-cabinet');
        if (cabShortcut) cabShortcut.onclick = () => switchTab('cabinet');

        // Tag filter pills (both top bar and tags inside anchor card)
        container.querySelectorAll('[data-ign-tag]').forEach(btn => {
          btn.onclick = () => {
            const nextTag = btn.getAttribute('data-ign-tag');
            state.ignition.selectedTag = nextTag;
            if (nextTag === '__recommended__') {
              const rec = pickWeightedDesireAnchor(null, allAnchors);
              if (rec) selectIgnitionAnchor(rec, 'anchor_tag_recommended');
            } else {
              const nextList = getFilteredIgnitionAnchors(nextTag);
              if (nextList.length > 0 && !nextList.some(a => a.id === state.ignition.currentAnchorId)) {
                const pick = pickWeightedDesireAnchor(null, nextList) || nextList[0];
                selectIgnitionAnchor(pick, 'anchor_tag_filter');
              }
            }
            renderIgnitionTab();
          };
        });

        // Direct anchor selection in filtered mode ("我想看哪个点火就能看哪个")
        container.querySelectorAll('[data-ign-pick]').forEach(btn => {
          btn.onclick = () => {
            const targetId = btn.getAttribute('data-ign-pick');
            const target = state.desireAnchors.find(a => a.id === targetId);
            if (!target) return;
            selectIgnitionAnchor(target, 'anchor_direct_pick');
            renderIgnitionTab();
          };
        });

        const toggleRawBtn = document.getElementById('btn-anchor-toggle-raw');
        if (toggleRawBtn) {
          toggleRawBtn.onclick = () => {
            state.ignition.showRawAnchor = !state.ignition.showRawAnchor;
            renderIgnitionTab();
          };
        }

        document.getElementById('btn-anchor-switch').onclick = () => {
          const pool = isFilteredMode ? filteredAnchors : allAnchors;
          const next = pickWeightedDesireAnchor(state.ignition.currentAnchorId, pool);
          if (!next || next.id === state.ignition.currentAnchorId) {
            showToast(isFilteredMode
              ? '当前标签下只有 1 条渴望，可点右下角「速记」新增'
              : '渴望池目前只有 1 条，点右下角「速记」多存几条吧');
            return;
          }
          state.ignition.switchCount++;
          selectIgnitionAnchor(next, 'anchor_switch');
          renderIgnitionTab();
        };

        const stepBtn = document.getElementById('btn-ign-step');
        if (stepBtn && cachedEvidence.linkedNodeId) {
          stepBtn.onclick = () => {
            trackActivity('ignition', 'step_click', cachedEvidence.linkedNodeId, {
              anchor_id: state.ignition.currentAnchorId,
              node_id: cachedEvidence.linkedNodeId
            });
            recordIgnitionFollowupIfRecent('forest', 'step_click');
            switchTab('forest');
            const targetNode = state.forestNodes.find(n => n.id === cachedEvidence.linkedNodeId);
            if (targetNode) {
              setTimeout(() => openForestNodeDrawer(targetNode), 80);
            }
          };
        }

        document.getElementById('btn-ign-refresh-ev').onclick = async () => {
          if (!isAiConfigured()) {
            const prevStash = state.prefs.ignition_cache?.capture_stash || [];
            state.prefs.ignition_cache = { ...buildLocalFallbackEvidence(), capture_stash: prevStash };
            persistUserCache();
            renderIgnitionTab();
            showToast('已根据森林进展刷新本地依据');
            return;
          }
          state.ignition.refreshingEvidence = true;
          renderIgnitionTab();
          try {
            const fresh = await aiGenerateIgnitionEvidence('');
            const prevStash = state.prefs.ignition_cache?.capture_stash || [];
            state.prefs.ignition_cache = { ...fresh, capture_stash: prevStash };
            persistUserCache();
            enqueueSyncOp({ type: 'save_prefs' });
            showToast('已刷新今日可行性依据并缓存');
          } catch (err) {
            showToast(err.message || '刷新失败', 3800);
          } finally {
            state.ignition.refreshingEvidence = false;
            renderIgnitionTab();
          }
        };
      }

      // =====================================================================
      // 11. TAB 1: 今日复习 (REVEAL FIRST -> VERIFY -> RATE & ADVANCE + UNDO)
      // =====================================================================
      function getCurrentQueueItem() {
        return state.review.queue[state.review.index] || null;
      }

      function getCurrentReviewCard() {
        const item = getCurrentQueueItem();
        return item ? state.cards.find(c => c.id === item.id) || null : null;
      }

      function renderReviewHeader() {
        const stats = getTodayCloudStats();
        const doneToday = stats.reviewedTodayCount;
        const remainingInQueue = Math.max(0, state.review.queue.length - state.review.index);
        const totalToday = doneToday + remainingInQueue;

        let label = '今日暂无待保鲜卡片';
        let pct = 100;
        if (remainingInQueue > 0) {
          const currentOrdinal = doneToday + 1;
          if (state.review.inExtraBatch) {
            label = `加餐第 ${state.review.index + 1} / ${state.review.queue.length} 张 · 今日第 ${currentOrdinal} 张`;
            pct = Math.min(100, Math.round((state.review.index / Math.max(1, state.review.queue.length)) * 100));
          } else {
            label = `今日第 ${currentOrdinal} / ${totalToday} 张`;
            pct = totalToday > 0 ? Math.min(100, Math.round((doneToday / totalToday) * 100)) : 0;
          }
        } else if (doneToday > 0) {
          label = `今日已完成 ${doneToday} 张`;
          pct = 100;
        }

        const pending = state.syncQueue.length;
        const dotClass = state.syncStatus === 'syncing' ? 'syncing' : (state.syncStatus === 'error' || pending > 0) ? 'error' : '';
        const dotTxt = state.syncStatus === 'syncing'
          ? (pending > 0 ? `同步中 (${pending})` : '同步中')
          : (state.syncStatus === 'error' || pending > 0)
            ? (pending > 0 ? `待同步 (${pending})` : '待重试')
            : '云端已同步';

        const canUndo = state.review.undoStack.length > 0;

        return `
          <div class="page-header" style="margin-bottom:10px;">
            <span style="font-size:13px;font-weight:500;color:var(--ink-secondary);font-variant-numeric:tabular-nums;">${label}</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${canUndo ? `
                <button type="button" class="btn-ghost btn-xs" id="btn-undo-review" title="撤回上一张">
                  ${ICONS.undo}<span>撤回</span>
                </button>
              ` : ''}
              <button type="button" class="sync-dot-wrap" id="btn-sync-pill" title="点击立即同步">
                <span id="sync-dot" class="sync-dot ${dotClass}"></span>
                <span id="sync-dot-text">${dotTxt}</span>
              </button>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
        `;
      }

      function wireReviewHeaderButtons() {
        const undoBtn = document.getElementById('btn-undo-review');
        if (undoBtn) undoBtn.onclick = onUndoLastReview;

        const syncPill = document.getElementById('btn-sync-pill');
        if (syncPill) {
          syncPill.onclick = async () => {
            if (state.syncQueue.length > 0) {
              await flushSyncQueue();
              showToast(state.syncQueue.length === 0 ? '所有离线变更已同步到云端' : '网络尚未恢复，稍后自动重试');
            } else {
              try {
                await fetchAllUserData();
                if (state.review.phase === 'front' && state.review.index >= state.review.queue.length) {
                  buildTodayQueue();
                  renderReviewTab();
                }
                showToast('已与云端同步最新数据');
              } catch (err) {
                showToast(err.message || '同步失败');
              }
            }
          };
        }
      }

      function renderReviewTab() {
        const container = document.getElementById('view-review');
        if (!container) return;

        const total = state.review.queue.length;
        const idx = state.review.index;

        // Completed / Empty State
        if (total === 0 || idx >= total) {
          const stats = getTodayCloudStats();
          const headline = stats.reviewedTodayCount > 0
            ? '今日已完成'
            : (state.cards.length === 0 ? '还没有卡片，先记第一条吧' : '今日暂无待复习卡片');
          const subtext = stats.reviewedTodayCount > 0
            ? '休息一下，交给大脑后台慢慢消化。'
            : '记下你看到的事实和第一感觉，明天自动安排复习。';

          container.innerHTML = `
            ${renderReviewHeader()}
            <div class="done-stage anim-up">
              <div class="done-icon">${ICONS.sun}</div>
              <h2 style="margin:0 0 8px;font-size:18px;font-weight:600;">${headline}</h2>
              <p style="margin:0 0 26px;font-size:13px;color:var(--ink-muted);max-width:260px;line-height:1.65;">
                ${subtext}
              </p>
              <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:220px;">
                <button type="button" class="btn btn-primary btn-block" id="btn-done-capture">记一条新的</button>
                ${state.review.hasReservoir ? `
                  <button type="button" class="btn btn-soft btn-sm btn-block" id="btn-pull-ten" style="color:var(--ink-muted);">
                    顺手再捞 10 张
                  </button>
                ` : ''}
              </div>
            </div>
          `;
          wireReviewHeaderButtons();
          document.getElementById('btn-done-capture').onclick = () => switchTab('capture');
          const pullBtn = document.getElementById('btn-pull-ten');
          if (pullBtn) pullBtn.onclick = pullExtraTenCards;
          return;
        }

        const card = getCurrentReviewCard();
        if (!card) {
          state.review.index++;
          renderReviewTab();
          return;
        }

        // ---------------- FRONT PHASE (Hero Fact + On-Demand Scientific AI Micro-Test) ----------------
        if (state.review.phase === 'front') {
          const testData = state.review.activeTest;
          let testPanelHtml = '';
          if (state.review.activeTestLoading) {
            testPanelHtml = `
              <div class="active-test-box anim-pulse" style="font-size:13px;color:var(--sage);">
                正在出一条轻测试...
              </div>
            `;
          } else if (testData) {
            testPanelHtml = `
              <div class="active-test-box anim-up">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
                  <span style="font-size:11px;font-weight:600;color:var(--sage);">✦ ${esc(testData.mode)} · 心里想 3 秒即可</span>
                  <button type="button" class="btn-ghost btn-xs" id="btn-active-test-refresh" style="color:var(--sage);padding:2px 6px;">换一题</button>
                </div>
                <p style="margin:0;font-size:14px;line-height:1.65;color:var(--ink);">${esc(testData.prompt)}</p>
              </div>
            `;
          }

          container.innerHTML = `
            ${renderReviewHeader()}
            <div class="review-stage anim-up">
              <div class="front-card" id="front-card-tap" role="button" tabindex="0" aria-label="点击翻看背面">
                <div class="clue-kicker">事实</div>
                <p class="clue-text">${esc(card.front_fact)}</p>
                <div style="margin-top:22px;font-size:12px;color:var(--ink-muted);opacity:0.75;">
                  轻触卡片翻面对照
                </div>
              </div>

              ${testPanelHtml}

              <div style="display:flex;flex-direction:column;gap:8px;">
                ${!testData && !state.review.activeTestLoading ? `
                  <button type="button" class="btn btn-soft btn-sm btn-block" id="btn-active-test" style="color:var(--ink-secondary);">
                    ${ICONS.sparkle} <span>AI 换个方式考我</span>
                  </button>
                ` : ''}
                ${renderAiExtraPromptHtml('rev-test-extra', '例如：出个职场沟通场景 / 从经济学视角考我（优先按此出题）', state.review.activeTestExtraPrompt)}
                <button type="button" class="btn btn-primary btn-block" id="btn-reveal-back" style="margin-top:4px;">
                  翻看背面
                </button>
              </div>
            </div>
          `;
          wireReviewHeaderButtons();
          document.getElementById('btn-reveal-back').onclick = onRevealBack;
          document.getElementById('front-card-tap').onclick = onRevealBack;
          const testExtraEl = document.getElementById('rev-test-extra');
          if (testExtraEl) {
            testExtraEl.oninput = () => { state.review.activeTestExtraPrompt = testExtraEl.value; };
          }
          const testBtn = document.getElementById('btn-active-test');
          if (testBtn) testBtn.onclick = onRequestActiveTest;
          const refreshTestBtn = document.getElementById('btn-active-test-refresh');
          if (refreshTestBtn) refreshTestBtn.onclick = onRequestActiveTest;
          return;
        }

        // ---------------- BACK PHASE (Prominent Fact + Muted Grey Anchor & Single-Line Evolution) ----------------
        const tags = Array.isArray(card.evolution_tags) ? card.evolution_tags : [];
        const isFull = tags.length >= 3;
        const edited = state.review.editedThisReview;
        const editedSlot = state.review.editedSlotIndex;
        const linkedCard = card.cross_link_id
          ? state.cards.find(c => c.id === card.cross_link_id)
          : null;

        // Build 3 fixed single-line slots in calm grey
        let slotsHtml = '';
        for (let i = 0; i < 3; i++) {
          if (i < tags.length) {
            const canFixSameSlot = edited && editedSlot === i;
            const disabledAttr = (edited && !canFixSameSlot) ? 'disabled' : '';
            slotsHtml += `
              <button type="button" class="evo-capsule ${canFixSameSlot ? 'just-edited' : ''}" data-slot="${i}" ${disabledAttr} title="${canFixSameSlot ? '可点此修正错别字' : '点击微调'}">
                <span style="flex:1;line-height:1.5;">${esc(tags[i])}</span>
                ${(!edited || canFixSameSlot) ? `<span style="opacity:0.55;display:inline-flex;flex-shrink:0;">${ICONS.edit}</span>` : ''}
              </button>
            `;
          } else {
            slotsHtml += `
              <button type="button" class="evo-slot-empty" data-add-slot="1" ${edited ? 'disabled' : ''}>
                <span>+ 记一条认识 (${i + 1}/3)</span>
              </button>
            `;
          }
        }

        let scaffoldHtml = '';
        if (state.review.scaffoldLoading) {
          scaffoldHtml = `
            <div class="scaffold-panel anim-pulse" style="font-size:12px;color:var(--ink-muted);">
              正在想几个切入问题...
            </div>
          `;
        } else if (state.review.scaffoldQuestions && state.review.scaffoldQuestions.length > 0) {
          scaffoldHtml = `
            <div class="scaffold-panel anim-up" style="background:var(--surface);">
              <div style="font-size:11px;font-weight:500;color:var(--ink-muted);">切入角度</div>
              <ul class="scaffold-list">
                ${state.review.scaffoldQuestions.map(q => `<li><span style="color:var(--sage);">·</span><span>${esc(q)}</span></li>`).join('')}
              </ul>
            </div>
          `;
        }

        container.innerHTML = `
          ${renderReviewHeader()}
          <div class="review-stage anim-up">
            <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px;">
              <!-- Prominent Hero Fact Card -->
              <div class="card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                  <span style="font-size:12px;font-weight:600;color:var(--ink-secondary);">事实</span>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span class="lock-badge" aria-label="已锁定">${ICONS.lock}</span>
                    <button type="button" class="btn-ghost btn-xs" id="btn-review-edit-card" style="padding:3px 6px;min-height:26px;" title="编辑或删除">
                      ${ICONS.edit}
                    </button>
                  </div>
                </div>
                <p class="fact-hero-text">${esc(card.front_fact)}</p>
              </div>

              <!-- Muted Grey Initial Feeling -->
              <div class="card-soft" style="padding:14px 16px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                  <span style="font-size:12px;font-weight:500;color:var(--ink-muted);">最初感受</span>
                  <span class="lock-badge" aria-label="已锁定">${ICONS.lock}</span>
                </div>
                <p class="muted-body-text">${esc(card.back_anchor)}</p>
              </div>

              <!-- Muted Grey Evolution Layer (3 Single-Line Slots) -->
              <div class="card-soft" style="padding:14px 16px;">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                  <span style="font-size:12px;font-weight:500;color:var(--ink-muted);">最新认识</span>
                  <span style="font-size:11px;color:var(--ink-muted);font-variant-numeric:tabular-nums;">${tags.length} / 3</span>
                </div>

                <div class="evo-slots-grid">${slotsHtml}</div>

                ${!edited && isFull ? `
                  <div style="margin-top:10px;">
                    <button type="button" class="btn btn-terra btn-sm btn-block" id="btn-open-compress">
                      ${ICONS.sparkle} 合并压缩新想法
                    </button>
                  </div>
                ` : ''}

                ${edited ? `
                  <div style="margin-top:10px;padding:8px 11px;border-radius:10px;background:var(--sage-soft);color:var(--sage);font-size:12px;line-height:1.5;">
                    已记下，留白给后台消化。${editedSlot !== null ? '点虚线行可改错字。' : ''}
                  </div>
                ` : ''}

                <!-- On-Demand Scaffolding Trigger -->
                <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;">
                  <button type="button" class="btn-ghost" id="btn-scaffold" style="margin-left:-8px;" ${state.review.scaffoldLoading ? 'disabled' : ''}>
                    ${ICONS.bulb} 给点提问角度
                  </button>
                  <span style="font-size:11px;color:var(--ink-muted);">直接点下方下一张</span>
                </div>
                ${renderAiExtraPromptHtml('rev-scaffold-extra', '例如：往心理学或博弈机制方向提问（优先按此生成）', state.review.scaffoldExtraPrompt)}

                ${scaffoldHtml}

                ${linkedCard ? `
                  <button type="button" class="cross-shimmer" id="btn-cross-peek">
                    <span>✦ 发现一张跨领域相似卡</span>
                    <span style="flex-shrink:0;display:inline-flex;">${ICONS.chevronRight}</span>
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- Binary Rating directly commits & advances cleanly -->
            <div class="rating-grid">
              <button type="button" class="btn btn-terra" id="btn-rate-again">有点模糊</button>
              <button type="button" class="btn btn-primary" id="btn-rate-good">想起来了</button>
            </div>
          </div>
        `;

        wireReviewHeaderButtons();

        document.getElementById('btn-rate-again').onclick = () => onBackRatedAndNext('again');
        document.getElementById('btn-rate-good').onclick = () => onBackRatedAndNext('good');
        document.getElementById('btn-scaffold').onclick = onRequestScaffold;
        const scafExtraEl = document.getElementById('rev-scaffold-extra');
        if (scafExtraEl) {
          scafExtraEl.oninput = () => { state.review.scaffoldExtraPrompt = scafExtraEl.value; };
        }
        document.getElementById('btn-review-edit-card').onclick = () => openCardEditModal(card, { fromReview: true });

        container.querySelectorAll('.evo-capsule').forEach(btn => {
          if (btn.disabled) return;
          btn.onclick = () => openEvolutionEditModal(card, Number(btn.getAttribute('data-slot')));
        });
        if (!edited) {
          container.querySelectorAll('.evo-slot-empty').forEach(btn => {
            btn.onclick = () => openEvolutionEditModal(card, null);
          });
          const compBtn = document.getElementById('btn-open-compress');
          if (compBtn) compBtn.onclick = () => openCompressModal(card);
        }

        const peekBtn = document.getElementById('btn-cross-peek');
        if (peekBtn && linkedCard) {
          peekBtn.onclick = () => openCrossDomainModal(card, linkedCard);
        }
      }

      async function onRequestActiveTest() {
        const card = getCurrentReviewCard();
        if (!card || state.review.activeTestLoading) return;
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }
        const customPrompt = readAiExtraPrompt('rev-test-extra', state.review.activeTestExtraPrompt);
        state.review.activeTestExtraPrompt = customPrompt;
        state.review.activeTestLoading = true;
        state.review.activeTestTriggered = true;
        renderReviewTab();

        try {
          state.review.activeTest = await aiGenerateActiveTest(card, customPrompt);
        } catch (err) {
          showToast(err.message || '测试生成失败', 4000);
          const hasEvo = Array.isArray(card.evolution_tags) && card.evolution_tags.length > 0;
          state.review.activeTest = {
            mode: hasEvo ? '场景迁移测' : '线索回忆测',
            prompt: hasEvo
              ? '如果把这件事换到工作或亲密关系里，你会先注意什么？'
              : '当时看到这件事，最先戳中你的那一下是什么感觉？'
          };
        } finally {
          state.review.activeTestLoading = false;
          renderReviewTab();
        }
      }

      function onRevealBack() {
        if (state.review.phase !== 'front') return;
        state.review.frontAccMs = getCurrentPhaseElapsedMs();
        state.review.backAccMs = 0;
        state.review.segStartMs = Date.now();
        state.review.phase = 'back';
        renderReviewTab();
        window.scrollTo(0, 0);
      }

      function onBackRatedAndNext(ratingKey) {
        const qItem = getCurrentQueueItem();
        const card = getCurrentReviewCard();
        if (!qItem || !card) return;

        const now = Date.now();
        const backDurationMs = getCurrentPhaseElapsedMs();
        const frontDurationMs = clamp(Math.round(state.review.frontAccMs || 800), 80, 300000);
        const R = Number(computeRetrievability(card.fsrs_state, now).toFixed(3));
        const nextFsrs = scheduleFsrsCard(card.fsrs_state, ratingKey, now);
        const prevStats = getTodayCloudStats();
        const dailyOrdinal = prevStats.reviewedTodayCount + 1;

        const prevCardSnapshot = {
          fsrs_state: card.fsrs_state ? JSON.parse(JSON.stringify(card.fsrs_state)) : null,
          due_at: card.due_at
        };

        updateCardOptimistic(card.id, {
          fsrs_state: nextFsrs,
          due_at: nextFsrs.due
        });

        const reviewLogClientId = logActivityCloud('review', card.id, {
          session_date: localDateKey(),
          tier: qItem.tier,
          extra_batch: Boolean(qItem.extraBatch),
          front_ms: frontDurationMs,
          back_ms: backDurationMs,
          rating: ratingKey === 'good' ? 'good' : 'again',
          retrievability_r: R,
          queue_index: dailyOrdinal,
          edited_evolution: state.review.editedThisReview,
          used_active_test: state.review.activeTestTriggered
        });

        if (state.review.scaffoldTriggered) {
          logActivityCloud('ai_usage', card.id, {
            feature: 'scaffold',
            adopted: state.review.editedThisReview
          });
        }
        if (state.review.activeTestTriggered) {
          logActivityCloud('ai_usage', card.id, {
            feature: 'active_test',
            adopted: true
          });
        }

        state.review.undoStack.push({
          cardId: card.id,
          prevCardSnapshot,
          queueIndex: state.review.index,
          reviewLogClientId
        });
        if (state.review.undoStack.length > 15) state.review.undoStack.shift();

        state.review.index++;
        resetCardTurnState();
        renderReviewTab();
        window.scrollTo(0, 0);
      }

      function onUndoLastReview() {
        if (state.review.undoStack.length === 0) return;
        const snap = state.review.undoStack.pop();
        const card = state.cards.find(c => c.id === snap.cardId);

        if (card) {
          updateCardOptimistic(card.id, {
            fsrs_state: snap.prevCardSnapshot.fsrs_state,
            due_at: snap.prevCardSnapshot.due_at
          });
        }
        undoActivityLogCloud(snap.reviewLogClientId);

        state.review.index = Math.min(snap.queueIndex, state.review.queue.length);
        resetCardTurnState();
        renderReviewTab();
        showToast('已撤回上一张卡片');
      }

      async function onRequestScaffold() {
        const card = getCurrentReviewCard();
        if (!card || state.review.scaffoldLoading) return;
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }

        const customPrompt = readAiExtraPrompt('rev-scaffold-extra', state.review.scaffoldExtraPrompt);
        state.review.scaffoldExtraPrompt = customPrompt;
        state.review.scaffoldLoading = true;
        state.review.scaffoldTriggered = true;
        renderReviewTab();

        try {
          state.review.scaffoldQuestions = await aiFetchScaffolding(card, customPrompt);
        } catch (err) {
          showToast(err.message || '提问角度生成失败', 4000);
          state.review.scaffoldQuestions = [
            '这件事背后最反常识的支点是什么？',
            '换一个完全不同的领域，它还成立吗？'
          ];
        } finally {
          state.review.scaffoldLoading = false;
          renderReviewTab();
        }
      }

      // --- Evolution Micro-Edit Modal (Max 1 edit per review, typo fix allowed on same slot) ---
      function openEvolutionEditModal(card, slotIndex) {
        const isFixingJustEdited = state.review.editedThisReview && state.review.editedSlotIndex === slotIndex;
        if (state.review.editedThisReview && !isFixingJustEdited) return;

        const isEdit = slotIndex !== null && slotIndex !== undefined;
        const tags = Array.isArray(card.evolution_tags) ? card.evolution_tags : [];
        const currentText = isEdit ? (tags[slotIndex] || '') : '';

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <h3 style="margin:0;font-size:16px;font-weight:600;">${isFixingJustEdited ? '修正词条' : (isEdit ? '修改认识' : '记一条认识')}</h3>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>
            <p style="margin:0;font-size:13px;color:var(--ink-muted);line-height:1.55;">
              ${isFixingJustEdited
                ? '可修改刚刚写下的错别字。'
                : '用 1 个简短短词概括你的新认识，本次改完即止。'}
            </p>
            <input id="m-evo-input" class="input" type="text" maxlength="24" value="${esc(currentText)}" placeholder="写下简短关键词或短句" />
            <div style="display:flex;gap:10px;">
              ${isEdit ? `<button type="button" class="btn btn-soft btn-sm" id="m-evo-del" style="color:var(--ink-muted);">清空</button>` : ''}
              <button type="button" class="btn btn-primary" style="flex:1;" id="m-evo-save">保存</button>
            </div>
          </div>
        `);

        const input = document.getElementById('m-evo-input');
        setTimeout(() => input?.focus(), 60);
        document.getElementById('m-close').onclick = closeModal;

        document.getElementById('m-evo-save').onclick = () => {
          const val = input.value.trim();
          if (!val) {
            showToast('请输入简短词条');
            return;
          }
          const before = [...tags];
          const after = [...tags];
          let targetSlot = slotIndex;
          if (isEdit) {
            if (after[slotIndex] === val) {
              closeModal();
              return;
            }
            after[slotIndex] = val;
          } else {
            if (after.length >= 3) {
              closeModal();
              return;
            }
            targetSlot = after.length;
            after.push(val);
          }
          commitEvolution(card, isEdit ? 'replace' : 'add', before, after, targetSlot, isFixingJustEdited);
          closeModal();
        };

        const delBtn = document.getElementById('m-evo-del');
        if (delBtn) {
          delBtn.onclick = () => {
            const before = [...tags];
            const after = before.filter((_, i) => i !== slotIndex);
            commitEvolution(card, 'remove', before, after, null, isFixingJustEdited);
            closeModal();
          };
        }
      }

      // --- AI Concept Compressor Modal (Now with editable refinement before commit!) ---
      function openCompressModal(card, onDoneCallback = null) {
        if (!onDoneCallback && state.review.editedThisReview) return;
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }
        const tags = card.evolution_tags || [];

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <h3 style="margin:0;font-size:16px;font-weight:600;">合并压缩词条</h3>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px;">
              ${tags.map((w, i) => `<div class="evo-row-readonly" style="font-size:13px;">${i + 1}. ${esc(w)}</div>`).join('')}
            </div>

            <div>
              <label class="field-label" for="m-comp-idea">新想法</label>
              <input id="m-comp-idea" class="input" type="text" maxlength="60" placeholder="写下你想加进来的新感悟" />
              ${renderAiExtraPromptHtml('comp-ai-extra', '例如：偏心理学专业词 / 控制在 4 字以内（优先按此压缩）')}
            </div>

            <button type="button" class="btn btn-primary btn-block" id="m-comp-run">${ICONS.sparkle} 生成 2 个合并词</button>
            <div id="m-comp-results" class="hidden" style="display:flex;flex-direction:column;gap:8px;"></div>
            <div id="m-comp-refine" class="hidden card-soft" style="display:flex;flex-direction:column;gap:10px;">
              <div id="m-comp-refine-title" style="font-size:12px;color:var(--ink-muted);">可直接确认或微调后再替换</div>
              <input id="m-comp-refine-input" class="input" type="text" maxlength="24" />
              <button type="button" class="btn btn-ink btn-sm btn-block" id="m-comp-confirm">确认替换</button>
            </div>
          </div>
        `);

        document.getElementById('m-close').onclick = closeModal;
        const ideaInput = document.getElementById('m-comp-idea');
        const runBtn = document.getElementById('m-comp-run');
        const resBox = document.getElementById('m-comp-results');
        const refineBox = document.getElementById('m-comp-refine');
        const refineTitle = document.getElementById('m-comp-refine-title');
        const refineInput = document.getElementById('m-comp-refine-input');
        const confirmBtn = document.getElementById('m-comp-confirm');
        let selectedTargetIdx = 0;

        setTimeout(() => ideaInput?.focus(), 60);

        runBtn.onclick = async () => {
          const idea = ideaInput.value.trim();
          if (!idea) {
            showToast('请先写一句你的新想法');
            return;
          }
          const customPrompt = readAiExtraPrompt('comp-ai-extra');
          runBtn.disabled = true;
          runBtn.textContent = '正在凝练语义...';
          resBox.classList.add('hidden');
          refineBox.classList.add('hidden');

          try {
            const options = await aiCompressTags(card, idea, customPrompt);
            if (!options.length) throw new Error('未返回压缩方案');

            resBox.innerHTML = options.map((opt, idx) => {
              const targetIdx = clamp(Number(opt.replace_index) || 0, 0, 2);
              const oldW = tags[targetIdx] || '';
              return `
                <button type="button" class="btn-sage-soft" data-opt="${idx}" style="width:100%;text-align:left;padding:12px 14px;border-radius:14px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <strong style="font-size:14px;">${esc(opt.word)}</strong>
                    <span style="font-size:11px;opacity:0.8;">替换「${esc(oldW)}」</span>
                  </div>
                  <div style="font-size:12px;color:var(--ink-secondary);">${esc(opt.reason || '')}</div>
                </button>
              `;
            }).join('');
            resBox.classList.remove('hidden');

            resBox.querySelectorAll('button[data-opt]').forEach(btn => {
              btn.onclick = () => {
                const opt = options[Number(btn.getAttribute('data-opt'))];
                selectedTargetIdx = clamp(Number(opt.replace_index) || 0, 0, 2);
                const oldW = tags[selectedTargetIdx] || '';
                refineTitle.textContent = `将替换槽位 ${selectedTargetIdx + 1}「${oldW}」，可直接确认或微调字词：`;
                refineInput.value = String(opt.word || '').trim();
                refineBox.classList.remove('hidden');
                refineInput.focus();
              };
            });

            confirmBtn.onclick = () => {
              const finalWord = refineInput.value.trim();
              if (!finalWord) {
                showToast('词条不能为空');
                return;
              }
              const before = [...tags];
              const after = [...tags];
              after[selectedTargetIdx] = finalWord;
              if (onDoneCallback) {
                onDoneCallback(after);
                logActivityCloud('ai_usage', card.id, { feature: 'compress', adopted: true });
                closeModal();
              } else {
                commitEvolution(card, 'compress', before, after, selectedTargetIdx, false);
                logActivityCloud('ai_usage', card.id, { feature: 'compress', adopted: true });
                closeModal();
              }
            };
          } catch (err) {
            showToast(err.message || '概念压缩失败', 4000);
            logActivityCloud('ai_usage', card.id, { feature: 'compress', adopted: false });
          } finally {
            runBtn.disabled = false;
            runBtn.innerHTML = `${ICONS.sparkle} 重新提炼压缩词`;
          }
        };
      }

      function commitEvolution(card, action, before, after, targetSlotIndex, isTypoFix = false) {
        const reps = (card.fsrs_state?.reps || 0) + 1;
        const history = Array.isArray(card.evolution_history) ? [...card.evolution_history] : [];

        if (isTypoFix && state.review.editedHistoryIdx !== null && history[state.review.editedHistoryIdx]) {
          // Amend the just-created history entry cleanly
          history[state.review.editedHistoryIdx] = {
            ...history[state.review.editedHistoryIdx],
            at: new Date().toISOString(),
            after
          };
        } else {
          history.push({
            at: new Date().toISOString(),
            reps,
            action,
            before,
            after
          });
          state.review.editedHistoryIdx = history.length - 1;
        }

        const updatedCard = updateCardOptimistic(card.id, {
          evolution_tags: after,
          evolution_history: history
        });

        state.review.editedThisReview = true;
        state.review.editedSlotIndex = targetSlotIndex;

        if (!isTypoFix) {
          logActivityCloud('evolution', card.id, { action, reps, before, after });
          // Re-run silent cross-domain matching when new semantic evolution tags emerge!
          if (updatedCard && after.length > 0) {
            runSilentCrossDomainMatch(updatedCard);
          }
        }

        showToast(isTypoFix ? '已修正词条错别字' : '进化层已微调并后台同步');
        renderReviewTab();
      }

      // --- Cross-Domain Peek Modal (Zero Spoiler) ---
      function openCrossDomainModal(currentCard, linkedCard) {
        logActivityCloud('ai_usage', currentCard.id, { feature: 'cross_link_peek', adopted: true });
        const tags = Array.isArray(linkedCard.evolution_tags) ? linkedCard.evolution_tags : [];

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="color:var(--terra);">✦</span>
                <h3 style="margin:0;font-size:15px;font-weight:600;">来自「${esc(normalizeDomainLabel(linkedCard.domain_tag))}」的相似卡片</h3>
              </div>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>
            <p style="margin:0;font-size:12px;color:var(--ink-muted);">
              仅将不同领域的两块砖推到一起，不做剧透，剩下的交给大脑自然碰撞。
            </p>
            <div class="card-soft" style="display:flex;flex-direction:column;gap:10px;">
              <div>
                <div style="font-size:11px;color:var(--ink-muted);margin-bottom:4px;">事实线索</div>
                <p style="margin:0;font-size:14px;line-height:1.65;white-space:pre-wrap;">${esc(linkedCard.front_fact)}</p>
              </div>
              <div style="padding-top:10px;border-top:1px solid var(--border-soft);">
                <div style="font-size:11px;color:var(--ink-muted);margin-bottom:4px;">最初感受</div>
                <p style="margin:0;font-size:13px;color:var(--ink-secondary);line-height:1.6;white-space:pre-wrap;">${esc(linkedCard.back_anchor)}</p>
              </div>
              ${tags.length ? `
                <div style="padding-top:8px;border-top:1px solid var(--border-soft);display:flex;flex-wrap:wrap;gap:6px;">
                  ${tags.map(w => `<span style="font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage);">${esc(w)}</span>`).join('')}
                </div>
              ` : ''}
            </div>
            <button type="button" class="btn btn-soft btn-block" id="m-done">收起，继续复习</button>
          </div>
        `);
        document.getElementById('m-close').onclick = closeModal;
        document.getElementById('m-done').onclick = closeModal;
      }

      // =====================================================================
      // 12. DEDICATED CAPTURE SPACES: 保鲜记卡片 (SPACE 5A) & 破局速记 (SPACE 5B)
      // =====================================================================
      function getCaptureStash() {
        const arr = state.prefs.ignition_cache?.capture_stash;
        return Array.isArray(arr) ? arr : [];
      }

      function saveCaptureStash(nextArr) {
        state.prefs.ignition_cache = {
          ...(state.prefs.ignition_cache || {}),
          capture_stash: nextArr.slice(0, 30)
        };
        persistUserCache();
        enqueueSyncOp({ type: 'save_prefs' });
      }

      // --- 12A. 保鲜速记：记卡片（合并 AI 拆解 + 单卡提炼 + 换一个观点，手动表单默认展开） ---
      function renderCardCaptureTab() {
        const container = document.getElementById('view-capture-card');
        if (!container) return;

        const existingDoms = getExistingDomains(false);
        const displayDomain = state.capture.domainTag
          ? esc(state.capture.domainTag)
          : (isAiConfigured() ? '自动归类' : UNCLASSIFIED_LABEL);
        const stash = getCaptureStash();
        const pendingOw = state.capture.aiPendingOverwrite;
        const hasAnyContent = Boolean(state.capture.raw || state.capture.front || state.capture.anchor || state.capture.evoInit || state.capture.aiError || pendingOw);

        container.innerHTML = `
          <div class="page-header" style="margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <button type="button" class="btn-ghost btn-xs" id="btn-cap-back" style="padding:4px 6px;" aria-label="返回保鲜">
                ${ICONS.chevronLeft}
              </button>
              <h1 class="page-title">记卡片</h1>
            </div>
            ${hasAnyContent ? `
              <button type="button" class="btn-ghost btn-xs" id="btn-cap-clear">清空</button>
            ` : ''}
          </div>

          <!-- Unified Raw Input -> AI Split / Single-Card Denoised Extractor -->
          <div class="card" style="margin-bottom:14px;display:flex;flex-direction:column;gap:10px;">
            <textarea id="cap-raw" class="textarea" rows="3" style="border:none;background:transparent;padding:0;min-height:76px;" placeholder="输入或粘贴原文，AI 帮你拆成 1 张单卡">${esc(state.capture.raw)}</textarea>

            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border-soft);">
              <button type="button" class="btn btn-primary btn-sm" style="flex:1.2;" id="btn-cap-ai" ${state.capture.aiLoading ? 'disabled' : ''}>
                ${ICONS.sparkle} <span id="btn-cap-ai-txt">${state.capture.aiLoading ? '拆解中...' : 'AI 拆解'}</span>
              </button>
              <button type="button" class="btn btn-soft btn-sm" style="flex:1;" id="btn-cap-ai-next" ${(state.capture.aiLoading || state.capture.aiExcluded.length === 0) ? 'disabled' : ''} title="避开刚才已拆的观点，再从原文提炼 1 个新观点">
                ${ICONS.refresh} <span>换一个观点${state.capture.aiExcluded.length > 0 ? ` (${state.capture.aiExcluded.length})` : ''}</span>
              </button>
              <button type="button" class="btn-ghost btn-xs" id="btn-cap-stash" style="padding:6px 8px;">暂存</button>
            </div>

            ${renderAiExtraPromptHtml('cap-ai-extra', '例如：侧重某段观点 / 归类偏心理学（优先按此拆解）', state.capture.aiExtraPrompt)}

            ${state.capture.aiError ? `
              <div class="inline-notice terra" role="alert">${esc(state.capture.aiError)}</div>
            ` : ''}

            ${pendingOw ? `
              <div class="card-soft anim-up" style="border:1px solid var(--terra-border);background:var(--terra-soft);padding:11px 12px;display:flex;flex-direction:column;gap:8px;">
                <div style="font-size:12px;color:var(--terra);font-weight:500;">下方表单已有手动填写的内容，是否用本次拆解结果替换？</div>
                <div style="font-size:12px;color:var(--ink-secondary);line-height:1.55;">
                  <div class="line-clamp-2"><strong>拟预填正面：</strong>${esc(pendingOw.front_fact)}</div>
                  ${pendingOw.back_anchor ? `<div class="line-clamp-2" style="margin-top:3px;"><strong>拟预填感受：</strong>${esc(pendingOw.back_anchor)}</div>` : `<div style="margin-top:3px;color:var(--ink-muted);">背面感受留空（供你自己写）</div>`}
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <button type="button" class="btn btn-primary btn-xs" id="btn-cap-ow-yes">确认替换</button>
                  <button type="button" class="btn btn-soft btn-xs" id="btn-cap-ow-no">保留手写</button>
                </div>
              </div>
            ` : ''}
          </div>

          <!-- Manual Preservation Card Form (Expanded by Default) -->
          <div id="cap-form-panel" class="anim-up" style="display:flex;flex-direction:column;gap:12px;margin-bottom:14px;">
            <div class="card">
              <label class="field-label" for="cap-front">事实 / 原话</label>
              <textarea id="cap-front" class="textarea" rows="3" placeholder="看到或听到的原话、具体事件">${esc(state.capture.front)}</textarea>
            </div>

            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
                <label class="field-label" style="margin:0;" for="cap-anchor">最初感受</label>
                <button type="button" class="btn-ghost btn-xs" id="btn-cap-clear-anchor" style="padding:2px 6px;min-height:24px;">清空自己写</button>
              </div>
              <textarea id="cap-anchor" class="textarea" rows="3" placeholder="当时的直接想法或情绪">${esc(state.capture.anchor)}</textarea>
              ${state.capture.anchorMissingHint ? `
                <div class="inline-notice terra" style="margin-top:8px;">
                  原文里没现成的点睛感悟，补一句你自己的第一感觉即可。
                </div>
              ` : ''}
            </div>

            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
                <label class="field-label" style="margin:0;" for="cap-evo-init">初始认识（选填）</label>
                <button type="button" class="btn btn-sage-soft btn-xs" id="btn-cap-gen-evo">
                  ${ICONS.sparkle} <span id="btn-cap-gen-evo-txt">AI 生成词条</span>
                </button>
              </div>
              <input id="cap-evo-init" class="input" type="text" maxlength="24" value="${esc(state.capture.evoInit)}" placeholder="用短词概括，可点右侧生成后再改" />
              ${renderAiExtraPromptHtml('cap-evo-extra', '例如：用经济学或心理学概念提炼，控制在 6 字以内（优先按此执行）', state.capture.evoExtraPrompt)}
            </div>

            <details class="card-soft">
              <summary style="list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-muted);">
                <span>分类：<strong id="cap-domain-label" style="color:var(--ink);font-weight:500;">${displayDomain}</strong></span>
                <span style="text-decoration:underline;">修改</span>
              </summary>
              <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:10px;">
                <input id="cap-domain-input" class="input" type="text" maxlength="14" value="${esc(state.capture.domainTag)}" placeholder="留空自动归类，或手动输入类名" />
                ${existingDoms.length ? `
                  <div style="display:flex;flex-wrap:wrap;gap:6px;" id="cap-domain-pills">
                    <button type="button" class="preset-chip ${!state.capture.domainTag ? 'active' : ''}" data-dom="">自动归类</button>
                    ${existingDoms.map(d => `
                      <button type="button" class="preset-chip ${d.name === state.capture.domainTag ? 'active' : ''}" data-dom="${esc(d.name)}">${esc(d.name)}</button>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            </details>

            <button type="button" class="btn btn-ink btn-block" id="btn-cap-save">保存卡片</button>
          </div>

          ${stash.length ? `
            <details class="card-soft">
              <summary style="list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-muted);">
                <span>暂存箱（${stash.length} 条）</span>
                <span style="text-decoration:underline;">展开处理</span>
              </summary>
              <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);">
                ${stash.map((item, idx) => `
                  <div class="card" style="padding:10px 12px;">
                    <p style="margin:0 0 8px;font-size:13px;line-height:1.55;white-space:pre-wrap;">${esc(item.text)}</p>
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-muted);">
                      <span>${formatTime(item.at).slice(5)}</span>
                      <div style="display:flex;gap:6px;">
                        <button type="button" class="btn-ghost btn-xs" data-stash-load="${idx}">载入</button>
                        <button type="button" class="btn-ghost btn-xs" style="color:var(--terra);" data-stash-del="${idx}">移除</button>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </details>
          ` : ''}
        `;

        document.getElementById('btn-cap-back').onclick = () => switchTab('preserve');

        const clearBtn = document.getElementById('btn-cap-clear');
        if (clearBtn) {
          clearBtn.onclick = () => {
            clearCaptureDraft();
            renderCardCaptureTab();
            showToast('已清空');
          };
        }

        const rawEl = document.getElementById('cap-raw');
        const frontEl = document.getElementById('cap-front');
        const anchorEl = document.getElementById('cap-anchor');
        const evoEl = document.getElementById('cap-evo-init');
        const domInput = document.getElementById('cap-domain-input');
        const domLabel = document.getElementById('cap-domain-label');

        rawEl.oninput = () => {
          if (rawEl.value !== state.capture.raw) {
            state.capture.raw = rawEl.value;
            state.capture.aiExcluded = [];
            state.capture.aiPendingOverwrite = null;
            state.capture.aiError = '';
            persistCaptureDraft();
          }
        };

        frontEl.oninput = () => {
          state.capture.front = frontEl.value;
          state.capture.formFilledByAi = false;
          persistCaptureDraft();
        };

        anchorEl.oninput = () => {
          state.capture.anchor = anchorEl.value;
          state.capture.formFilledByAi = false;
          if (anchorEl.value.trim()) state.capture.anchorMissingHint = false;
          persistCaptureDraft();
        };

        evoEl.oninput = () => {
          state.capture.evoInit = evoEl.value;
          persistCaptureDraft();
        };

        domInput.oninput = () => {
          state.capture.domainTag = domInput.value.trim();
          domLabel.textContent = state.capture.domainTag || (isAiConfigured() ? '自动归类' : UNCLASSIFIED_LABEL);
          persistCaptureDraft();
        };

        document.getElementById('btn-cap-clear-anchor').onclick = () => {
          state.capture.anchor = '';
          state.capture.anchorMissingHint = false;
          state.capture.formFilledByAi = false;
          anchorEl.value = '';
          persistCaptureDraft();
          anchorEl.focus();
          showToast('已清空背面感悟，请直接写下你的直觉');
        };

        const pillsBox = document.getElementById('cap-domain-pills');
        if (pillsBox) {
          pillsBox.querySelectorAll('button').forEach(btn => {
            btn.onclick = () => {
              state.capture.domainTag = btn.getAttribute('data-dom') || '';
              domInput.value = state.capture.domainTag;
              domLabel.textContent = state.capture.domainTag || (isAiConfigured() ? '自动归类' : UNCLASSIFIED_LABEL);
              pillsBox.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
              persistCaptureDraft();
            };
          });
        }

        const capAiExtraEl = document.getElementById('cap-ai-extra');
        if (capAiExtraEl) capAiExtraEl.oninput = () => { state.capture.aiExtraPrompt = capAiExtraEl.value; };
        const capEvoExtraEl = document.getElementById('cap-evo-extra');
        if (capEvoExtraEl) capEvoExtraEl.oninput = () => { state.capture.evoExtraPrompt = capEvoExtraEl.value; };

        const applySplitResultToForm = (res) => {
          state.capture.front = res.front_fact;
          state.capture.anchor = res.back_anchor;
          state.capture.domainTag = res.domain_tag === UNCLASSIFIED_LABEL ? '' : res.domain_tag;
          state.capture.anchorMissingHint = !res.back_anchor;
          state.capture.formFilledByAi = true;
          state.capture.aiPendingOverwrite = null;
          state.capture.aiSplitUsed = true;
          state.capture.aiSplitSnapshot = {
            front_fact: res.front_fact,
            back_anchor: res.back_anchor,
            domain_tag: state.capture.domainTag
          };
          persistCaptureDraft();
          renderCardCaptureTab();
          const formEl = document.getElementById('cap-form-panel');
          if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          if (!res.back_anchor) {
            showToast('已拆出正面原话，背面留空供你自己写感悟');
            setTimeout(() => document.getElementById('cap-anchor')?.focus(), 100);
          } else {
            showToast(`已拆解 1 张单卡（${res.domain_tag}）`);
          }
        };

        const runUnifiedCardSplit = async (switchAngle = false) => {
          const raw = rawEl.value.trim();
          if (!raw) {
            showToast('请先输入或粘贴原文');
            rawEl.focus();
            return;
          }
          if (!isAiConfigured()) {
            promptConfigureAi();
            return;
          }
          const customPrompt = readAiExtraPrompt('cap-ai-extra', state.capture.aiExtraPrompt);
          state.capture.raw = raw;
          state.capture.aiExtraPrompt = customPrompt;
          state.capture.aiLoading = true;
          state.capture.aiError = '';
          state.capture.aiPendingOverwrite = null;
          renderCardCaptureTab();

          try {
            const excluded = switchAngle ? [...state.capture.aiExcluded] : [];
            const res = await aiSplitCapture(raw, excluded, customPrompt);
            if (!res.front_fact) {
              throw new Error('AI 未能从原文中提取有效内容，请重试或补充提示词');
            }
            if (switchAngle) {
              state.capture.aiExcluded.push({ front_fact: res.front_fact, back_anchor: res.back_anchor });
            } else {
              state.capture.aiExcluded = [{ front_fact: res.front_fact, back_anchor: res.back_anchor }];
            }

            const hasManualFormContent = Boolean(
              !state.capture.formFilledByAi &&
              (state.capture.front.trim() || state.capture.anchor.trim())
            );
            state.capture.aiLoading = false;

            if (hasManualFormContent) {
              state.capture.aiPendingOverwrite = res;
              renderCardCaptureTab();
              showToast('拆解完成，请确认是否替换下方手写内容');
              return;
            }

            applySplitResultToForm(res);
          } catch (err) {
            state.capture.aiLoading = false;
            state.capture.aiError = err.message || 'AI 拆解失败';
            renderCardCaptureTab();
            showToast(err.message || 'AI 拆解失败', 4200);
          }
        };

        document.getElementById('btn-cap-ai').onclick = () => runUnifiedCardSplit(false);
        document.getElementById('btn-cap-ai-next').onclick = () => runUnifiedCardSplit(true);

        const owYesBtn = document.getElementById('btn-cap-ow-yes');
        if (owYesBtn && pendingOw) {
          owYesBtn.onclick = () => applySplitResultToForm(pendingOw);
        }
        const owNoBtn = document.getElementById('btn-cap-ow-no');
        if (owNoBtn) {
          owNoBtn.onclick = () => {
            state.capture.aiPendingOverwrite = null;
            renderCardCaptureTab();
            showToast('已保留手写内容');
          };
        }

        // Stash raw text
        document.getElementById('btn-cap-stash').onclick = () => {
          const raw = rawEl.value.trim();
          if (!raw) {
            showToast('先输入一段内容再暂存');
            return;
          }
          const next = [{ id: makeClientId(), text: raw, at: new Date().toISOString() }, ...getCaptureStash()];
          saveCaptureStash(next);
          trackActivity('capture', 'capture_stash', null, { length: raw.length, source: 'card_capture' });
          state.capture.raw = '';
          state.capture.aiExcluded = [];
          persistCaptureDraft();
          renderCardCaptureTab();
          showToast('已存进暂存箱');
        };

        container.querySelectorAll('[data-stash-load]').forEach(btn => {
          btn.onclick = () => {
            const idx = Number(btn.getAttribute('data-stash-load'));
            const cur = [...getCaptureStash()];
            const item = cur[idx];
            if (!item) return;
            cur.splice(idx, 1);
            saveCaptureStash(cur);
            state.capture.raw = item.text;
            state.capture.aiExcluded = [];
            persistCaptureDraft();
            renderCardCaptureTab();
          };
        });
        container.querySelectorAll('[data-stash-del]').forEach(btn => {
          btn.onclick = () => {
            const idx = Number(btn.getAttribute('data-stash-del'));
            const cur = [...getCaptureStash()];
            cur.splice(idx, 1);
            saveCaptureStash(cur);
            renderCardCaptureTab();
            showToast('已移除');
          };
        });

        // AI Generate Editable Initial Evolution Tag
        document.getElementById('btn-cap-gen-evo').onclick = async () => {
          const front = frontEl.value.trim();
          const anchor = anchorEl.value.trim();
          if (!front) {
            showToast('先填一下事实 / 原话');
            frontEl.focus();
            return;
          }
          if (!anchor) {
            showToast('先填一下最初感受，生成的词条更贴合');
            anchorEl.focus();
            return;
          }
          if (!isAiConfigured()) {
            promptConfigureAi();
            return;
          }
          const customPrompt = readAiExtraPrompt('cap-evo-extra', state.capture.evoExtraPrompt);
          state.capture.evoExtraPrompt = customPrompt;
          const genEvoBtn = document.getElementById('btn-cap-gen-evo');
          genEvoBtn.disabled = true;
          const txtEl = document.getElementById('btn-cap-gen-evo-txt');
          if (txtEl) txtEl.textContent = '生成中...';
          try {
            const res = await aiSuggestInitialTag(front, anchor, domInput.value.trim(), customPrompt);
            if (!res.initial_tag) throw new Error('未能生成词条');
            state.capture.evoInit = res.initial_tag;
            evoEl.value = res.initial_tag;
            if (!state.capture.domainTag && res.domain_tag && res.domain_tag !== UNCLASSIFIED_LABEL) {
              state.capture.domainTag = res.domain_tag;
              domInput.value = res.domain_tag;
              domLabel.textContent = res.domain_tag;
            }
            persistCaptureDraft();
            logActivityCloud('ai_usage', null, { feature: 'gen_init_tag', adopted: true });
            showToast('已生成初始词条，可直接编辑修改');
            evoEl.focus();
          } catch (err) {
            showToast(err.message || '生成词条失败', 4000);
          } finally {
            genEvoBtn.disabled = false;
            if (txtEl) txtEl.textContent = 'AI 生成词条';
          }
        };

        // Save Card
        document.getElementById('btn-cap-save').onclick = async () => {
          const front = frontEl.value.trim();
          const anchor = anchorEl.value.trim();
          const initWord = evoEl.value.trim();
          const chosenDomain = domInput.value.trim();

          if (!front) {
            showToast('请先填写事实 / 原话');
            frontEl.focus();
            return;
          }
          if (!anchor) {
            showToast('请写一句最初感受');
            anchorEl.focus();
            return;
          }

          const saveBtn = document.getElementById('btn-cap-save');
          saveBtn.disabled = true;
          saveBtn.textContent = '保存中...';

          const nowIso = new Date().toISOString();
          const fsrs = createInitialFsrsState();
          const tags = initWord ? [initWord] : [];
          const history = initWord ? [{ at: nowIso, reps: 0, action: 'init', before: [], after: tags }] : [];
          const needsSilentClassify = !chosenDomain && isAiConfigured();
          const initialDomain = chosenDomain ? normalizeDomainLabel(chosenDomain) : UNCLASSIFIED_LABEL;

          try {
            const created = await insertCardToCloud({
              front_fact: front,
              back_anchor: anchor,
              evolution_tags: tags,
              evolution_history: history,
              domain_tag: initialDomain,
              fsrs_state: fsrs,
              due_at: fsrs.due,
              cross_link_id: null,
              cross_link_hint: null
            });

            trackActivity('capture', 'capture_submit', created?.id || null, {
              length: front.length + anchor.length,
              mode: state.capture.aiSplitUsed ? 'ai_split' : 'manual_card'
            });

            if (state.capture.aiSplitUsed) {
              const snap = state.capture.aiSplitSnapshot || {};
              const modified = (snap.front_fact !== front) || (snap.back_anchor !== anchor) || (snap.domain_tag !== chosenDomain);
              logActivityCloud('ai_usage', created?.id, {
                feature: 'split',
                adopted: true,
                modified
              });
            }

            clearCaptureDraft();
            renderCardCaptureTab();
            renderLibraryTab();

            showToast(needsSilentClassify
              ? '已保存，后台自动归类中'
              : '已保存，明天开始复习');

            if (created) {
              (async () => {
                if (needsSilentClassify) {
                  await runSilentAutoClassify(created);
                }
                const latestCard = state.cards.find(c => c.id === created.id) || created;
                await runSilentCrossDomainMatch(latestCard);
              })();
            }
          } catch (err) {
            showToast(err.message || '保存失败，请稍后重试', 3600);
            saveBtn.disabled = false;
            saveBtn.textContent = '保存卡片';
          }
        };
      }

      // --- 12B. 破局速记：专属问题树录入与 AI 具象化挂树 ---

                <div>

            <div class="card" style="display:flex;flex-direction:column;gap:10px;">

                  <button type="button" class="seg-btn ${fc.status === 'active' ? 'active' : ''}" data-fcap-status="active">推进中</button>
