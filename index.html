            <!-- 2. Cloud Activity & Backup -->
            <div class="card">
              <h2 style="margin:0 0 4px;font-size:15px;font-weight:600;">记录与备份</h2>
              <p style="margin:0;font-size:12px;color:var(--ink-muted);">使用记录实时同步云端，刷新不丢失。</p>

              <div class="stat-grid">
                <div class="stat-box"><div class="stat-val">${state.cards.length}</div><div class="stat-lbl">卡片</div></div>
                <div class="stat-box"><div class="stat-val">${reviewLogCount}</div><div class="stat-lbl">复习</div></div>
                <div class="stat-box"><div class="stat-val">${evoLogCount}</div><div class="stat-lbl">演变</div></div>
                <div class="stat-box"><div class="stat-val">${aiLogCount}</div><div class="stat-lbl">AI 协助</div></div>
              </div>

              <div style="display:flex;flex-direction:column;gap:9px;">
                <button type="button" class="btn btn-sage-soft btn-sm btn-block" id="btn-export-md">
                  导出 AI 体检报告
                </button>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">
                  <button type="button" class="btn btn-soft btn-sm" id="btn-export-json">导出存档</button>
                  <label class="btn btn-soft btn-sm" style="margin:0;cursor:pointer;">
                    导入存档
                    <input id="input-import-json" type="file" accept="application/json" class="hidden" />
                  </label>
                </div>
              </div>
            </div>

            <!-- 3. Local AI Settings (Collapsed by default, placed right before Account & Cloud) -->
            <details id="settings-ai-details" class="card">
              <summary class="settings-collapse-summary">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <h2 style="margin:0;font-size:15px;font-weight:600;flex-shrink:0;">AI 接口设置</h2>
                  <span id="settings-ai-status-badge" class="db-status-tag ${aiReady ? 'ready' : ''}" style="max-width:165px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(aiBadgeText)}</span>
                </div>
                <span style="color:var(--ink-muted);display:inline-flex;flex-shrink:0;">${ICONS.chevronRight}</span>
              </summary>

              <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft);">
                <p style="margin:0 0 12px;font-size:12px;color:var(--ink-muted);">
                  仅保存在本机浏览器，不上传云端。
                </p>

                <div class="preset-grid" id="ai-presets">
                  ${AI_PRESETS.map(p => `
                    <button type="button" class="preset-chip ${state.aiConfig.preset === p.id ? 'active' : ''}" data-preset="${p.id}">${p.label}</button>
                  `).join('')}
                </div>

                <div style="display:flex;flex-direction:column;gap:10px;">
                  <div>
                    <label class="field-label" for="ai-base-url">Base URL</label>
                    <input id="ai-base-url" class="input" type="url" value="${esc(state.aiConfig.baseUrl)}" placeholder="https://api.openai.com/v1" />
                  </div>
                  <div>
                    <label class="field-label" for="ai-api-key">API Key</label>
                    <div class="pw-wrap">
                      <input id="ai-api-key" class="input" type="password" value="${esc(state.aiConfig.apiKey)}" placeholder="sk-..." autocomplete="off" />
                      <button type="button" class="pw-eye" id="btn-eye-ai-key" aria-label="显示或隐藏密钥">${ICONS.eye}</button>
                    </div>
                  </div>
                  <div>
                    <label class="field-label" for="ai-model">Model Name</label>
                    <input id="ai-model" class="input" type="text" value="${esc(state.aiConfig.model)}" placeholder="gpt-6.1-terra" />
                  </div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:4px;">
                    <button type="button" class="btn btn-primary btn-sm" id="btn-save-ai">保存配置</button>
                    <button type="button" class="btn btn-soft btn-sm" id="btn-test-ai">测试连通</button>
                  </div>
                  <div id="ai-test-feedback" class="inline-notice hidden"></div>
                </div>
              </div>
            </details>

            <!-- 4. Account Management -->
            <div class="card">
              <h2 style="margin:0 0 10px;font-size:15px;font-weight:600;">私有账号与云端</h2>
              <div class="card-soft" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:12px;">
                <div style="display:flex;justify-content:space-between;gap:10px;">
                  <span style="color:var(--ink-muted);">账号邮箱</span>
                  <span style="font-weight:500;word-break:break-all;">${esc(state.session?.user?.email || '-')}</span>
                </div>
                <div style="display:flex;justify-content:space-between;gap:10px;">
                  <span style="color:var(--ink-muted);">数据库</span>
                  <span style="font-family:var(--font-mono);font-size:11px;word-break:break-all;">${esc(sbHost || '-')}</span>
                </div>
              </div>
              <button type="button" class="btn btn-terra btn-sm btn-block" id="btn-logout">退出登录</button>
            </div>
          </div>
        `;

        // Wire AI preset buttons
        container.querySelectorAll('#ai-presets button').forEach(btn => {
          btn.onclick = () => {
            const preset = AI_PRESETS.find(p => p.id === btn.getAttribute('data-preset'));
            if (!preset) return;
            state.aiConfig.preset = preset.id;
            if (preset.id !== 'custom') {
              document.getElementById('ai-base-url').value = preset.baseUrl;
              document.getElementById('ai-model').value = preset.model;
            }
            container.querySelectorAll('#ai-presets button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          };
        });

        // Toggle AI key visibility
        const keyInput = document.getElementById('ai-api-key');
        const eyeBtn = document.getElementById('btn-eye-ai-key');
        eyeBtn.onclick = () => {
          const isPw = keyInput.type === 'password';
          keyInput.type = isPw ? 'text' : 'password';
          eyeBtn.innerHTML = isPw ? ICONS.eyeOff : ICONS.eye;
        };

        const readAiInputs = () => {
          state.aiConfig.baseUrl = document.getElementById('ai-base-url').value.trim();
          state.aiConfig.apiKey = document.getElementById('ai-api-key').value.trim();
          state.aiConfig.model = document.getElementById('ai-model').value.trim();
        };

        const fbBox = document.getElementById('ai-test-feedback');
        const showAiFeedback = (ok, msg) => {
          fbBox.className = `inline-notice ${ok ? 'sage' : 'terra'}`;
          fbBox.textContent = msg;
        };

        const updateAiStatusBadge = () => {
          const badge = document.getElementById('settings-ai-status-badge');
          if (!badge) return;
          const ok = isAiConfigured();
          badge.textContent = ok ? `已配置 · ${state.aiConfig.model}` : '未配置';
          badge.className = `db-status-tag ${ok ? 'ready' : ''}`;
        };

        document.getElementById('btn-save-ai').onclick = () => {
          readAiInputs();
          saveJsonStorage(STORAGE_KEYS.AI_LOCAL, state.aiConfig);
          updateAiStatusBadge();
          showToast('AI 配置已保存在本机');
        };

        document.getElementById('btn-test-ai').onclick = async () => {
          readAiInputs();
          saveJsonStorage(STORAGE_KEYS.AI_LOCAL, state.aiConfig);
          updateAiStatusBadge();
          if (!isAiConfigured()) {
            showAiFeedback(false, '请先完整填写 Base URL、API Key 与 Model Name');
            return;
          }
          const btn = document.getElementById('btn-test-ai');
          btn.disabled = true;
          btn.textContent = '测试中...';
          fbBox.classList.add('hidden');
          try {
            const reply = await callOpenAiCompatible('只回复“连通成功”四个字。', '测试连接', false);
            showAiFeedback(true, `测试通过：${reply.slice(0, 32)}`);
            showToast('AI 接口连通成功');
          } catch (err) {
            showAiFeedback(false, err.message || '连通测试失败');
            showToast('连通测试未通过，请看下方报错', 3400);
          } finally {
            btn.disabled = false;
            btn.textContent = '测试连通';
          }
        };

        // Prefs: Daily limit
        const range = document.getElementById('pref-limit-range');
        const valSpan = document.getElementById('pref-limit-val');
        range.oninput = () => { valSpan.textContent = range.value; };
        range.onchange = () => {
          state.prefs.daily_limit = Number(range.value);
          persistUserCache();
          enqueueSyncOp({ type: 'save_prefs' });
          buildTodayQueue();
          showToast(`每日保鲜上限已设为 ${state.prefs.daily_limit} 张`);
        };

        // Prefs: Mix backlog
        document.getElementById('sw-mix').onclick = () => {
          state.prefs.mix_backlog = !state.prefs.mix_backlog;
          persistUserCache();
          enqueueSyncOp({ type: 'save_prefs' });
          buildTodayQueue();
          renderSettingsTab();
          showToast(state.prefs.mix_backlog ? '已开启静默混入蓄水池卡' : '已关闭静默混入');
        };

        // Prefs: Theme
        document.getElementById('sw-theme').onclick = () => {
          state.prefs.theme = state.prefs.theme === 'dark' ? 'light' : 'dark';
          applyTheme(state.prefs.theme);
          persistUserCache();
          enqueueSyncOp({ type: 'save_prefs' });
          renderSettingsTab();
        };

        // Export Markdown Diagnosis Report
        document.getElementById('btn-export-md').onclick = openDiagnosisReportModal;

        // Export Full JSON Archive
        document.getElementById('btn-export-json').onclick = () => {
          const archive = {
            app: 'neihua-cognitive-assistant',
            version: 2,
            exported_at: new Date().toISOString(),
            prefs: state.prefs,
            cards: state.cards,
            activity_logs: state.activityLogs.filter(l => !l._undone)
          };
          const day = localDateKey();
          downloadFile(JSON.stringify(archive, null, 2), `内化完整存档-${day}.json`, 'application/json;charset=utf-8');
          showToast('完整存档已下载，可存入网盘兜底');
        };

        // Idempotent JSON Import (Preserves UUIDs, restores cross_link_id & activity_logs, zero duplicates)
        document.getElementById('input-import-json').onchange = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            const parsed = JSON.parse(await file.text());
            if (!Array.isArray(parsed.cards)) throw new Error('存档格式不正确');

            showToast('正在将存档恢复至云端...');
            const existingIds = new Set(state.cards.map(c => c.id));
            const existingFingerprints = new Set(state.cards.map(c => `${c.front_fact}||${c.back_anchor}`));
            const oldToNewId = new Map();
            const pendingCrossLinks = [];
            let importedCards = 0;

            for (const c of parsed.cards) {
              if (!c.front_fact || !c.back_anchor) continue;
              const fp = `${c.front_fact}||${c.back_anchor}`;
              if ((c.id && existingIds.has(c.id)) || existingFingerprints.has(fp)) {
                if (c.id) oldToNewId.set(c.id, c.id);
                continue;
              }
              const payload = {
                front_fact: c.front_fact,
                back_anchor: c.back_anchor,
                evolution_tags: Array.isArray(c.evolution_tags) ? c.evolution_tags.slice(0, 3) : [],
                evolution_history: Array.isArray(c.evolution_history) ? c.evolution_history : [],
                domain_tag: normalizeDomainLabel(c.domain_tag),
                fsrs_state: c.fsrs_state || createInitialFsrsState(),
                due_at: c.due_at || createInitialFsrsState().due,
                cross_link_id: null,
                cross_link_hint: c.cross_link_hint || null
              };
              if (isValidUuid(c.id)) payload.id = c.id;
              const created = await insertCardToCloud(payload);
              if (created?.id) {
                existingIds.add(created.id);
                existingFingerprints.add(fp);
                if (c.id) oldToNewId.set(c.id, created.id);
                if (c.cross_link_id) {
                  pendingCrossLinks.push({ cardId: created.id, targetOldId: c.cross_link_id, hint: c.cross_link_hint || null });
                }
                importedCards++;
              }
            }

            // Second pass: restore cross_link_id safely
            for (const link of pendingCrossLinks) {
              const targetId = oldToNewId.get(link.targetOldId) || (existingIds.has(link.targetOldId) ? link.targetOldId : null);
              if (targetId && targetId !== link.cardId) {
                updateCardOptimistic(link.cardId, {
                  cross_link_id: targetId,
                  cross_link_hint: link.hint
                });
              }
            }

            // Restore missing cloud activity_logs
            let importedLogs = 0;
            if (Array.isArray(parsed.activity_logs) && parsed.activity_logs.length > 0) {
              const existingLogKeys = new Set(state.activityLogs.map(l => l.id || `${l.created_at}|${l.event_type}|${l.card_id}`));
              for (const l of parsed.activity_logs.slice(0, 1500)) {
                const key = l.id || `${l.created_at}|${l.event_type}|${l.card_id}`;
                if (existingLogKeys.has(key)) continue;
                const mappedCardId = l.card_id ? (oldToNewId.get(l.card_id) || (existingIds.has(l.card_id) ? l.card_id : null)) : null;
                logActivityCloud(l.event_type || 'review', mappedCardId, l.payload || {});
                existingLogKeys.add(key);
                importedLogs++;
              }
            }

            if (parsed.prefs) {
              state.prefs = { ...state.prefs, ...parsed.prefs };
              applyTheme(state.prefs.theme);
              enqueueSyncOp({ type: 'save_prefs' });
            }

            persistUserCache();
            buildTodayQueue();
            renderSettingsTab();
            renderLibraryTab();
            showToast(`恢复完成：新增 ${importedCards} 张卡片` + (importedLogs ? `、${importedLogs} 条记录` : ''));
          } catch (err) {
            showToast(err.message || '存档解析或导入失败', 3800);
          } finally {
            e.target.value = '';
          }
        };

        document.getElementById('btn-logout').onclick = sbLogout;
      }

      // --- Markdown Self-Diagnosis Report Builder (Outlier-capped & Full Cloud History) ---
      function buildDiagnosisMarkdown() {
        const revLogs = state.activityLogs.filter(l => l.event_type === 'review' && !l._undone);
        const aiLogs = state.activityLogs.filter(l => l.event_type === 'ai_usage');

        const capDur = (ms) => Math.min(180000, Math.max(0, Number(ms) || 0));

        const avgFront = revLogs.length
          ? (revLogs.reduce((s, r) => s + capDur(r.payload?.front_ms), 0) / revLogs.length / 1000).toFixed(1)
          : '0.0';
        const avgBack = revLogs.length
          ? (revLogs.reduce((s, r) => s + capDur(r.payload?.back_ms), 0) / revLogs.length / 1000).toFixed(1)
          : '0.0';
        const againTotal = revLogs.filter(r => r.payload?.rating === 'again').length;

        const buckets = { '1-10': [], '11-25': [], '26-50': [], '51+': [] };
        revLogs.forEach(r => {
          const i = Number(r.payload?.queue_index) || 1;
          if (i <= 10) buckets['1-10'].push(r);
          else if (i <= 25) buckets['11-25'].push(r);
          else if (i <= 50) buckets['26-50'].push(r);
          else buckets['51+'].push(r);
        });
        const fatigueLines = Object.entries(buckets).map(([k, arr]) => {
          if (!arr.length) return `- 第 ${k} 张：暂无样本`;
          const s = (arr.reduce((sum, x) => sum + capDur(x.payload?.front_ms), 0) / arr.length / 1000).toFixed(1);
          const fuzz = Math.round((arr.filter(x => x.payload?.rating === 'again').length / arr.length) * 100);
          return `- 第 ${k} 张（${arr.length} 次）：平均正面耗时 ${s}s，模糊率 ${fuzz}%`;
        });

        // Stubborn cards ranked by lapse count & lapse rate
        const stubborn = state.cards
          .map(c => {
            const reps = Number(c.fsrs_state?.reps) || 0;
            const lapses = Number(c.fsrs_state?.lapses) || 0;
            return { c, reps, lapses, rate: reps > 0 ? lapses / reps : 0 };
          })
          .filter(x => x.lapses >= 2)
          .sort((a, b) => b.lapses - a.lapses || b.rate - a.rate)
          .slice(0, 6)
          .map(x => `- 「${x.c.front_fact.slice(0, 42)}」（模糊 ${x.lapses}/${x.reps} 次 · ${normalizeDomainLabel(x.c.domain_tag)}）`);

        // AI feature adoption & split rewrite tracking
        const aiMap = {};
        aiLogs.forEach(l => {
          const f = l.payload?.feature || 'unknown';
          if (!aiMap[f]) aiMap[f] = { total: 0, adopted: 0, modified: 0 };
          aiMap[f].total++;
          if (l.payload?.adopted) aiMap[f].adopted++;
          if (l.payload?.modified) aiMap[f].modified++;
        });
        const aiLines = Object.entries(aiMap).map(([k, v]) => {
          const modNote = v.modified ? `，其中手动微调 ${v.modified} 次` : '';
          return `- ${k}：触发 ${v.total} 次，采纳 ${v.adopted} 次（${Math.round((v.adopted / v.total) * 100)}%${modNote}）`;
        });

        const evoLines = [];
        state.cards.forEach(c => {
          (c.evolution_history || []).forEach(h => {
            evoLines.push(`- [${formatTime(h.at)}] (${normalizeDomainLabel(c.domain_tag)}) 第 ${h.reps || 0} 次接触：${(h.before || []).join('/') || '无'} → ${(h.after || []).join('/') || '无'}`);
          });
        });

        return `# 内化 · 轻量认知助手 自我诊断报告原料

> 请作为认知科学与效率产品顾问，分析以下真实行为日志并给出改进建议：
> 1. 根据队列位置的耗时与模糊率，判断我当前的每日软上限（${state.prefs.daily_limit} 张）是否存在疲劳拐点？
> 2. 顽固卡片有哪些共同的表述问题？该如何改进录入拆解规则？
> 3. 结合进化快照与 AI 采纳/改写率，我的脚手架和概念压缩提示词应如何迭代？

## 一、基础数据概览
- 卡片总量：${state.cards.length} 张（动态类别数：${getExistingDomains(false).length} 个）
- 云端累计复习记录：${revLogs.length} 次（其中有点模糊 ${againTotal} 次）
- 平均正面提取耗时：${avgFront} 秒（已剔除切后台与超长离屏异常）
- 平均背面微加工耗时：${avgBack} 秒

## 二、队列位置与疲劳拐点
${fatigueLines.join('\n')}

## 三、高频模糊卡片（顽固卡）
${stubborn.length ? stubborn.join('\n') : '- 暂无明显顽固卡片'}

## 四、AI 能力有效率
${aiLines.length ? aiLines.join('\n') : '- 暂无 AI 调用记录'}

## 五、近期认知进化轨迹（最近 25 条）
${evoLines.length ? evoLines.slice(-25).join('\n') : '- 暂无进化层记录'}
`;
      }

      function openDiagnosisReportModal() {
        const md = buildDiagnosisMarkdown();
        openModal(`
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <h3 style="margin:0;font-size:16px;font-weight:600;">AI 体检报告原料</h3>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>
            <p style="margin:0;font-size:12px;color:var(--ink-muted);">复制后直接发给任意大模型，即可帮你诊断疲劳拐点与迭代方向。</p>
            <textarea readonly rows="10" class="textarea" style="font-family:var(--font-mono);font-size:12px;">${esc(md)}</textarea>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <button type="button" class="btn btn-primary btn-sm" id="m-md-copy">一键复制全文</button>
              <button type="button" class="btn btn-soft btn-sm" id="m-md-dl">下载 .md 文件</button>
            </div>
          </div>
        `);
        document.getElementById('m-close').onclick = closeModal;
        document.getElementById('m-md-copy').onclick = () => copyText(md);
        document.getElementById('m-md-dl').onclick = () => {
          downloadFile(md, `内化AI体检报告-${localDateKey()}.md`, 'text/markdown;charset=utf-8');
          showToast('体检报告已开始下载');
        };
      }

      // =====================================================================
      // 15. APPLICATION BOOTSTRAP & LIFECYCLE LISTENERS
      // =====================================================================
      async function boot() {
        applyTheme(state.prefs.theme);
        initPwaAssets();
        initAuthWallEvents();

        // Backdrop click to close modal
        document.getElementById('modal-root').addEventListener('click', (e) => {
          if (e.target.id === 'modal-root') closeModal();
        });

        // Visibility-aware timer pause/resume (prevents phone calls / app switching skewing stats)
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) pauseActiveReviewTimer();
          else resumeActiveReviewTimer();
        });

        // Auto-flush offline sync queue whenever mobile network reconnects
        window.addEventListener('online', () => {
          if (state.syncQueue.length > 0) {
            flushSyncQueue();
          }
        });

        // Verify persisted Supabase session on load
        if (state.session?.access_token && state.sbConfig.url && state.sbConfig.anonKey) {
          try {
            await ensureValidAccessToken(false);
            await enterAuthenticatedApp();
          } catch (_) {
            // If offline with cached session & data, allow seamless offline review!
            const uid = currentUserId();
            if (!navigator.onLine && uid && loadUserCache(uid)) {
              await enterAuthenticatedApp();
            } else {
              showAuthWall('上次登录已过期，请重新输入密码验证。');
            }
          }
        } else {
          showAuthWall();
        }
      }

      boot();
    })();
  </script>
</body>
</html>
