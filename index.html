<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="内化" />
  <meta name="theme-color" content="#F8F6F1" id="meta-theme-color" />
  <title>内化 · 轻量认知助手</title>

  <!-- Inline SVG Favicon (Zero external dependency) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%234E6E5D'/%3E%3Cpath d='M19 42C19 27 31 19 45 19C45 34 34 45 19 42Z' fill='%23F8F6F1' fill-opacity='0.94'/%3E%3Ccircle cx='28' cy='34' r='3.2' fill='%234E6E5D'/%3E%3C/svg%3E" />

  <style>
    /* =====================================================================
       DESIGN TOKENS: Warm Paper Light Mode & Eye-Care Dark Mode
       ===================================================================== */
    :root {
      --bg: #F8F6F1;
      --surface: #FFFFFF;
      --surface-soft: #F1EDE5;
      --surface-subtle: #F5F2EB;
      --border: #E6E0D5;
      --border-soft: rgba(230, 224, 213, 0.65);
      --ink: #262422;
      --ink-secondary: #57524C;
      --ink-muted: #847D74;
      --sage: #4E6E5D;
      --sage-hover: #3F5B4C;
      --sage-soft: #EAF1ED;
      --sage-border: rgba(78, 110, 93, 0.22);
      --terra: #B57254;
      --terra-soft: #F8EDE7;
      --terra-border: rgba(181, 114, 84, 0.24);
      --shadow-sm: 0 2px 10px rgba(38, 36, 34, 0.04);
      --shadow-md: 0 10px 30px rgba(38, 36, 34, 0.08);
      --backdrop: rgba(22, 21, 19, 0.42);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 26px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html.dark {
      --bg: #161513;
      --surface: #21201D;
      --surface-soft: #2A2824;
      --surface-subtle: #1C1B18;
      --border: #33302B;
      --border-soft: rgba(51, 48, 43, 0.72);
      --ink: #EAE5DD;
      --ink-secondary: #C4BEB4;
      --ink-muted: #938C82;
      --sage: #7BA68F;
      --sage-hover: #8CB7A0;
      --sage-soft: #213028;
      --sage-border: rgba(123, 166, 143, 0.26);
      --terra: #D49172;
      --terra-soft: #33251E;
      --terra-border: rgba(212, 145, 114, 0.28);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 34px rgba(0, 0, 0, 0.45);
      --backdrop: rgba(0, 0, 0, 0.62);
    }

    /* =====================================================================
       BASE RESET & LAYOUT SHELL
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      user-select: none;
    }

    button:disabled {
      opacity: 0.52;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 520px) {
      .shell {
        border-left: 1px solid var(--border-soft);
        border-right: 1px solid var(--border-soft);
      }
    }

    /* =====================================================================
       ANIMATIONS
       ===================================================================== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .anim-up {
      animation: fadeUp 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-pulse {
      animation: pulseSoft 1.5s ease-in-out infinite;
    }

    /* =====================================================================
       COMMON UI COMPONENTS
       ===================================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .input, .textarea, .select {
      width: 100%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      font-size: 16px; /* Prevents iOS Safari auto-zoom */
      line-height: 1.55;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .input:focus, .textarea:focus, .select:focus {
      border-color: var(--sage);
      background: var(--surface);
    }

    .textarea {
      resize: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 46px;
      padding: 11px 18px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 500;
      transition: transform 0.14s ease, opacity 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      min-height: 36px;
      padding: 7px 13px;
      font-size: 13px;
      border-radius: var(--radius-sm);
    }

    .btn-primary {
      background: var(--sage);
      color: #FFFFFF;
    }

    html.dark .btn-primary {
      color: #161513;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--sage-hover);
    }

    .btn-ink {
      background: var(--ink);
      color: var(--bg);
    }

    .btn-ink:hover:not(:disabled) {
      opacity: 0.92;
    }

    .btn-soft {
      background: var(--surface-soft);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-terra {
      background: var(--terra-soft);
      color: var(--terra);
      border: 1px solid var(--terra-border);
    }

    .btn-sage-soft {
      background: var(--sage-soft);
      color: var(--sage);
      border: 1px solid var(--sage-border);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-muted);
      min-height: 34px;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--ink);
      background: var(--surface-soft);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      border-radius: 999px;
      background: var(--border);
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .switch.on {
      background: var(--sage);
    }

    .switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .switch.on .switch-knob {
      transform: translateX(20px);
    }

    /* Range Slider */
    input[type="range"] {
      width: 100%;
      accent-color: var(--sage);
      cursor: pointer;
    }

    /* =====================================================================
       AUTH WALL (PRIVATE GATE - ONLY RENDERED WHEN LOGGED OUT)
       ===================================================================== */
    #auth-wall {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(var(--safe-top) + 24px) 22px calc(var(--safe-bottom) + 28px);
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: var(--sage);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 8px 20px rgba(78, 110, 93, 0.22);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-title {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .auth-subtitle {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--ink-muted);
    }

    .auth-error {
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      background: var(--terra-soft);
      border: 1px solid var(--terra-border);
      color: var(--terra);
      font-size: 13px;
      line-height: 1.5;
    }

    .db-config-details {
      margin-top: 16px;
      border-top: 1px solid var(--border-soft);
      padding-top: 14px;
    }

    .db-config-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--ink-muted);
      padding: 4px 2px;
    }

    .db-config-summary::-webkit-details-marker {
      display: none;
    }

    .db-status-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink-muted);
    }

    .db-status-tag.ready {
      background: var(--sage-soft);
      color: var(--sage);
    }

    /* =====================================================================
       MAIN APP LAYOUT & BOTTOM NAVIGATION
       ===================================================================== */
    #app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .tab-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 84px);
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .page-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .page-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--ink-muted);
    }

    /* Ultra-thin progress bar */
    .progress-track {
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: var(--sage);
      border-radius: 999px;
      transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Sync indicator dot */
    .sync-dot-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-muted);
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sage);
      flex-shrink: 0;
    }

    .sync-dot.syncing {
      background: var(--terra);
      animation: pulseSoft 1s infinite;
    }

    .sync-dot.error {
      background: #C45B4D;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }

    html.dark .bottom-nav {
      background: rgba(33, 32, 29, 0.92);
    }

    .bottom-nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 62px;
      padding: 0 6px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 500;
      border-radius: 14px;
      transition: color 0.18s ease;
    }

    .nav-item.active {
      color: var(--sage);
    }

    /* =====================================================================
       REVIEW TAB SPECIFICS
       ===================================================================== */
    .review-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .front-card {
      flex: 1;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 26px 22px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    .clue-kicker {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      margin-bottom: 16px;
    }

    .clue-text {
      margin: 0;
      font-size: 18px;
      line-height: 1.78;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .rating-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 4px;
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* 3 Fixed Capsule Slots for Evolution Layer */
    .evo-slots-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .evo-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      background: var(--sage-soft);
      color: var(--sage);
      border: 1px solid var(--sage-border);
      transition: transform 0.14s ease, border-color 0.18s ease;
    }

    .evo-capsule:not(:disabled):active {
      transform: scale(0.97);
    }

    .evo-slot-empty {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--ink-muted);
      border: 1px dashed var(--border);
      background: transparent;
      transition: border-color 0.18s ease, color 0.18s ease;
    }

    .evo-slot-empty:hover:not(:disabled) {
      border-color: var(--sage);
      color: var(--sage);
    }

    .cross-shimmer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: var(--radius-md);
      background: var(--terra-soft);
      border: 1px solid var(--terra-border);
      color: var(--terra);
      font-size: 12px;
      text-align: left;
      transition: opacity 0.18s ease;
    }

    .cross-shimmer:hover {
      opacity: 0.9;
    }

    .scaffold-panel {
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
    }

    .scaffold-list {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .scaffold-list li {
      font-size: 13px;
      color: var(--ink-secondary);
      display: flex;
      align-items: flex-start;
      gap: 7px;
      line-height: 1.55;
    }

    .done-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 36px 20px;
    }

    .done-icon {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      background: var(--sage-soft);
      color: var(--sage);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    /* =====================================================================
       LIBRARY TAB SPECIFICS
       ===================================================================== */
    .pills-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface);
      color: var(--ink-muted);
      border: 1px solid var(--border);
      transition: all 0.18s ease;
    }

    .pill.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .lib-card {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.18s ease, transform 0.14s ease;
    }

    .lib-card:active {
      transform: scale(0.99);
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Timeline in Detail Modal */
    .timeline {
      border-left: 1.5px solid var(--border);
      padding-left: 14px;
      margin-left: 5px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-item {
      position: relative;
      font-size: 12px;
    }

    .timeline-dot {
      position: absolute;
      left: -19px;
      top: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sage);
    }

    /* =====================================================================
       SETTINGS TAB SPECIFICS
       ===================================================================== */
    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-top: 1px solid var(--border-soft);
    }

    .preset-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .preset-chip {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--surface-soft);
      color: var(--ink-secondary);
      border: 1px solid var(--border);
      transition: all 0.16s ease;
    }

    .preset-chip.active {
      background: var(--sage-soft);
      color: var(--sage);
      border-color: var(--sage-border);
      font-weight: 500;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .stat-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 10px 6px;
      text-align: center;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap .input {
      padding-right: 44px;
    }

    .pw-eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      border-radius: 8px;
    }

    /* =====================================================================
       MODAL & TOAST
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--backdrop);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 520px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;
      overflow-y: auto;
      background: var(--surface);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px 18px calc(var(--safe-bottom) + 20px);
      box-shadow: var(--shadow-md);
      border-top: 1px solid var(--border);
    }

    @media (min-width: 520px) {
      .modal-sheet {
        border-radius: 24px;
        border: 1px solid var(--border);
        padding: 22px;
      }
    }

    .toast-wrap {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      width: 90%;
      max-width: 380px;

      pointer-events: none;

      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: var(--shadow-md);
      text-align: center;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <script>
    (() => {
      'use strict';

      // =====================================================================
      // 1. CONSTANTS, STORAGE KEYS & INLINE SVG ICONS
      // =====================================================================
      const DOMAINS = ['专业认知', '人情世故', '亲密关系', '自我觉察', '商业规律', '生活杂感'];
      const MS_PER_DAY = 86400000;

      const STORAGE_KEYS = {

        AI_LOCAL: 'neihua_ai_local_cfg_v1',

      const AI_PRESETS = [

      // Crisp inline SVG icon library (Zero external icon CDN)
      const ICONS = {
        review: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 10h8M8 14h5"/></svg>',

        library: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>',

        edit: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
        search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',
        eye: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
        eyeOff: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94M9.9 4.24A10.8 10.8 0 0 1 12 4c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>',
        sun: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
        close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
        chevronRight: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'
      };

      // =====================================================================
      // 2. APPLICATION STATE
      // =====================================================================
      const state = {
        sbConfig: loadJsonStorage(STORAGE_KEYS.SUPABASE, { url: '', anonKey: '' }),
        session: loadJsonStorage(STORAGE_KEYS.SESSION, null),
        aiConfig: loadJsonStorage(STORAGE_KEYS.AI_LOCAL, {
          preset: 'deepseek',
          baseUrl: 'https://api.deepseek.com/v1',
          apiKey: '',
          model: 'deepseek-chat'
        }),
        prefs: {
          daily_limit: 50,
          mix_backlog: true,
          theme: loadJsonStorage(STORAGE_KEYS.THEME, 'light')
        },
        cards: [],
        activityLogs: [],
        activeTab: 'review',
        syncStatus: 'idle', // 'idle' | 'syncing' | 'ok' | 'error'
        appMounted: false,

        // Review Session State
        review: {
          queue: [],
          index: 0,
          reviewedIds: new Set(),
          sunkenShown: 0,
          hasReservoir: false,
          phase: 'front', // 'front' | 'back'
          rating: null,
          frontStartMs: 0,
          backStartMs: 0,
          frontDurationMs: 0,
          editedThisReview: false,
          scaffoldQuestions: null,
          scaffoldLoading: false,
          scaffoldTriggered: false,
          submitting: false
        },

        // Capture State
        capture: {
          domainTag: '生活杂感',
          aiSplitUsed: false
        },

        // Library Filter State
        library: {
          search: '',
          domain: '全部'
        }
      };

      // =====================================================================
      // 3. PWA ICON & DYNAMIC MANIFEST GENERATOR (ZERO EXTERNAL ASSETS)
      // =====================================================================
      function initPwaAssets() {
        try {
          const drawIconPng = (size) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            if (!ctx) return '';

            // Rounded sage square
            const r = size * 0.24;
            ctx.fillStyle = '#4E6E5D';
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();

            // Minimal organic leaf / insight glyph
            ctx.fillStyle = 'rgba(248, 246, 241, 0.95)';
            ctx.beginPath();
            ctx.moveTo(size * 0.29, size * 0.67);
            ctx.bezierCurveTo(size * 0.29, size * 0.42, size * 0.47, size * 0.29, size * 0.71, size * 0.29);
            ctx.bezierCurveTo(size * 0.71, size * 0.54, size * 0.54, size * 0.71, size * 0.29, size * 0.67);
            ctx.closePath();
            ctx.fill();

            // Anchor dot
            ctx.fillStyle = '#4E6E5D';
            ctx.beginPath();
            ctx.arc(size * 0.44, size * 0.53, size * 0.055, 0, Math.PI * 2);
            ctx.fill();

            return canvas.toDataURL('image/png');
          };

          const icon180 = drawIconPng(180);
          const icon512 = drawIconPng(512);

          if (icon180) {
            const appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            appleLink.sizes = '180x180';
            appleLink.href = icon180;
            document.head.appendChild(appleLink);
          }

          if (icon512) {
            const manifest = {
              name: '内化 · 轻量认知助手',
              short_name: '内化',
              description: '低认知负荷的遗忘曲线保鲜与认知螺旋内化工具',
              start_url: './',
              display: 'standalone',
              background_color: '#F8F6F1',
              theme_color: '#4E6E5D',
              icons: [
                { src: icon180, sizes: '180x180', type: 'image/png' },
                { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
              ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(blob);
            const mLink = document.createElement('link');
            mLink.rel = 'manifest';
            mLink.href = manifestUrl;
            document.head.appendChild(mLink);
          }
        } catch (_) {
          // Safe fallback if canvas/blob is restricted
        }
      }

      // =====================================================================
      // 4. STORAGE, THEME, TOAST, MODAL & FORMATTING HELPERS
      // =====================================================================
      function loadJsonStorage(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (_) {
          return fallback;
        }
      }

      function saveJsonStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (_) {
          // Ignore quota errors
        }
      }

      function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        const metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', isDark ? '#161513' : '#F8F6F1');
        saveJsonStorage(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light');
      }

      let toastTimer = null;
      function showToast(message, duration = 2600) {
        const wrap = document.getElementById('toast-wrap');
        const pill = document.getElementById('toast-pill');
        pill.textContent = message;
        wrap.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => wrap.classList.remove('show'), duration);
      }

      function openModal(html) {
        const root = document.getElementById('modal-root');
        const sheet = document.getElementById('modal-sheet');
        sheet.innerHTML = html;
        root.classList.remove('hidden');
      }

      function closeModal() {
        const root = document.getElementById('modal-root');
        root.classList.add('hidden');
        document.getElementById('modal-sheet').innerHTML = '';
      }

      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function copyText(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) {
            showToast('已复制到剪贴板');
            return true;
          }
        } catch (_) {}
        showToast('复制受限，请长按文本框手动复制');
        return false;
      }

      function downloadFile(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function startOfTodayMs() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      }

      function endOfTodayMs() {
        const d = new Date();
        d.setHours(23, 59, 59, 999);
        return d.getTime();
      }

      function formatTime(isoOrMs) {
        if (!isoOrMs) return '-';
        const d = new Date(isoOrMs);
        if (Number.isNaN(d.getTime())) return '-';
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function setSyncStatus(status) {
        state.syncStatus = status;
        const dot = document.getElementById('sync-dot');
        const txt = document.getElementById('sync-dot-text');
        if (!dot || !txt) return;
        dot.className = 'sync-dot' + (status === 'syncing' ? ' syncing' : status === 'error' ? ' error' : '');
        txt.textContent = status === 'syncing' ? '同步中' : status === 'error' ? '待重试' : '云端已同步';
      }

      // =====================================================================
      // 5. FSRS-4.5 FORGETTING CURVE & 4-TIER ANTI-AVALANCHE SCHEDULER
      // =====================================================================
      // Standard FSRS-4.5 weights
      const FSRS_W = [
        0.4072, 1.1829, 3.1262, 15.4722,
        7.2102, 0.5316, 1.0651, 0.0234,
        1.616, 0.1544, 1.0824, 1.9813,
        0.0953, 0.2975, 2.2042, 0.2407, 2.9466
      ];
      const FSRS_FACTOR = 19 / 81;
      const FSRS_DECAY = -0.5;

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      /**
       * FSRS-4.5 Retrievability: R(t, S) = (1 + (19/81) * (t / S))^(-0.5)
       */
      function computeRetrievability(fsrsState, nowMs = Date.now()) {
        if (!fsrsState || !fsrsState.last_review) return 0.9;
        const lastMs = new Date(fsrsState.last_review).getTime();
        if (Number.isNaN(lastMs)) return 0.9;
        const elapsedDays = Math.max(0, (nowMs - lastMs) / MS_PER_DAY);
        const S = Math.max(0.15, Number(fsrsState.stability) || 1.0);
        return Math.pow(1 + FSRS_FACTOR * (elapsedDays / S), FSRS_DECAY);
      }

      /**
       * Create initial FSRS state for a newly captured card (first review tomorrow)
       */
      function createInitialFsrsState(nowMs = Date.now()) {
        const dueIso = new Date(startOfTodayMs() + MS_PER_DAY).toISOString();
        return {
          stability: 1.0,
          difficulty: 5.0,
          elapsed_days: 0,
          scheduled_days: 1,
          reps: 0,
          lapses: 0,
          state: 0, // 0=New, 1=Learning, 2=Review, 3=Relearning
          last_review: new Date(nowMs).toISOString(),
          due: dueIso
        };
      }

      /**
       * Compute next FSRS-4.5 state for binary rating:
       * 'good' -> Rating 3 (想起来了)
       * 'again' -> Rating 1 (有点模糊)
       */
      function scheduleFsrsCard(prev, ratingKey, nowMs = Date.now()) {
        const G = ratingKey === 'good' ? 3 : 1;
        const base = prev && typeof prev === 'object' ? prev : createInitialFsrsState(nowMs - MS_PER_DAY);

        const lastMs = base.last_review ? new Date(base.last_review).getTime() : (nowMs - MS_PER_DAY);
        const elapsedDays = Number(Math.max(0, (nowMs - lastMs) / MS_PER_DAY).toFixed(2));
        const prevReps = Number(base.reps) || 0;
        const prevLapses = Number(base.lapses) || 0;

        let S, D, scheduledDays, nextState;
        const D0Good = clamp(FSRS_W[4] - (3 - 3) * FSRS_W[5], 1, 10);

        if (prevReps === 0 || base.state === 0) {
          // First active recall review
          S = FSRS_W[G - 1];
          D = clamp(FSRS_W[4] - (G - 3) * FSRS_W[5], 1, 10);
          if (G === 3) {
            scheduledDays = Math.max(1, Math.round(S));
            nextState = 2;
          } else {
            scheduledDays = 1;
            nextState = 1;
          }
        } else {
          const prevS = Math.max(0.2, Number(base.stability) || 1.0);
          const prevD = clamp(Number(base.difficulty) || 5.0, 1, 10);
          const R = Math.pow(1 + FSRS_FACTOR * (elapsedDays / prevS), FSRS_DECAY);

          // Mean reversion difficulty update
          D = clamp(FSRS_W[7] * D0Good + (1 - FSRS_W[7]) * (prevD - FSRS_W[6] * (G - 3)), 1, 10);

          if (G === 3) {
            // Successful recall (Good)
            const inc = Math.exp(FSRS_W[8]) *
              (11 - D) *
              Math.pow(prevS, -FSRS_W[9]) *
              (Math.exp(FSRS_W[10] * (1 - R)) - 1);
            S = clamp(prevS * (1 + Math.max(0.15, inc)), 0.5, 365);
            scheduledDays = clamp(Math.round(S), 1, 365);
            nextState = 2;
          } else {
            // Lapsed recall (Again)
            const sf = FSRS_W[11] *
              Math.pow(D, -FSRS_W[12]) *
              (Math.pow(prevS + 1, FSRS_W[13]) - 1) *
              Math.exp(FSRS_W[14] * (1 - R));
            S = clamp(Math.min(prevS, sf), 0.25, 30);
            scheduledDays = 1;
            nextState = 3;
          }
        }

        const dueIso = new Date(startOfTodayMs() + scheduledDays * MS_PER_DAY).toISOString();
        return {
          stability: Number(S.toFixed(2)),
          difficulty: Number(D.toFixed(2)),
          elapsed_days: elapsedDays,
          scheduled_days: scheduledDays,
          reps: prevReps + 1,
          lapses: G === 1 ? prevLapses + 1 : prevLapses,
          state: nextState,
          last_review: new Date(nowMs).toISOString(),
          due: dueIso
        };
      }

      /**
       * Partition cards into the 4 anti-avalanche priority tiers
       */
      function classifyTiers(excludeSet) {
        const now = Date.now();
        const todayStart = startOfTodayMs();
        const todayEnd = endOfTodayMs();

        const tier1 = []; // Due today & fresh (scheduled_days <= 7 or reps <= 2)
        const tier2 = []; // Due today & stable
        const tier3 = []; // Historical overdue reservoir, R >= 0.30 (semi-ripe)
        const tier4 = []; // Historical overdue reservoir, R < 0.30 (sunken)

        for (const card of state.cards) {
          if (excludeSet.has(card.id)) continue;
          const dueMs = card.due_at ? new Date(card.due_at).getTime() : todayStart;
          if (dueMs > todayEnd) continue; // Future card, not due yet

          const fsrs = card.fsrs_state || {};
          const sched = Number(fsrs.scheduled_days) || 1;
          const reps = Number(fsrs.reps) || 0;
          const R = computeRetrievability(fsrs, now);

          if (dueMs >= todayStart) {
            if (sched <= 7 || reps <= 2) {
              tier1.push({ card, sched, dueMs, R });
            } else {
              tier2.push({ card, sched, dueMs, R });
            }
          } else {
            if (R >= 0.30) {
              tier3.push({ card, R, dueMs });
            } else {
              tier4.push({ card, R, dueMs });
            }
          }
        }

        // Tier 1: shortest scheduled interval ASC
        tier1.sort((a, b) => a.sched - b.sched || a.dueMs - b.dueMs);
        // Tier 2: due time ASC
        tier2.sort((a, b) => a.dueMs - b.dueMs);
        // Tier 3 & 4: retrievability R DESC (save highest-R cards before total decay)
        tier3.sort((a, b) => b.R - a.R);
        tier4.sort((a, b) => b.R - a.R);

        return {
          tier1: tier1.map(x => x.card),
          tier2: tier2.map(x => x.card),
          tier3: tier3.map(x => x.card),
          tier4: tier4.map(x => x.card)
        };
      }

      /**
       * Build today's clean queue with peak-shaving, valley-filling, and silent mixing
       */
      function buildTodayQueue() {
        const cap = clamp(Number(state.prefs.daily_limit) || 50, 5, 150);
        const mix = Boolean(state.prefs.mix_backlog);
        const { tier1, tier2, tier3, tier4 } = classifyTiers(state.review.reviewedIds);

        const todayDue = [...tier1, ...tier2];
        const queue = [];
        let t3Idx = 0;
        let t4Idx = 0;
        let todayCount = 0;

        // 1. Add today-due cards (peak shaved at daily_limit), quietly mixing 1 Tier-3 every 4 cards
        for (const c of todayDue) {
          if (queue.length >= cap) break;
          queue.push(c.id);
          todayCount++;
          if (mix && todayCount % 4 === 0 && t3Idx < tier3.length && queue.length < cap) {
            queue.push(tier3[t3Idx++].id);
          }
        }

        // 2. Valley-fill: if due today < 5 and reservoir non-empty, silently top up to 5
        const minFloor = Math.min(5, cap);
        while (queue.length < minFloor && t3Idx < tier3.length) {
          queue.push(tier3[t3Idx++].id);
        }
        while (queue.length < minFloor && t4Idx < tier4.length && state.review.sunkenShown < 2) {
          queue.push(tier4[t4Idx++].id);
          state.review.sunkenShown++;
        }

        // Boolean-only reservoir check (STRICTLY never expose overdue counts!)
        const leftover = (todayDue.length - todayCount) + (tier3.length - t3Idx) + (tier4.length - t4Idx);
        state.review.hasReservoir = leftover > 0;

        state.review.queue = queue;
        state.review.index = 0;
        resetCardTurnState();
      }

      /**
       * Voluntary extra batch: "顺手再捞 10 张"
       */
      function pullExtraTenCards() {
        const { tier1, tier2, tier3, tier4 } = classifyTiers(state.review.reviewedIds);
        const batch = [];

        for (const c of [...tier1, ...tier2, ...tier3]) {
          if (batch.length >= 10) break;
          batch.push(c.id);
        }
        for (const c of tier4) {
          if (batch.length >= 10) break;
          if (state.review.sunkenShown >= 2) break;
          batch.push(c.id);
          state.review.sunkenShown++;
        }

        if (batch.length === 0) {
          state.review.hasReservoir = false;
          showToast('蓄水池暂时已经清空啦');
          renderReviewTab();
          return;
        }

        const picked = new Set(batch);
        state.review.hasReservoir = [...tier1, ...tier2, ...tier3, ...tier4].some(c => !picked.has(c.id));
        state.review.queue = batch;
        state.review.index = 0;
        resetCardTurnState();
        renderReviewTab();
      }

      // =====================================================================
      // 6. NATIVE FETCH SUPABASE AUTH & POSTGREST CLIENT
      // =====================================================================
      function cleanBaseUrl(url) {
        return String(url || '').trim().replace(/\/+$/, '');
      }

      function translateSupabaseError(status, bodyText) {
        const msg = String(bodyText || '').toLowerCase();
        if (msg.includes('invalid login credentials') || msg.includes('invalid_grant')) {
          return '邮箱或密码不正确，请检查后再试。';
        }
        if (msg.includes('email not confirmed')) {
          return '该邮箱尚未在 Supabase 后台确认（勾选 Auto Confirm User 即可）。';
        }
        if (msg.includes('invalid api key') || status === 401) {
          return 'Supabase Anon Key 无效或登录已过期，请核对配置或重新登录。';
        }
        if (msg.includes('relation') && msg.includes('does not exist')) {
          return '数据库尚未建表，请先在 Supabase SQL Editor 运行建表脚本。';
        }
        if (msg.includes('row-level security') || status === 403) {
          return '没有权限操作数据，请检查 Supabase 的 RLS 安全策略是否已正确执行。';
        }
        if (status === 0) {
          return '网络连接失败，请检查 Supabase Project URL 格式或当前手机网络。';
        }
        return `云端请求失败 (${status})，请稍后重试。`;
      }

      async function sbPasswordLogin(url, anonKey, email, password) {
        const endpoint = `${cleanBaseUrl(url)}/auth/v1/token?grant_type=password`;
        let resp;
        try {
          resp = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'apikey': anonKey.trim(),
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email.trim(), password })
          });
        } catch (_) {
          throw new Error(translateSupabaseError(0, ''));
        }

        const text = await resp.text();
        if (!resp.ok) {
          throw new Error(translateSupabaseError(resp.status, text));
        }

        const data = JSON.parse(text);
        const expiresAt = data.expires_at
          ? data.expires_at * 1000
          : Date.now() + (data.expires_in || 3600) * 1000;

        return {
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          expires_at: expiresAt,
          user: {
            id: data.user?.id || '',
            email: data.user?.email || email.trim()
          }
        };
      }

      let refreshPromise = null;
      async function ensureValidAccessToken(forceRefresh = false) {
        if (!state.session || !state.sbConfig.url || !state.sbConfig.anonKey) {
          throw new Error('会话未就绪');
        }

        const now = Date.now();
        const needsRefresh = forceRefresh || !state.session.expires_at || (state.session.expires_at - now < 120000);
        if (!needsRefresh) return state.session.access_token;

        if (!state.session.refresh_token) {
          handleSessionExpired();
          throw new Error('登录已过期，请重新登录');
        }

        if (!refreshPromise) {
          refreshPromise = (async () => {
            const endpoint = `${cleanBaseUrl(state.sbConfig.url)}/auth/v1/token?grant_type=refresh_token`;
            const resp = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'apikey': state.sbConfig.anonKey,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ refresh_token: state.session.refresh_token })
            });
            if (!resp.ok) {
              handleSessionExpired();
              throw new Error('登录状态已失效，请重新登录');
            }
            const data = await resp.json();
            const expiresAt = data.expires_at
              ? data.expires_at * 1000
              : Date.now() + (data.expires_in || 3600) * 1000;

            state.session = {
              access_token: data.access_token,
              refresh_token: data.refresh_token || state.session.refresh_token,
              expires_at: expiresAt,
              user: {
                id: data.user?.id || state.session.user?.id || '',
                email: data.user?.email || state.session.user?.email || ''
              }
            };
            saveJsonStorage(STORAGE_KEYS.SESSION, state.session);
            return state.session.access_token;
          })().finally(() => {
            refreshPromise = null;
          });
        }

        return refreshPromise;
      }

      function handleSessionExpired() {
        state.session = null;
        localStorage.removeItem(STORAGE_KEYS.SESSION);
        state.cards = [];
        state.activityLogs = [];
        state.appMounted = false;
        showAuthWall('登录状态已过期，请重新安全登录。');
      }

      async function sbLogout() {
        try {
          if (state.session?.access_token && state.sbConfig.url && state.sbConfig.anonKey) {
            await fetch(`${cleanBaseUrl(state.sbConfig.url)}/auth/v1/logout`, {
              method: 'POST',
              headers: {
                'apikey': state.sbConfig.anonKey,
                'Authorization': `Bearer ${state.session.access_token}`
              }
            });
          }
        } catch (_) {}
        state.session = null;
        localStorage.removeItem(STORAGE_KEYS.SESSION);
        state.cards = [];
        state.activityLogs = [];
        state.review.reviewedIds.clear();
        state.appMounted = false;
        showAuthWall();
        showToast('已安全退出登录');
      }

      async function sbRest(path, options = {}, retried = false) {
        const token = await ensureValidAccessToken(retried);
        const url = `${cleanBaseUrl(state.sbConfig.url)}/rest/v1/${path}`;
        const headers = {
          'apikey': state.sbConfig.anonKey,
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          ...(options.headers || {})
        };

        let resp;
        try {
          resp = await fetch(url, {
            method: options.method || 'GET',
            headers,
            body: options.body !== undefined ? JSON.stringify(options.body) : undefined
          });
        } catch (_) {
          setSyncStatus('error');
          throw new Error('网络不太顺畅，未能连接云端数据库');
        }

        if (resp.status === 401 && !retried) {
          return sbRest(path, options, true);
        }

        const text = await resp.text();
        if (!resp.ok) {
          setSyncStatus('error');
          throw new Error(translateSupabaseError(resp.status, text));
        }

        if (!text) return null;
        try {
          return JSON.parse(text);
        } catch (_) {
          return null;
        }
      }

      // --- Data Operations matching exact Supabase schema ---
      async function fetchAllUserData() {
        setSyncStatus('syncing');
        const userId = state.session.user.id;
        const [cardsData, prefsData, logsData] = await Promise.all([
          sbRest('cards?select=*&order=created_at.desc'),
          sbRest(`user_prefs?user_id=eq.${encodeURIComponent(userId)}&select=*`),
          sbRest('activity_logs?select=*&order=created_at.desc&limit=500')
        ]);

        state.cards = Array.isArray(cardsData) ? cardsData : [];
        state.activityLogs = Array.isArray(logsData) ? logsData : [];

        if (Array.isArray(prefsData) && prefsData.length > 0) {
          const p = prefsData[0];
          state.prefs = {
            daily_limit: Number(p.daily_limit) || 50,
            mix_backlog: p.mix_backlog !== undefined ? Boolean(p.mix_backlog) : true,
            theme: p.theme === 'dark' ? 'dark' : 'light'
          };
          applyTheme(state.prefs.theme);

          // Initialize user_prefs row silently

        setSyncStatus('syncing');
        await sbRest('user_prefs?on_conflict=user_id', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },
          body: {
            user_id: state.session.user.id,
            daily_limit: Number(state.prefs.daily_limit) || 50,
            mix_backlog: Boolean(state.prefs.mix_backlog),
            theme: state.prefs.theme
          }
        });
        setSyncStatus('ok');

      async function insertCardToCloud(cardPayload) {
        setSyncStatus('syncing');
        const rows = await sbRest('cards', {
          method: 'POST',
          headers: { 'Prefer': 'return=representation' },
          body: {
            user_id: state.session.user.id,
            ...cardPayload
          }
        });
        const created = Array.isArray(rows) ? rows[0] : rows;
        if (created) {
          state.cards.unshift(created);
        }
        setSyncStatus('ok');
        return created;
      }

      async function updateCardInCloud(cardId, patch) {
        setSyncStatus('syncing');
        const body = { ...patch, updated_at: new Date().toISOString() };
        const rows = await sbRest(`cards?id=eq.${encodeURIComponent(cardId)}`, {
          method: 'PATCH',
          headers: { 'Prefer': 'return=representation' },
          body
        });
        const updated = Array.isArray(rows) ? rows[0] : null;
        const idx = state.cards.findIndex(c => c.id === cardId);
        if (idx >= 0) {
          state.cards[idx] = updated || { ...state.cards[idx], ...body };
        }
        setSyncStatus('ok');
        return state.cards[idx];
      }

      async function deleteCardInCloud(cardId) {
        setSyncStatus('syncing');
        await sbRest(`cards?id=eq.${encodeURIComponent(cardId)}`, { method: 'DELETE' });
        state.cards = state.cards.filter(c => c.id !== cardId);
        setSyncStatus('ok');

      function extractJsonObject(raw) {
        const cleaned = String(raw || '')
          .replace(/^```json\s*/i, '')
          .replace(/^```\s*/i, '')
          .replace(/```\s*$/i, '')
          .trim();
        const start = cleaned.indexOf('{');
        const end = cleaned.lastIndexOf('}');
        if (start >= 0 && end > start) {
          return JSON.parse(cleaned.slice(start, end + 1));
        }
        return JSON.parse(cleaned);
      }

      async function callOpenAiCompatible(systemPrompt, userPrompt, expectJson = true) {
        if (!isAiConfigured()) {
          throw new Error('NO_AI_KEY');
        }
        const base = cleanBaseUrl(state.aiConfig.baseUrl);
        const endpoint = base.endsWith('/chat/completions') ? base : `${base}/chat/completions`;

        const sys = expectJson
          ? `${systemPrompt}\n\n严格要求：只返回一个合法的纯 JSON 对象，不要包含 Markdown 代码块、前缀或任何多余解释。`
          : systemPrompt;

        let resp;
        try {
          resp = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${state.aiConfig.apiKey.trim()}`
            },
            body: JSON.stringify({
              model: state.aiConfig.model.trim(),
              temperature: 1,
              messages: [
                { role: 'system', content: sys },
                { role: 'user', content: userPrompt }
              ]
            })
          });
        } catch (_) {
          throw new Error('无法连接 AI 接口（可能是网络异常或该接口不支持浏览器直连跨域）');
        }

        const text = await resp.text();
        if (!resp.ok) {
          if (resp.status === 401) throw new Error('API Key 无效或余额不足，请检查设置');
          if (resp.status === 404) throw new Error('接口地址或模型名称不存在，请检查设置');
          if (resp.status === 429) throw new Error('请求频率受限，请稍等几秒再试');
          throw new Error(`AI 接口返回异常 (${resp.status})`);
        }

        const data = JSON.parse(text);
        const content = data?.choices?.[0]?.message?.content;
        if (!content) throw new Error('AI 返回内容为空');
        return expectJson ? extractJsonObject(content) : content.trim();
      }
