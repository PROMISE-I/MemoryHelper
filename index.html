      function extractJsonObject(raw) {
        const cleaned = String(raw || '')
          .replace(/^```json\s*/i, '')
          .replace(/^```\s*/i, '')
          .replace(/```\s*$/i, '')
          .trim();
        const start = cleaned.indexOf('{');
        const end = cleaned.lastIndexOf('}');
        if (start >= 0 && end > start) {
          return JSON.parse(cleaned.slice(start, end + 1));
        }
        return JSON.parse(cleaned);
      }

      function parseAiErrorDetail(status, rawText) {
        let serverMsg = '';
        try {
          const parsed = JSON.parse(rawText);
          serverMsg = parsed?.error?.message || parsed?.message || (typeof parsed?.error === 'string' ? parsed.error : '');
        } catch (_) {
          serverMsg = String(rawText || '').trim().slice(0, 160);
        }
        const suffix = serverMsg ? `：${serverMsg}` : '';
        if (status === 401) return `API Key 无效或未授权 (401)${suffix}`;
        if (status === 404) return `接口地址或模型不存在 (404)${suffix}`;
        if (status === 429) return `请求受限或额度不足 (429)${suffix}`;
        return `AI 接口异常 (${status})${suffix}`;
      }

      /**
       * Compatible with OpenAI GPT-6 (gpt-6.1-terra / gpt-6-luna), DeepSeek, Gemini, etc.
       * Strictly omits non-default temperature parameter so reasoning models default cleanly to 1.
       */
      async function callOpenAiCompatible(systemPrompt, userPrompt, expectJson = true) {
        if (!isAiConfigured()) {
          throw new Error('NO_AI_KEY');
        }
        const base = cleanBaseUrl(state.aiConfig.baseUrl);
        const endpoint = base.endsWith('/chat/completions') ? base : `${base}/chat/completions`;

        const sys = expectJson
          ? `${systemPrompt}\n\n严格要求：只返回一个合法的纯 JSON 对象，不要包含 Markdown 代码块、前缀或任何多余解释。`
          : systemPrompt;

        let resp;
        try {
          resp = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${state.aiConfig.apiKey.trim()}`
            },
            body: JSON.stringify({
              model: state.aiConfig.model.trim(),
              messages: [
                { role: 'system', content: sys },
                { role: 'user', content: userPrompt }
              ]
            })
          });
        } catch (netErr) {
          throw new Error(`无法连接 AI 接口（网络异常或浏览器跨域受限）：${netErr?.message || 'Failed to fetch'}`);
        }

        const text = await resp.text();
        if (!resp.ok) {
          throw new Error(parseAiErrorDetail(resp.status, text));
        }

        const data = JSON.parse(text);
        const content = data?.choices?.[0]?.message?.content;
        if (!content) throw new Error('AI 返回内容为空');
        return expectJson ? extractJsonObject(content) : content.trim();
      }

      // AI 3: Concept Compressor (Anti-Fan-Effect when 3 slots are full)
      async function aiCompressTags(card, newIdea) {
        const sys = `你是“概念压缩机”，用于对抗认知科学中的扇形效应。
卡片的进化层已有 3 个词条（硬性上限），现在用户产生了 1 个新想法。
请返回 JSON：
{
  "options": [
    {"word": "2到8字凝练新词", "replace_index": 0, "reason": "12字内说明融合了哪两层意思"},
    {"word": "另一凝练候选词", "replace_index": 1, "reason": "12字内说明"}
  ]
}
其中 replace_index 必须是 0、1 或 2。`;
        const tags = card.evolution_tags || [];
        const prompt = `原事实：${card.front_fact}\n现有 3 个词条：\n[0] ${tags[0] || ''}\n[1] ${tags[1] || ''}\n[2] ${tags[2] || ''}\n新想法：${newIdea}`;
        const res = await callOpenAiCompatible(sys, prompt, true);
        return Array.isArray(res.options) ? res.options.slice(0, 2) : [];
      }

      // AI 4: Full-Library & Evolution-Aware Silent Cross-Domain Matcher
      function buildCrossDomainCandidatePool(targetCard, maxCandidates = 55) {
        const targetDom = normalizeDomainLabel(targetCard.domain_tag);
        const pool = state.cards.filter(c =>
          c.id !== targetCard.id &&
          normalizeDomainLabel(c.domain_tag) !== targetDom
        );
        if (pool.length <= maxCandidates) return pool;

        // Stratified pool: prioritize cards with mature evolution_tags + spread across old & new cards
        const withEvo = pool.filter(c => Array.isArray(c.evolution_tags) && c.evolution_tags.length > 0);
        const withoutEvo = pool.filter(c => !Array.isArray(c.evolution_tags) || c.evolution_tags.length === 0);

        const picked = [];
        const pickedIds = new Set();
        const addFrom = (arr, quota) => {
          if (arr.length <= quota) {
            arr.forEach(c => { if (!pickedIds.has(c.id)) { picked.push(c); pickedIds.add(c.id); } });
            return;
          }
          // Evenly sample across the entire timeline so old cards collide with new ones!
          const step = arr.length / quota;
          for (let i = 0; i < quota; i++) {
            const c = arr[Math.min(arr.length - 1, Math.floor(i * step))];
            if (!pickedIds.has(c.id)) {
              picked.push(c);
              pickedIds.add(c.id);
            }
          }
        };

        addFrom(withEvo, Math.min(38, maxCandidates));
        addFrom(withoutEvo, maxCandidates - picked.length);
        return picked;
      }

      async function runSilentCrossDomainMatch(targetCard) {
        if (!isAiConfigured() || !targetCard?.id) return;
        const candidates = buildCrossDomainCandidatePool(targetCard, 55);
        if (candidates.length === 0) return;

        try {
          const sys = `你是后台静默跨界碰瓷器。判断目标卡片与不同领域的历史候选卡片中，是否存在底层机制或通用规律上的高度共振（尤其关注进化词条反映的深层规律）。
规则：
- 若存在令人惊喜的底层结构相似性，返回 {"match_id": "对应候选卡片id"}。
- 若没有足够强的底层相似性，切勿硬凑，返回 {"match_id": ""}。
- 严禁返回解释或剧透原因。`;
          const listStr = candidates.map(c =>
            `ID:${c.id} | 类别:${normalizeDomainLabel(c.domain_tag)} | 事实:${String(c.front_fact).slice(0, 52)} | 进化词条:${(c.evolution_tags || []).join('/') || '暂无'}`
          ).join('\n');
          const prompt = `目标卡片（${normalizeDomainLabel(targetCard.domain_tag)}）：\n事实：${targetCard.front_fact}\n感受：${targetCard.back_anchor}\n最新进化词条：${(targetCard.evolution_tags || []).join(' / ') || '暂无'}\n\n不同领域候选：\n${listStr}`;

          const res = await callOpenAiCompatible(sys, prompt, true);
          const match = candidates.find(c => c.id === res.match_id);
          if (match) {
            updateCardOptimistic(targetCard.id, {
              cross_link_id: match.id,
              cross_link_hint: normalizeDomainLabel(match.domain_tag)
            });
            // Bidirectionally link the matched card if it doesn't have one yet
            if (!match.cross_link_id) {
              updateCardOptimistic(match.id, {
                cross_link_id: targetCard.id,
                cross_link_hint: normalizeDomainLabel(targetCard.domain_tag)
              });
            }
            logActivityCloud('ai_usage', targetCard.id, { feature: 'cross_link', adopted: true });
          }
        } catch (_) {
          // Silent background operation
        }
      }

      // AI 5: Batch Re-Categorize Existing Cards by Latest Understanding
      async function aiReorganizeLibraryDomains(cardsList) {
        const formatCardForPrompt = (c) => {
          const evo = (c.evolution_tags || []).join(' / ') || '暂无';
          return `ID:${c.id} | 现类别:${normalizeDomainLabel(c.domain_tag)} | 最新理解(进化词条):${evo} | 事实:${String(c.front_fact).slice(0, 75)} | 最初感受:${String(c.back_anchor).slice(0, 45)}`;
        };

        const batchSize = 55;
        // Stage 1: Establish unified taxonomy + classify first batch (prioritizing cards with evolution tags)
        const sortedForTaxonomy = [...cardsList].sort((a, b) => {
          const aLen = (a.evolution_tags || []).length;
          const bLen = (b.evolution_tags || []).length;
          return bLen - aLen;
        });
        const firstBatch = sortedForTaxonomy.slice(0, batchSize);
        const restCards = sortedForTaxonomy.slice(batchSize);

        const targetCatCount = cardsList.length <= 8 ? '2 到 4' : cardsList.length <= 25 ? '3 到 6' : '4 到 9';
        const sys1 = `你是个人认知卡片库的整理顾问。请综合每张卡片的「最新理解（进化词条）」、事实与最初感受，为用户提炼一套干净、精炼、贴合其真实内容的大类体系，并把每张卡片按最新理解重新归类。
严格规则：
1. 根据这批卡片的实际内容动态生成 ${targetCatCount} 个宽泛且有区分度的类别名（每个 2–6 个汉字），不要照搬刻板默认分类，也不要碎成一卡一类。
2. 优先依据「最新理解（进化词条）」判断卡片归属；若暂无进化词条，则依据事实与最初感受判断。
3. 返回纯 JSON：
{
  "categories": ["类别A", "类别B", ...],
  "assignments": [{"id": "卡片ID", "domain_tag": "类别A"}, ...]
}
每张输入卡片都必须出现在 assignments 中，且 domain_tag 必须严格取自 categories。`;

        const res1 = await callOpenAiCompatible(
          sys1,
          `请整理并重新归类以下 ${firstBatch.length} 张卡片：\n${firstBatch.map(formatCardForPrompt).join('\n')}`,
          true
        );

        const categories = Array.isArray(res1.categories)
          ? Array.from(new Set(res1.categories.map(normalizeDomainLabel).filter(x => x && x !== UNCLASSIFIED_LABEL)))
          : [];
        const assignmentMap = new Map();

        if (Array.isArray(res1.assignments)) {
          res1.assignments.forEach(a => {
            if (a?.id && a?.domain_tag) {
              assignmentMap.set(a.id, normalizeDomainLabel(a.domain_tag));
            }
          });
        }

        // Stage 2: Classify any remaining cards strictly into the established taxonomy
        if (restCards.length > 0 && categories.length > 0) {
          for (let i = 0; i < restCards.length; i += batchSize) {
            const chunk = restCards.slice(i, i + batchSize);
            const sysNext = `请将以下卡片严格按最新理解归入已确定的类别体系中：${categories.join('、')}。
返回纯 JSON：{"assignments": [{"id": "卡片ID", "domain_tag": "类别名"}]}`;
            const resNext = await callOpenAiCompatible(
              sysNext,
              chunk.map(formatCardForPrompt).join('\n'),
              true
            );
            if (Array.isArray(resNext.assignments)) {
              resNext.assignments.forEach(a => {
                if (a?.id && a?.domain_tag) {
                  assignmentMap.set(a.id, normalizeDomainLabel(a.domain_tag));
                }
              });
            }
          }
        }

        return { categories, assignmentMap };
      }

          const password = pwInput.value;

          const sbAnon = document.getElementById('cfg-sb-anon').value.trim();

        }

        // Instant hydration from local cache if available (zero cold-start wait!)
        const cached = loadUserCache(uid);
        const hadCache = Boolean(cached && Array.isArray(cached.cards));
        if (hadCache) {
          state.cards = cached.cards;
          state.activityLogs = Array.isArray(cached.activityLogs) ? cached.activityLogs : [];
          if (cached.prefs) {
            state.prefs = { ...state.prefs, ...cached.prefs };
            applyTheme(state.prefs.theme);

          buildTodayQueue();
          renderReviewTab();

            <div class="done-stage">

            </div>
          `;
        }

        // Flush any pending offline changes first, then pull latest cloud truth
        try {
          if (state.syncQueue.length > 0) {
            await flushSyncQueue();
          }
          await fetchAllUserData();

          // If user already started flipping a card from cache, don't yank it away; otherwise rebuild cleanly
          const midTurn = hadCache && state.review.phase === 'back';
          if (!midTurn) {
            buildTodayQueue();
            renderReviewTab();
          }
          if (!hadCache) {
            renderCaptureTab();
            switchTab('review');
          }
          renderLibraryTab();
          renderSettingsTab();
        } catch (err) {
          if (hadCache) {
            setSyncStatus('error');
            showToast('当前离线，已载入本机缓存，联网后将自动同步');
          } else {
            showToast(err.message || '云端数据加载失败');
            document.getElementById('view-review').innerHTML = `
              <div class="done-stage">
                <p style="font-size:14px;color:var(--terra);margin:0 0 14px;">${esc(err.message || '云端连接异常')}</p>
                <button type="button" class="btn btn-primary btn-sm" id="btn-retry-load">重新同步</button>
              </div>
            `;
            document.getElementById('btn-retry-load').onclick = () => enterAuthenticatedApp();
          }
        }
      }

      function switchTab(tab) {
        if (state.activeTab === 'review' && tab !== 'review') {
          pauseActiveReviewTimer();
        }
        state.activeTab = tab;
        ['review', 'capture', 'library', 'settings'].forEach(name => {
          const el = document.getElementById(`view-${name}`);
          if (el) el.classList.toggle('hidden', name !== tab);
        });
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
        });
        window.scrollTo(0, 0);
        if (tab === 'review') {
          renderReviewTab();
          resumeActiveReviewTimer();
        }
        if (tab === 'capture') renderCaptureTab();
        if (tab === 'library') renderLibraryTab();
        if (tab === 'settings') renderSettingsTab();
      }

      // =====================================================================
      // 11. TAB 1: 今日复习 (REVEAL FIRST -> VERIFY -> RATE & ADVANCE + UNDO)
      // =====================================================================
      function getCurrentQueueItem() {
        return state.review.queue[state.review.index] || null;
      }

      function getCurrentReviewCard() {
        const item = getCurrentQueueItem();
        return item ? state.cards.find(c => c.id === item.id) || null : null;
      }

      function renderReviewHeader() {
        const stats = getTodayCloudStats();
        const doneToday = stats.reviewedTodayCount;
        const remainingInQueue = Math.max(0, state.review.queue.length - state.review.index);
        const totalToday = doneToday + remainingInQueue;

        let label = '今日暂无待保鲜卡片';
        let pct = 100;
        if (remainingInQueue > 0) {
          const currentOrdinal = doneToday + 1;
          if (state.review.inExtraBatch) {
            label = `加餐第 ${state.review.index + 1} / ${state.review.queue.length} 张 · 今日第 ${currentOrdinal} 张`;
            pct = Math.min(100, Math.round((state.review.index / Math.max(1, state.review.queue.length)) * 100));
          } else {
            label = `今日第 ${currentOrdinal} / ${totalToday} 张`;
            pct = totalToday > 0 ? Math.min(100, Math.round((doneToday / totalToday) * 100)) : 0;
          }
        } else if (doneToday > 0) {
          label = `今日已完成 ${doneToday} 张`;
          pct = 100;
        }

        const pending = state.syncQueue.length;
        const dotClass = state.syncStatus === 'syncing' ? 'syncing' : (state.syncStatus === 'error' || pending > 0) ? 'error' : '';
        const dotTxt = state.syncStatus === 'syncing'
          ? (pending > 0 ? `同步中 (${pending})` : '同步中')
          : (state.syncStatus === 'error' || pending > 0)
            ? (pending > 0 ? `待同步 (${pending})` : '待重试')
            : '云端已同步';

        const canUndo = state.review.undoStack.length > 0;

        return `
          <div class="page-header" style="margin-bottom:10px;">
            <span style="font-size:13px;font-weight:500;color:var(--ink-secondary);font-variant-numeric:tabular-nums;">${label}</span>

                <span id="sync-dot-text">${dotTxt}</span>
              </button>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
        `;
      }

              <div style="display:flex;flex-direction:column;gap:10px;">
                ${!testData && !state.review.activeTestLoading ? `
                  <button type="button" class="btn btn-soft btn-sm btn-block" id="btn-active-test" style="color:var(--ink-secondary);">

          if (testBtn) testBtn.onclick = onRequestActiveTest;
          const refreshTestBtn = document.getElementById('btn-active-test-refresh');
          if (refreshTestBtn) refreshTestBtn.onclick = onRequestActiveTest;
          return;
        }

        // ---------------- BACK PHASE (Prominent Fact + Muted Grey Anchor & Single-Line Evolution) ----------------
        const tags = Array.isArray(card.evolution_tags) ? card.evolution_tags : [];
        const isFull = tags.length >= 3;
        const edited = state.review.editedThisReview;
        const editedSlot = state.review.editedSlotIndex;
        const linkedCard = card.cross_link_id
          ? state.cards.find(c => c.id === card.cross_link_id)
          : null;

        // Build 3 fixed single-line slots in calm grey
        let slotsHtml = '';
        for (let i = 0; i < 3; i++) {
          if (i < tags.length) {
            const canFixSameSlot = edited && editedSlot === i;
            const disabledAttr = (edited && !canFixSameSlot) ? 'disabled' : '';
            slotsHtml += `
              <button type="button" class="evo-capsule ${canFixSameSlot ? 'just-edited' : ''}" data-slot="${i}" ${disabledAttr} title="${canFixSameSlot ? '可点此修正错别字' : '点击微调'}">
                <span style="flex:1;line-height:1.5;">${esc(tags[i])}</span>
                ${(!edited || canFixSameSlot) ? `<span style="opacity:0.55;display:inline-flex;flex-shrink:0;">${ICONS.edit}</span>` : ''}
              </button>
            `;
          } else {
            slotsHtml += `
              <button type="button" class="evo-slot-empty" data-add-slot="1" ${edited ? 'disabled' : ''}>
                <span>+ 记一条认识 (${i + 1}/3)</span>
              </button>

        let scaffoldHtml = '';
        if (state.review.scaffoldLoading) {
          scaffoldHtml = `
            <div class="scaffold-panel anim-pulse" style="font-size:12px;color:var(--ink-muted);">
              正在想几个切入问题...
            </div>
          `;
        } else if (state.review.scaffoldQuestions && state.review.scaffoldQuestions.length > 0) {
          scaffoldHtml = `
            <div class="scaffold-panel anim-up" style="background:var(--surface);">
              <div style="font-size:11px;font-weight:500;color:var(--ink-muted);">切入角度</div>
              <ul class="scaffold-list">
                ${state.review.scaffoldQuestions.map(q => `<li><span style="color:var(--sage);">·</span><span>${esc(q)}</span></li>`).join('')}
              </ul>
            </div>
          `;
        }

        container.innerHTML = `
          ${renderReviewHeader()}
          <div class="review-stage anim-up">
            <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px;">
              <!-- Prominent Hero Fact Card -->
              <div class="card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                  <span style="font-size:12px;font-weight:600;color:var(--ink-secondary);">事实</span>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span class="lock-badge" aria-label="已锁定">${ICONS.lock}</span>
                    <button type="button" class="btn-ghost btn-xs" id="btn-review-edit-card" style="padding:3px 6px;min-height:26px;" title="编辑或删除">
                      ${ICONS.edit}
                    </button>
                  </div>
                </div>
                <p class="fact-hero-text">${esc(card.front_fact)}</p>
              </div>

              <!-- Muted Grey Initial Feeling -->
              <div class="card-soft" style="padding:14px 16px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                  <span style="font-size:12px;font-weight:500;color:var(--ink-muted);">最初感受</span>
                  <span class="lock-badge" aria-label="已锁定">${ICONS.lock}</span>
                </div>
                <p class="muted-body-text">${esc(card.back_anchor)}</p>
              </div>

              <!-- Muted Grey Evolution Layer (3 Single-Line Slots) -->
              <div class="card-soft" style="padding:14px 16px;">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                  <span style="font-size:12px;font-weight:500;color:var(--ink-muted);">最新认识</span>
                  <span style="font-size:11px;color:var(--ink-muted);font-variant-numeric:tabular-nums;">${tags.length} / 3</span>
                </div>

                <div class="evo-slots-grid">${slotsHtml}</div>

                ${!edited && isFull ? `
                  <div style="margin-top:10px;">
                    <button type="button" class="btn btn-terra btn-sm btn-block" id="btn-open-compress">
                      ${ICONS.sparkle} 合并压缩新想法
                    </button>
                  </div>
                ` : ''}

                ${edited ? `
                  <div style="margin-top:10px;padding:8px 11px;border-radius:10px;background:var(--sage-soft);color:var(--sage);font-size:12px;line-height:1.5;">
                    已记下，留白给后台消化。${editedSlot !== null ? '点虚线行可改错字。' : ''}
                  </div>

                <!-- On-Demand Scaffolding Trigger -->
                <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;">
                  <button type="button" class="btn-ghost" id="btn-scaffold" style="margin-left:-8px;" ${state.review.scaffoldLoading ? 'disabled' : ''}>
                    ${ICONS.bulb} 给点提问角度
                  </button>
                  <span style="font-size:11px;color:var(--ink-muted);">直接点下方下一张</span>

                ${scaffoldHtml}

                ${linkedCard ? `
                  <button type="button" class="cross-shimmer" id="btn-cross-peek">
                    <span>✦ 发现一张跨领域相似卡</span>
                    <span style="flex-shrink:0;display:inline-flex;">${ICONS.chevronRight}</span>
                  </button>

              </div>
            </div>

            <!-- Binary Rating directly commits & advances cleanly -->
            <div class="rating-grid">
              <button type="button" class="btn btn-terra" id="btn-rate-again">有点模糊</button>

          </div>

        wireReviewHeaderButtons();

        document.getElementById('btn-rate-again').onclick = () => onBackRatedAndNext('again');
        document.getElementById('btn-rate-good').onclick = () => onBackRatedAndNext('good');
        document.getElementById('btn-scaffold').onclick = onRequestScaffold;
        document.getElementById('btn-review-edit-card').onclick = () => openCardEditModal(card, { fromReview: true });

        container.querySelectorAll('.evo-capsule').forEach(btn => {
          if (btn.disabled) return;
          btn.onclick = () => openEvolutionEditModal(card, Number(btn.getAttribute('data-slot')));
        });
        if (!edited) {
          container.querySelectorAll('.evo-slot-empty').forEach(btn => {
            btn.onclick = () => openEvolutionEditModal(card, null);

          const compBtn = document.getElementById('btn-open-compress');
          if (compBtn) compBtn.onclick = () => openCompressModal(card);
        }

        const peekBtn = document.getElementById('btn-cross-peek');
        if (peekBtn && linkedCard) {
          peekBtn.onclick = () => openCrossDomainModal(card, linkedCard);

      async function onRequestActiveTest() {
        const card = getCurrentReviewCard();
        if (!card || state.review.activeTestLoading) return;
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }
        state.review.activeTestLoading = true;
        state.review.activeTestTriggered = true;
        renderReviewTab();

        try {
          state.review.activeTest = await aiGenerateActiveTest(card);
        } catch (err) {
          showToast(err.message || '测试生成失败', 4000);
          const hasEvo = Array.isArray(card.evolution_tags) && card.evolution_tags.length > 0;
          state.review.activeTest = {
            mode: hasEvo ? '场景迁移测' : '线索回忆测',
            prompt: hasEvo
              ? '如果把这件事换到工作或亲密关系里，你会先注意什么？'
              : '当时看到这件事，最先戳中你的那一下是什么感觉？'
          };
        } finally {
          state.review.activeTestLoading = false;
          renderReviewTab();
        }
      }

      function onRevealBack() {
        if (state.review.phase !== 'front') return;
        state.review.frontAccMs = getCurrentPhaseElapsedMs();
        state.review.backAccMs = 0;
        state.review.segStartMs = Date.now();
        state.review.phase = 'back';
        renderReviewTab();
        window.scrollTo(0, 0);
      }

      function onBackRatedAndNext(ratingKey) {
        const qItem = getCurrentQueueItem();
        const card = getCurrentReviewCard();
        if (!qItem || !card) return;

        const now = Date.now();
        const backDurationMs = getCurrentPhaseElapsedMs();
        const frontDurationMs = clamp(Math.round(state.review.frontAccMs || 800), 80, 300000);
        const R = Number(computeRetrievability(card.fsrs_state, now).toFixed(3));
        const nextFsrs = scheduleFsrsCard(card.fsrs_state, ratingKey, now);
        const prevStats = getTodayCloudStats();
        const dailyOrdinal = prevStats.reviewedTodayCount + 1;

        const prevCardSnapshot = {
          fsrs_state: card.fsrs_state ? JSON.parse(JSON.stringify(card.fsrs_state)) : null,
          due_at: card.due_at
        };

        updateCardOptimistic(card.id, {
          fsrs_state: nextFsrs,
          due_at: nextFsrs.due
        });

        const reviewLogClientId = logActivityCloud('review', card.id, {
          session_date: localDateKey(),
          tier: qItem.tier,
          extra_batch: Boolean(qItem.extraBatch),
          front_ms: frontDurationMs,
          back_ms: backDurationMs,
          rating: ratingKey === 'good' ? 'good' : 'again',
          retrievability_r: R,
          queue_index: dailyOrdinal,
          edited_evolution: state.review.editedThisReview,
          used_active_test: state.review.activeTestTriggered
        });

        if (state.review.scaffoldTriggered) {
          logActivityCloud('ai_usage', card.id, {
            feature: 'scaffold',
            adopted: state.review.editedThisReview
          });
        }
        if (state.review.activeTestTriggered) {
          logActivityCloud('ai_usage', card.id, {
            feature: 'active_test',
            adopted: true
          });
        }

        state.review.undoStack.push({
          cardId: card.id,
          prevCardSnapshot,
          queueIndex: state.review.index,
          reviewLogClientId
        });
        if (state.review.undoStack.length > 15) state.review.undoStack.shift();

        state.review.index++;
        resetCardTurnState();
        renderReviewTab();
        window.scrollTo(0, 0);
      }

      function onUndoLastReview() {
        if (state.review.undoStack.length === 0) return;
        const snap = state.review.undoStack.pop();
        const card = state.cards.find(c => c.id === snap.cardId);

        if (card) {
          updateCardOptimistic(card.id, {
            fsrs_state: snap.prevCardSnapshot.fsrs_state,
            due_at: snap.prevCardSnapshot.due_at
          });
        }
        undoActivityLogCloud(snap.reviewLogClientId);

        state.review.index = Math.min(snap.queueIndex, state.review.queue.length);
        resetCardTurnState();
        renderReviewTab();
        showToast('已撤回上一张卡片');
      }

      async function onRequestScaffold() {
        const card = getCurrentReviewCard();
        if (!card || state.review.scaffoldLoading) return;
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }

        state.review.scaffoldLoading = true;
        state.review.scaffoldTriggered = true;
        renderReviewTab();

        try {
          state.review.scaffoldQuestions = await aiFetchScaffolding(card);
        } catch (err) {
          showToast(err.message || '脚手架生成失败', 4000);
          state.review.scaffoldQuestions = [
            '这件事背后最反常识的支点是什么？',
            '换一个完全不同的领域，它还成立吗？'
          ];
        } finally {
          state.review.scaffoldLoading = false;
          renderReviewTab();
        }
      }

      // --- Evolution Micro-Edit Modal (Max 1 edit per review, typo fix allowed on same slot) ---
      function openEvolutionEditModal(card, slotIndex) {
        const isFixingJustEdited = state.review.editedThisReview && state.review.editedSlotIndex === slotIndex;
        if (state.review.editedThisReview && !isFixingJustEdited) return;

        const isEdit = slotIndex !== null && slotIndex !== undefined;
        const tags = Array.isArray(card.evolution_tags) ? card.evolution_tags : [];
        const currentText = isEdit ? (tags[slotIndex] || '') : '';

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <h3 style="margin:0;font-size:16px;font-weight:600;">${isFixingJustEdited ? '修正词条' : (isEdit ? '修改认识' : '记一条认识')}</h3>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>
            <p style="margin:0;font-size:13px;color:var(--ink-muted);line-height:1.55;">
              ${isFixingJustEdited
                ? '可修改刚刚写下的错别字。'
                : '用 1 个简短短词概括你的新认识，本次改完即止。'}
            </p>
            <input id="m-evo-input" class="input" type="text" maxlength="24" value="${esc(currentText)}" placeholder="写下简短关键词或短句" />
            <div style="display:flex;gap:10px;">
              ${isEdit ? `<button type="button" class="btn btn-soft btn-sm" id="m-evo-del" style="color:var(--ink-muted);">清空</button>` : ''}
              <button type="button" class="btn btn-primary" style="flex:1;" id="m-evo-save">保存</button>
            </div>
          </div>
        `);

        const input = document.getElementById('m-evo-input');
        setTimeout(() => input?.focus(), 60);
        document.getElementById('m-close').onclick = closeModal;

        document.getElementById('m-evo-save').onclick = () => {
          const val = input.value.trim();
          if (!val) {
            showToast('请输入简短词条');
            return;
          }
          const before = [...tags];
          const after = [...tags];
          let targetSlot = slotIndex;
          if (isEdit) {
            if (after[slotIndex] === val) {
              closeModal();
              return;
            }
            after[slotIndex] = val;
          } else {
            if (after.length >= 3) {
              closeModal();
              return;
            }
            targetSlot = after.length;
            after.push(val);
          }
          commitEvolution(card, isEdit ? 'replace' : 'add', before, after, targetSlot, isFixingJustEdited);
          closeModal();
        };

        const delBtn = document.getElementById('m-evo-del');
        if (delBtn) {
          delBtn.onclick = () => {
            const before = [...tags];
            const after = before.filter((_, i) => i !== slotIndex);
            commitEvolution(card, 'remove', before, after, null, isFixingJustEdited);
            closeModal();
          };
        }
      }

      // --- AI Concept Compressor Modal (Now with editable refinement before commit!) ---
      function openCompressModal(card, onDoneCallback = null) {
        if (!onDoneCallback && state.review.editedThisReview) return;
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }
        const tags = card.evolution_tags || [];

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <h3 style="margin:0;font-size:16px;font-weight:600;">合并压缩词条</h3>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px;">
              ${tags.map((w, i) => `<div class="evo-row-readonly" style="font-size:13px;">${i + 1}. ${esc(w)}</div>`).join('')}
            </div>

            <div>
              <label class="field-label" for="m-comp-idea">新想法</label>
              <input id="m-comp-idea" class="input" type="text" maxlength="60" placeholder="写下你想加进来的新感悟" />
            </div>

            <button type="button" class="btn btn-primary btn-block" id="m-comp-run">${ICONS.sparkle} 生成 2 个合并词</button>
            <div id="m-comp-results" class="hidden" style="display:flex;flex-direction:column;gap:8px;"></div>
            <div id="m-comp-refine" class="hidden card-soft" style="display:flex;flex-direction:column;gap:10px;">
              <div id="m-comp-refine-title" style="font-size:12px;color:var(--ink-muted);">可直接确认或微调后再替换</div>
              <input id="m-comp-refine-input" class="input" type="text" maxlength="24" />
              <button type="button" class="btn btn-ink btn-sm btn-block" id="m-comp-confirm">确认替换</button>
            </div>
          </div>
        `);

        document.getElementById('m-close').onclick = closeModal;
        const ideaInput = document.getElementById('m-comp-idea');
        const runBtn = document.getElementById('m-comp-run');
        const resBox = document.getElementById('m-comp-results');
        const refineBox = document.getElementById('m-comp-refine');
        const refineTitle = document.getElementById('m-comp-refine-title');
        const refineInput = document.getElementById('m-comp-refine-input');
        const confirmBtn = document.getElementById('m-comp-confirm');
        let selectedTargetIdx = 0;

        setTimeout(() => ideaInput?.focus(), 60);

        runBtn.onclick = async () => {
          const idea = ideaInput.value.trim();
          if (!idea) {
            showToast('请先写一句你的新想法');
            return;
          }
          runBtn.disabled = true;
          runBtn.textContent = '正在凝练语义...';
          resBox.classList.add('hidden');
          refineBox.classList.add('hidden');

          try {
            const options = await aiCompressTags(card, idea);
            if (!options.length) throw new Error('未返回压缩方案');

            resBox.innerHTML = options.map((opt, idx) => {
              const targetIdx = clamp(Number(opt.replace_index) || 0, 0, 2);
              const oldW = tags[targetIdx] || '';
              return `
                <button type="button" class="btn-sage-soft" data-opt="${idx}" style="width:100%;text-align:left;padding:12px 14px;border-radius:14px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <strong style="font-size:14px;">${esc(opt.word)}</strong>
                    <span style="font-size:11px;opacity:0.8;">替换「${esc(oldW)}」</span>
                  </div>
                  <div style="font-size:12px;color:var(--ink-secondary);">${esc(opt.reason || '')}</div>
                </button>
              `;
            }).join('');
            resBox.classList.remove('hidden');

            resBox.querySelectorAll('button[data-opt]').forEach(btn => {
              btn.onclick = () => {
                const opt = options[Number(btn.getAttribute('data-opt'))];
                selectedTargetIdx = clamp(Number(opt.replace_index) || 0, 0, 2);
                const oldW = tags[selectedTargetIdx] || '';
                refineTitle.textContent = `将替换槽位 ${selectedTargetIdx + 1}「${oldW}」，可直接确认或微调字词：`;
                refineInput.value = String(opt.word || '').trim();
                refineBox.classList.remove('hidden');
                refineInput.focus();
              };
            });

            confirmBtn.onclick = () => {
              const finalWord = refineInput.value.trim();
              if (!finalWord) {
                showToast('词条不能为空');
                return;
              }
              const before = [...tags];
              const after = [...tags];
              after[selectedTargetIdx] = finalWord;
              if (onDoneCallback) {
                onDoneCallback(after);
                logActivityCloud('ai_usage', card.id, { feature: 'compress', adopted: true });
                closeModal();
              } else {
                commitEvolution(card, 'compress', before, after, selectedTargetIdx, false);
                logActivityCloud('ai_usage', card.id, { feature: 'compress', adopted: true });
                closeModal();
              }
            };
          } catch (err) {
            showToast(err.message || '概念压缩失败', 4000);
            logActivityCloud('ai_usage', card.id, { feature: 'compress', adopted: false });
          } finally {
            runBtn.disabled = false;
            runBtn.innerHTML = `${ICONS.sparkle} 重新提炼压缩词`;
          }
        };
      }

      function commitEvolution(card, action, before, after, targetSlotIndex, isTypoFix = false) {
        const reps = (card.fsrs_state?.reps || 0) + 1;
        const history = Array.isArray(card.evolution_history) ? [...card.evolution_history] : [];

        if (isTypoFix && state.review.editedHistoryIdx !== null && history[state.review.editedHistoryIdx]) {
          // Amend the just-created history entry cleanly
          history[state.review.editedHistoryIdx] = {
            ...history[state.review.editedHistoryIdx],
            at: new Date().toISOString(),
            after
          };
        } else {
          history.push({
            at: new Date().toISOString(),
            reps,
            action,
            before,
            after
          });
          state.review.editedHistoryIdx = history.length - 1;
        }

        const updatedCard = updateCardOptimistic(card.id, {
          evolution_tags: after,
          evolution_history: history
        });

        state.review.editedThisReview = true;
        state.review.editedSlotIndex = targetSlotIndex;

        if (!isTypoFix) {
          logActivityCloud('evolution', card.id, { action, reps, before, after });
          // Re-run silent cross-domain matching when new semantic evolution tags emerge!
          if (updatedCard && after.length > 0) {
            runSilentCrossDomainMatch(updatedCard);
          }
        }

        showToast(isTypoFix ? '已修正词条错别字' : '进化层已微调并后台同步');
        renderReviewTab();
      }

              <div style="padding-top:10px;border-top:1px solid var(--border-soft);">
                <div style="font-size:11px;color:var(--ink-muted);margin-bottom:4px;">最初感受</div>
                <p style="margin:0;font-size:13px;color:var(--ink-secondary);line-height:1.6;white-space:pre-wrap;">${esc(linkedCard.back_anchor)}</p>
              </div>
              ${tags.length ? `
                <div style="padding-top:8px;border-top:1px solid var(--border-soft);display:flex;flex-wrap:wrap;gap:6px;">
                  ${tags.map(w => `<span style="font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage);">${esc(w)}</span>`).join('')}
                </div>
              ` : ''}
            </div>
            <button type="button" class="btn btn-soft btn-block" id="m-done">收起，继续复习</button>
          </div>
        `);
        document.getElementById('m-close').onclick = closeModal;
        document.getElementById('m-done').onclick = closeModal;
      }

      // =====================================================================
      // 12. TAB 2: 速记录入 (QUICK CAPTURE + DRAFT PERSISTENCE + DYNAMIC AI CATEGORY)
      // =====================================================================
      function renderCaptureTab() {
        const container = document.getElementById('view-capture');
        if (!container) return;

        const existingDoms = getExistingDomains(false);
        const displayDomain = state.capture.domainTag
          ? esc(state.capture.domainTag)
          : (isAiConfigured() ? '自动归类' : UNCLASSIFIED_LABEL);

        container.innerHTML = `
          <div class="page-header">
            <h1 class="page-title">速记录入</h1>
            ${(state.capture.raw || state.capture.front || state.capture.anchor || state.capture.evoInit) ? `
              <button type="button" class="btn-ghost btn-xs" id="btn-cap-clear">清空</button>
            ` : ''}
          </div>

          <div class="card" style="margin-bottom:14px;">
            ${state.capture.rawCollapsed ? `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <span class="line-clamp-2" style="font-size:12px;color:var(--ink-muted);flex:1;">原文：${esc(state.capture.raw)}</span>
                <button type="button" class="btn-ghost btn-xs" id="btn-cap-expand-raw" style="flex-shrink:0;">展开原文</button>
              </div>
            ` : `
              <textarea id="cap-raw" class="textarea" rows="4" style="border:none;background:transparent;padding:0;min-height:100px;" placeholder="说出或粘贴你看到的事、听到的话，以及当时的感觉">${esc(state.capture.raw)}</textarea>
              <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-top:10px;border-top:1px solid var(--border-soft);">
                <button type="button" class="btn-ghost" id="btn-cap-manual">${state.capture.formOpen ? '收起手动填写' : '手动填写'}</button>
                <button type="button" class="btn btn-primary btn-sm" id="btn-cap-ai">
                  ${ICONS.sparkle} <span id="btn-cap-ai-txt">AI 拆解</span>
                </button>
              </div>
            `}
          </div>

          <div id="cap-form-panel" class="${state.capture.formOpen ? '' : 'hidden'} anim-up" style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px;">
              <span style="font-size:12px;font-weight:500;color:var(--ink-muted);">卡片内容</span>
              <button type="button" class="btn-ghost btn-xs" id="btn-cap-collapse-form">收起</button>
            </div>

            <div class="card">
              <label class="field-label" for="cap-front">事实 / 原话</label>
              <textarea id="cap-front" class="textarea" rows="3" placeholder="记录你看到或听到的原话、具体发生了什么">${esc(state.capture.front)}</textarea>
            </div>

            <div class="card">
              <label class="field-label" for="cap-anchor">最初感受</label>
              <textarea id="cap-anchor" class="textarea" rows="3" placeholder="当时最直接的想法或情绪，用大白话写">${esc(state.capture.anchor)}</textarea>
              ${state.capture.anchorMissingHint ? `
                <div class="inline-notice terra" style="margin-top:8px;">
                  原文里没写你的感受，补一句第一时间的直觉即可。
                </div>
              ` : ''}
            </div>

            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
                <label class="field-label" style="margin:0;" for="cap-evo-init">初始认识（选填）</label>
                <button type="button" class="btn btn-sage-soft btn-xs" id="btn-cap-gen-evo">
                  ${ICONS.sparkle} <span id="btn-cap-gen-evo-txt">AI 生成词条</span>
                </button>
              </div>
              <input id="cap-evo-init" class="input" type="text" maxlength="24" value="${esc(state.capture.evoInit)}" placeholder="用短词概括，可点右上角生成后再修改" />
            </div>

            <details class="card-soft">
              <summary style="list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-muted);">
                <span>分类：<strong id="cap-domain-label" style="color:var(--ink);font-weight:500;">${displayDomain}</strong></span>
                <span style="text-decoration:underline;">修改</span>
              </summary>
              <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:10px;">
                <input id="cap-domain-input" class="input" type="text" maxlength="14" value="${esc(state.capture.domainTag)}" placeholder="留空自动归类，或手动输入类名" />
                ${existingDoms.length ? `
                  <div style="display:flex;flex-wrap:wrap;gap:6px;" id="cap-domain-pills">
                    <button type="button" class="preset-chip ${!state.capture.domainTag ? 'active' : ''}" data-dom="">自动归类</button>
                    ${existingDoms.map(d => `
                      <button type="button" class="preset-chip ${d.name === state.capture.domainTag ? 'active' : ''}" data-dom="${esc(d.name)}">${esc(d.name)}</button>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            </details>

            <button type="button" class="btn btn-ink btn-block" id="btn-cap-save">保存卡片</button>
          </div>
        `;

        // Wire Clear Draft
        const clearBtn = document.getElementById('btn-cap-clear');
        if (clearBtn) {
          clearBtn.onclick = () => {
            clearCaptureDraft();
            renderCaptureTab();
            showToast('已清空');
          };
        }

        // Wire Expand Raw
        const expandBtn = document.getElementById('btn-cap-expand-raw');
        if (expandBtn) {
          expandBtn.onclick = () => {
            state.capture.rawCollapsed = false;
            persistCaptureDraft();
            renderCaptureTab();
          };
        }

        // Wire Collapse Form (fixes manual form unable to close!)
        const collapseFormBtn = document.getElementById('btn-cap-collapse-form');
        if (collapseFormBtn) {
          collapseFormBtn.onclick = () => {
            state.capture.formOpen = false;
            state.capture.rawCollapsed = false;
            persistCaptureDraft();
            renderCaptureTab();
          };
        }

        // Wire Inputs + Auto-save draft
        const rawEl = document.getElementById('cap-raw');
        const frontEl = document.getElementById('cap-front');
        const anchorEl = document.getElementById('cap-anchor');
        const evoEl = document.getElementById('cap-evo-init');
        const domInput = document.getElementById('cap-domain-input');
        const domLabel = document.getElementById('cap-domain-label');

        if (rawEl) {
          rawEl.oninput = () => {
            state.capture.raw = rawEl.value;
            persistCaptureDraft();
          };
        }
        frontEl.oninput = () => {
          state.capture.front = frontEl.value;
          persistCaptureDraft();
        };
        anchorEl.oninput = () => {
          state.capture.anchor = anchorEl.value;
          if (anchorEl.value.trim()) state.capture.anchorMissingHint = false;
          persistCaptureDraft();
        };
        evoEl.oninput = () => {
          state.capture.evoInit = evoEl.value;
          persistCaptureDraft();
        };
        domInput.oninput = () => {
          state.capture.domainTag = domInput.value.trim();
          domLabel.textContent = state.capture.domainTag || (isAiConfigured() ? '自动归类' : UNCLASSIFIED_LABEL);
          persistCaptureDraft();
        };

        const pillsBox = document.getElementById('cap-domain-pills');
        if (pillsBox) {
          pillsBox.querySelectorAll('button').forEach(btn => {
            btn.onclick = () => {
              state.capture.domainTag = btn.getAttribute('data-dom') || '';
              domInput.value = state.capture.domainTag;
              domLabel.textContent = state.capture.domainTag || (isAiConfigured() ? '自动归类' : UNCLASSIFIED_LABEL);
              pillsBox.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
              persistCaptureDraft();
            };
          });
        }

        // Manual toggle open / close
        const manualBtn = document.getElementById('btn-cap-manual');
        if (manualBtn) {
          manualBtn.onclick = () => {
            if (state.capture.formOpen) {
              state.capture.formOpen = false;
              persistCaptureDraft();
              renderCaptureTab();
              return;
            }
            state.capture.formOpen = true;
            if (state.capture.raw.trim() && !state.capture.front.trim()) {
              state.capture.front = state.capture.raw.trim();
            }
            state.capture.aiSplitUsed = false;
            state.capture.aiSplitSnapshot = null;
            persistCaptureDraft();
            renderCaptureTab();
            setTimeout(() => document.getElementById('cap-front')?.focus(), 60);
          };
        }

        // AI Generate Editable Initial Evolution Tag (after manual fill of fact & feeling)
        const genEvoBtn = document.getElementById('btn-cap-gen-evo');
        if (genEvoBtn) {
          genEvoBtn.onclick = async () => {
            const front = frontEl.value.trim();
            const anchor = anchorEl.value.trim();
            if (!front) {
              showToast('先填一下事实 / 原话');
              frontEl.focus();
              return;
            }
            if (!anchor) {
              showToast('先填一下最初感受，生成的词条更贴合');
              anchorEl.focus();
              return;
            }
            if (!isAiConfigured()) {
              promptConfigureAi();
              return;
            }
            genEvoBtn.disabled = true;
            const txtEl = document.getElementById('btn-cap-gen-evo-txt');
            if (txtEl) txtEl.textContent = '生成中...';
            try {
              const res = await aiSuggestInitialTag(front, anchor);
              if (!res.initial_tag) throw new Error('未能生成词条');
              state.capture.evoInit = res.initial_tag;
              evoEl.value = res.initial_tag;
              if (!state.capture.domainTag && res.domain_tag && res.domain_tag !== UNCLASSIFIED_LABEL) {
                state.capture.domainTag = res.domain_tag;
                domInput.value = res.domain_tag;
                domLabel.textContent = res.domain_tag;
              }
              persistCaptureDraft();
              logActivityCloud('ai_usage', null, { feature: 'gen_init_tag', adopted: true });
              showToast('已生成初始词条，可直接编辑修改');
              evoEl.focus();
            } catch (err) {
              showToast(err.message || '生成词条失败', 4000);
            } finally {
              genEvoBtn.disabled = false;
              if (txtEl) txtEl.textContent = 'AI 生成词条';
            }
          };
        }

        const aiBtn = document.getElementById('btn-cap-ai');
        if (aiBtn) {
          aiBtn.onclick = async () => {
            const raw = (rawEl ? rawEl.value : state.capture.raw).trim();
            if (!raw) {
              showToast('先输入或口述一段内容');
              return;
            }
            if (!isAiConfigured()) {
              promptConfigureAi();
              return;
            }
            aiBtn.disabled = true;
            const aiTxt = document.getElementById('btn-cap-ai-txt');
            if (aiTxt) aiTxt.textContent = '拆解中...';

            try {
              const res = await aiSplitCapture(raw);
              state.capture.raw = raw;
              state.capture.front = res.front_fact;
              state.capture.anchor = res.back_anchor;
              state.capture.domainTag = res.domain_tag === UNCLASSIFIED_LABEL ? '' : res.domain_tag;
              state.capture.formOpen = true;
              state.capture.rawCollapsed = true;
              state.capture.anchorMissingHint = !res.back_anchor;
              state.capture.aiSplitUsed = true;
              state.capture.aiSplitSnapshot = {
                front_fact: res.front_fact,
                back_anchor: res.back_anchor,
                domain_tag: state.capture.domainTag
              };
              persistCaptureDraft();
              renderCaptureTab();
              if (!res.back_anchor) {
                showToast('事实已拆出，补一句最初感受即可');
                setTimeout(() => document.getElementById('cap-anchor')?.focus(), 80);
              } else {
                showToast(`已拆解 · 归入「${res.domain_tag}」`);
              }
            } catch (err) {
              showToast(err.message || 'AI 拆解失败，可先手动填写', 4200);
              state.capture.front = state.capture.front || raw;
              state.capture.formOpen = true;
              persistCaptureDraft();
              renderCaptureTab();
            }
          };
        }

        document.getElementById('btn-cap-save').onclick = async () => {
          const front = frontEl.value.trim();
          const anchor = anchorEl.value.trim();
          const initWord = evoEl.value.trim();
          const chosenDomain = domInput.value.trim();

          if (!front) {
            showToast('请先填写事实 / 原话');
            return;
          }
          if (!anchor) {
            showToast('请写一句最初感受');
            return;
          }

          const saveBtn = document.getElementById('btn-cap-save');
          saveBtn.disabled = true;
          saveBtn.textContent = '保存中...';

          const nowIso = new Date().toISOString();
          const fsrs = createInitialFsrsState();
          const tags = initWord ? [initWord] : [];
          const history = initWord ? [{ at: nowIso, reps: 0, action: 'init', before: [], after: tags }] : [];
          const needsSilentClassify = !chosenDomain && isAiConfigured();
          const initialDomain = chosenDomain ? normalizeDomainLabel(chosenDomain) : UNCLASSIFIED_LABEL;

          try {
            const created = await insertCardToCloud({
              front_fact: front,
              back_anchor: anchor,
              evolution_tags: tags,
              evolution_history: history,
              domain_tag: initialDomain,
              fsrs_state: fsrs,
              due_at: fsrs.due,
              cross_link_id: null,
              cross_link_hint: null
            });

            if (state.capture.aiSplitUsed) {
              const snap = state.capture.aiSplitSnapshot || {};
              const modified = (snap.front_fact !== front) || (snap.back_anchor !== anchor) || (snap.domain_tag !== chosenDomain);
              logActivityCloud('ai_usage', created?.id, {
                feature: 'split',
                adopted: true,
                modified
              });
            }

            clearCaptureDraft();
            renderCaptureTab();
            renderLibraryTab();

            showToast(needsSilentClassify
              ? '已保存，后台自动归类中'
              : '已保存，明天开始复习');

            // Non-blocking background auto-classify (if blank) + cross-domain match
            if (created) {
              (async () => {
                if (needsSilentClassify) {
                  await runSilentAutoClassify(created);
                }
                const latestCard = state.cards.find(c => c.id === created.id) || created;
                await runSilentCrossDomainMatch(latestCard);
              })();
            }
          } catch (err) {
            showToast(err.message || '保存失败，请稍后重试', 3600);
            saveBtn.disabled = false;
            saveBtn.textContent = '保存卡片';
          }
        };
      }

      // =====================================================================
      // 13. TAB 3: 卡片库 (DYNAMIC DOMAINS + AI REORGANIZE + EVOLUTION VIEW + EDIT/DELETE)
      // =====================================================================
      function renderLibraryTab() {
        const container = document.getElementById('view-library');
        if (!container) return;

        const existingSearch = document.getElementById('lib-search-input');
        if (!existingSearch) {
          container.innerHTML = `
            <div class="page-header">
              <h1 class="page-title">卡片库</h1>
              <button type="button" class="btn btn-sage-soft btn-xs" id="btn-ai-reorg">
                ${ICONS.sparkle} <span>整理归类</span>
              </button>
            </div>

            <div class="seg-bar" role="tablist">
              <button type="button" class="seg-btn ${state.library.viewMode === 'domain' ? 'active' : ''}" data-lib-mode="domain">按分类</button>
              <button type="button" class="seg-btn ${state.library.viewMode === 'evolution' ? 'active' : ''}" data-lib-mode="evolution">按认识</button>
            </div>

            <div style="position:relative;margin-bottom:12px;">
              <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-muted);display:inline-flex;pointer-events:none;">${ICONS.search}</span>
              <input id="lib-search-input" class="input" type="search" style="padding-left:38px;" placeholder="搜事实、感受、认识或分类" value="${esc(state.library.search)}" />
            </div>

            <div id="lib-pills" class="pills-scroll"></div>
            <div id="lib-meta-row" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;font-size:12px;color:var(--ink-muted);"></div>
            <div id="lib-list" style="flex:1;"></div>
          `;

          document.getElementById('lib-search-input').addEventListener('input', (e) => {
            state.library.search = e.target.value;
            updateLibraryListOnly();
          });

          container.querySelectorAll('[data-lib-mode]').forEach(btn => {
            btn.onclick = () => {
              state.library.viewMode = btn.getAttribute('data-lib-mode');
              container.querySelectorAll('[data-lib-mode]').forEach(b => b.classList.toggle('active', b === btn));
              updateLibraryListOnly();
            };
          });

          document.getElementById('btn-ai-reorg').onclick = openReorganizeDomainsModal;
        }

        updateLibraryListOnly();
      }

      function updateLibraryListOnly() {
        const pillsEl = document.getElementById('lib-pills');
        const metaEl = document.getElementById('lib-meta-row');
        const listEl = document.getElementById('lib-list');
        if (!pillsEl || !listEl || !metaEl) return;

        const q = state.library.search.trim().toLowerCase();

        if (state.library.viewMode === 'evolution') {
          pillsEl.classList.add('hidden');
          renderEvolutionAggregationView(listEl, metaEl, q);
          return;
        }

        pillsEl.classList.remove('hidden');

        // Build purely dynamic categories from actual cards (NO hardcoded default domains!)
        const dynDomains = getExistingDomains(true);
        const validNames = new Set(['全部', ...dynDomains.map(d => d.name)]);
        if (!validNames.has(state.library.domain)) {
          state.library.domain = '全部';
        }

        const pillItems = [
          { name: '全部', count: state.cards.length },
          ...dynDomains
        ];

        pillsEl.innerHTML = pillItems.map(item => `
          <button type="button" class="pill ${item.name === state.library.domain ? 'active' : ''}" data-dom="${esc(item.name)}">
            ${esc(item.name)} <span style="opacity:0.65;font-size:11px;margin-left:2px;">${item.count}</span>
          </button>
        `).join('');

        pillsEl.querySelectorAll('button').forEach(btn => {
          btn.onclick = () => {
            state.library.domain = btn.getAttribute('data-dom');
            updateLibraryListOnly();
          };
        });

        const filtered = state.cards.filter(c => {
          const dom = normalizeDomainLabel(c.domain_tag);
          if (state.library.domain !== '全部' && dom !== state.library.domain) return false;
          if (!q) return true;
          return (
            String(c.front_fact || '').toLowerCase().includes(q) ||
            String(c.back_anchor || '').toLowerCase().includes(q) ||
            dom.toLowerCase().includes(q) ||
            (c.evolution_tags || []).some(w => String(w).toLowerCase().includes(q))
          );
        });

        metaEl.innerHTML = `
          <span>共 ${filtered.length} 张卡片</span>
          <span>${dynDomains.length ? `${dynDomains.length} 个自然类别` : '暂无类别'}</span>
        `;

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div style="text-align:center;padding:48px 16px;font-size:13px;color:var(--ink-muted);">
              ${state.cards.length === 0 ? '素材库还是空的，去「速记录入」记下第一条洞察吧' : '没有匹配的卡片'}
            </div>
          `;
          return;
        }

        // Use <div role="button"> instead of <button> so mobile vertical touch scrolling is 100% silky!
        listEl.innerHTML = filtered.map(c => {
          const tags = Array.isArray(c.evolution_tags) ? c.evolution_tags : [];
          const dom = normalizeDomainLabel(c.domain_tag);
          return `
            <div role="button" tabindex="0" class="lib-card" data-cid="${esc(c.id)}">
              <p class="line-clamp-2" style="margin:0 0 10px;font-size:14px;line-height:1.6;color:var(--ink);">${esc(c.front_fact)}</p>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                  ${tags.length
                    ? tags.map(w => `<span style="font-size:11px;padding:3px 9px;border-radius:999px;background:var(--sage-soft);color:var(--sage);">${esc(w)}</span>`).join('')
                    : `<span style="font-size:11px;color:var(--ink-muted);opacity:0.75;">待孵化词条</span>`
                  }
                </div>
                <span style="font-size:11px;color:var(--ink-muted);flex-shrink:0;">${esc(dom)}</span>
              </div>
            </div>
          `;
        }).join('');

        listEl.querySelectorAll('.lib-card').forEach(el => {
          el.onclick = () => {
            const card = state.cards.find(x => x.id === el.getAttribute('data-cid'));
            if (card) openCardDetailModal(card);
          };
        });
      }

      function renderEvolutionAggregationView(listEl, metaEl, q) {
        const tagMap = new Map();
        for (const c of state.cards) {
          const tags = Array.isArray(c.evolution_tags) ? c.evolution_tags : [];
          for (const raw of tags) {
            const t = String(raw || '').trim();
            if (!t) continue;
            if (q && !t.toLowerCase().includes(q) && !String(c.front_fact || '').toLowerCase().includes(q)) continue;
            if (!tagMap.has(t)) tagMap.set(t, []);
            tagMap.get(t).push(c);
          }
        }

        const groups = Array.from(tagMap.entries())
          .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'zh-CN'));

        metaEl.innerHTML = `
          <span>已沉淀 ${groups.length} 个进化词条</span>
          <span>按跨卡聚合度排序</span>
        `;

        if (groups.length === 0) {
          listEl.innerHTML = `
            <div style="text-align:center;padding:48px 16px;font-size:13px;color:var(--ink-muted);line-height:1.7;">
              ${q ? '没有匹配的进化词条' : '复习中沉淀出进化词条后，这里会自动把不同领域长出的同一条底层规律聚在一起。'}
            </div>
          `;
          return;
        }

        listEl.innerHTML = groups.map(([tagName, cards]) => {
          const domains = Array.from(new Set(cards.map(c => normalizeDomainLabel(c.domain_tag))));
          return `
            <div class="tag-cloud-card">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;">
                <span style="font-size:14px;font-weight:600;color:var(--sage);"># ${esc(tagName)}</span>
                <span style="font-size:11px;color:var(--ink-muted);">${cards.length} 张 · ${esc(domains.join(' / '))}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${cards.map(c => `
                  <div role="button" tabindex="0" class="card-soft evo-group-card" data-cid="${esc(c.id)}" style="padding:10px 12px;cursor:pointer;touch-action:pan-y;">

      // --- AI Re-Categorize Library Modal (Preview before apply!) ---
      function openReorganizeDomainsModal() {
        if (state.cards.length === 0) {
          showToast('卡片库还是空的，先记几张卡片再来整理吧');
          return;
        }
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div>
                <h3 style="margin:0;font-size:16px;font-weight:600;">AI 整理已有卡片类别</h3>
                <p style="margin:3px 0 0;font-size:12px;color:var(--ink-muted);">按你的最新理解（进化词条）重新提炼并归类</p>
              </div>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>

            <div class="card-soft" style="font-size:13px;color:var(--ink-secondary);line-height:1.65;">
              AI 会通读当前全部 <strong>${state.cards.length} 张</strong> 卡片的「最新进化词条」「客观事实」和「最初感受」，重新提炼一套简洁不杂乱的主题类别，并为你预览每一处变动——你确认后才会写回云端。
            </div>

            <div id="reorg-preview-box" class="hidden" style="display:flex;flex-direction:column;gap:12px;"></div>
            <div id="reorg-err-box" class="inline-notice terra hidden"></div>

            <div id="reorg-action-row" style="display:flex;gap:10px;">
              <button type="button" class="btn btn-primary btn-block" id="btn-reorg-run">
                ${ICONS.sparkle} 开始智能分析归类
              </button>
            </div>
          </div>
        `);

        document.getElementById('m-close').onclick = closeModal;
        const previewBox = document.getElementById('reorg-preview-box');
        const errBox = document.getElementById('reorg-err-box');
        const actionRow = document.getElementById('reorg-action-row');

        let latestPlan = null;

        async function runAnalysis() {
          errBox.classList.add('hidden');
          previewBox.classList.add('hidden');
          actionRow.innerHTML = `<button type="button" class="btn btn-primary btn-block" disabled>正在通读 ${state.cards.length} 张卡片并重排类别...</button>`;

          try {
            const { categories, assignmentMap } = await aiReorganizeLibraryDomains(state.cards);
            if (assignmentMap.size === 0) {
              throw new Error('AI 未返回有效的归类方案，请重试');
            }

            const changes = [];
            const catCounts = new Map();
            for (const c of state.cards) {
              const oldDom = normalizeDomainLabel(c.domain_tag);
              const newDom = assignmentMap.get(c.id) || oldDom;
              catCounts.set(newDom, (catCounts.get(newDom) || 0) + 1);
              if (newDom !== oldDom) {
                changes.push({ card: c, oldDom, newDom });
              }
            }

            latestPlan = { categories, changes };

            const summaryChips = Array.from(catCounts.entries())
              .sort((a, b) => b[1] - a[1])
              .map(([name, cnt]) => `<span style="font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:500;">${esc(name)} (${cnt})</span>`)
              .join('');

            const diffListHtml = changes.length === 0
              ? `<div class="inline-notice sage">所有卡片的类别都已经非常贴合最新理解，无需调整。</div>`
              : `
                <div style="font-size:12px;color:var(--ink-muted);">以下 ${changes.length} 张卡片类别将更新：</div>
                <div style="display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px;">
                  ${changes.map(ch => `
                    <div class="card-soft" style="padding:10px 12px;">
                      <div class="line-clamp-2" style="font-size:13px;color:var(--ink);margin-bottom:5px;">${esc(ch.card.front_fact)}</div>
                      <div style="font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                        <span style="color:var(--ink-muted);text-decoration:line-through;">${esc(ch.oldDom)}</span>
                        <span style="color:var(--sage);">→</span>
                        <span style="color:var(--sage);font-weight:600;">${esc(ch.newDom)}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `;

            previewBox.innerHTML = `
              <div>
                <div style="font-size:12px;color:var(--ink-muted);margin-bottom:8px;">AI 提炼的新类别体系：</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;">${summaryChips}</div>
              </div>
              ${diffListHtml}
            `;
            previewBox.classList.remove('hidden');

            if (changes.length === 0) {
              actionRow.innerHTML = `
                <button type="button" class="btn btn-soft" style="flex:1;" id="btn-reorg-again">重新分析</button>
                <button type="button" class="btn btn-primary" style="flex:1;" id="btn-reorg-close-ok">完成</button>
              `;
              document.getElementById('btn-reorg-again').onclick = runAnalysis;
              document.getElementById('btn-reorg-close-ok').onclick = closeModal;
            } else {
              actionRow.innerHTML = `
                <button type="button" class="btn btn-soft" style="flex:1;" id="btn-reorg-again">重新生成</button>
                <button type="button" class="btn btn-primary" style="flex:1.4;" id="btn-reorg-apply">确认应用 (${changes.length} 张)</button>
              `;
              document.getElementById('btn-reorg-again').onclick = runAnalysis;
              document.getElementById('btn-reorg-apply').onclick = () => {
                for (const ch of latestPlan.changes) {
                  updateCardOptimistic(ch.card.id, { domain_tag: ch.newDom });
                }
                logActivityCloud('ai_usage', null, {
                  feature: 'reorganize_domains',
                  adopted: true,
                  changed_count: latestPlan.changes.length,
                  category_count: latestPlan.categories.length
                });
                state.library.domain = '全部';
                closeModal();
                updateLibraryListOnly();
                showToast(`已按最新理解重新归类 ${latestPlan.changes.length} 张卡片并后台同步`);
              };
            }
          } catch (err) {
            errBox.textContent = err.message || '智能归类分析失败';
            errBox.classList.remove('hidden');
            actionRow.innerHTML = `<button type="button" class="btn btn-primary btn-block" id="btn-reorg-run">${ICONS.sparkle} 重试智能归类</button>`;
            document.getElementById('btn-reorg-run').onclick = runAnalysis;
          }
        }

        document.getElementById('btn-reorg-run').onclick = runAnalysis;
      }

      // --- Full Card Editor Modal (Respects 3-slot limit + gentle anchor reminder + Delete) ---
      function openCardEditModal(card, opts = {}) {

        const existingDoms = getExistingDomains(false);

                <input id="ed-evo-1" class="input" type="text" maxlength="24" value="${esc(tags[1] || '')}" placeholder="第 2 条认识（选填）" />
                <input id="ed-evo-2" class="input" type="text" maxlength="24" value="${esc(tags[2] || '')}" placeholder="第 3 条认识（选填）" />
              </div>
            </div>

            <div>
              <label class="field-label" for="ed-domain">分类</label>

                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;" id="ed-dom-pills">
                  ${existingDoms.map(d => `

              </button>
            </div>
          </div>
        `);

        const domInput = document.getElementById('ed-domain');
        const pillsBox = document.getElementById('ed-dom-pills');
        if (pillsBox) {
          pillsBox.querySelectorAll('button').forEach(btn => {
            btn.onclick = () => {
              domInput.value = btn.getAttribute('data-dom') || '';
              pillsBox.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            };
          });
        }

        const compBtn = document.getElementById('ed-btn-compress');
        if (compBtn) {
          compBtn.onclick = () => {
            openCompressModal(latest, (newTags) => {
              const history = Array.isArray(latest.evolution_history) ? [...latest.evolution_history] : [];
              history.push({
                at: new Date().toISOString(),
                reps: latest.fsrs_state?.reps || 0,
                action: 'compress',
                before: tags,
                after: newTags
              });
              updateCardOptimistic(latest.id, { evolution_tags: newTags, evolution_history: history });
              showToast('已压缩并更新进化层');
              updateLibraryListOnly();
              renderReviewTab();
            });

          const newFront = document.getElementById('ed-front').value.trim();
          const newAnchor = document.getElementById('ed-anchor').value.trim();
          if (!newFront) {
            showToast('正面客观事实不能为空');
            return;
          }
          if (!newAnchor) {
            showToast('背面最初感受不能为空');
            return;

          const newTags = [
            document.getElementById('ed-evo-0').value.trim(),
            document.getElementById('ed-evo-1').value.trim(),
            document.getElementById('ed-evo-2').value.trim()
          ].filter(Boolean).slice(0, 3);

          const newDom = normalizeDomainLabel(domInput.value);
          const patch = {
            front_fact: newFront,
            back_anchor: newAnchor,
            domain_tag: newDom
          };

          const tagsChanged = JSON.stringify(tags) !== JSON.stringify(newTags);
          if (tagsChanged) {
            const history = Array.isArray(latest.evolution_history) ? [...latest.evolution_history] : [];
            history.push({
              at: new Date().toISOString(),
              reps: latest.fsrs_state?.reps || 0,
              action: 'manual_edit',
              before: tags,
              after: newTags
            });
            patch.evolution_tags = newTags;
            patch.evolution_history = history;
          }

          const updated = updateCardOptimistic(latest.id, patch);
          if (tagsChanged && updated && newTags.length > 0) {
            runSilentCrossDomainMatch(updated);
          }

          showToast('卡片修改已保存并后台同步');
          updateLibraryListOnly();
          renderReviewTab();
          if (opts.fromReview) closeModal();
          else openCardDetailModal(updated || latest);
        };

        document.getElementById('ed-btn-del').onclick = () => {
          document.getElementById('ed-del-wrap').innerHTML = `
            <div style="display:flex;justify-content:center;gap:10px;">
              <button type="button" class="btn btn-soft btn-sm" id="ed-del-no">取消删除</button>
              <button type="button" class="btn btn-terra btn-sm" id="ed-del-yes">确认永久删除</button>
            </div>

          document.getElementById('ed-del-yes').onclick = () => {
            deleteCardOptimistic(latest.id);
            closeModal();
            showToast('卡片已永久删除并同步');
            updateLibraryListOnly();
            renderReviewTab();
          };
        };
      }
