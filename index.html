                <span style="text-decoration:underline;">展开处理</span>
              </summary>
              <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);">
                ${stash.map((item, idx) => `
                  <div class="card" style="padding:10px 12px;">
                    <p style="margin:0 0 8px;font-size:13px;line-height:1.55;white-space:pre-wrap;">${esc(item.text)}</p>
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-muted);">
                      <span>${formatTime(item.at).slice(5)}</span>
                      <div style="display:flex;gap:6px;">
                        <button type="button" class="btn-ghost btn-xs" data-fstash-load="${idx}">载入</button>
                        <button type="button" class="btn-ghost btn-xs" style="color:var(--terra);" data-fstash-del="${idx}">移除</button>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </details>
          ` : ''}
        `;

        document.getElementById('btn-fcap-back').onclick = () => switchTab('forest');

        const clearBtn = document.getElementById('btn-fcap-clear');
        if (clearBtn) {
          clearBtn.onclick = () => {
            clearForestCaptureDraft();
            renderForestCaptureTab();
            showToast('已清空');
          };
        }

        const rawEl = document.getElementById('fcap-raw');
        const treeEl = document.getElementById('fcap-tree');
        const parentEl = document.getElementById('fcap-parent');
        const titleEl = document.getElementById('fcap-title');
        const probEl = document.getElementById('fcap-problem');
        const refEl = document.getElementById('fcap-refined');
        const stepEl = document.getElementById('fcap-step');
        const extraEl = document.getElementById('fcap-ai-extra');

        rawEl.oninput = () => {
          fc.raw = rawEl.value;
          fc.aiError = '';
        };
        treeEl.oninput = () => { fc.treeLabel = treeEl.value; };
        parentEl.onchange = () => {
          fc.parentId = parentEl.value;
          const pNode = state.forestNodes.find(n => n.id === fc.parentId);
          if (pNode && !treeEl.value.trim()) {
            fc.treeLabel = pNode.tree_label;
            treeEl.value = pNode.tree_label;
          }
        };
        titleEl.oninput = () => { fc.title = titleEl.value; fc.formFilledByAi = false; };
        probEl.oninput = () => { fc.problem = probEl.value; fc.formFilledByAi = false; };
        refEl.oninput = () => { fc.refined = refEl.value; fc.formFilledByAi = false; };
        stepEl.oninput = () => { fc.step = stepEl.value; fc.formFilledByAi = false; };
        if (extraEl) extraEl.oninput = () => { fc.aiExtraPrompt = extraEl.value; };

            container.querySelectorAll('[data-fcap-tree]').forEach(b => b.classList.toggle('active', b === btn));

          btn.onclick = () => {
            fc.status = btn.getAttribute('data-fcap-status') || 'fuzzy';
            container.querySelectorAll('[data-fcap-status]').forEach(b => b.classList.toggle('active', b === btn));

        });

          fc.treeLabel = res.tree_label || fc.treeLabel || '综合破局';
          fc.parentId = res.parent_id || '';
          fc.title = res.short_title || '';
          fc.problem = res.corrected_problem || fc.raw.trim();
          fc.refined = res.refined_problem || '';
          fc.step = res.next_micro_step || '';
          fc.status = (fc.refined || fc.step) ? 'active' : 'fuzzy';
          fc.implicitIntent = res.implicit_intent || '';
          fc.formFilledByAi = true;
          fc.pendingOverwrite = null;
          renderForestCaptureTab();
          const formEl = document.getElementById('fcap-form-panel');
          if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          showToast(`已具象化并建议挂入「${fc.treeLabel}」`);
        };

            rawEl.focus();
            return;
          }
          if (!isAiConfigured()) {
            promptConfigureAi();
            return;
          }
          const customPrompt = readAiExtraPrompt('fcap-ai-extra', fc.aiExtraPrompt);
          fc.raw = raw;
          fc.aiExtraPrompt = customPrompt;
          fc.aiLoading = true;
          fc.aiError = '';
          fc.pendingOverwrite = null;
          renderForestCaptureTab();

          try {
            const res = await aiStructureForestCapture(raw, customPrompt);
            const hasManualContent = Boolean(
              !fc.formFilledByAi &&
              (fc.title.trim() || fc.problem.trim() || fc.refined.trim())

            fc.aiError = err.message || 'AI 整理失败';
            renderForestCaptureTab();
            showToast(err.message || 'AI 整理失败', 4200);
          }
        };

        const fowYes = document.getElementById('btn-fcap-ow-yes');
        if (fowYes && pendingOw) fowYes.onclick = () => applyForestAiResult(pendingOw);

        if (fowNo) {

            fc.pendingOverwrite = null;
            renderForestCaptureTab();
            showToast('已保留手写内容');
          };
        }

        document.getElementById('btn-fcap-stash').onclick = () => {

          if (!raw) {

          const next = [{ id: makeClientId(), text: raw, at: new Date().toISOString() }, ...getCaptureStash()];

          trackActivity('capture', 'capture_stash', null, { length: raw.length, source: 'forest_capture' });
          fc.raw = '';
          renderForestCaptureTab();
          showToast('已存进暂存箱');
        };

        container.querySelectorAll('[data-fstash-load]').forEach(btn => {
          btn.onclick = () => {
            const idx = Number(btn.getAttribute('data-fstash-load'));
            const cur = [...getCaptureStash()];
            const item = cur[idx];
            if (!item) return;
            cur.splice(idx, 1);
            saveCaptureStash(cur);
            fc.raw = item.text;
            renderForestCaptureTab();
          };
        });
        container.querySelectorAll('[data-fstash-del]').forEach(btn => {
          btn.onclick = () => {
            const idx = Number(btn.getAttribute('data-fstash-del'));
            const cur = [...getCaptureStash()];
            cur.splice(idx, 1);
            saveCaptureStash(cur);
            renderForestCaptureTab();
            showToast('已移除');
          };
        });

        document.getElementById('btn-fcap-save').onclick = () => {

            showToast('请先写下问题原述');
            probEl.focus();
            return;
          }
          const parentId = parentEl.value || null;
          const parentObj = parentId ? state.forestNodes.find(n => n.id === parentId) : null;
          const treeLabel = (treeEl.value.trim() || parentObj?.tree_label || '综合破局').slice(0, 16);
          const shortTitle = (titleEl.value.trim() || problem.slice(0, 18)).slice(0, 32);
          const refined = refEl.value.trim() || null;
          const step = stepEl.value.trim() || null;
          const status = fc.status || ((refined || step) ? 'active' : 'fuzzy');

          const created = createForestNodeOptimistic({
            tree_label: treeLabel,
            parent_id: parentId,
            short_title: shortTitle,
            raw_problem: problem,
            refined_problem: refined,
            next_micro_step: step,
            status,
            analysis_history: [{
              at: new Date().toISOString(),
              source: 'forest_capture',
              content: problem,
              next_step: step || ''
            }]
          });

          trackActivity('capture', 'capture_submit', created?.id || null, {
            length: problem.length,
            mode: fc.formFilledByAi ? 'forest_ai_capture' : 'forest_manual_capture',
            tree_label: treeLabel
          });

          scheduleIgnitionPreheat();
          clearForestCaptureDraft();

          if (state.forest.selectedTree !== '全部树') {
            state.forest.selectedTree = treeLabel;
          }
          switchTab('forest');
          showToast(`已种入破局森林「${treeLabel}」`);
        };
      }

      // =====================================================================
      // 12B. SPACE 2: 破局森林 (TOP-DOWN BREAKTHROUGH FOREST - CANVAS + LIST)
      // =====================================================================
      const FOREST_STATUS_META = {
        fuzzy: { label: '模糊', dotClass: 'fuzzy' },
        active: { label: '推进中', dotClass: 'active' },
        solved: { label: '已克服', dotClass: 'solved' }
      };

      function getForestTreesList() {
        const map = new Map();
        for (const n of state.forestNodes) {
          const t = String(n.tree_label || '综合破局').trim() || '综合破局';
          if (!map.has(t)) map.set(t, { label: t, count: 0, isMeta: false });
          const item = map.get(t);
          item.count++;
          if (n.is_meta) item.isMeta = true;
        }
        return Array.from(map.values()).sort((a, b) => {
          if (a.isMeta !== b.isMeta) return a.isMeta ? -1 : 1;
          return b.count - a.count || a.label.localeCompare(b.label, 'zh-CN');
        });
      }

      function wouldCreateForestCycle(nodeId, candidateParentId, nodeMap) {
        if (!candidateParentId) return false;
        let cur = candidateParentId;
        const seen = new Set([nodeId]);
        while (cur) {
          if (seen.has(cur)) return true;
          seen.add(cur);
          const p = nodeMap.get(cur);
          cur = p ? p.parent_id : null;
        }
        return false;
      }

      function computeEffectiveForestNodes(visibleNodes) {
        const plan = state.forest.reorgPlan;
        const previewAfter = Boolean(plan && plan.mode === 'after');
        const map = new Map();
        visibleNodes.forEach(n => {
          map.set(n.id, {
            ...n,
            _effParentId: n.parent_id || null,
            _effParallelGroup: n.parallel_group || null,
            _effShortTitle: n.short_title,
            _reorgChanged: false,
            _reorgEdgeDashed: false,
            _reorgNote: ''
          });
        });

        if (previewAfter && Array.isArray(plan.proposals)) {
          for (const prop of plan.proposals) {
            if (!prop.selected) continue;
            const target = map.get(prop.nodeId);
            if (!target) continue;
            if (prop.action === 'move_parent') {
              const cand = prop.newParentId || null;
              if (!cand || map.has(cand)) {
                // Guard against cycle in preview
                let cur = cand;
                let cycle = false;
                const visited = new Set([target.id]);
                while (cur) {
                  if (visited.has(cur)) { cycle = true; break; }
                  visited.add(cur);
                  cur = map.get(cur)?._effParentId || null;
                }
                if (!cycle) {
                  target._effParentId = cand;
                  target._reorgChanged = true;
                  target._reorgEdgeDashed = Boolean(cand);
                  target._reorgNote = cand ? `拟挂至「${map.get(cand)?.short_title || ''}」` : '拟升为独立根问题';
                }
              }
            } else if (prop.action === 'make_parallel' && prop.newParallelGroup) {
              target._effParallelGroup = prop.newParallelGroup;
              target._reorgChanged = true;
              target._reorgNote = `拟设为并列组「${prop.newParallelGroup}」`;
            } else if (prop.action === 'rename_short_title' && prop.newShortTitle) {
              target._effShortTitle = prop.newShortTitle;
              target._reorgChanged = true;
              target._reorgNote = `拟精炼为「${prop.newShortTitle}」`;
            }
          }
        }
        return Array.from(map.values());
      }

      function autoLayoutForestNodes(nodesSubset, persist = true) {
        if (!nodesSubset.length) return;
        const byId = new Map(nodesSubset.map(n => [n.id, n]));
        const childrenMap = new Map();
        const roots = [];

        nodesSubset.forEach(n => {
          if (n.parent_id && byId.has(n.parent_id)) {
            if (!childrenMap.has(n.parent_id)) childrenMap.set(n.parent_id, []);
            childrenMap.get(n.parent_id).push(n);
          } else {
            roots.push(n);
          }
        });

        roots.sort((a, b) => {
          if (a.is_meta !== b.is_meta) return a.is_meta ? -1 : 1;
          return String(a.tree_label).localeCompare(String(b.tree_label), 'zh-CN');
        });

        const X_GAP = 240;
        const Y_GAP = 166;
        let cursorX = 64;

        function placeSubtree(node, depth) {
          const kids = (childrenMap.get(node.id) || []).slice().sort((a, b) =>
            (Number(a.pos_x) || 0) - (Number(b.pos_x) || 0) ||
            new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime()
          );
          const y = 64 + depth * Y_GAP;
          let x;
          if (kids.length === 0) {
            x = cursorX;
            cursorX += X_GAP;
          } else {
            const xs = kids.map(k => placeSubtree(k, depth + 1));
            x = Math.round((xs[0] + xs[xs.length - 1]) / 2);
          }
          if (persist) {
            updateForestNodeOptimistic(node.id, { pos_x: x, pos_y: y });
          } else {
            node.pos_x = x;
            node.pos_y = y;
          }
          return x;
        }

        roots.forEach((root, idx) => {
          if (idx > 0) cursorX += 46;
          placeSubtree(root, 0);
        });
      }

      function centerForestViewport(visibleNodes) {
        if (!visibleNodes.length) {
          state.forest.panX = 40;
          state.forest.panY = 40;
          state.forest.scale = 1;
          return;
        }
        const NODE_W = 196;
        const xs = visibleNodes.map(n => Number(n.pos_x) || 80);
        const ys = visibleNodes.map(n => Number(n.pos_y) || 80);
        const minX = Math.min(...xs) - 20;
        const maxX = Math.max(...xs) + NODE_W + 20;
        const minY = Math.min(...ys) - 20;
        const contentW = Math.max(240, maxX - minX);
        const shellEl = document.getElementById('forest-canvas-shell');
        const availW = shellEl?.clientWidth || Math.min(window.innerWidth - 36, window.innerWidth >= 768 ? 1120 : 440);
        const fitScale = Number(clamp((availW - 32) / contentW, 0.55, 1).toFixed(2));
        state.forest.scale = fitScale;
        state.forest.panX = Math.round((availW - contentW * fitScale) / 2 - minX * fitScale);
        state.forest.panY = Math.round(28 - minY * fitScale);
      }

      function getForestCoverAnchors(selectedTree) {
        if (selectedTree !== '全部树') {
          const treeNodeIds = new Set(state.forestNodes.filter(n => n.tree_label === selectedTree).map(n => n.id));
          const linked = state.desireAnchors.filter(a => a.linked_node_id && treeNodeIds.has(a.linked_node_id));
          if (linked.length > 0) return linked;
        }
        const nonMeta = state.desireAnchors.filter(a => !a.is_meta);
        return nonMeta.length > 0 ? nonMeta : state.desireAnchors;
      }

      function formatParallelGroupLabel(groupName) {
        if (groupName === 'meta_pillars') return '三大核心支柱';
        return String(groupName || '');
      }

      function renderForestSvgEdges(effNodes) {
        const nodeMap = new Map(effNodes.map(n => [n.id, n]));
        const NODE_W = 196;
        const estimateCardHeight = (n) => {
          const titleLen = String(n._effShortTitle || '').length;
          const extraLines = (state.forest.selectedTree === '全部树' ? 1 : 0) + (n._reorgNote ? 1 : 0);
          return (titleLen > 12 ? 64 : 44) + extraLines * 15;
        };
        const parts = [];

        // 1. Subtle dashed bounding boxes for parallel sibling groups (允许并列)
        const parallelGroups = new Map();
        effNodes.forEach(n => {
          if (!n._effParallelGroup) return;
          if (!parallelGroups.has(n._effParallelGroup)) parallelGroups.set(n._effParallelGroup, []);
          parallelGroups.get(n._effParallelGroup).push(n);
        });

        parallelGroups.forEach((members, groupName) => {
          if (members.length < 1) return;
          const minX = Math.min(...members.map(m => Number(m.pos_x) || 80)) - 14;
          const minY = Math.min(...members.map(m => Number(m.pos_y) || 80)) - 28;
          const maxX = Math.max(...members.map(m => (Number(m.pos_x) || 80) + NODE_W)) + 14;
          const maxY = Math.max(...members.map(m => (Number(m.pos_y) || 80) + estimateCardHeight(m))) + 18;
          parts.push(`
            <rect x="${minX}" y="${minY}" width="${maxX - minX}" height="${maxY - minY}" rx="16"
              fill="none" stroke="var(--sage-border)" stroke-width="1.5" stroke-dasharray="6 5" />
            <text x="${minX + 12}" y="${minY + 17}" font-size="11" fill="var(--sage)" opacity="0.88">并列 · ${esc(formatParallelGroupLabel(groupName))}</text>
          `);
        });

        // 2. Smooth vertical Bezier curves between parent and child
        effNodes.forEach(n => {
          if (!n._effParentId) return;
          const p = nodeMap.get(n._effParentId);
          if (!p) return;
          const x1 = (Number(p.pos_x) || 80) + NODE_W / 2;
          const y1 = (Number(p.pos_y) || 80) + estimateCardHeight(p);
          const x2 = (Number(n.pos_x) || 80) + NODE_W / 2;
          const y2 = (Number(n.pos_y) || 80);
          const midY = Math.round((y1 + y2) / 2);
          const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
          if (n._reorgEdgeDashed) {
            parts.push(`<path d="${d}" fill="none" stroke="var(--terra)" stroke-width="2.2" stroke-dasharray="6 5" />`);
          } else {
            parts.push(`<path d="${d}" fill="none" stroke="var(--border)" stroke-width="2" />`);
          }
        });

        return parts.join('');
      }

            </div>
          </div>
        ` : '';

        // Main Workspace: Canvas vs Mobile Single-Tree List
        let workspaceHtml = '';
        if (state.forest.viewMode === 'canvas') {
          const svgContent = renderForestSvgEdges(effNodes);
          const cardsHtml = effNodes.map(n => {
            const st = FOREST_STATUS_META[n.status] || FOREST_STATUS_META.fuzzy;
            const x = Number(n.pos_x) || 80;
            const y = Number(n.pos_y) || 80;
            return `
              <div class="forest-node-card ${n.is_meta ? 'is-meta' : ''} ${n._reorgChanged ? 'reorg-highlight' : ''}"
                data-fnode-id="${esc(n.id)}"
                style="left:${x}px;top:${y}px;">
                <div style="display:flex;align-items:flex-start;gap:8px;">

                    ${state.forest.selectedTree === '全部树' ? `<div style="font-size:10px;color:var(--ink-muted);margin-top:3px;">${esc(n.tree_label)}</div>` : ''}
                    ${n._reorgNote ? `<div style="font-size:10px;color:var(--terra);margin-top:3px;">${esc(n._reorgNote)}</div>` : ''}
                  </div>
                </div>
              </div>

          }).join('');

          workspaceHtml = `
            <div class="forest-canvas-shell" id="forest-canvas-shell">
              <div class="forest-viewport" id="forest-viewport" style="transform:translate(${state.forest.panX}px, ${state.forest.panY}px) scale(${state.forest.scale});">

                <span id="fc-zoom-label" style="font-size:11px;color:var(--ink-muted);padding:0 4px;display:inline-flex;align-items:center;font-variant-numeric:tabular-nums;">${Math.round(state.forest.scale * 100)}%</span>
                <button type="button" class="btn-ghost btn-xs" id="btn-fc-zoom-in" title="放大">+</button>
                <button type="button" class="btn-ghost btn-xs" id="btn-fc-layout" title="自动整理间距">排布</button>
                <button type="button" class="btn-ghost btn-xs" id="btn-fc-center" title="居中视角">居中</button>
              </div>

          `;
        } else {
          // Mobile-friendly Single-Tree Focus Indented List
          const groupedByTree = new Map();
          effNodes.forEach(n => {
            const t = n.tree_label || '综合破局';

          const listBlocks = [];
          groupedByTree.forEach((nodesInTree, treeName) => {

                <div role="button" tabindex="0" class="forest-list-node ${node.is_meta ? 'is-meta' : ''}"
                  data-flist-id="${esc(node.id)}"

                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                    <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                      <span class="status-dot ${st.dotClass}" title="${st.label}"></span>
                      <span style="font-size:14px;font-weight:500;color:var(--ink);line-height:1.45;">${esc(node._effShortTitle)}</span>
                    </div>
                    <span style="color:var(--ink-muted);display:inline-flex;flex-shrink:0;">${ICONS.chevronRight}</span>
                  </div>
                  ${(node._effParallelGroup || node._reorgNote) ? `
                    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-left:17px;">
                      ${node._effParallelGroup ? `<span style="font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sage-soft);color:var(--sage);">并列 · ${esc(formatParallelGroupLabel(node._effParallelGroup))}</span>` : ''}
                      ${node._reorgNote ? `<span style="font-size:11px;color:var(--terra);">${esc(node._reorgNote)}</span>` : ''}
                    </div>
                  ` : ''}
                </div>
              `);
              (childrenByParent.get(node.id) || []).forEach(child => walk(child, depth + 1));
            }
            roots.forEach(r => walk(r, 0));

            ? `<div style="flex:1;">${listBlocks.join('')}</div>`

        container.innerHTML = `

          </div>

          <!-- Tree-Top Desire Anchor Cover Card -->

              <div style="display:flex;align-items:center;gap:4px;">

                <button type="button" class="btn-ghost btn-xs" id="btn-fcover-manage" style="padding:2px 7px;min-height:24px;">+ 挂渴望</button>

            <p style="margin:0;font-size:14px;line-height:1.6;color:var(--ink);">${esc(activeCover ? (activeCover.use_polished && activeCover.polished_text ? activeCover.polished_text : activeCover.raw_text) : DEFAULT_META_ANCHOR)}</p>

          btn.onclick = () => {
            state.forest.selectedTree = btn.getAttribute('data-ftree');

              ? state.forestNodes
              : state.forestNodes.filter(n => n.tree_label === state.forest.selectedTree);
            if (state.forest.viewMode === 'canvas') centerForestViewport(subset);
            renderForestTab();
          };
        });

        // Wire Tree-top Desire Anchor cover controls
        const prevCover = document.getElementById('btn-fcover-prev');
        const nextCover = document.getElementById('btn-fcover-next');
        if (prevCover) {
          prevCover.onclick = () => {
            state.forest.coverIndexByTree[coverKey] = coverIdx - 1;
            renderForestTab();
          };
        }
        if (nextCover) {
          nextCover.onclick = () => {
            state.forest.coverIndexByTree[coverKey] = coverIdx + 1;
            renderForestTab();
          };
        }
        document.getElementById('btn-fcover-manage').onclick = () => openDesireAnchorPoolModal(firstRootForTree?.id || null);

        // Wire New Problem button -> Dedicated Forest Capture
        document.getElementById('btn-for-new').onclick = () =>
          openForestCapture(state.forest.selectedTree === '全部树' ? '' : state.forest.selectedTree);

        // Wire AI Cabinet Reorganize Forest
        document.getElementById('btn-for-reorg').onclick = async () => {
          const nonMeta = visibleNodes.filter(n => !n.is_meta);
          if (nonMeta.length < 2) {
            showToast('至少有 2 个问题节点时，再召唤内阁整理脉络吧');
            return;
          }
          if (!isAiConfigured()) {
            promptConfigureAi();
            return;
          }
          const customPrompt = readAiExtraPrompt('for-reorg-extra', state.forest.reorgExtraPrompt);
          state.forest.reorgExtraPrompt = customPrompt;
          state.forest.reorgLoading = true;
          renderForestTab();
          try {
            const proposals = await aiReorganizeForest(visibleNodes, customPrompt);
            if (proposals.length === 0) {
              showToast('内阁审视后认为当前脉络已足够清晰，无需硬凑调整');
              state.forest.reorgPlan = null;
            } else {
              state.forest.reorgPlan = { proposals, mode: 'after' };
              showToast(`已生成 ${proposals.length} 条虚线预演建议，请批红决定`);
            }
          } catch (err) {
            showToast(err.message || '内阁整理脉络失败', 4000);
          } finally {
            state.forest.reorgLoading = false;
            renderForestTab();
          }
        };

        // Wire Reorg Preview Controls
        if (plan) {
          container.querySelectorAll('[data-reorg-mode]').forEach(btn => {
            btn.onclick = () => {
              plan.mode = btn.getAttribute('data-reorg-mode');
              renderForestTab();
            };
          });
          container.querySelectorAll('[data-reorg-idx]').forEach(cb => {
            cb.onchange = () => {
              const i = Number(cb.getAttribute('data-reorg-idx'));
              if (plan.proposals[i]) plan.proposals[i].selected = cb.checked;
              renderForestTab();
            };
          });
          document.getElementById('btn-reorg-reject').onclick = () => {
            const count = plan.proposals.length;
            state.forest.reorgPlan = null;
            trackActivity('forest', 'reorg_decision', null, { decision: 'rejected', proposed_count: count, adopted_count: 0 });
            trackActivity('cabinet', 'ai_decision', null, { feature: 'forest_reorg', decision: 'rejected' });
            renderForestTab();
            showToast('已一键驳回，画布保留原状');
          };
          document.getElementById('btn-reorg-commit').onclick = () => {
            const chosen = plan.proposals.filter(p => p.selected);
            const nodeMap = new Map(state.forestNodes.map(n => [n.id, { ...n }]));
            let applied = 0;
            for (const p of chosen) {
              const patch = {};
              if (p.action === 'move_parent') {
                if (!wouldCreateForestCycle(p.nodeId, p.newParentId, nodeMap)) {
                  patch.parent_id = p.newParentId || null;
                  const target = nodeMap.get(p.nodeId);
                  if (target) target.parent_id = patch.parent_id;
                }
              } else if (p.action === 'make_parallel' && p.newParallelGroup) {
                patch.parallel_group = p.newParallelGroup;
              } else if (p.action === 'rename_short_title' && p.newShortTitle) {
                patch.short_title = p.newShortTitle;
              }
              if (Object.keys(patch).length > 0) {
                updateForestNodeOptimistic(p.nodeId, patch);
                applied++;
              }
            }
            const totalProp = plan.proposals.length;
            state.forest.reorgPlan = null;
            trackActivity('forest', 'reorg_decision', null, {
              decision: applied === totalProp ? 'approved' : 'edited',
              proposed_count: totalProp,
              adopted_count: applied
            });
            trackActivity('cabinet', 'ai_decision', null, {
              feature: 'forest_reorg',
              decision: applied === totalProp ? 'approved' : 'edited'
            });
            scheduleIgnitionPreheat();
            renderForestTab();
            showToast(`已批红应用 ${applied} 条脉络整理`);
          };
        }

        // Wire Canvas Interactions OR List Clicks
        if (state.forest.viewMode === 'canvas') {
          wireForestCanvasInteractions(effNodes);
        } else {
          container.querySelectorAll('[data-flist-id]').forEach(el => {
            el.onclick = () => {
              const node = state.forestNodes.find(n => n.id === el.getAttribute('data-flist-id'));
              if (node) openForestNodeDrawer(node);
            };
          });
        }
      }

      function wireForestCanvasInteractions(effNodes) {
        const shell = document.getElementById('forest-canvas-shell');
        const viewport = document.getElementById('forest-viewport');
        const svgEl = document.getElementById('forest-svg');
        const zoomLbl = document.getElementById('fc-zoom-label');
        if (!shell || !viewport) return;

        const applyTransform = () => {
          viewport.style.transform = `translate(${state.forest.panX}px, ${state.forest.panY}px) scale(${state.forest.scale})`;
          if (zoomLbl) zoomLbl.textContent = `${Math.round(state.forest.scale * 100)}%`;
        };

        // Canvas Pan & Node Drag via Pointer Events (Zero external dependencies)
        let dragMode = null; // 'pan' | 'node'
        let activeNodeId = null;
        let activeNodeEl = null;
        let startClientX = 0;
        let startClientY = 0;
        let origPanX = 0;
        let origPanY = 0;
        let origNodeX = 0;
        let origNodeY = 0;
        let movedDist = 0;

        shell.onpointerdown = (e) => {
          if (e.target.closest('.forest-canvas-controls')) return;
          const cardEl = e.target.closest('.forest-node-card');
          startClientX = e.clientX;
          startClientY = e.clientY;
          movedDist = 0;

          if (cardEl) {
            dragMode = 'node';
            activeNodeId = cardEl.getAttribute('data-fnode-id');
            activeNodeEl = cardEl;
            const nObj = effNodes.find(x => x.id === activeNodeId);
            origNodeX = Number(nObj?.pos_x) || 80;
            origNodeY = Number(nObj?.pos_y) || 80;
            try { shell.setPointerCapture(e.pointerId); } catch (_) {}
          } else {
            dragMode = 'pan';
            origPanX = state.forest.panX;
            origPanY = state.forest.panY;
            shell.classList.add('dragging');
            try { shell.setPointerCapture(e.pointerId); } catch (_) {}
          }
        };

        shell.onpointermove = (e) => {
          if (!dragMode) return;
          const dx = e.clientX - startClientX;
          const dy = e.clientY - startClientY;
          movedDist = Math.max(movedDist, Math.hypot(dx, dy));

          if (dragMode === 'pan') {
            state.forest.panX = Math.round(origPanX + dx);
            state.forest.panY = Math.round(origPanY + dy);
            applyTransform();
          } else if (dragMode === 'node' && activeNodeEl) {
            const nx = Math.round(origNodeX + dx / state.forest.scale);
            const ny = Math.round(origNodeY + dy / state.forest.scale);
            activeNodeEl.style.left = `${nx}px`;
            activeNodeEl.style.top = `${ny}px`;
            const nObj = effNodes.find(x => x.id === activeNodeId);
            if (nObj) {
              nObj.pos_x = nx;
              nObj.pos_y = ny;
              if (svgEl) svgEl.innerHTML = renderForestSvgEdges(effNodes);
            }
          }
        };

        const finishPointer = (e) => {
          if (!dragMode) return;
          const mode = dragMode;
          const nid = activeNodeId;
          dragMode = null;
          activeNodeId = null;
          activeNodeEl = null;
          shell.classList.remove('dragging');
          try { shell.releasePointerCapture(e.pointerId); } catch (_) {}

          if (mode === 'node' && nid) {
            if (movedDist <= 6) {
              const realNode = state.forestNodes.find(n => n.id === nid);
              if (realNode) openForestNodeDrawer(realNode);
            } else {
              const movedNode = effNodes.find(x => x.id === nid);
              if (movedNode) {
                updateForestNodeOptimistic(nid, {
                  pos_x: Math.round(Number(movedNode.pos_x) || 80),
                  pos_y: Math.round(Number(movedNode.pos_y) || 80)
                });
              }
            }
          }
        };

        shell.onpointerup = finishPointer;
        shell.onpointercancel = finishPointer;

        // Smooth wheel zoom on desktop
        shell.onwheel = (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.09 : 0.92;
          const nextScale = Number(clamp(state.forest.scale * factor, 0.45, 1.65).toFixed(2));
          state.forest.scale = nextScale;
          applyTransform();
        };

        document.getElementById('btn-fc-zoom-in').onclick = () => {
          state.forest.scale = Number(clamp(state.forest.scale + 0.15, 0.45, 1.65).toFixed(2));
          applyTransform();
        };
        document.getElementById('btn-fc-zoom-out').onclick = () => {
          state.forest.scale = Number(clamp(state.forest.scale - 0.15, 0.45, 1.65).toFixed(2));
          applyTransform();
        };
        document.getElementById('btn-fc-center').onclick = () => {
          centerForestViewport(effNodes);
          applyTransform();
        };
        document.getElementById('btn-fc-layout').onclick = () => {
          const subset = state.forest.selectedTree === '全部树'
            ? state.forestNodes
            : state.forestNodes.filter(n => n.tree_label === state.forest.selectedTree);
          autoLayoutForestNodes(subset, true);
          centerForestViewport(subset);
          renderForestTab();
          showToast('已按树状层级重新排布坐标');
        };
      }
