        try {
          const sys = `你是后台静默跨界碰瓷器。判断新卡片与不同领域的历史候选卡片中，是否存在底层结构或通用规律上的高度共振。
规则：
- 若存在令人惊喜的底层结构相似性，返回 {"match_id": "对应候选卡片id"}。
- 若没有足够强的底层相似性，切勿硬凑，返回 {"match_id": ""}。
- 严禁返回解释或剧透原因。`;
          const listStr = candidates.map(c =>
            `ID:${c.id} | 事实:${String(c.front_fact).slice(0, 55)} | 词条:${(c.evolution_tags || []).join('/')}`
          ).join('\n');
          const prompt = `新卡片（${savedCard.domain_tag}）：\n事实：${savedCard.front_fact}\n感受：${savedCard.back_anchor}\n\n不同领域候选：\n${listStr}`;

          const res = await callOpenAiCompatible(sys, prompt, true);
          const match = candidates.find(c => c.id === res.match_id);
          if (match) {
            await updateCardInCloud(savedCard.id, {
              cross_link_id: match.id,
              cross_link_hint: match.domain_tag
            });
            logActivitySilent('ai_usage', savedCard.id, { feature: 'cross_link', adopted: true });
          }
        } catch (_) {
          // Silent background operation: never bother user
        }
      }

      // =====================================================================
      // 8. AUTH WALL VIEW & LOGIN FLOW
      // =====================================================================
      function showAuthWall(errorMsg = '') {
        const authWall = document.getElementById('auth-wall');
        const appMain = document.getElementById('app-main');
        appMain.classList.add('hidden');
        appMain.innerHTML = ''; // Strictly unmount all app UI when logged out
        authWall.classList.remove('hidden');

        // Pre-fill Supabase config from localStorage
        const urlInput = document.getElementById('cfg-sb-url');
        const anonInput = document.getElementById('cfg-sb-anon');
        const details = document.getElementById('supabase-config-details');
        const statusTag = document.getElementById('db-config-status');

        urlInput.value = state.sbConfig.url || '';
        anonInput.value = state.sbConfig.anonKey || '';

        const configured = Boolean(state.sbConfig.url && state.sbConfig.anonKey);
        details.open = !configured; // Expand on first visit; collapse once saved
        statusTag.textContent = configured ? '已记住本机配置' : '首次需填写';
        statusTag.className = 'db-status-tag' + (configured ? ' ready' : '');

        const errBox = document.getElementById('auth-error-box');
        if (errorMsg) {
          errBox.textContent = errorMsg;
          errBox.classList.remove('hidden');
        } else {
          errBox.classList.add('hidden');
        }
      }

      function initAuthWallEvents() {
        const pwInput = document.getElementById('auth-password');
        const eyeBtn = document.getElementById('btn-toggle-auth-pw');
        eyeBtn.innerHTML = ICONS.eye;
        eyeBtn.addEventListener('click', () => {
          const isPw = pwInput.type === 'password';
          pwInput.type = isPw ? 'text' : 'password';
          eyeBtn.innerHTML = isPw ? ICONS.eyeOff : ICONS.eye;
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('auth-email').value.trim();
          const password = pwInput.value;
          const sbUrl = cleanBaseUrl(document.getElementById('cfg-sb-url').value);
          const sbAnon = document.getElementById('cfg-sb-anon').value.trim();
          const errBox = document.getElementById('auth-error-box');
          const submitBtn = document.getElementById('btn-auth-submit');

          errBox.classList.add('hidden');

          if (!sbUrl || !sbAnon) {
            document.getElementById('supabase-config-details').open = true;
            errBox.textContent = '请先展开并填写 Supabase Project URL 与 Anon Key。';
            errBox.classList.remove('hidden');
            return;
          }
          if (!/^https?:\/\//i.test(sbUrl)) {
            document.getElementById('supabase-config-details').open = true;
            errBox.textContent = 'Supabase Project URL 应以 https:// 开头。';
            errBox.classList.remove('hidden');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = '正在验证身份...';

          try {
            const session = await sbPasswordLogin(sbUrl, sbAnon, email, password);
            state.sbConfig = { url: sbUrl, anonKey: sbAnon };
            state.session = session;
            saveJsonStorage(STORAGE_KEYS.SUPABASE, state.sbConfig);
            saveJsonStorage(STORAGE_KEYS.SESSION, state.session);
            pwInput.value = '';
            await enterAuthenticatedApp();
          } catch (err) {
            errBox.textContent = err.message || '登录失败，请检查账号密码与云端配置。';
            errBox.classList.remove('hidden');
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '安全登录';
          }
        });
      }

      // =====================================================================
      // 9. AUTHENTICATED APP SHELL MOUNTING
      // =====================================================================
      async function enterAuthenticatedApp() {
        document.getElementById('auth-wall').classList.add('hidden');
        const appMain = document.getElementById('app-main');
        appMain.classList.remove('hidden');

        if (!state.appMounted) {
          appMain.innerHTML = `
            <main class="tab-container">
              <section id="view-review" style="flex:1;display:flex;flex-direction:column;"></section>
              <section id="view-capture" class="hidden" style="flex:1;display:flex;flex-direction:column;"></section>
              <section id="view-library" class="hidden" style="flex:1;display:flex;flex-direction:column;"></section>
              <section id="view-settings" class="hidden" style="flex:1;display:flex;flex-direction:column;"></section>
            </main>

            <nav class="bottom-nav" aria-label="主导航">
              <div class="bottom-nav-grid">
                <button type="button" class="nav-item active" data-tab="review">${ICONS.review}<span>今日复习</span></button>
                <button type="button" class="nav-item" data-tab="capture">${ICONS.capture}<span>速记录入</span></button>
                <button type="button" class="nav-item" data-tab="library">${ICONS.library}<span>卡片库</span></button>
                <button type="button" class="nav-item" data-tab="settings">${ICONS.settings}<span>设置</span></button>
              </div>
            </nav>
          `;

          appMain.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
          });

          state.appMounted = true;
        }

        // Show calm initial loading placeholder inside review view
        document.getElementById('view-review').innerHTML = `
          <div class="done-stage">
            <div class="done-icon anim-pulse">${ICONS.sun}</div>
            <p style="font-size:13px;color:var(--ink-muted);margin:0;">正在同步你的私有记忆素材库...</p>
          </div>
        `;

        try {
          await fetchAllUserData();
          buildTodayQueue();
          renderReviewTab();
          renderCaptureTab();
          renderLibraryTab();
          renderSettingsTab();
          switchTab('review');
        } catch (err) {
          showToast(err.message || '云端数据加载失败');
          document.getElementById('view-review').innerHTML = `
            <div class="done-stage">
              <p style="font-size:14px;color:var(--terra);margin:0 0 14px;">${esc(err.message || '云端连接异常')}</p>
              <button type="button" class="btn btn-primary btn-sm" id="btn-retry-load">重新同步</button>
            </div>
          `;
          document.getElementById('btn-retry-load').onclick = () => enterAuthenticatedApp();
        }
      }

      function switchTab(tab) {
        state.activeTab = tab;
        ['review', 'capture', 'library', 'settings'].forEach(name => {
          const el = document.getElementById(`view-${name}`);
          if (el) el.classList.toggle('hidden', name !== tab);
        });
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
        });
        if (tab === 'review') renderReviewTab();
        if (tab === 'library') renderLibraryTab();
        if (tab === 'settings') renderSettingsTab();
      }

      // =====================================================================
      // 10. TAB 1: 今日复习 (REVIEW)
      // =====================================================================
      function getCurrentReviewCard() {
        const id = state.review.queue[state.review.index];
        return id ? state.cards.find(c => c.id === id) || null : null;
      }

      function renderReviewHeader(currentNum, totalNum) {
        const pct = totalNum > 0 ? Math.min(100, Math.round((currentNum / totalNum) * 100)) : 100;
        const label = totalNum > 0
          ? (currentNum <= totalNum ? `今日第 ${currentNum} / ${totalNum} 张` : `今日 ${totalNum} / ${totalNum} 已完成`)
          : '今日暂无待保鲜卡片';
        const dotClass = state.syncStatus === 'syncing' ? 'syncing' : state.syncStatus === 'error' ? 'error' : '';
        const dotTxt = state.syncStatus === 'syncing' ? '同步中' : state.syncStatus === 'error' ? '待重试' : '云端已同步';

        return `
          <div class="page-header" style="margin-bottom:10px;">
            <span style="font-size:13px;font-weight:500;color:var(--ink-secondary);font-variant-numeric:tabular-nums;">${label}</span>
            <span class="sync-dot-wrap">
              <span id="sync-dot" class="sync-dot ${dotClass}"></span>
              <span id="sync-dot-text">${dotTxt}</span>
            </span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
        `;
      }

      function renderReviewTab() {
        const container = document.getElementById('view-review');
        if (!container) return;

        const total = state.review.queue.length;
        const idx = state.review.index;

        // Completed / Empty State
        if (total === 0 || idx >= total) {
          container.innerHTML = `
            ${renderReviewHeader(total, total)}
            <div class="done-stage anim-up">
              <div class="done-icon">${ICONS.sun}</div>
              <h2 style="margin:0 0 8px;font-size:18px;font-weight:600;">今日已保鲜，交给后台潜意识</h2>
              <p style="margin:0 0 26px;font-size:13px;color:var(--ink-muted);max-width:290px;line-height:1.7;">
                前台内存已留白。散步、洗澡或放空时，大脑默认模式网络会自动让已固化的素材发生跨界碰撞。
              </p>
              <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:220px;">
                <button type="button" class="btn btn-primary btn-block" id="btn-done-capture">去记一条新洞察</button>
                ${state.review.hasReservoir ? `
                  <button type="button" class="btn btn-soft btn-sm btn-block" id="btn-pull-ten" style="color:var(--ink-muted);">
                    状态正好 · 顺手再捞 10 张
                  </button>
                ` : ''}
              </div>
            </div>
          `;
          document.getElementById('btn-done-capture').onclick = () => switchTab('capture');
          const pullBtn = document.getElementById('btn-pull-ten');
          if (pullBtn) pullBtn.onclick = pullExtraTenCards;
          return;
        }

        const card = getCurrentReviewCard();
        if (!card) {
          state.review.index++;
          renderReviewTab();
          return;
        }

        // ---------------- FRONT PHASE (Pure recall, NO domain tag) ----------------
        if (state.review.phase === 'front') {
          container.innerHTML = `
            ${renderReviewHeader(idx + 1, total)}
            <div class="review-stage anim-up">
              <div class="front-card">
                <div class="clue-kicker">测试线索 · 纯复述，零绩效</div>
                <p class="clue-text">${esc(card.front_fact)}</p>
              </div>
              <div class="rating-grid">
                <button type="button" class="btn btn-terra" id="btn-rate-again">有点模糊</button>
                <button type="button" class="btn btn-primary" id="btn-rate-good">想起来了</button>
              </div>
            </div>
          `;
          document.getElementById('btn-rate-again').onclick = () => onFrontRated('again');
          document.getElementById('btn-rate-good').onclick = () => onFrontRated('good');
          return;
        }

        // ---------------- BACK PHASE (Anchor + 3 Evolution Slots + Gentle AI) ----------------
        const tags = Array.isArray(card.evolution_tags) ? card.evolution_tags : [];
        const isFull = tags.length >= 3;
        const edited = state.review.editedThisReview;
        const linkedCard = card.cross_link_id
          ? state.cards.find(c => c.id === card.cross_link_id)
          : null;

        // Build 3 fixed visual capsule slots
        let slotsHtml = '';
        for (let i = 0; i < 3; i++) {
          if (i < tags.length) {
            slotsHtml += `
              <button type="button" class="evo-capsule" data-slot="${i}" ${edited ? 'disabled' : ''}>
                <span>${esc(tags[i])}</span>
                ${edited ? '' : `<span style="opacity:0.65;display:inline-flex;">${ICONS.edit}</span>`}
              </button>
            `;
          } else {
            slotsHtml += `
              <button type="button" class="evo-slot-empty" data-add-slot="1" ${edited ? 'disabled' : ''}>
                <span>+ 空槽位 ${i + 1}</span>
              </button>
            `;
          }
        }

        let scaffoldHtml = '';
        if (state.review.scaffoldLoading) {
          scaffoldHtml = `
            <div class="scaffold-panel anim-pulse" style="font-size:12px;color:var(--ink-muted);">
              正在生成轻量化切入角度...
            </div>
          `;
        } else if (state.review.scaffoldQuestions && state.review.scaffoldQuestions.length > 0) {
          scaffoldHtml = `
            <div class="scaffold-panel anim-up">
              <div style="font-size:11px;font-weight:500;color:var(--ink-muted);">思维脚手架 · 轻触任一角度即可停手</div>
              <ul class="scaffold-list">
                ${state.review.scaffoldQuestions.map(q => `<li><span style="color:var(--sage);">·</span><span>${esc(q)}</span></li>`).join('')}
              </ul>
            </div>
          `;
        }

        container.innerHTML = `
          ${renderReviewHeader(idx + 1, total)}
          <div class="review-stage anim-up">
            <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px;">
              <!-- Dimmed Front Fact Reference -->
              <div class="card-soft" style="padding:12px 14px;">
                <p style="margin:0;font-size:13px;color:var(--ink-muted);line-height:1.65;white-space:pre-wrap;">${esc(card.front_fact)}</p>
              </div>

              <!-- Back Anchor Layer (Immutable) -->
              <div class="card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                  <span style="font-size:12px;font-weight:500;color:var(--ink-muted);">锚点层 · 最初感受</span>
                  <span class="lock-badge">${ICONS.lock} 原境锁定</span>
                </div>
                <p style="margin:0;font-size:15px;line-height:1.72;color:var(--ink);white-space:pre-wrap;">${esc(card.back_anchor)}</p>
              </div>

              <!-- Evolution Layer (3 Fixed Capsule Slots) -->
              <div class="card">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                  <span style="font-size:12px;font-weight:500;color:var(--ink-muted);">进化层 · 最新认识（限 3 槽）</span>
                  <span style="font-size:11px;color:var(--ink-muted);font-variant-numeric:tabular-nums;">${tags.length} / 3</span>
                </div>

                <div class="evo-slots-grid">${slotsHtml}</div>

                ${!edited && isFull ? `
                  <div style="margin-top:10px;">
                    <button type="button" class="btn btn-terra btn-sm" id="btn-open-compress">
                      ${ICONS.sparkle} 槽位已满 · 压缩合并新感悟
                    </button>
                  </div>
                ` : ''}

                ${edited ? `
                  <div style="margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--sage-soft);color:var(--sage);font-size:12px;line-height:1.55;">
                    微调已完成，留白给后台潜意识。
                  </div>
                ` : ''}

                <!-- On-Demand Scaffolding Trigger -->
                <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:8px;">
                  <button type="button" class="btn-ghost" id="btn-scaffold" style="margin-left:-8px;" ${state.review.scaffoldLoading ? 'disabled' : ''}>
                    ${ICONS.bulb} 要个脚手架
                  </button>
                  <span style="font-size:11px;color:var(--ink-muted);">无新感觉直接点下一张</span>
                </div>

                ${scaffoldHtml}

                ${linkedCard ? `
                  <button type="button" class="cross-shimmer" id="btn-cross-peek">
                    <span>✦ 你曾在不同领域记过一张底层相似的卡片 · 点击查看</span>
                    <span style="flex-shrink:0;display:inline-flex;">${ICONS.chevronRight}</span>
                  </button>
                ` : ''}
              </div>
            </div>

            <button type="button" class="btn btn-ink btn-block" id="btn-next-card" ${state.review.submitting ? 'disabled' : ''}>
              ${state.review.submitting ? '保存进度中...' : '下一张'}
            </button>
          </div>
        `;

        // Wire Back Phase Events
        document.getElementById('btn-next-card').onclick = onNextCard;
        document.getElementById('btn-scaffold').onclick = onRequestScaffold;

        if (!edited) {
          container.querySelectorAll('.evo-capsule').forEach(btn => {
            btn.onclick = () => openEvolutionEditModal(card, Number(btn.getAttribute('data-slot')));
          });
          container.querySelectorAll('.evo-slot-empty').forEach(btn => {
            btn.onclick = () => openEvolutionEditModal(card, null);
          });
          const compBtn = document.getElementById('btn-open-compress');
          if (compBtn) compBtn.onclick = () => openCompressModal(card);
        }

        const peekBtn = document.getElementById('btn-cross-peek');
        if (peekBtn && linkedCard) {
          peekBtn.onclick = () => openCrossDomainModal(card, linkedCard);
        }
      }

      function onFrontRated(ratingKey) {
        if (state.review.phase !== 'front') return;
        const now = Date.now();
        state.review.frontDurationMs = Math.max(80, now - (state.review.frontStartMs || now));
        state.review.backStartMs = now;
        state.review.rating = ratingKey;
        state.review.phase = 'back';
        renderReviewTab();
      }

      async function onNextCard() {
        const card = getCurrentReviewCard();
        if (!card || state.review.submitting) return;

        state.review.submitting = true;
        renderReviewTab();

        const now = Date.now();
        const backDurationMs = Math.max(80, now - (state.review.backStartMs || now));
        const R = Number(computeRetrievability(card.fsrs_state, now).toFixed(3));
        const ratingKey = state.review.rating || 'good';
        const nextFsrs = scheduleFsrsCard(card.fsrs_state, ratingKey, now);

        try {
          await updateCardInCloud(card.id, {
            fsrs_state: nextFsrs,
            due_at: nextFsrs.due
          });

          state.review.reviewedIds.add(card.id);

          // Silent Review Telemetry
          logActivitySilent('review', card.id, {
            front_ms: state.review.frontDurationMs,
            back_ms: backDurationMs,
            rating: ratingKey === 'good' ? 'good' : 'again',
            retrievability_r: R,
            queue_index: state.review.index + 1,
            edited_evolution: state.review.editedThisReview
          });

          if (state.review.scaffoldTriggered) {
            logActivitySilent('ai_usage', card.id, {
              feature: 'scaffold',
              adopted: state.review.editedThisReview
            });
          }

          state.review.index++;
          resetCardTurnState();
          renderReviewTab();
        } catch (err) {
          state.review.submitting = false;
          showToast(err.message || '保存复习进度失败，请重试');
          renderReviewTab();
        }
      }

      async function onRequestScaffold() {
        const card = getCurrentReviewCard();
        if (!card || state.review.scaffoldLoading) return;
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }

        state.review.scaffoldLoading = true;
        state.review.scaffoldTriggered = true;
        renderReviewTab();

        try {
          state.review.scaffoldQuestions = await aiFetchScaffolding(card);
        } catch (err) {
          showToast(err.message || '脚手架生成失败');
          state.review.scaffoldQuestions = [
            '这件事背后最反常识的支点是什么？',
            '换一个完全不同的领域，它还成立吗？'
          ];
        } finally {
          state.review.scaffoldLoading = false;
          renderReviewTab();
        }
      }

      // --- Evolution Micro-Edit Modal (Max 1 edit per review) ---
      function openEvolutionEditModal(card, slotIndex) {
        if (state.review.editedThisReview) return;
        const isEdit = slotIndex !== null && slotIndex !== undefined;
        const tags = Array.isArray(card.evolution_tags) ? card.evolution_tags : [];
        const currentText = isEdit ? (tags[slotIndex] || '') : '';

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <h3 style="margin:0;font-size:16px;font-weight:600;">${isEdit ? '替换或微调词条' : '填入一个进化词条'}</h3>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>
            <p style="margin:0;font-size:13px;color:var(--ink-muted);line-height:1.55;">
              像搬砖一样沉淀 1 个精炼短词或短句（建议 2–12 字），本次复习改完即止。
            </p>
            <input id="m-evo-input" class="input" type="text" maxlength="24" value="${esc(currentText)}" placeholder="例如：隐性摩擦成本" />
            <div style="display:flex;gap:10px;">
              ${isEdit ? `<button type="button" class="btn btn-soft btn-sm" id="m-evo-del" style="color:var(--ink-muted);">清空此槽</button>` : ''}
              <button type="button" class="btn btn-primary" style="flex:1;" id="m-evo-save">保存微调</button>
            </div>
          </div>
        `);

        const input = document.getElementById('m-evo-input');
        setTimeout(() => input?.focus(), 60);
        document.getElementById('m-close').onclick = closeModal;

        document.getElementById('m-evo-save').onclick = async () => {
          const val = input.value.trim();
          if (!val) {
            showToast('请输入简短词条');
            return;
          }
          const before = [...tags];
          const after = [...tags];
          if (isEdit) {
            if (after[slotIndex] === val) {
              closeModal();
              return;
            }
            after[slotIndex] = val;
          } else {
            if (after.length >= 3) {
              closeModal();
              return;
            }
            after.push(val);
          }
          await commitEvolution(card, isEdit ? 'replace' : 'add', before, after);
          closeModal();
        };

        const delBtn = document.getElementById('m-evo-del');
        if (delBtn) {
          delBtn.onclick = async () => {
            const before = [...tags];
            const after = before.filter((_, i) => i !== slotIndex);
            await commitEvolution(card, 'remove', before, after);
            closeModal();
          };
        }
      }

      // --- AI Concept Compressor Modal ---
      function openCompressModal(card) {
        if (state.review.editedThisReview) return;
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }
        const tags = card.evolution_tags || [];

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div>
                <h3 style="margin:0;font-size:16px;font-weight:600;">AI 概念压缩机</h3>
                <p style="margin:3px 0 0;font-size:12px;color:var(--ink-muted);">对抗扇形效应 · 合并提炼新词并替换旧槽位</p>
              </div>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>

            <div class="card-soft" style="display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;">
              ${tags.map((w, i) => `<span style="font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);">${i + 1}. ${esc(w)}</span>`).join('')}
            </div>

            <div>
              <label class="field-label" for="m-comp-idea">写下刚冒出的新感悟</label>
              <input id="m-comp-idea" class="input" type="text" maxlength="60" placeholder="例如：把规则定在前面比事后争吵省力..." />
            </div>

            <button type="button" class="btn btn-primary btn-block" id="m-comp-run">${ICONS.sparkle} 提炼 2 个压缩替代词</button>
            <div id="m-comp-results" class="hidden" style="display:flex;flex-direction:column;gap:8px;"></div>
          </div>
        `);

        document.getElementById('m-close').onclick = closeModal;
        const ideaInput = document.getElementById('m-comp-idea');
        const runBtn = document.getElementById('m-comp-run');
        const resBox = document.getElementById('m-comp-results');
        setTimeout(() => ideaInput?.focus(), 60);

        runBtn.onclick = async () => {
          const idea = ideaInput.value.trim();
          if (!idea) {
            showToast('请先写一句你的新想法');
            return;
          }
          runBtn.disabled = true;
          runBtn.textContent = '正在凝练语义...';
          resBox.classList.add('hidden');

          try {
            const options = await aiCompressTags(card, idea);
            if (!options.length) throw new Error('未返回压缩方案');

            resBox.innerHTML = options.map((opt, idx) => {
              const targetIdx = clamp(Number(opt.replace_index) || 0, 0, 2);
              const oldW = tags[targetIdx] || '';
              return `
                <button type="button" class="btn-sage-soft" data-opt="${idx}" style="width:100%;text-align:left;padding:12px 14px;border-radius:14px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <strong style="font-size:14px;">${esc(opt.word)}</strong>
                    <span style="font-size:11px;opacity:0.8;">替换「${esc(oldW)}」</span>
                  </div>
                  <div style="font-size:12px;color:var(--ink-secondary);">${esc(opt.reason || '')}</div>
                </button>
              `;
            }).join('');
            resBox.classList.remove('hidden');

            resBox.querySelectorAll('button[data-opt]').forEach(btn => {
              btn.onclick = async () => {
                const opt = options[Number(btn.getAttribute('data-opt'))];
                const targetIdx = clamp(Number(opt.replace_index) || 0, 0, 2);
                const before = [...tags];
                const after = [...tags];
                after[targetIdx] = String(opt.word || '').trim();
                await commitEvolution(card, 'compress', before, after);
                logActivitySilent('ai_usage', card.id, { feature: 'compress', adopted: true });
                closeModal();
              };
            });
          } catch (err) {
            showToast(err.message || '概念压缩失败');
            logActivitySilent('ai_usage', card.id, { feature: 'compress', adopted: false });
          } finally {
            runBtn.disabled = false;
            runBtn.innerHTML = `${ICONS.sparkle} 重新提炼压缩词`;
          }
        };
      }

      async function commitEvolution(card, action, before, after) {
        const reps = (card.fsrs_state?.reps || 0) + 1;
        const entry = {
          at: new Date().toISOString(),
          reps,
          action,
          before,
          after
        };
        const history = Array.isArray(card.evolution_history) ? [...card.evolution_history, entry] : [entry];

        try {
          await updateCardInCloud(card.id, {
            evolution_tags: after,
            evolution_history: history
          });
          state.review.editedThisReview = true;
          logActivitySilent('evolution', card.id, { action, reps, before, after });
          showToast('进化层已微调并同步');
          renderReviewTab();
        } catch (err) {
          showToast(err.message || '更新进化层失败');
        }
      }

            anchorEl.value = res.back_anchor;
            state.capture.domainTag = res.domain_tag;

            renderCaptureDomainPills();

            aiBtn.disabled = false;
            aiTxt.textContent = 'AI 智能拆解';
          }

        document.getElementById('btn-cap-save').onclick = async () => {
          const front = frontEl.value.trim();
          const anchor = anchorEl.value.trim();
          const initWord = evoEl.value.trim();

          if (!front) {
            showToast('请填写正面的客观事实或原话');
            return;
          }
          if (!anchor) {
            showToast('请留下一句最初的大白话感受作为锚点');
            return;
          }

          const saveBtn = document.getElementById('btn-cap-save');
          saveBtn.disabled = true;
          saveBtn.textContent = '正在锁定存入...';

          const nowIso = new Date().toISOString();
          const fsrs = createInitialFsrsState();
          const tags = initWord ? [initWord] : [];
          const history = initWord ? [{ at: nowIso, reps: 0, action: 'init', before: [], after: tags }] : [];

          try {
            const created = await insertCardToCloud({
              front_fact: front,
              back_anchor: anchor,
              evolution_tags: tags,
              evolution_history: history,
              domain_tag: state.capture.domainTag,
              fsrs_state: fsrs,
              due_at: fsrs.due,
              cross_link_id: null,
              cross_link_hint: null
            });

            if (state.capture.aiSplitUsed) {
              logActivitySilent('ai_usage', created?.id, { feature: 'split', adopted: true });
            }

            rawEl.value = '';
            frontEl.value = '';
            anchorEl.value = '';
            evoEl.value = '';
            panel.classList.add('hidden');
            state.capture.aiSplitUsed = false;

            showToast('已锁定存入云端，明天起进入保鲜曲线');
            renderLibraryTab();

            // Non-blocking background cross-domain matcher
            runSilentCrossDomainMatch(created);
          } catch (err) {
            showToast(err.message || '存入云端失败，请稍后重试');
          } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = '锁定并存入云端';
          }
        };

                        <span style="font-weight:500;">${esc((h.after || []).join(' / ') || '空白')}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}

              </div>
            </div>
          </div>
        `);

        document.getElementById('m-close').onclick = closeModal;

        document.getElementById('m-domain-sel').onchange = async (e) => {

            updateLibraryListOnly();
          } catch (err) {

          }
        };

        document.getElementById('m-btn-del').onclick = () => {

            const existingIds = new Set(state.cards.map(c => c.id));

            for (const c of parsed.cards) {
              if (!c.front_fact || !c.back_anchor) continue;
              if (c.id && existingIds.has(c.id)) continue; // Avoid duplicates
              await insertCardToCloud({
                front_fact: c.front_fact,
                back_anchor: c.back_anchor,
                evolution_tags: Array.isArray(c.evolution_tags) ? c.evolution_tags.slice(0, 3) : [],
                evolution_history: Array.isArray(c.evolution_history) ? c.evolution_history : [],

      // --- Markdown Self-Diagnosis Report Builder ---
      function buildDiagnosisMarkdown() {
        const revLogs = state.activityLogs.filter(l => l.event_type === 'review');
        const aiLogs = state.activityLogs.filter(l => l.event_type === 'ai_usage');

        const avgFront = revLogs.length
          ? (revLogs.reduce((s, r) => s + (Number(r.payload?.front_ms) || 0), 0) / revLogs.length / 1000).toFixed(1)
          : '0.0';
        const avgBack = revLogs.length
          ? (revLogs.reduce((s, r) => s + (Number(r.payload?.back_ms) || 0), 0) / revLogs.length / 1000).toFixed(1)
          : '0.0';
        const againTotal = revLogs.filter(r => r.payload?.rating === 'again').length;

        // Fatigue curve by queue index bucket
        const buckets = { '1-10': [], '11-25': [], '26-50': [], '51+': [] };
        revLogs.forEach(r => {
          const i = Number(r.payload?.queue_index) || 1;
          if (i <= 10) buckets['1-10'].push(r);
          else if (i <= 25) buckets['11-25'].push(r);
          else if (i <= 50) buckets['26-50'].push(r);
          else buckets['51+'].push(r);
        });
        const fatigueLines = Object.entries(buckets).map(([k, arr]) => {
          if (!arr.length) return `- 第 ${k} 张：暂无样本`;
          const s = (arr.reduce((sum, x) => sum + (Number(x.payload?.front_ms) || 0), 0) / arr.length / 1000).toFixed(1);
          const fuzz = Math.round((arr.filter(x => x.payload?.rating === 'again').length / arr.length) * 100);
          return `- 第 ${k} 张（${arr.length} 次）：平均正面耗时 ${s}s，模糊率 ${fuzz}%`;
        });

        // Stubborn cards
        const againByCard = {};
        revLogs.forEach(r => {
          if (r.payload?.rating === 'again' && r.card_id) {
            againByCard[r.card_id] = (againByCard[r.card_id] || 0) + 1;
          }
        });
        const stubborn = Object.entries(againByCard)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 6)
          .map(([cid, cnt]) => {
            const c = state.cards.find(x => x.id === cid);
            return c ? `- 「${c.front_fact.slice(0, 42)}」（模糊 ${cnt} 次 · ${c.domain_tag}）` : null;
          })
          .filter(Boolean);

        // AI feature adoption
        const aiMap = {};
        aiLogs.forEach(l => {
          const f = l.payload?.feature || 'unknown';
          if (!aiMap[f]) aiMap[f] = { total: 0, adopted: 0 };
          aiMap[f].total++;
          if (l.payload?.adopted) aiMap[f].adopted++;
        });
        const aiLines = Object.entries(aiMap).map(([k, v]) =>
          `- ${k}：触发 ${v.total} 次，采纳 ${v.adopted} 次（${Math.round((v.adopted / v.total) * 100)}%）`
        );

        // Recent evolution snapshots
        const evoLines = [];
        state.cards.forEach(c => {
          (c.evolution_history || []).forEach(h => {
            evoLines.push(`- [${formatTime(h.at)}] (${c.domain_tag}) 第 ${h.reps || 0} 次接触：${(h.before || []).join('/') || '无'} → ${(h.after || []).join('/') || '无'}`);
          });
        });

        return `# 内化 · 轻量认知助手 自我诊断报告原料

> 请作为认知科学与效率产品顾问，分析以下真实行为日志并给出改进建议：
> 1. 根据队列位置的耗时与模糊率，判断我当前的每日软上限（${state.prefs.daily_limit} 张）是否存在疲劳拐点？
> 2. 顽固卡片有哪些共同的表述问题？该如何改进录入拆解规则？
> 3. 结合进化快照与 AI 采纳率，我的脚手架和概念压缩提示词应如何迭代？

## 一、基础数据概览
- 卡片总量：${state.cards.length} 张
- 累计复习记录：${revLogs.length} 次（其中有点模糊 ${againTotal} 次）
- 平均正面提取耗时：${avgFront} 秒
- 平均背面微加工耗时：${avgBack} 秒

## 二、队列位置与疲劳拐点
${fatigueLines.join('\n')}

## 三、高频模糊卡片（顽固卡）
${stubborn.length ? stubborn.join('\n') : '- 暂无明显顽固卡片'}

## 四、AI 能力有效率
${aiLines.length ? aiLines.join('\n') : '- 暂无 AI 调用记录'}

## 五、近期认知进化轨迹（最近 25 条）
${evoLines.length ? evoLines.slice(-25).join('\n') : '- 暂无进化层记录'}
`;
      }

      function openDiagnosisReportModal() {
        const md = buildDiagnosisMarkdown();
        openModal(`
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <h3 style="margin:0;font-size:16px;font-weight:600;">AI 体检报告原料</h3>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>
            <p style="margin:0;font-size:12px;color:var(--ink-muted);">复制后直接发给任意大模型，即可帮你诊断疲劳拐点与迭代方向。</p>
            <textarea readonly rows="10" class="textarea" style="font-family:var(--font-mono);font-size:12px;">${esc(md)}</textarea>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <button type="button" class="btn btn-primary btn-sm" id="m-md-copy">一键复制全文</button>
              <button type="button" class="btn btn-soft btn-sm" id="m-md-dl">下载 .md 文件</button>
            </div>
          </div>
        `);
        document.getElementById('m-close').onclick = closeModal;
        document.getElementById('m-md-copy').onclick = () => copyText(md);
        document.getElementById('m-md-dl').onclick = () => {
          downloadFile(md, `内化AI体检报告-${new Date().toISOString().slice(0, 10)}.md`, 'text/markdown;charset=utf-8');
          showToast('体检报告已开始下载');
        };
      }

      // =====================================================================
      // 14. APPLICATION BOOTSTRAP
      // =====================================================================
      async function boot() {
        applyTheme(state.prefs.theme);
        initPwaAssets();
        initAuthWallEvents();

        // Backdrop click to close modal
        document.getElementById('modal-root').addEventListener('click', (e) => {
          if (e.target.id === 'modal-root') closeModal();
        });

        // Verify persisted Supabase session on load
        if (state.session?.access_token && state.sbConfig.url && state.sbConfig.anonKey) {
          try {
            await ensureValidAccessToken(false);
            await enterAuthenticatedApp();
          } catch (_) {
            showAuthWall('上次登录已过期，请重新输入密码验证。');
          }
        } else {
          showAuthWall();
        }
      }

      boot();
    })();
  </script>
