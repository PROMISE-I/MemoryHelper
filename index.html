            <div class="card" style="padding:13px 14px;border-color:${node.next_micro_step ? 'var(--sage-border)' : 'var(--border)'};">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
                <span style="font-size:12px;font-weight:600;color:var(--sage);">15 分钟最小抓手</span>
                <button type="button" class="btn-ghost btn-xs" id="nd-edit-step" style="padding:2px 6px;min-height:24px;">编辑</button>
              </div>
              ${node.next_micro_step ? `
                <p style="margin:0 0 10px;font-size:14px;color:var(--ink);line-height:1.55;">${esc(node.next_micro_step)}</p>
                <button type="button" class="btn btn-primary btn-xs btn-block" id="nd-done-step">✓ 完成这一步，记入推进史</button>
              ` : `
                <p style="margin:0;font-size:12px;color:var(--ink-muted);">暂未设定下一步，可点「编辑」或让下方内阁草拟一个 15 分钟小抓手。</p>
              `}
            </div>

            <!-- AI Ming Cabinet Helpers (+ Collapsed Custom Prompt) -->
            <div style="display:flex;flex-direction:column;gap:8px;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <button type="button" class="btn btn-sage-soft btn-xs" id="nd-ai-split" ${drawerState.loadingSplit ? 'disabled' : ''}>
                  ${ICONS.sparkle} <span>${drawerState.loadingSplit ? '票拟中...' : '具象化 / 拆子问题'}</span>
                </button>
                <button type="button" class="btn btn-soft btn-xs" id="nd-ai-step" ${drawerState.loadingStep ? 'disabled' : ''}>
                  ${ICONS.bulb} <span>${drawerState.loadingStep ? '构思中...' : '给 15 分钟抓手'}</span>
                </button>
              </div>
              ${renderAiExtraPromptHtml('nd-ai-extra', '例如：偏实验设计拆解 / 给我一个不依赖他人的第一步（优先按此执行）', drawerState.extraPrompt || '')}
            </div>

            ${aiSplitPreviewHtml}
            ${aiStepPreviewHtml}

            <!-- Quick Append Analysis History -->
            <div class="card-soft" style="padding:12px 13px;display:flex;flex-direction:column;gap:8px;">
              <label class="field-label" style="margin:0;" for="nd-hist-input">追加本次推进 / 思考痕迹</label>
              <textarea id="nd-hist-input" class="textarea" rows="2" placeholder="记下你刚试了什么、卡在哪、或想到什么新切口..."></textarea>
              <button type="button" class="btn btn-ink btn-xs btn-block" id="nd-hist-add">追加到历史脉络</button>
            </div>

            <!-- Reverse-Chronological Full Analysis History -->
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                <span style="font-size:12px;font-weight:500;color:var(--ink-muted);">完整分析与推进历史 (${history.length})</span>
                <button type="button" class="btn-ghost btn-xs" id="nd-add-child" style="padding:2px 6px;min-height:24px;">+ 手动加子节点</button>
              </div>
              ${history.length === 0 ? `<p style="margin:0;font-size:12px;color:var(--ink-muted);">暂无历史记录</p>` : `
                <div class="timeline">
                  ${history.slice().reverse().map(h => `
                    <div class="timeline-item">
                      <span class="timeline-dot"></span>
                      <div style="font-size:11px;color:var(--ink-muted);margin-bottom:2px;">${formatTime(h.at)}${h.source ? ` · ${esc(h.source)}` : ''}</div>
                      <div style="font-size:13px;color:var(--ink-secondary);line-height:1.58;white-space:pre-wrap;">${esc(h.content)}</div>
                      ${h.next_step ? `<div style="font-size:11px;color:var(--sage);margin-top:3px;">抓手：${esc(h.next_step)}</div>` : ''}
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            ${children.length ? `
              <div style="padding-top:8px;border-top:1px solid var(--border-soft);">
                <div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px;">下属子节点 (${children.length})</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                  ${children.map(ch => `
                    <button type="button" class="preset-chip" data-open-child="${esc(ch.id)}" style="display:inline-flex;align-items:center;gap:5px;">
                      <span class="status-dot ${ch.status || 'fuzzy'}"></span><span>${esc(ch.short_title)}</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Collapsible Node Meta Edit & Delete -->
            <details class="card-soft">
              <summary class="settings-collapse-summary" style="font-size:12px;color:var(--ink-muted);">
                <span>修改短语、所属树、父子关系或删除</span>
                <span>${ICONS.chevronRight}</span>
              </summary>
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px;">
                <input id="nd-meta-title" class="input" style="font-size:13px;" value="${esc(node.short_title)}" placeholder="折叠短语" />
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <input id="nd-meta-tree" class="input" style="font-size:13px;" value="${esc(node.tree_label)}" placeholder="所属领域树" ${node.is_meta ? 'disabled' : ''} />
                  <input id="nd-meta-parallel" class="input" style="font-size:13px;" value="${esc(node.parallel_group || '')}" placeholder="并列组名（选填）" />
                </div>
                ${!node.is_meta ? `
                  <select id="nd-meta-parent" class="select" style="font-size:13px;">
                    <option value="">独立 / 根节点</option>
                    ${otherNodes.map(n => `<option value="${esc(n.id)}" ${n.id === node.parent_id ? 'selected' : ''}>挂于：${esc(n.tree_label)} · ${esc(n.short_title.slice(0, 12))}</option>`).join('')}
                  </select>
                ` : ''}
                <textarea id="nd-meta-raw" class="textarea" rows="2" placeholder="原始问题表述">${esc(node.raw_problem)}</textarea>
                <div style="display:flex;gap:8px;">
                  <button type="button" class="btn btn-primary btn-xs" style="flex:1;" id="nd-meta-save">保存修改</button>
                  ${!node.is_meta ? `<button type="button" class="btn btn-terra btn-xs" id="nd-meta-del">删除节点</button>` : ''}
                </div>
              </div>
            </details>
          </div>
        `);

        document.getElementById('m-close').onclick = closeModal;

        // Status switcher
        document.querySelectorAll('[data-nd-status]').forEach(btn => {
          btn.onclick = () => {
            const nextSt = btn.getAttribute('data-nd-status');
            if (nextSt === node.status) return;
            const prevSt = node.status;
            const updated = updateForestNodeOptimistic(node.id, { status: nextSt, last_touched_at: new Date().toISOString() });
            trackActivity('forest', 'node_status_change', node.id, { from: prevSt, to: nextSt });
            scheduleIgnitionPreheat();
            renderForestTab();
            openForestNodeDrawer(updated || node, { ...drawerState, _trackedOpen: true });
            showToast(`状态已更新为「${FOREST_STATUS_META[nextSt].label}」`);
          };
        });

        // Revert refined problem
        const clearRefBtn = document.getElementById('nd-clear-refined');
        if (clearRefBtn) {
          clearRefBtn.onclick = () => {
            const updated = updateForestNodeOptimistic(node.id, { refined_problem: null });
            renderForestTab();
            openForestNodeDrawer(updated || node, { ...drawerState, _trackedOpen: true });
            showToast('已退回原始模糊表述');
          };
        }

        // Inline Edit 15-min micro step
        document.getElementById('nd-edit-step').onclick = () => {
          const next = window.prompt('设定 15 分钟内可启动的最小抓手：', node.next_micro_step || '');
          if (next === null) return;
          const updated = updateForestNodeOptimistic(node.id, {
            next_micro_step: next.trim() || null,
            last_touched_at: new Date().toISOString()
          });
          scheduleIgnitionPreheat();
          renderForestTab();
          openForestNodeDrawer(updated || node, { ...drawerState, _trackedOpen: true });
        };

        // Complete micro step
        const doneStepBtn = document.getElementById('nd-done-step');
        if (doneStepBtn) {
          doneStepBtn.onclick = () => {
            const nowIso = new Date().toISOString();
            const nextHist = [...history, {
              at: nowIso,
              source: '完成抓手',
              content: `✓ 完成 15 分钟抓手：${node.next_micro_step}`,
              next_step: ''
            }];
            const updated = updateForestNodeOptimistic(node.id, {
              analysis_history: nextHist,
              next_micro_step: null,
              status: node.status === 'fuzzy' ? 'active' : node.status,
              last_touched_at: nowIso
            });
            trackActivity('forest', 'micro_step_done', node.id, { step: node.next_micro_step });
            scheduleIgnitionPreheat();
            renderForestTab();
            openForestNodeDrawer(updated || node, { ...drawerState, _trackedOpen: true });
            showToast('已完成这一步，真实战果已写入推进史');
          };
        }

        // Append analysis history
        document.getElementById('nd-hist-add').onclick = () => {
          const val = document.getElementById('nd-hist-input').value.trim();
          if (!val) {
            showToast('先写一句推进记录或观察');
            return;
          }
          const nowIso = new Date().toISOString();
          const nextHist = [...history, { at: nowIso, source: '推进记录', content: val, next_step: '' }];
          const updated = updateForestNodeOptimistic(node.id, {
            analysis_history: nextHist,
            status: node.status === 'fuzzy' ? 'active' : node.status,
            last_touched_at: nowIso
          });
          trackActivity('forest', 'analysis_append', node.id, { length: val.length });
          scheduleIgnitionPreheat();
          renderForestTab();
          openForestNodeDrawer(updated || node, { ...drawerState, _trackedOpen: true });
          showToast('已记入历史脉络');
        };

        // Quick Add Child
        document.getElementById('nd-add-child').onclick = () => openNewForestNodeModal(node.tree_label, node.id);

        // Open child node
        document.querySelectorAll('[data-open-child]').forEach(btn => {
          btn.onclick = () => {
            const child = state.forestNodes.find(n => n.id === btn.getAttribute('data-open-child'));
            if (child) openForestNodeDrawer(child);
          };
        });

        // AI Helper 1: 具象化 / 拆子问题
        document.getElementById('nd-ai-split').onclick = async () => {
          if (!isAiConfigured()) { promptConfigureAi(); return; }
          const extra = readAiExtraPrompt('nd-ai-extra', drawerState.extraPrompt || '');
          openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, extraPrompt: extra, loadingSplit: true, splitDraft: null });
          try {
            const draft = await aiRefineAndSplitForestNode(node, extra);
            draft.sub_nodes = (draft.sub_nodes || []).map(sn => ({ ...sn, selected: true }));
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, extraPrompt: extra, loadingSplit: false, splitDraft: draft, splitEditMode: false });
          } catch (err) {
            showToast(err.message || '内阁拆解失败', 4000);
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, extraPrompt: extra, loadingSplit: false });
          }
        };

        // Wire AI Split 3-button 批红
        if (splitDraft) {
          document.getElementById('nd-split-close').onclick = () =>
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, splitDraft: null, splitEditMode: false });

          document.querySelectorAll('[data-sp-sub]').forEach(cb => {
            cb.onchange = () => {
              const i = Number(cb.getAttribute('data-sp-sub'));
              if (splitDraft.sub_nodes[i]) splitDraft.sub_nodes[i].selected = cb.checked;
            };
          });

          document.getElementById('nd-sp-edit').onclick = () =>
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, splitDraft, splitEditMode: !splitEditMode });

          document.getElementById('nd-sp-keep').onclick = () => {
            trackActivity('cabinet', 'ai_decision', node.id, { feature: 'forest_split', decision: 'kept_raw' });
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, splitDraft: null, splitEditMode: false });
            showToast('已保留原样，暂不改写');
          };

          document.getElementById('nd-sp-approve').onclick = () => {
            const nextTitle = (splitEditMode ? document.getElementById('nd-sp-title')?.value.trim() : splitDraft.short_title) || node.short_title;
            const nextRefined = (splitEditMode ? document.getElementById('nd-sp-refined')?.value.trim() : splitDraft.refined_problem) || null;
            const nextStep = (splitEditMode ? document.getElementById('nd-sp-step')?.value.trim() : splitDraft.next_micro_step) || node.next_micro_step;

            const updated = updateForestNodeOptimistic(node.id, {
              short_title: nextTitle,
              short_title_ai_draft: splitDraft.short_title,
              refined_problem: nextRefined,
              next_micro_step: nextStep,
              status: node.status === 'fuzzy' ? 'active' : node.status,
              last_touched_at: new Date().toISOString()
            });

            let createdKids = 0;
            const chosenSubs = (splitDraft.sub_nodes || []).filter(sn => sn.selected !== false);
            chosenSubs.forEach(sn => {
              createForestNodeOptimistic({
                tree_label: node.tree_label,
                parent_id: sn.is_parallel ? (node.parent_id || null) : node.id,
                parallel_group: sn.is_parallel ? `${node.short_title.slice(0, 8)}·并列` : null,
                short_title: sn.short_title,
                raw_problem: sn.raw_problem,
                status: 'fuzzy',
                analysis_history: [{ at: new Date().toISOString(), source: '内阁拆解', content: sn.raw_problem, next_step: '' }]
              });
              createdKids++;
            });

            trackActivity('cabinet', 'ai_decision', node.id, {
              feature: 'forest_split',
              decision: splitEditMode ? 'edited' : 'approved',
              created_children: createdKids
            });
            scheduleIgnitionPreheat();
            renderForestTab();
            openForestNodeDrawer(updated || node, { ...drawerState, _trackedOpen: true, splitDraft: null, splitEditMode: false });
            showToast(`已批红生效${createdKids ? `，并挂载 ${createdKids} 个新节点` : ''}`);
          };
        }

        // AI Helper 2: 给 15 分钟下一步
        document.getElementById('nd-ai-step').onclick = async () => {
          if (!isAiConfigured()) { promptConfigureAi(); return; }
          const extra = readAiExtraPrompt('nd-ai-extra', drawerState.extraPrompt || '');
          openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, extraPrompt: extra, loadingStep: true, stepDraft: null });
          try {
            const draft = await aiSuggestForestNextStep(node, extra);
            if (!draft.next_micro_step) throw new Error('未能生成下一步抓手');
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, extraPrompt: extra, loadingStep: false, stepDraft: draft, stepEditMode: false });
          } catch (err) {
            showToast(err.message || '生成抓手失败', 4000);
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, extraPrompt: extra, loadingStep: false });
          }
        };

        if (stepDraft) {
          document.getElementById('nd-st-edit').onclick = () =>
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, stepDraft, stepEditMode: !stepEditMode });

          document.getElementById('nd-st-keep').onclick = () => {
            trackActivity('cabinet', 'ai_decision', node.id, { feature: 'forest_next_step', decision: 'kept_raw' });
            openForestNodeDrawer(node, { ...drawerState, _trackedOpen: true, stepDraft: null, stepEditMode: false });
            showToast('已保留原样');
          };

          document.getElementById('nd-st-approve').onclick = () => {
            const val = (stepEditMode ? document.getElementById('nd-st-input')?.value.trim() : stepDraft.next_micro_step) || '';
            if (!val) { showToast('抓手不能为空'); return; }
            const updated = updateForestNodeOptimistic(node.id, {
              next_micro_step: val,
              status: node.status === 'fuzzy' ? 'active' : node.status,
              last_touched_at: new Date().toISOString()
            });
            trackActivity('cabinet', 'ai_decision', node.id, { feature: 'forest_next_step', decision: stepEditMode ? 'edited' : 'approved' });
            scheduleIgnitionPreheat();
            renderForestTab();
            openForestNodeDrawer(updated || node, { ...drawerState, _trackedOpen: true, stepDraft: null, stepEditMode: false });
            showToast('已采纳为 15 分钟抓手');
          };
        }

        // Meta Save & 2-Step Delete
        document.getElementById('nd-meta-save').onclick = () => {
          const newTitle = document.getElementById('nd-meta-title').value.trim();
          const newRaw = document.getElementById('nd-meta-raw').value.trim();
          const newTree = document.getElementById('nd-meta-tree').value.trim() || node.tree_label;
          const newParallel = document.getElementById('nd-meta-parallel').value.trim() || null;
          const parentSel = document.getElementById('nd-meta-parent');
          const newParent = parentSel ? (parentSel.value || null) : node.parent_id;

          if (!newTitle || !newRaw) {
            showToast('短语和原始表述不能为空');
            return;
          }
          const nodeMap = new Map(state.forestNodes.map(n => [n.id, n]));
          if (!node.is_meta && wouldCreateForestCycle(node.id, newParent, nodeMap)) {
            showToast('不能将节点挂到自己的子节点下');
            return;
          }

          const updated = updateForestNodeOptimistic(node.id, {
            short_title: newTitle,
            raw_problem: newRaw,
            tree_label: node.is_meta ? node.tree_label : newTree,
            parallel_group: newParallel,
            parent_id: node.is_meta ? null : newParent
          });
          scheduleIgnitionPreheat();
          renderForestTab();
          openForestNodeDrawer(updated || node, { ...drawerState, _trackedOpen: true });
          showToast('节点信息已保存');
        };

        const delBtn = document.getElementById('nd-meta-del');
        if (delBtn) {
          let confirmArmed = false;
          delBtn.onclick = () => {
            if (!confirmArmed) {
              confirmArmed = true;
              delBtn.textContent = '确认永久删除';
              return;
            }
            deleteForestNodeOptimistic(node.id);
            scheduleIgnitionPreheat();
            closeModal();
            renderForestTab();
            showToast('节点已移除（其子节点已保留为独立节点）');
          };
        }
      }

      // =====================================================================
      // 12C. SPACE 4: 内阁大议 (PERIODIC CROSS-ENGINE COLLISION INBOX)
      // =====================================================================
      const PROPOSAL_META = {
        card_to_forest: { label: '以保鲜解破局', badgeClass: '' },
        forest_to_anchor: { label: '以破局喂渴望', badgeClass: 'terra' },
        forest_to_card: { label: '以破局沉淀保鲜', badgeClass: '' }
      };

      function renderCabinetTab() {
        const container = document.getElementById('view-cabinet');
        if (!container) return;

        const pendingList = state.cabinetProposals.filter(p => p.status === 'pending');
        const resolvedList = state.cabinetProposals.filter(p => p.status !== 'pending');
        const currentList = state.cabinet.tab === 'resolved' ? resolvedList : pendingList;

        const cardsHtml = currentList.length === 0 ? `
          <div class="done-stage anim-up" style="padding:36px 16px;">
            <div class="done-icon">${ICONS.cabinet}</div>
            <h2 style="margin:0 0 8px;font-size:17px;font-weight:600;">${state.cabinet.tab === 'pending' ? '当前暂无待批红提案' : '暂无已处理记录'}</h2>
            <p style="margin:0;font-size:13px;color:var(--ink-muted);max-width:280px;line-height:1.65;">
              ${state.cabinet.tab === 'pending'
                ? '两大引擎平时各自安静运转。积攒一些素材后，点上方「发起定期碰撞」，内阁会两阶段粗筛，宁缺毋滥呈递 3–5 条高价值提案。'
                : '批红采纳或驳回的提案都会保留在这里备查。'}
            </p>
          </div>
        ` : currentList.map(prop => {
          const meta = PROPOSAL_META[prop.proposal_type] || PROPOSAL_META.card_to_forest;
          const d = prop.draft_payload || {};
          const isEditing = state.cabinet.editingId === prop.id && prop.status === 'pending';

          const refNodeId = (prop.target_refs || []).find(r => r.kind === 'forest_node' || r.kind === 'forest_tree')?.id
            || (prop.source_refs || []).find(r => r.kind === 'forest_node')?.id;
          const refNode = refNodeId ? state.forestNodes.find(n => n.id === refNodeId) : null;
          const refCardId = (prop.source_refs || []).find(r => r.kind === 'card')?.id;
          const refCard = refCardId ? state.cards.find(c => c.id === refCardId) : null;

          let bodyHtml = '';
          if (prop.proposal_type === 'card_to_forest') {
            bodyHtml = isEditing ? `
              <div style="display:flex;flex-direction:column;gap:8px;">
                <textarea id="cab-ed-entry" class="textarea" rows="3" placeholder="追加到森林节点历史分析的内容">${esc(d.analysis_entry || '')}</textarea>
                <input id="cab-ed-step" class="input" style="font-size:13px;" value="${esc(d.suggested_next_step || '')}" placeholder="可选：更新为 15 分钟抓手" />
              </div>
            ` : `
              <div class="card-soft" style="padding:11px 12px;font-size:13px;line-height:1.6;color:var(--ink-secondary);">
                ${refCard ? `<div style="font-size:11px;color:var(--ink-muted);margin-bottom:4px;">来源保鲜卡：${esc(refCard.front_fact.slice(0, 36))}</div>` : ''}
                ${refNode ? `<div style="font-size:11px;color:var(--sage);margin-bottom:6px;">目标节点：${esc(refNode.tree_label)} · ${esc(refNode.short_title)}</div>` : ''}
                <div>${esc(d.analysis_entry || prop.summary)}</div>
                ${d.suggested_next_step ? `<div style="font-size:12px;color:var(--sage);margin-top:6px;">建议抓手：${esc(d.suggested_next_step)}</div>` : ''}
              </div>
            `;
          } else if (prop.proposal_type === 'forest_to_anchor') {
            bodyHtml = isEditing ? `
              <div style="display:flex;flex-direction:column;gap:8px;">
                <textarea id="cab-ed-anc-raw" class="textarea" rows="2" placeholder="大白话渴望画面">${esc(d.anchor_raw_text || '')}</textarea>
                <input id="cab-ed-anc-pol" class="input" style="font-size:13px;" value="${esc(d.anchor_polished_text || '')}" placeholder="可选凝练版" />
                <input id="cab-ed-anc-tags" class="input" style="font-size:13px;" value="${esc((d.scene_tags || []).join(', '))}" placeholder="适用时段/场景标签" />
              </div>
            ` : `
              <div class="card-soft" style="padding:11px 12px;font-size:13px;line-height:1.6;">
                ${refNode ? `<div style="font-size:11px;color:var(--ink-muted);margin-bottom:5px;">挂到树顶：${esc(refNode.tree_label)} · ${esc(refNode.short_title)}</div>` : ''}
                <div style="color:var(--ink);font-weight:500;">${esc(d.anchor_raw_text || prop.summary)}</div>
                ${d.anchor_polished_text && d.anchor_polished_text !== d.anchor_raw_text ? `<div style="font-size:12px;color:var(--ink-muted);margin-top:4px;">凝练票拟：${esc(d.anchor_polished_text)}</div>` : ''}
              </div>
            `;
          } else {
            // forest_to_card
            bodyHtml = isEditing ? `
              <div style="display:flex;flex-direction:column;gap:8px;">
                <textarea id="cab-ed-front" class="textarea" rows="2" placeholder="事实 / 实战场景">${esc(d.front_fact || '')}</textarea>
                <textarea id="cab-ed-anchor" class="textarea" rows="2" placeholder="最初大白话体悟">${esc(d.back_anchor || '')}</textarea>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <input id="cab-ed-evo" class="input" style="font-size:13px;" value="${esc((d.evolution_tags || []).join('、'))}" placeholder="初始认识（最多3条，顿号分隔）" />
                  <input id="cab-ed-dom" class="input" style="font-size:13px;" value="${esc(d.domain_tag || '')}" placeholder="底层学科大类" />
                </div>
              </div>
            ` : `
              <div class="card-soft" style="padding:11px 12px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:5px;">
                ${refNode ? `<div style="font-size:11px;color:var(--ink-muted);">来自森林节点：${esc(refNode.tree_label)} · ${esc(refNode.short_title)}</div>` : ''}
                <div><strong style="color:var(--ink);">事实：</strong>${esc(d.front_fact || '')}</div>
                <div style="color:var(--ink-muted);"><strong>感受：</strong>${esc(d.back_anchor || '')}</div>
                <div style="font-size:12px;color:var(--sage);">认识：${esc((d.evolution_tags || []).join(' / ') || '待孵化')} · 类别：${esc(normalizeDomainLabel(d.domain_tag))}</div>
              </div>
            `;
          }

          const statusLabelMap = { approved: '已批红采纳', edited: '微调后采纳', rejected: '已驳回留待日后' };

          return `
            <div class="proposal-card anim-up">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
                <span class="proposal-badge ${meta.badgeClass}">${meta.label}</span>
                <span style="font-size:11px;color:var(--ink-muted);">${formatTime(prop.created_at).slice(5)}</span>
              </div>
              <p style="margin:0 0 10px;font-size:14px;font-weight:500;line-height:1.55;color:var(--ink);">${esc(prop.summary)}</p>
              ${bodyHtml}
              ${prop.status === 'pending' ? `
                <div class="tri-approve-grid">
                  <button type="button" class="btn btn-primary btn-xs" data-cab-approve="${esc(prop.id)}">${isEditing ? '确认微调生效' : '采纳生效'}</button>
                  <button type="button" class="btn btn-soft btn-xs" data-cab-edit="${esc(prop.id)}">${isEditing ? '取消微调' : '微调后采纳'}</button>
                  <button type="button" class="btn btn-ghost btn-xs tri-approve-keep" data-cab-reject="${esc(prop.id)}">保留原样，驳回留待日后</button>
                </div>
              ` : `
                <div style="margin-top:10px;font-size:12px;color:var(--ink-muted);display:flex;justify-content:space-between;">
                  <span>${statusLabelMap[prop.status] || prop.status}</span>
                  <span>${prop.resolved_at ? formatTime(prop.resolved_at).slice(5) : ''}</span>
                </div>
              `}
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="page-header" style="margin-bottom:10px;">
            <div>
              <h1 class="page-title">内阁大议</h1>
              <p class="page-sub">手动发起两阶段跨引擎碰撞 · 宁缺毋滥</p>
            </div>
            <button type="button" class="btn btn-primary btn-xs" id="btn-cab-run" ${state.cabinet.running ? 'disabled' : ''}>
              ${ICONS.sparkle} <span>${state.cabinet.running ? '两阶段碰撞中...' : '发起定期碰撞'}</span>
            </button>
          </div>

          <div style="margin-bottom:12px;">
            ${renderAiExtraPromptHtml('cab-col-extra', '例如：重点看看科研节点与心理学卡片间有没有反常识火花（优先按此碰撞）', state.cabinet.extraPrompt)}
          </div>

          <div class="seg-bar" role="tablist">
            <button type="button" class="seg-btn ${state.cabinet.tab === 'pending' ? 'active' : ''}" data-cab-tab="pending">待批红 (${pendingList.length})</button>
            <button type="button" class="seg-btn ${state.cabinet.tab === 'resolved' ? 'active' : ''}" data-cab-tab="resolved">已处理 (${resolvedList.length})</button>
          </div>

          <div style="flex:1;">${cardsHtml}</div>
        `;

        const extraEl = document.getElementById('cab-col-extra');
        if (extraEl) extraEl.oninput = () => { state.cabinet.extraPrompt = extraEl.value; };

        container.querySelectorAll('[data-cab-tab]').forEach(btn => {
          btn.onclick = () => {
            state.cabinet.tab = btn.getAttribute('data-cab-tab');
            state.cabinet.editingId = null;
            renderCabinetTab();
          };
        });

        document.getElementById('btn-cab-run').onclick = async () => {
          if (!isAiConfigured()) { promptConfigureAi(); return; }
          const customPrompt = readAiExtraPrompt('cab-col-extra', state.cabinet.extraPrompt);
          state.cabinet.extraPrompt = customPrompt;
          state.cabinet.running = true;
          renderCabinetTab();
          try {
            const list = await aiRunPeriodicCollision(customPrompt);
            state.cabinet.tab = 'pending';
            showToast(list.length > 0
              ? `内阁大议呈递了 ${list.length} 条高价值碰撞提案`
              : '两阶段粗筛后暂无强火花，宁缺毋滥未强凑提案');
          } catch (err) {
            showToast(err.message || '定期碰撞调用失败', 4200);
          } finally {
            state.cabinet.running = false;
            renderCabinetTab();
          }
        };

        container.querySelectorAll('[data-cab-edit]').forEach(btn => {
          btn.onclick = () => {
            const pid = btn.getAttribute('data-cab-edit');
            state.cabinet.editingId = state.cabinet.editingId === pid ? null : pid;
            renderCabinetTab();
          };
        });

        container.querySelectorAll('[data-cab-reject]').forEach(btn => {
          btn.onclick = () => {
            const pid = btn.getAttribute('data-cab-reject');
            const prop = state.cabinetProposals.find(p => p.id === pid);
            if (!prop) return;
            updateCabinetProposalOptimistic(pid, { status: 'rejected', resolved_at: new Date().toISOString() });
            trackActivity('cabinet', 'collision_decision', pid, { proposal_type: prop.proposal_type, decision: 'rejected' });
            trackActivity('cabinet', 'ai_decision', pid, { feature: 'collision_' + prop.proposal_type, decision: 'rejected' });
            state.cabinet.editingId = null;
            renderCabinetTab();
            showToast('已驳回留待日后');
          };
        });

        container.querySelectorAll('[data-cab-approve]').forEach(btn => {
          btn.onclick = async () => {
            const pid = btn.getAttribute('data-cab-approve');
            const prop = state.cabinetProposals.find(p => p.id === pid);
            if (!prop) return;
            const isEditing = state.cabinet.editingId === pid;
            const d = prop.draft_payload || {};
            const nowIso = new Date().toISOString();

            const refNodeId = (prop.target_refs || []).find(r => r.kind === 'forest_node' || r.kind === 'forest_tree')?.id
              || (prop.source_refs || []).find(r => r.kind === 'forest_node')?.id;
            const refNode = refNodeId ? state.forestNodes.find(n => n.id === refNodeId) : null;

            btn.disabled = true;
            try {
              if (prop.proposal_type === 'card_to_forest') {
                if (!refNode) throw new Error('对应的森林节点已不存在');
                const entry = (isEditing ? document.getElementById('cab-ed-entry')?.value.trim() : d.analysis_entry) || prop.summary;
                const nextStep = (isEditing ? document.getElementById('cab-ed-step')?.value.trim() : d.suggested_next_step) || '';
                const nextHist = [...(refNode.analysis_history || []), {
                  at: nowIso,
                  source: '内阁碰撞',
                  content: entry,
                  next_step: nextStep
                }];
                const patch = {
                  analysis_history: nextHist,
                  status: refNode.status === 'fuzzy' ? 'active' : refNode.status,
                  last_touched_at: nowIso
                };
                if (nextStep) patch.next_micro_step = nextStep;
                updateForestNodeOptimistic(refNode.id, patch);
                scheduleIgnitionPreheat();
                showToast(`已写入森林节点「${refNode.short_title}」`);
              } else if (prop.proposal_type === 'forest_to_anchor') {
                const rawAnc = (isEditing ? document.getElementById('cab-ed-anc-raw')?.value.trim() : d.anchor_raw_text) || prop.summary;
                const polAnc = (isEditing ? document.getElementById('cab-ed-anc-pol')?.value.trim() : d.anchor_polished_text) || null;
                const tagsStr = isEditing ? (document.getElementById('cab-ed-anc-tags')?.value || '') : (d.scene_tags || []).join(',');
                const scenes = tagsStr.split(/[,，、\s]+/).filter(Boolean).slice(0, 4);
                const created = createDesireAnchorOptimistic({
                  raw_text: rawAnc,
                  polished_text: polAnc,
                  use_polished: Boolean(polAnc && polAnc !== rawAnc),
                  scene_tags: scenes.length ? scenes : [getTimeSlotLabel()],
                  linked_node_id: refNode?.id || null
                });
                state.ignition.currentAnchorId = created.id;
                showToast('已批红存入渴望锚点池，并挂到对应问题树');
              } else {
                // forest_to_card
                const frontFact = (isEditing ? document.getElementById('cab-ed-front')?.value.trim() : d.front_fact) || '';
                const backAnchor = (isEditing ? document.getElementById('cab-ed-anchor')?.value.trim() : d.back_anchor) || '';
                if (!frontFact || !backAnchor) throw new Error('事实与最初感受不能为空，请点微调补充');
                const evoRaw = isEditing
                  ? (document.getElementById('cab-ed-evo')?.value || '').split(/[,，、/]+/).map(x => x.trim()).filter(Boolean).slice(0, 3)
                  : (Array.isArray(d.evolution_tags) ? d.evolution_tags.filter(Boolean).slice(0, 3) : []);
                const domTag = normalizeDomainLabel(isEditing ? document.getElementById('cab-ed-dom')?.value : d.domain_tag);
                const fsrs = createInitialFsrsState();
                const createdCard = await insertCardToCloud({
                  front_fact: frontFact,
                  back_anchor: backAnchor,
                  evolution_tags: evoRaw,
                  evolution_history: evoRaw.length ? [{ at: nowIso, reps: 0, action: 'cabinet_init', before: [], after: evoRaw }] : [],
                  domain_tag: domTag,
                  source_forest_node_id: refNode?.id || null,
                  fsrs_state: fsrs,
                  due_at: fsrs.due,
                  cross_link_id: null,
                  cross_link_hint: null
                });
                if (createdCard) runSilentCrossDomainMatch(createdCard);
                buildTodayQueue();
                renderLibraryTab();
                showToast('已沉淀为标准保鲜卡，明天进入复习队列');
              }

              const decision = isEditing ? 'edited' : 'approved';
              updateCabinetProposalOptimistic(pid, { status: decision, resolved_at: nowIso });
              trackActivity('cabinet', 'collision_decision', pid, { proposal_type: prop.proposal_type, decision });
              trackActivity('cabinet', 'ai_decision', pid, { feature: 'collision_' + prop.proposal_type, decision });
              state.cabinet.editingId = null;
              renderCabinetTab();
            } catch (err) {
              showToast(err.message || '批红应用失败', 3800);
              btn.disabled = false;
            }
          };
        });
      }

      // =====================================================================
      // 13. TAB 3: 卡片库 (DYNAMIC DOMAINS + AI REORGANIZE + EVOLUTION VIEW + EDIT/DELETE)
      // =====================================================================
      function renderLibraryTab() {
        const container = document.getElementById('view-library');
        if (!container) return;

        const existingSearch = document.getElementById('lib-search-input');
        if (!existingSearch) {
          container.innerHTML = `
            <div class="page-header">
              <h1 class="page-title">卡片库</h1>
              <button type="button" class="btn btn-sage-soft btn-xs" id="btn-ai-reorg">
                ${ICONS.sparkle} <span>整理归类</span>
              </button>
            </div>

            <div class="seg-bar" role="tablist">
              <button type="button" class="seg-btn ${state.library.viewMode === 'domain' ? 'active' : ''}" data-lib-mode="domain">按分类</button>
              <button type="button" class="seg-btn ${state.library.viewMode === 'evolution' ? 'active' : ''}" data-lib-mode="evolution">按认识</button>
            </div>

            <div style="position:relative;margin-bottom:12px;">
              <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-muted);display:inline-flex;pointer-events:none;">${ICONS.search}</span>
              <input id="lib-search-input" class="input" type="search" style="padding-left:38px;" placeholder="搜事实、感受、认识或分类" value="${esc(state.library.search)}" />
            </div>

            <div id="lib-pills" class="pills-scroll"></div>
            <div id="lib-meta-row" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;font-size:12px;color:var(--ink-muted);"></div>
            <div id="lib-list" style="flex:1;"></div>
          `;

          document.getElementById('lib-search-input').addEventListener('input', (e) => {
            state.library.search = e.target.value;
            updateLibraryListOnly();
          });

          container.querySelectorAll('[data-lib-mode]').forEach(btn => {
            btn.onclick = () => {
              state.library.viewMode = btn.getAttribute('data-lib-mode');
              container.querySelectorAll('[data-lib-mode]').forEach(b => b.classList.toggle('active', b === btn));
              updateLibraryListOnly();
            };
          });

          document.getElementById('btn-ai-reorg').onclick = openReorganizeDomainsModal;
        }

        updateLibraryListOnly();
      }

      function updateLibraryListOnly() {
        const pillsEl = document.getElementById('lib-pills');
        const metaEl = document.getElementById('lib-meta-row');
        const listEl = document.getElementById('lib-list');
        if (!pillsEl || !listEl || !metaEl) return;

        const q = state.library.search.trim().toLowerCase();

        if (state.library.viewMode === 'evolution') {
          pillsEl.classList.add('hidden');
          renderEvolutionAggregationView(listEl, metaEl, q);
          return;
        }

        pillsEl.classList.remove('hidden');

        // Build purely dynamic categories from actual cards (NO hardcoded default domains!)
        const dynDomains = getExistingDomains(true);
        const validNames = new Set(['全部', ...dynDomains.map(d => d.name)]);
        if (!validNames.has(state.library.domain)) {
          state.library.domain = '全部';
        }

        const pillItems = [
          { name: '全部', count: state.cards.length },
          ...dynDomains
        ];

        pillsEl.innerHTML = pillItems.map(item => `
          <button type="button" class="pill ${item.name === state.library.domain ? 'active' : ''}" data-dom="${esc(item.name)}">
            ${esc(item.name)} <span style="opacity:0.65;font-size:11px;margin-left:2px;">${item.count}</span>
          </button>
        `).join('');

        pillsEl.querySelectorAll('button').forEach(btn => {
          btn.onclick = () => {
            state.library.domain = btn.getAttribute('data-dom');
            updateLibraryListOnly();
          };
        });

        const filtered = state.cards.filter(c => {
          const dom = normalizeDomainLabel(c.domain_tag);
          if (state.library.domain !== '全部' && dom !== state.library.domain) return false;
          if (!q) return true;
          return (
            String(c.front_fact || '').toLowerCase().includes(q) ||
            String(c.back_anchor || '').toLowerCase().includes(q) ||
            dom.toLowerCase().includes(q) ||
            (c.evolution_tags || []).some(w => String(w).toLowerCase().includes(q))
          );
        });

        metaEl.innerHTML = `
          <span>共 ${filtered.length} 张卡片</span>
          <span>${dynDomains.length ? `${dynDomains.length} 个自然类别` : '暂无类别'}</span>
        `;

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div style="text-align:center;padding:48px 16px;font-size:13px;color:var(--ink-muted);">
              ${state.cards.length === 0 ? '素材库还是空的，去「速记录入」记下第一条洞察吧' : '没有匹配的卡片'}
            </div>
          `;
          return;
        }

        // Use <div role="button"> instead of <button> so mobile vertical touch scrolling is 100% silky!
        listEl.innerHTML = filtered.map(c => {
          const tags = Array.isArray(c.evolution_tags) ? c.evolution_tags : [];
          const dom = normalizeDomainLabel(c.domain_tag);
          return `
            <div role="button" tabindex="0" class="lib-card" data-cid="${esc(c.id)}">
              <p class="line-clamp-2" style="margin:0 0 10px;font-size:14px;line-height:1.6;color:var(--ink);">${esc(c.front_fact)}</p>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                  ${tags.length
                    ? tags.map(w => `<span style="font-size:11px;padding:3px 9px;border-radius:999px;background:var(--sage-soft);color:var(--sage);">${esc(w)}</span>`).join('')
                    : `<span style="font-size:11px;color:var(--ink-muted);opacity:0.75;">待孵化词条</span>`
                  }
                </div>
                <span style="font-size:11px;color:var(--ink-muted);flex-shrink:0;">${esc(dom)}</span>
              </div>
            </div>
          `;
        }).join('');

        listEl.querySelectorAll('.lib-card').forEach(el => {
          el.onclick = () => {
            const card = state.cards.find(x => x.id === el.getAttribute('data-cid'));
            if (card) openCardDetailModal(card);
          };
        });
      }

      function renderEvolutionAggregationView(listEl, metaEl, q) {
        const tagMap = new Map();
        for (const c of state.cards) {
          const tags = Array.isArray(c.evolution_tags) ? c.evolution_tags : [];
          for (const raw of tags) {
            const t = String(raw || '').trim();
            if (!t) continue;
            if (q && !t.toLowerCase().includes(q) && !String(c.front_fact || '').toLowerCase().includes(q)) continue;
            if (!tagMap.has(t)) tagMap.set(t, []);
            tagMap.get(t).push(c);
          }
        }

        const groups = Array.from(tagMap.entries())
          .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'zh-CN'));

        metaEl.innerHTML = `
          <span>已沉淀 ${groups.length} 个进化词条</span>
          <span>按跨卡聚合度排序</span>
        `;

        if (groups.length === 0) {
          listEl.innerHTML = `
            <div style="text-align:center;padding:48px 16px;font-size:13px;color:var(--ink-muted);line-height:1.7;">
              ${q ? '没有匹配的进化词条' : '复习中沉淀出进化词条后，这里会自动把不同领域长出的同一条底层规律聚在一起。'}
            </div>
          `;
          return;
        }

        listEl.innerHTML = groups.map(([tagName, cards]) => {
          const domains = Array.from(new Set(cards.map(c => normalizeDomainLabel(c.domain_tag))));
          return `
            <div class="tag-cloud-card">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;">
                <span style="font-size:14px;font-weight:600;color:var(--sage);"># ${esc(tagName)}</span>
                <span style="font-size:11px;color:var(--ink-muted);">${cards.length} 张 · ${esc(domains.join(' / '))}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${cards.map(c => `
                  <div role="button" tabindex="0" class="card-soft evo-group-card" data-cid="${esc(c.id)}" style="padding:10px 12px;cursor:pointer;touch-action:pan-y;">
                    <div class="line-clamp-2" style="font-size:13px;color:var(--ink);line-height:1.55;">${esc(c.front_fact)}</div>
                    <div style="font-size:11px;color:var(--ink-muted);margin-top:4px;">${esc(normalizeDomainLabel(c.domain_tag))}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('');

        listEl.querySelectorAll('.evo-group-card').forEach(el => {
          el.onclick = () => {
            const card = state.cards.find(x => x.id === el.getAttribute('data-cid'));
            if (card) openCardDetailModal(card);
          };
        });
      }

      // --- AI Re-Categorize Library Modal (Preview before apply!) ---
      function openReorganizeDomainsModal() {
        if (state.cards.length === 0) {
          showToast('卡片库还是空的，先记几张卡片再来整理吧');
          return;
        }
        if (!isAiConfigured()) {
          promptConfigureAi();
          return;
        }

        openModal(`
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div>
                <h3 style="margin:0;font-size:16px;font-weight:600;">AI 整理已有卡片类别</h3>
                <p style="margin:3px 0 0;font-size:12px;color:var(--ink-muted);">按你的最新理解（进化词条）重新提炼并归类</p>
              </div>
              <button type="button" class="btn-ghost" id="m-close">${ICONS.close}</button>
            </div>

            <div class="card-soft" style="font-size:13px;color:var(--ink-secondary);line-height:1.65;">
              AI 会通读当前 <strong>${state.cards.length} 张</strong> 卡片的最新认识、事实与最初感受，穿透表层话题、按底层学科与机制提炼精炼大类，预览确认后再写回云端。
            </div>

            ${renderAiExtraPromptHtml('reorg-ai-extra', '例如：严格按心理学、社会学、经济学等基础学科归类，控制在 5 类以内（优先按此整理）')}

            <div id="reorg-preview-box" class="hidden" style="display:flex;flex-direction:column;gap:12px;"></div>
            <div id="reorg-err-box" class="inline-notice terra hidden"></div>

            <div id="reorg-action-row" style="display:flex;gap:10px;">
              <button type="button" class="btn btn-primary btn-block" id="btn-reorg-run">
                ${ICONS.sparkle} 开始智能分析归类
              </button>
            </div>
          </div>
        `);

        document.getElementById('m-close').onclick = closeModal;
        const previewBox = document.getElementById('reorg-preview-box');
        const errBox = document.getElementById('reorg-err-box');
        const actionRow = document.getElementById('reorg-action-row');

        let latestPlan = null;

        async function runAnalysis() {
          const customPrompt = readAiExtraPrompt('reorg-ai-extra');
          errBox.classList.add('hidden');
          previewBox.classList.add('hidden');
          actionRow.innerHTML = `<button type="button" class="btn btn-primary btn-block" disabled>正在通读 ${state.cards.length} 张卡片并重排类别...</button>`;

          try {
            const { categories, assignmentMap } = await aiReorganizeLibraryDomains(state.cards, customPrompt);
            if (assignmentMap.size === 0) {
              throw new Error('AI 未返回有效的归类方案，请重试');
            }

            const changes = [];
            const catCounts = new Map();
            for (const c of state.cards) {
              const oldDom = normalizeDomainLabel(c.domain_tag);
              const newDom = assignmentMap.get(c.id) || oldDom;
              catCounts.set(newDom, (catCounts.get(newDom) || 0) + 1);
              if (newDom !== oldDom) {
                changes.push({ card: c, oldDom, newDom });
              }
            }

            latestPlan = { categories, changes };

            const summaryChips = Array.from(catCounts.entries())
              .sort((a, b) => b[1] - a[1])
              .map(([name, cnt]) => `<span style="font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:500;">${esc(name)} (${cnt})</span>`)
              .join('');

            const diffListHtml = changes.length === 0
              ? `<div class="inline-notice sage">所有卡片的类别都已经非常贴合最新理解，无需调整。</div>`
              : `
                <div style="font-size:12px;color:var(--ink-muted);">以下 ${changes.length} 张卡片类别将更新：</div>
                <div style="display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px;">
                  ${changes.map(ch => `
                    <div class="card-soft" style="padding:10px 12px;">
                      <div class="line-clamp-2" style="font-size:13px;color:var(--ink);margin-bottom:5px;">${esc(ch.card.front_fact)}</div>
                      <div style="font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                        <span style="color:var(--ink-muted);text-decoration:line-through;">${esc(ch.oldDom)}</span>
                        <span style="color:var(--sage);">→</span>
                        <span style="color:var(--sage);font-weight:600;">${esc(ch.newDom)}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `;

            previewBox.innerHTML = `
              <div>
                <div style="font-size:12px;color:var(--ink-muted);margin-bottom:8px;">AI 提炼的新类别体系：</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;">${summaryChips}</div>
              </div>
              ${diffListHtml}
            `;
            previewBox.classList.remove('hidden');

            if (changes.length === 0) {
              actionRow.innerHTML = `
                <button type="button" class="btn btn-soft" style="flex:1;" id="btn-reorg-again">重新分析</button>
                <button type="button" class="btn btn-primary" style="flex:1;" id="btn-reorg-close-ok">完成</button>
              `;
              document.getElementById('btn-reorg-again').onclick = runAnalysis;
              document.getElementById('btn-reorg-close-ok').onclick = closeModal;
            } else {
              actionRow.innerHTML = `
                <button type="button" class="btn btn-soft" style="flex:1;" id="btn-reorg-again">重新生成</button>
                <button type="button" class="btn btn-primary" style="flex:1.4;" id="btn-reorg-apply">确认应用 (${changes.length} 张)</button>
              `;
              document.getElementById('btn-reorg-again').onclick = runAnalysis;
              document.getElementById('btn-reorg-apply').onclick = () => {
                for (const ch of latestPlan.changes) {
                  updateCardOptimistic(ch.card.id, { domain_tag: ch.newDom });
                }
                logActivityCloud('ai_usage', null, {
                  feature: 'reorganize_domains',
                  adopted: true,
                  changed_count: latestPlan.changes.length,
                  category_count: latestPlan.categories.length
                });
                state.library.domain = '全部';
                closeModal();
                updateLibraryListOnly();
                showToast(`已按最新理解重新归类 ${latestPlan.changes.length} 张卡片并后台同步`);
              };
            }
          } catch (err) {
            errBox.textContent = err.message || '智能归类分析失败';
            errBox.classList.remove('hidden');
            actionRow.innerHTML = `<button type="button" class="btn btn-primary btn-block" id="btn-reorg-run">${ICONS.sparkle} 重试智能归类</button>`;
            document.getElementById('btn-reorg-run').onclick = runAnalysis;
          }
        }

        document.getElementById('btn-reorg-run').onclick = runAnalysis;
      }

      // =====================================================================
      // 14. SETTINGS & OBSERVER ANALYSIS LAB (ZERO ANXIETY + 6-MODULE TELEMETRY)
      // =====================================================================
      function filterLogsByRange(rangeKey = state.lab.range) {
        const now = Date.now();
        const cutoff = rangeKey === '7d'
          ? now - 7 * MS_PER_DAY
          : rangeKey === '30d'
            ? now - 30 * MS_PER_DAY
            : 0;
        return state.activityLogs.filter(l => {
          if (!l || l._undone) return false;
          if (!cutoff) return true;
          const t = l.created_at ? new Date(l.created_at).getTime() : now;
          return Number.isNaN(t) ? true : t >= cutoff;
        });
      }

      function computeObserverMetrics(rangeKey = state.lab.range) {
        const logs = filterLogsByRange(rangeKey);
        const capDur = (ms) => Math.min(180000, Math.max(0, Number(ms) || 0));

        // 1. Time-of-day distribution across all 6 modules
        const slots = { morning: 0, daytime: 0, evening: 0 };
        const modCounts = { ignition: 0, capture: 0, forest: 0, preserve: 0, cabinet: 0, system: 0 };
        logs.forEach(l => {
          const mod = normalizeLogModule(l);
          if (Object.prototype.hasOwnProperty.call(modCounts, mod)) modCounts[mod]++;
          const slot = l.payload?.time_slot || (l.created_at ? getCurrentTimeSlot(new Date(l.created_at)) : 'daytime');
          if (Object.prototype.hasOwnProperty.call(slots, slot)) slots[slot]++;
        });
        const totalSlot = Math.max(1, slots.morning + slots.daytime + slots.evening);

        // 2. Ignition & Follow-up
        const ignViews = logs.filter(l => l.event_type === 'ignition_view').length;
        const ignSwitches = logs.filter(l => l.event_type === 'anchor_switch').length;
        const ignFollowups = logs.filter(l => l.event_type === 'ignition_followup').length;
        const ignStepClicks = logs.filter(l => l.event_type === 'step_click').length;

        // 3. Capture & Triage
        const capSubmits = logs.filter(l => l.event_type === 'capture_submit').length;
        const capStashes = logs.filter(l => l.event_type === 'capture_stash').length;
        const capDecisions = logs.filter(l => l.event_type === 'capture_triage_decision');
        const capTargetCounts = { anchor: 0, forest: 0, card: 0 };
        capDecisions.forEach(l => {
          const ft = l.payload?.final_target;
          if (Object.prototype.hasOwnProperty.call(capTargetCounts, ft)) capTargetCounts[ft]++;
        });

        // 4. Forest Status & Quiet Nodes (>14 days untouched, neutral observer lens)
        const now = Date.now();
        const nonMetaNodes = state.forestNodes.filter(n => !n.is_meta);
        const forestFuzzy = nonMetaNodes.filter(n => n.status === 'fuzzy').length;
        const forestActive = nonMetaNodes.filter(n => n.status === 'active').length;
        const forestSolved = nonMetaNodes.filter(n => n.status === 'solved').length;
        const quietNodes = nonMetaNodes
          .filter(n => n.status !== 'solved')
          .map(n => {
            const lastMs = n.last_touched_at ? new Date(n.last_touched_at).getTime() : now;
            const quietDays = Math.max(0, Math.floor((now - lastMs) / MS_PER_DAY));
            return { node: n, quietDays };
          })
          .filter(x => x.quietDays >= 14)
          .sort((a, b) => b.quietDays - a.quietDays)
          .slice(0, 5);
        const forestStepsDone = logs.filter(l => l.event_type === 'micro_step_done').length;
        const forestAppends = logs.filter(l => l.event_type === 'analysis_append').length;

        // 5. Daily Preservation Fluency & Fatigue
        const revLogs = logs.filter(l => l.event_type === 'review');
        const avgFront = revLogs.length
          ? (revLogs.reduce((s, r) => s + capDur(r.payload?.front_ms), 0) / revLogs.length / 1000).toFixed(1)
          : '0.0';
        const avgBack = revLogs.length
          ? (revLogs.reduce((s, r) => s + capDur(r.payload?.back_ms), 0) / revLogs.length / 1000).toFixed(1)
          : '0.0';
        const againTotal = revLogs.filter(r => r.payload?.rating === 'again').length;
        const fuzzRate = revLogs.length ? Math.round((againTotal / revLogs.length) * 100) : 0;
        const extraTenClicks = logs.filter(l => l.event_type === 'extra_10_click').length;

        // 6. Ming Cabinet AI Approval Distribution
        const aiDecisionLogs = logs.filter(l => l.event_type === 'ai_decision');
        const aiDecisions = { approved: 0, edited: 0, kept_raw: 0, rejected: 0 };
        aiDecisionLogs.forEach(l => {
          const dec = l.payload?.decision;
          if (Object.prototype.hasOwnProperty.call(aiDecisions, dec)) aiDecisions[dec]++;
        });
        const aiUsageLogs = logs.filter(l => l.event_type === 'ai_usage' || l.event_type === 'ai_trigger');

        return {
          rangeKey,
          logs,
          slots,
          totalSlot,
          modCounts,
          ignViews,
          ignSwitches,
          ignFollowups,
          ignStepClicks,
          capSubmits,
          capStashes,
          capTargetCounts,
          forestFuzzy,
          forestActive,
          forestSolved,
          quietNodes,
          forestStepsDone,
          forestAppends,
          revLogs,
          avgFront,
          avgBack,
          againTotal,
          fuzzRate,
          extraTenClicks,
          aiDecisions,
          aiUsageLogs
        };

          showToast('2.0 完整存档已下载，可存入网盘兜底');
        };

        // Idempotent 1.0 + 2.0 JSON Import (Preserves UUIDs, zero duplicates)
        document.getElementById('input-import-json').onchange = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            const parsed = JSON.parse(await file.text());
            if (!Array.isArray(parsed.cards) && !Array.isArray(parsed.forest_nodes)) {
              throw new Error('存档格式不正确');
            }

            showToast('正在将存档恢复至云端...');
            const existingIds = new Set(state.cards.map(c => c.id));
            const existingFingerprints = new Set(state.cards.map(c => `${c.front_fact}||${c.back_anchor}`));
            const oldToNewId = new Map();
            const pendingCrossLinks = [];
            let importedCards = 0;

            for (const c of (parsed.cards || [])) {
              if (!c.front_fact || !c.back_anchor) continue;
              const fp = `${c.front_fact}||${c.back_anchor}`;
              if ((c.id && existingIds.has(c.id)) || existingFingerprints.has(fp)) {
                if (c.id) oldToNewId.set(c.id, c.id);
                continue;
              }
              const payload = {
                front_fact: c.front_fact,
                back_anchor: c.back_anchor,
                evolution_tags: Array.isArray(c.evolution_tags) ? c.evolution_tags.slice(0, 3) : [],
                evolution_history: Array.isArray(c.evolution_history) ? c.evolution_history : [],
                domain_tag: normalizeDomainLabel(c.domain_tag),
                source_forest_node_id: c.source_forest_node_id || null,
                fsrs_state: c.fsrs_state || createInitialFsrsState(),
                due_at: c.due_at || createInitialFsrsState().due,
                cross_link_id: null,
                cross_link_hint: c.cross_link_hint || null
              };
              if (isValidUuid(c.id)) payload.id = c.id;
              const created = await insertCardToCloud(payload);
              if (created?.id) {
                existingIds.add(created.id);
                existingFingerprints.add(fp);
                if (c.id) oldToNewId.set(c.id, created.id);
                if (c.cross_link_id) {
                  pendingCrossLinks.push({ cardId: created.id, targetOldId: c.cross_link_id, hint: c.cross_link_hint || null });
                }
                importedCards++;
              }
            }

            for (const link of pendingCrossLinks) {
              const targetId = oldToNewId.get(link.targetOldId) || (existingIds.has(link.targetOldId) ? link.targetOldId : null);
              if (targetId && targetId !== link.cardId) {
                updateCardOptimistic(link.cardId, { cross_link_id: targetId, cross_link_hint: link.hint });
              }
            }

            // Restore 2.0 Forest Nodes
            let importedNodes = 0;
            const existingNodeIds = new Set(state.forestNodes.map(n => n.id));
            for (const n of (parsed.forest_nodes || [])) {
              if (!n.short_title || existingNodeIds.has(n.id)) continue;
              const row = { ...n, user_id: currentUserId(), id: isValidUuid(n.id) ? n.id : (crypto.randomUUID ? crypto.randomUUID() : makeClientId()) };
              state.forestNodes.push(row);
              existingNodeIds.add(row.id);
              enqueueSyncOp({ type: 'upsert_table', table: 'forest_nodes', row });
              importedNodes++;
            }

            // Restore 2.0 Desire Anchors
            let importedAnchors = 0;
            const existingAncIds = new Set(state.desireAnchors.map(a => a.id));
            for (const a of (parsed.desire_anchors || [])) {
              if (!a.raw_text || existingAncIds.has(a.id)) continue;
              const row = { ...a, user_id: currentUserId(), id: isValidUuid(a.id) ? a.id : (crypto.randomUUID ? crypto.randomUUID() : makeClientId()) };
              state.desireAnchors.push(row);
              existingAncIds.add(row.id);
              enqueueSyncOp({ type: 'upsert_table', table: 'desire_anchors', row });
              importedAnchors++;
            }

            // Restore 2.0 Cabinet Proposals
            const existingPropIds = new Set(state.cabinetProposals.map(p => p.id));
            for (const p of (parsed.cabinet_proposals || [])) {
              if (!p.summary || existingPropIds.has(p.id)) continue;
              const row = { ...p, user_id: currentUserId(), id: isValidUuid(p.id) ? p.id : (crypto.randomUUID ? crypto.randomUUID() : makeClientId()) };
              state.cabinetProposals.push(row);
              existingPropIds.add(row.id);
              enqueueSyncOp({ type: 'upsert_table', table: 'cabinet_proposals', row });
            }

            // Restore missing cloud activity_logs
            let importedLogs = 0;
            if (Array.isArray(parsed.activity_logs) && parsed.activity_logs.length > 0) {
              const existingLogKeys = new Set(state.activityLogs.map(l => l.id || `${l.created_at}|${l.event_type}|${l.card_id || l.entity_id}`));
              for (const l of parsed.activity_logs.slice(0, 1500)) {
                const key = l.id || `${l.created_at}|${l.event_type}|${l.card_id || l.entity_id}`;
                if (existingLogKeys.has(key)) continue;
                const mappedId = l.card_id ? (oldToNewId.get(l.card_id) || (existingIds.has(l.card_id) ? l.card_id : null)) : (l.entity_id || null);
                trackActivity(normalizeLogModule(l), l.event_type || 'review', mappedId, l.payload || {}, l.duration_ms || null, false);
                existingLogKeys.add(key);
                importedLogs++;
              }
            }

            if (parsed.prefs) {
              state.prefs = {
                ...state.prefs,
                ...parsed.prefs,
                day_schedule: { ...DEFAULT_DAY_SCHEDULE, ...(parsed.prefs.day_schedule || {}) }
              };
              applyTheme(state.prefs.theme);
              enqueueSyncOp({ type: 'save_prefs' });
            }

            persistUserCache();
            updateCabinetBadgeDot();
            buildTodayQueue();
            renderSettingsTab();
            renderLibraryTab();
            showToast(`恢复完成：卡片 +${importedCards}、节点 +${importedNodes}、渴望 +${importedAnchors}` + (importedLogs ? `、日志 +${importedLogs}` : ''));
          } catch (err) {
            showToast(err.message || '存档解析或导入失败', 3800);
          } finally {
            e.target.value = '';
          }
        };

        document.getElementById('btn-logout').onclick = sbLogout;
      }

      // --- 2.0 Full-Chain 6-Module AI System Diagnosis Package (Markdown + JSON) ---
      function buildDiagnosisPackageData(rangeKey = state.lab.range) {
        const m = computeObserverMetrics(rangeKey);
        const capDur = (ms) => Math.min(180000, Math.max(0, Number(ms) || 0));

        const buckets = { '1-10': [], '11-25': [], '26-50': [], '51+': [] };
        m.revLogs.forEach(r => {
          const i = Number(r.payload?.queue_index) || 1;
          if (i <= 10) buckets['1-10'].push(r);
          else if (i <= 25) buckets['11-25'].push(r);
          else if (i <= 50) buckets['26-50'].push(r);
          else buckets['51+'].push(r);
        });

        const fatigueSummary = Object.entries(buckets).map(([range, arr]) => ({
          range,
          count: arr.length,
          avg_front_sec: arr.length ? Number((arr.reduce((s, x) => s + capDur(x.payload?.front_ms), 0) / arr.length / 1000).toFixed(1)) : 0,
          fuzz_pct: arr.length ? Math.round((arr.filter(x => x.payload?.rating === 'again').length / arr.length) * 100) : 0
        }));

        const stubbornCards = state.cards
          .map(c => {
            const reps = Number(c.fsrs_state?.reps) || 0;
            const lapses = Number(c.fsrs_state?.lapses) || 0;
            return { c, reps, lapses, rate: reps > 0 ? lapses / reps : 0 };
          })
          .filter(x => x.lapses >= 2)
          .sort((a, b) => b.lapses - a.lapses || b.rate - a.rate)
          .slice(0, 6);

        const topAnchors = [...state.desireAnchors]
          .sort((a, b) => (Number(b.ignite_score) || 1) - (Number(a.ignite_score) || 1))
          .slice(0, 5);

        return {
          exported_at: new Date().toISOString(),
          range: rangeKey,
          prefs: {
            daily_limit: state.prefs.daily_limit,
            mix_backlog: state.prefs.mix_backlog,
            day_schedule: state.prefs.day_schedule
          },
          module_counts: m.modCounts,
          time_slots: m.slots,
          ignition: {
            views: m.ignViews,
            switches: m.ignSwitches,
            followups_5m: m.ignFollowups,
            step_clicks: m.ignStepClicks,
            top_anchors: topAnchors.map(a => ({ text: a.raw_text.slice(0, 40), shown: a.shown_count || 0, score: a.ignite_score || 1 }))
          },
          capture: {
            submits: m.capSubmits,
            stashes: m.capStashes,
            final_targets: m.capTargetCounts
          },
          forest: {
            total: state.forestNodes.length,
            fuzzy: m.forestFuzzy,
            active: m.forestActive,
            solved: m.forestSolved,
            steps_done: m.forestStepsDone,
            analysis_appends: m.forestAppends,
            quiet_14d_nodes: m.quietNodes.map(q => ({ tree: q.node.tree_label, title: q.node.short_title, quiet_days: q.quietDays }))
          },
          preserve: {
            total_cards: state.cards.length,
            domain_count: getExistingDomains(false).length,
            reviews: m.revLogs.length,
            again_count: m.againTotal,
            fuzz_pct: m.fuzzRate,
            avg_front_sec: Number(m.avgFront),
            avg_back_sec: Number(m.avgBack),
            extra_10_clicks: m.extraTenClicks,
            fatigue_curve: fatigueSummary,
            stubborn_cards: stubbornCards.map(x => ({ fact: x.c.front_fact.slice(0, 48), lapses: x.lapses, reps: x.reps, domain: normalizeDomainLabel(x.c.domain_tag) }))
          },
          cabinet: {
            decisions: m.aiDecisions,
            pending_proposals: state.cabinetProposals.filter(p => p.status === 'pending').length,
            total_ai_calls: m.aiUsageLogs.length
          },
          raw_events: m.logs.slice(0, 600)
        };
      }

      function buildDiagnosisMarkdown(rangeKey = state.lab.range) {
        const pkg = buildDiagnosisPackageData(rangeKey);
        const rangeLabel = rangeKey === '7d' ? '近 7 天' : rangeKey === '30d' ? '近 30 天' : '全部历史';

        const fatigueLines = pkg.preserve.fatigue_curve.map(b =>
          b.count ? `- 第 ${b.range} 张（${b.count} 次）：平均正面耗时 ${b.avg_front_sec}s，模糊率 ${b.fuzz_pct}%` : `- 第 ${b.range} 张：暂无样本`
        );

        const stubbornLines = pkg.preserve.stubborn_cards.map(x =>
          `- 「${x.fact}」（模糊 ${x.lapses}/${x.reps} 次 · ${x.domain}）`
        );

        const quietLines = pkg.forest.quiet_14d_nodes.map(q =>
          `- [${q.tree}] ${q.title}（已静置 ${q.quiet_days} 天）`
        );

        const anchorLines = pkg.ignition.top_anchors.map(a =>
          `- 「${a.text}」（展示 ${a.shown} 次 · 点火权重 ${a.score}）`
        );

        const evoLines = [];
        state.cards.forEach(c => {
          (c.evolution_history || []).forEach(h => {
            evoLines.push(`- [${formatTime(h.at)}] (${normalizeDomainLabel(c.domain_tag)}) 第 ${h.reps || 0} 次：${(h.before || []).join('/') || '无'} → ${(h.after || []).join('/') || '无'}`);
          });
        });

        return `# 双引擎个人认知内化系统（2.0）AI 体检报告包（${rangeLabel}）

> **给分析大模型的预置诊断 Prompt**：
> 请作为认知科学、动机心理学与个人系统架构顾问，严格以冷静、无评判的「观察者视角」分析以下全链路真实使用轨迹，并提出 3–5 条具体可落地的系统调优建议：
> 1. **启动点火效率**：观察点火展示与 5 分钟内顺势进入行动的转化、以及哪些渴望锚点最有效，判断启动阻力在哪里？
> 2. **破局森林推进节奏**：结合静置 >14 天的节点与小抓手完成情况，指出哪些问题切口过大或需要降级/拆分？
> 3. **每日保鲜认知负荷**：根据队列位置的正面耗时与模糊率，判断每日上限（${pkg.prefs.daily_limit} 张）是否存在疲劳拐点？顽固卡片有哪些表述共性？
> 4. **明朝内阁 AI 票拟质量**：观察「采纳 / 微调 / 保留原样 / 驳回」比例，告诉我哪类 AI 提示词需要精调？
> 5. **双引擎协同**：早/中/晚自然活跃时段与我的时段配置是否匹配？

## 一、全链路活跃概况（${rangeLabel}）
- 活跃时段：清晨 ${pkg.time_slots.morning} 次 · 白天 ${pkg.time_slots.daytime} 次 · 晚间 ${pkg.time_slots.evening} 次
- 六大模块事件数：点火 ${pkg.module_counts.ignition} · 速记 ${pkg.module_counts.capture} · 破局森林 ${pkg.module_counts.forest} · 每日保鲜 ${pkg.module_counts.preserve} · 内阁 AI ${pkg.module_counts.cabinet} · 系统切换 ${pkg.module_counts.system}

## 二、启动点火与渴望锚点
- 点火展示 ${pkg.ignition.views} 次 · 切换渴望 ${pkg.ignition.switches} 次 · 点击 15 分钟抓手 ${pkg.ignition.step_clicks} 次 · 5 分钟内顺势进入行动 ${pkg.ignition.followups_5m} 次
- 点火权重较高的渴望锚点：
${anchorLines.length ? anchorLines.join('\n') : '- 暂无数据'}

## 三、统一速记与分流
- 速记提交 ${pkg.capture.submits} 次 · 先存暂存箱 ${pkg.capture.stashes} 次
- 最终分流去向：渴望锚点 ${pkg.capture.final_targets.anchor} · 破局森林 ${pkg.capture.final_targets.forest} · 每日保鲜 ${pkg.capture.final_targets.card}

## 四、破局森林进展（自顶向下）

## 七、近期认知进化轨迹（最近 20 条）
${evoLines.length ? evoLines.slice(-20).join('\n') : '- 暂无进化层记录'}

      }

        document.getElementById('m-md-copy').onclick = () => copyText(md);
        document.getElementById('m-md-dl').onclick = () => {
          downloadFile(md, `双引擎AI体检包-${rangeKey}-${localDateKey()}.md`, 'text/markdown;charset=utf-8');
          showToast('Markdown 体检包已开始下载');
        };
        document.getElementById('m-json-dl').onclick = () => {
          downloadFile(JSON.stringify(pkgJson, null, 2), `双引擎AI体检包-${rangeKey}-${localDateKey()}.json`, 'application/json;charset=utf-8');
          showToast('JSON 体检包已开始下载');
        };
      }

      // =====================================================================
      // 15. APPLICATION BOOTSTRAP & LIFECYCLE LISTENERS
      // =====================================================================
      async function boot() {
        applyTheme(state.prefs.theme);
        initPwaAssets();
        initAuthWallEvents();

        // Backdrop click to close modal
        document.getElementById('modal-root').addEventListener('click', (e) => {
          if (e.target.id === 'modal-root') closeModal();
        });

        // Visibility-aware timer pause/resume + silent log flush on hide
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            pauseActiveReviewTimer();
            flushLogBatchQueue();
          } else {
            resumeActiveReviewTimer();
          }
        });

        // Session end flush on pagehide
        window.addEventListener('pagehide', () => {
          if (state.appMounted && state.session?.user?.id) {
            trackActivity('system', 'session_end', null, {}, Math.max(0, Date.now() - state.sessionStartMs));
            flushLogBatchQueue();
          }
        });

        // Auto-flush offline sync & telemetry queues whenever mobile network reconnects
        window.addEventListener('online', () => {
          if (state.syncQueue.length > 0) flushSyncQueue();
          if (state.logBatchQueue.length > 0) flushLogBatchQueue();
        });

        // Verify persisted Supabase session on load
        if (state.session?.access_token && state.sbConfig.url && state.sbConfig.anonKey) {
          try {
            await ensureValidAccessToken(false);
            await enterAuthenticatedApp();
          } catch (_) {
            // If offline with cached session & data, allow seamless offline experience!
            const uid = currentUserId();
            if (!navigator.onLine && uid && loadUserCache(uid)) {
              await enterAuthenticatedApp();
            } else {
              showAuthWall('上次登录已过期，请重新输入密码验证。');
            }
          }
        } else {
          showAuthWall();
        }
      }

      boot();
    })();
  </script>
</body>
