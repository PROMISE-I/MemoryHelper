<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="内化" />
  <meta name="theme-color" content="#F8F6F1" id="meta-theme-color" />
  <title>内化 · 轻量认知助手</title>

  <!-- Inline SVG Favicon (Zero external dependency) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%234E6E5D'/%3E%3Cpath d='M19 42C19 27 31 19 45 19C45 34 34 45 19 42Z' fill='%23F8F6F1' fill-opacity='0.94'/%3E%3Ccircle cx='28' cy='34' r='3.2' fill='%234E6E5D'/%3E%3C/svg%3E" />

  <style>
    /* =====================================================================
       DESIGN TOKENS: Warm Paper Light Mode & Eye-Care Dark Mode
       ===================================================================== */
    :root {
      --bg: #F8F6F1;
      --surface: #FFFFFF;
      --surface-soft: #F1EDE5;
      --surface-subtle: #F5F2EB;
      --border: #E6E0D5;
      --border-soft: rgba(230, 224, 213, 0.65);
      --ink: #262422;
      --ink-secondary: #57524C;
      --ink-muted: #847D74;
      --sage: #4E6E5D;
      --sage-hover: #3F5B4C;
      --sage-soft: #EAF1ED;
      --sage-border: rgba(78, 110, 93, 0.22);
      --terra: #B57254;
      --terra-soft: #F8EDE7;
      --terra-border: rgba(181, 114, 84, 0.24);
      --shadow-sm: 0 2px 10px rgba(38, 36, 34, 0.04);
      --shadow-md: 0 10px 30px rgba(38, 36, 34, 0.08);
      --backdrop: rgba(22, 21, 19, 0.42);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 26px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html.dark {
      --bg: #161513;
      --surface: #21201D;
      --surface-soft: #2A2824;
      --surface-subtle: #1C1B18;
      --border: #33302B;
      --border-soft: rgba(51, 48, 43, 0.72);
      --ink: #EAE5DD;
      --ink-secondary: #C4BEB4;
      --ink-muted: #938C82;
      --sage: #7BA68F;
      --sage-hover: #8CB7A0;
      --sage-soft: #213028;
      --sage-border: rgba(123, 166, 143, 0.26);
      --terra: #D49172;
      --terra-soft: #33251E;
      --terra-border: rgba(212, 145, 114, 0.28);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 34px rgba(0, 0, 0, 0.45);
      --backdrop: rgba(0, 0, 0, 0.62);
    }

    /* =====================================================================
       BASE RESET & MOBILE-FIRST SMOOTH SCROLLING SHELL
       (Never put overflow-x: hidden or overscroll-behavior-y: none on html+body)
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      height: auto;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
      overflow-x: clip;
      touch-action: pan-y;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.modal-open {
      overflow: hidden;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      user-select: none;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.52;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
    }

    @media (min-width: 520px) {
      .shell {
        border-left: 1px solid var(--border-soft);
        border-right: 1px solid var(--border-soft);
      }
    }

    /* =====================================================================
       ANIMATIONS
       ===================================================================== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .anim-up {
      animation: fadeUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-pulse {
      animation: pulseSoft 1.5s ease-in-out infinite;
    }

    /* =====================================================================
       COMMON UI COMPONENTS
       ===================================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .input, .textarea, .select {
      width: 100%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      font-size: 16px; /* Prevents iOS Safari auto-zoom */
      line-height: 1.55;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .input:focus, .textarea:focus, .select:focus {
      border-color: var(--sage);
      background: var(--surface);
    }

    .textarea {
      resize: vertical;
      min-height: 72px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 46px;
      padding: 11px 18px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 500;
      transition: transform 0.14s ease, opacity 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      min-height: 36px;
      padding: 7px 13px;
      font-size: 13px;
      border-radius: var(--radius-sm);
    }

    .btn-xs {
      min-height: 30px;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 10px;
    }

    .btn-primary {
      background: var(--sage);
      color: #FFFFFF;
    }

    html.dark .btn-primary {
      color: #161513;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--sage-hover);
    }

    .btn-ink {
      background: var(--ink);
      color: var(--bg);
    }

    .btn-ink:hover:not(:disabled) {
      opacity: 0.92;
    }

    .btn-soft {
      background: var(--surface-soft);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-terra {
      background: var(--terra-soft);
      color: var(--terra);
      border: 1px solid var(--terra-border);
    }

    .btn-sage-soft {
      background: var(--sage-soft);
      color: var(--sage);
      border: 1px solid var(--sage-border);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-muted);
      min-height: 34px;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--ink);
      background: var(--surface-soft);
    }

    .inline-notice {
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      line-height: 1.55;
      word-break: break-word;
    }

    .inline-notice.terra {
      background: var(--terra-soft);
      border: 1px solid var(--terra-border);
      color: var(--terra);
    }

    .inline-notice.sage {
      background: var(--sage-soft);
      border: 1px solid var(--sage-border);
      color: var(--sage);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      border-radius: 999px;
      background: var(--border);
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .switch.on {
      background: var(--sage);
    }

    .switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .switch.on .switch-knob {
      transform: translateX(20px);
    }

    /* Range Slider */
    input[type="range"] {
      width: 100%;
      accent-color: var(--sage);
      cursor: pointer;
    }

    /* Segmented View Switch */
    .seg-bar {
      display: inline-flex;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 12px;
      width: 100%;
    }

    .seg-btn {
      flex: 1;
      min-height: 34px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
      transition: all 0.18s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    /* =====================================================================
       AUTH WALL (PRIVATE GATE - ONLY RENDERED WHEN LOGGED OUT)
       ===================================================================== */
    #auth-wall {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(var(--safe-top) + 24px) 22px calc(var(--safe-bottom) + 32px);
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: var(--sage);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 8px 20px rgba(78, 110, 93, 0.22);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-title {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .auth-subtitle {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--ink-muted);
    }

    .auth-error {
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      background: var(--terra-soft);
      border: 1px solid var(--terra-border);
      color: var(--terra);
      font-size: 13px;
      line-height: 1.5;
    }

    .db-config-details {
      margin-top: 16px;
      border-top: 1px solid var(--border-soft);
      padding-top: 14px;
    }

    .db-config-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--ink-muted);
      padding: 4px 2px;
    }

    .db-config-summary::-webkit-details-marker {
      display: none;
    }

    .db-status-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink-muted);
    }

    .db-status-tag.ready {
      background: var(--sage-soft);
      color: var(--sage);
    }

    /* =====================================================================
       MAIN APP LAYOUT & BOTTOM NAVIGATION
       ===================================================================== */
    #app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .tab-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 96px);
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .page-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .page-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--ink-muted);
    }

    /* Ultra-thin progress bar */
    .progress-track {
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: var(--sage);
      border-radius: 999px;
      transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Sync indicator pill */
    .sync-dot-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-muted);
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sage);
      flex-shrink: 0;
    }

    .sync-dot.syncing {
      background: var(--terra);
      animation: pulseSoft 1s infinite;
    }

    .sync-dot.error {
      background: #C45B4D;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 30;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }

    html.dark .bottom-nav {
      background: rgba(33, 32, 29, 0.94);
    }

    .bottom-nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 62px;
      padding: 0 6px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 500;
      border-radius: 14px;
      transition: color 0.18s ease;
    }

    .nav-item.active {
      color: var(--sage);
    }

    /* =====================================================================
       REVIEW TAB SPECIFICS
       ===================================================================== */
    .review-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .front-card {
      flex: 1;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 26px 22px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      cursor: pointer;
      touch-action: pan-y;
    }

    .clue-kicker {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      margin-bottom: 14px;
    }

    .clue-text {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.76;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .fact-hero-text {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.72;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .muted-body-text {
      margin: 0;
      font-size: 14px;
      line-height: 1.68;
      color: var(--ink-muted);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .active-test-box {
      margin-bottom: 14px;
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      background: var(--sage-soft);
      border: 1px solid var(--sage-border);
    }

    .rating-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 4px;
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* 3 Fixed Single-Line Slots for Evolution Layer (Calm Muted Grey) */
    .evo-slots-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .evo-capsule {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 400;
      background: var(--surface);
      color: var(--ink-secondary);
      border: 1px solid var(--border);
      transition: transform 0.14s ease, border-color 0.18s ease;
    }

    .evo-capsule.just-edited {
      border-style: dashed;
      border-color: var(--sage);
    }

    .evo-capsule:not(:disabled):active {
      transform: scale(0.99);
    }

    .evo-slot-empty {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 13px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--ink-muted);
      border: 1px dashed var(--border);
      background: transparent;
      transition: border-color 0.18s ease, color 0.18s ease;
    }

    .evo-slot-empty:hover:not(:disabled) {
      border-color: var(--sage);
      color: var(--sage);
    }

    .evo-row-readonly {
      width: 100%;
      padding: 9px 13px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink-secondary);
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      word-break: break-word;
    }

    .settings-collapse-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .settings-collapse-summary::-webkit-details-marker {
      display: none;
    }

    .cross-shimmer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: var(--radius-md);
      background: var(--terra-soft);
      border: 1px solid var(--terra-border);
      color: var(--terra);
      font-size: 12px;
      text-align: left;
      transition: opacity 0.18s ease;
    }

    .cross-shimmer:hover {
      opacity: 0.9;
    }

    .scaffold-panel {
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
    }

    .scaffold-list {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .scaffold-list li {
      font-size: 13px;
      color: var(--ink-secondary);
      display: flex;
      align-items: flex-start;
      gap: 7px;
      line-height: 1.55;
    }

    .done-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 36px 20px;
    }

    .done-icon {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      background: var(--sage-soft);
      color: var(--sage);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    /* =====================================================================
       LIBRARY TAB SPECIFICS
       ===================================================================== */
    .pills-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface);
      color: var(--ink-muted);
      border: 1px solid var(--border);
      transition: all 0.18s ease;
    }

    .pill.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .lib-card {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      touch-action: pan-y;
      transition: border-color 0.18s ease, transform 0.14s ease;
    }

    .lib-card:active {
      transform: scale(0.99);
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tag-cloud-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      touch-action: pan-y;
    }

    /* Timeline in Detail Modal */
    .timeline {
      border-left: 1.5px solid var(--border);
      padding-left: 14px;
      margin-left: 5px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-item {
      position: relative;
      font-size: 12px;
    }

    .timeline-dot {
      position: absolute;
      left: -19px;
      top: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sage);
    }

    /* =====================================================================
       SETTINGS TAB SPECIFICS
       ===================================================================== */
    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-top: 1px solid var(--border-soft);
    }

    .preset-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .preset-chip {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--surface-soft);
      color: var(--ink-secondary);
      border: 1px solid var(--border);
      transition: all 0.16s ease;
    }

    .preset-chip.active {
      background: var(--sage-soft);
      color: var(--sage);
      border-color: var(--sage-border);
      font-weight: 500;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .stat-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 10px 6px;
      text-align: center;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap .input {
      padding-right: 44px;
    }

    .pw-eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      border-radius: 8px;
    }

    /* =====================================================================
       MODAL & TOAST
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--backdrop);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 520px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      background: var(--surface);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px 18px calc(var(--safe-bottom) + 24px);
      box-shadow: var(--shadow-md);
      border-top: 1px solid var(--border);
    }

    @media (min-width: 520px) {
      .modal-sheet {
        border-radius: 24px;
        border: 1px solid var(--border);
        padding: 22px;
      }
    }

    .toast-wrap {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      width: 90%;
      max-width: 400px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast-wrap.show {
      opacity: 1;
    }

    .toast-pill {
      background: var(--ink);
      color: var(--bg);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      text-align: center;
      max-width: 100%;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- ===============================================================

        <!-- Collapsible Supabase Connection Configuration -->

    <!-- ===============================================================
         MAIN APP MOUNT POINT (Strictly empty until authenticated)
         =============================================================== -->
    <div id="app-main" class="hidden"></div>

    <!-- Modal Root -->

      <div id="modal-sheet" class="modal-sheet anim-up"></div>

      <div id="toast-pill" class="toast-pill"></div>

  </div>

  <script>
    (() => {
      'use strict';

      // =====================================================================
      // 1. CONSTANTS, STORAGE KEYS & INLINE SVG ICONS
      // =====================================================================
      const UNCLASSIFIED_LABEL = '未分类';
      const MS_PER_DAY = 86400000;
      const MIN_FIRST_REVIEW_DELAY_MS = 6 * 3600000; // At least 6 hours before first recall

      const STORAGE_KEYS = {
        SUPABASE: 'neihua_supabase_cfg_v1',
        SESSION: 'neihua_auth_session_v1',
        AI_LOCAL: 'neihua_ai_local_cfg_v1',
        THEME: 'neihua_theme_v1',
        CACHE_PREFIX: 'neihua_cache_v2_',
        SYNC_QUEUE_PREFIX: 'neihua_sync_q_v2_',

      const AI_PRESETS = [
        { id: 'openai_terra', label: 'OpenAI 主力', baseUrl: 'https://api.openai.com/v1', model: 'gpt-6.1-terra' },
        { id: 'openai_luna', label: 'OpenAI 轻量', baseUrl: 'https://api.openai.com/v1', model: 'gpt-6-luna' },

        { id: 'gemini', label: 'Gemini 兼容', baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai', model: 'gemini-2.5-flash' },
        { id: 'siliconflow', label: '硅基流动', baseUrl: 'https://api.siliconflow.cn/v1', model: 'Qwen/Qwen2.5-7B-Instruct' },
        { id: 'custom', label: '自定义', baseUrl: '', model: '' }
      ];

      // Crisp inline SVG icon library (Zero external icon CDN)
      const ICONS = {
        review: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 10h8M8 14h5"/></svg>',
        capture: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
        library: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>',
        settings: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
        lock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
        sparkle: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.3L19 10.2l-5.1 1.9L12 17.4l-1.9-5.3L5 10.2l5.1-1.9L12 3z"/></svg>',
        bulb: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>',
        edit: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
        undo: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>',
        trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
        search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',
        eye: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
        eyeOff: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94M9.9 4.24A10.8 10.8 0 0 1 12 4c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>',
        sun: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
        close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
        chevronRight: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'
      };

      // =====================================================================
      // 2. APPLICATION STATE
      // =====================================================================
      const state = {
        sbConfig: loadJsonStorage(STORAGE_KEYS.SUPABASE, { url: '', anonKey: '' }),
        session: loadJsonStorage(STORAGE_KEYS.SESSION, null),
        aiConfig: loadJsonStorage(STORAGE_KEYS.AI_LOCAL, {
          preset: 'openai_terra',
          baseUrl: 'https://api.openai.com/v1',
          apiKey: '',
          model: 'gpt-6.1-terra'
        }),
        prefs: {
          daily_limit: 50,
          mix_backlog: true,
          theme: loadJsonStorage(STORAGE_KEYS.THEME, 'light')
        },
        cards: [],
        activityLogs: [],
        activeTab: 'review',
        syncStatus: 'idle', // 'idle' | 'syncing' | 'ok' | 'error'
        syncQueue: [],
        syncFlushing: false,
        appMounted: false,

        // Review Session State (Daily counts derived from cloud activity_logs)
        review: {
          queue: [], // Array of { id, tier, extraBatch }
          index: 0,
          inExtraBatch: false,
          hasReservoir: false,
          phase: 'front', // 'front' | 'back'
          // Visibility-aware timers
          frontAccMs: 0,
          backAccMs: 0,
          segStartMs: 0,
          // Single micro-edit tracking (allows fixing typo in the SAME slot edited)
          editedThisReview: false,
          editedSlotIndex: null,
          editedHistoryIdx: null,
          activeTest: null, // { mode: string, prompt: string }
          activeTestLoading: false,
          activeTestTriggered: false,
          scaffoldQuestions: null,
          scaffoldLoading: false,
          scaffoldTriggered: false,
          undoStack: []
        },

        // Capture State
        capture: {
          raw: '',
          front: '',
          anchor: '',
          evoInit: '',
          domainTag: '', // Empty = AI auto-classify based on content
          formOpen: false,
          rawCollapsed: false,
          anchorMissingHint: false,
          aiSplitUsed: false,
          aiSplitSnapshot: null
        },

        // Library Filter State
        library: {
          viewMode: 'domain', // 'domain' | 'evolution'
          search: '',
          domain: '全部'
        }
      };

      // =====================================================================
      // 3. PWA ICON & DYNAMIC MANIFEST GENERATOR (ZERO EXTERNAL ASSETS)
      // =====================================================================
      function initPwaAssets() {
        try {
          const drawIconPng = (size) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            if (!ctx) return '';

            const r = size * 0.24;
            ctx.fillStyle = '#4E6E5D';
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(248, 246, 241, 0.95)';
            ctx.beginPath();
            ctx.moveTo(size * 0.29, size * 0.67);
            ctx.bezierCurveTo(size * 0.29, size * 0.42, size * 0.47, size * 0.29, size * 0.71, size * 0.29);
            ctx.bezierCurveTo(size * 0.71, size * 0.54, size * 0.54, size * 0.71, size * 0.29, size * 0.67);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#4E6E5D';
            ctx.beginPath();
            ctx.arc(size * 0.44, size * 0.53, size * 0.055, 0, Math.PI * 2);
            ctx.fill();

            return canvas.toDataURL('image/png');
          };

          const icon180 = drawIconPng(180);
          const icon512 = drawIconPng(512);

          if (icon180) {
            const appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            appleLink.sizes = '180x180';
            appleLink.href = icon180;
            document.head.appendChild(appleLink);
          }

          if (icon512) {
            const manifest = {
              name: '内化 · 轻量认知助手',
              short_name: '内化',
              description: '低认知负荷的遗忘曲线保鲜与认知螺旋内化工具',
              start_url: './',
              display: 'standalone',
              background_color: '#F8F6F1',
              theme_color: '#4E6E5D',
              icons: [
                { src: icon180, sizes: '180x180', type: 'image/png' },
                { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
              ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(blob);
            const mLink = document.createElement('link');
            mLink.rel = 'manifest';
            mLink.href = manifestUrl;
            document.head.appendChild(mLink);
          }
        } catch (_) {
          // Safe fallback if canvas/blob is restricted
        }
      }

      // =====================================================================
      // 4. STORAGE, CACHE, THEME, TOAST, MODAL & FORMATTING HELPERS
      // =====================================================================
      function loadJsonStorage(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (_) {
          return fallback;
        }
      }

      function saveJsonStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (_) {
          // Ignore quota errors
        }
      }

      function currentUserId() {
        return state.session?.user?.id || '';
      }

      function persistUserCache() {
        const uid = currentUserId();
        if (!uid) return;
        saveJsonStorage(STORAGE_KEYS.CACHE_PREFIX + uid, {
          cards: state.cards,
          prefs: state.prefs,
          activityLogs: state.activityLogs.slice(0, 2500),
          updatedAt: Date.now()
        });
      }

      function loadUserCache(uid) {
        if (!uid) return null;
        return loadJsonStorage(STORAGE_KEYS.CACHE_PREFIX + uid, null);
      }

      function persistSyncQueue() {
        const uid = currentUserId();
        if (!uid) return;
        saveJsonStorage(STORAGE_KEYS.SYNC_QUEUE_PREFIX + uid, state.syncQueue);
      }

      function loadSyncQueue(uid) {
        if (!uid) return [];
        const q = loadJsonStorage(STORAGE_KEYS.SYNC_QUEUE_PREFIX + uid, []);
        return Array.isArray(q) ? q : [];
      }

      function persistCaptureDraft() {
        const uid = currentUserId();
        if (!uid) return;
        saveJsonStorage(STORAGE_KEYS.DRAFT_PREFIX + uid, {
          raw: state.capture.raw,
          front: state.capture.front,
          anchor: state.capture.anchor,
          evoInit: state.capture.evoInit,
          domainTag: state.capture.domainTag,
          formOpen: state.capture.formOpen,
          rawCollapsed: state.capture.rawCollapsed
        });
      }

      function loadCaptureDraft(uid) {
        if (!uid) return;
        const d = loadJsonStorage(STORAGE_KEYS.DRAFT_PREFIX + uid, null);
        if (!d) return;
        state.capture.raw = String(d.raw || '');
        state.capture.front = String(d.front || '');
        state.capture.anchor = String(d.anchor || '');
        state.capture.evoInit = String(d.evoInit || '');
        state.capture.domainTag = String(d.domainTag || '');
        state.capture.formOpen = Boolean(d.formOpen);
        state.capture.rawCollapsed = Boolean(d.rawCollapsed);
      }

      function clearCaptureDraft() {
        const uid = currentUserId();
        if (uid) localStorage.removeItem(STORAGE_KEYS.DRAFT_PREFIX + uid);
        state.capture.raw = '';
        state.capture.front = '';
        state.capture.anchor = '';
        state.capture.evoInit = '';
        state.capture.domainTag = '';
        state.capture.formOpen = false;
        state.capture.rawCollapsed = false;
        state.capture.anchorMissingHint = false;
        state.capture.aiSplitUsed = false;
        state.capture.aiSplitSnapshot = null;
      }

      function clearPrivateUserStorage(uid) {
        if (!uid) return;
        try {
          localStorage.removeItem(STORAGE_KEYS.CACHE_PREFIX + uid);
          localStorage.removeItem(STORAGE_KEYS.SYNC_QUEUE_PREFIX + uid);
          localStorage.removeItem(STORAGE_KEYS.DRAFT_PREFIX + uid);
        } catch (_) {}
      }

      function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        const metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', isDark ? '#161513' : '#F8F6F1');
        saveJsonStorage(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light');
      }

      let toastTimer = null;
      function showToast(message, duration = 2800) {
        const wrap = document.getElementById('toast-wrap');
        const pill = document.getElementById('toast-pill');
        pill.textContent = message;
        wrap.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => wrap.classList.remove('show'), duration);
      }

      function openModal(html) {
        const root = document.getElementById('modal-root');
        const sheet = document.getElementById('modal-sheet');
        sheet.innerHTML = html;
        sheet.scrollTop = 0;
        root.classList.remove('hidden');
        document.body.classList.add('modal-open');
      }

      function closeModal() {
        const root = document.getElementById('modal-root');
        root.classList.add('hidden');
        document.getElementById('modal-sheet').innerHTML = '';
        document.body.classList.remove('modal-open');
      }

      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => showToast('已复制到剪贴板'),
            () => fallbackCopy(text)
          );
          return true;
        }
        return fallbackCopy(text);
      }

      function fallbackCopy(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) {
            showToast('已复制到剪贴板');
            return true;
          }
        } catch (_) {}
        showToast('复制受限，请长按文本框手动复制');
        return false;
      }

      function downloadFile(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function localDateKey(d = new Date()) {
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }

      function startOfTodayMs() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      }

      function endOfTodayMs() {
        const d = new Date();
        d.setHours(23, 59, 59, 999);
        return d.getTime();
      }

      function formatTime(isoOrMs) {
        if (!isoOrMs) return '-';
        const d = new Date(isoOrMs);
        if (Number.isNaN(d.getTime())) return '-';
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function isValidUuid(str) {
        return typeof str === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(str);
      }

      function makeClientId() {
        return `c_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      }

      function normalizeDomainLabel(tag) {
        const cleaned = String(tag || '').trim().replace(/\s+/g, '');
        return cleaned ? cleaned.slice(0, 14) : UNCLASSIFIED_LABEL;
      }

      /**
       * Dynamically collect existing user categories ordered by card count DESC
       */
      function getExistingDomains(includeUnclassified = false) {
        const counts = new Map();
        for (const c of state.cards) {
          const dom = normalizeDomainLabel(c.domain_tag);
          if (!includeUnclassified && dom === UNCLASSIFIED_LABEL) continue;
          counts.set(dom, (counts.get(dom) || 0) + 1);
        }
        return Array.from(counts.entries())
          .sort((a, b) => {
            if (a[0] === UNCLASSIFIED_LABEL) return 1;
            if (b[0] === UNCLASSIFIED_LABEL) return -1;
            return b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN');
          })
          .map(([name, count]) => ({ name, count }));
      }

      function setSyncStatus(status) {
        state.syncStatus = status;
        const dot = document.getElementById('sync-dot');
        const txt = document.getElementById('sync-dot-text');
        if (!dot || !txt) return;
        const pending = state.syncQueue.length;
        dot.className = 'sync-dot' + (status === 'syncing' ? ' syncing' : (status === 'error' || pending > 0) ? ' error' : '');
        if (status === 'syncing') {
          txt.textContent = pending > 0 ? `同步中 (${pending})` : '同步中';
        } else if (status === 'error' || pending > 0) {
          txt.textContent = pending > 0 ? `待同步 (${pending})` : '待重试';
        } else {
          txt.textContent = '云端已同步';
        }
      }

      // =====================================================================
      // 5. VISIBILITY-AWARE STOPWATCH FOR REVIEW TIMING
      // =====================================================================
      function pauseActiveReviewTimer() {
        if (state.activeTab !== 'review' || !state.review.segStartMs) return;
        const delta = Math.max(0, Date.now() - state.review.segStartMs);
        if (state.review.phase === 'front') state.review.frontAccMs += delta;
        else state.review.backAccMs += delta;
        state.review.segStartMs = 0;
      }

      function resumeActiveReviewTimer() {
        if (state.activeTab !== 'review' || document.hidden) return;
        if (state.review.index < state.review.queue.length && !state.review.segStartMs) {
          state.review.segStartMs = Date.now();
        }
      }

      function getCurrentPhaseElapsedMs() {
        const extra = (!document.hidden && state.review.segStartMs)
          ? Math.max(0, Date.now() - state.review.segStartMs)
          : 0;
        const raw = (state.review.phase === 'front' ? state.review.frontAccMs : state.review.backAccMs) + extra;
        return clamp(Math.round(raw), 80, 300000);
      }

      // =====================================================================
      // 6. FSRS-4.5 FORGETTING CURVE (2-BUTTON BALANCED) & 4-TIER SCHEDULER
      // =====================================================================
      const FSRS_W = [
        0.4072, 1.1829, 3.1262, 15.4722,
        7.2102, 0.5316, 1.0651, 0.0234,
        1.616, 0.1544, 1.0824, 1.9813,
        0.0953, 0.2975, 2.2042, 0.2407, 2.9466
      ];
      const FSRS_FACTOR = 19 / 81;
      const FSRS_DECAY = -0.5;

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      /**
       * FSRS-4.5 Retrievability: R(t, S) = (1 + (19/81) * (t / S))^(-0.5)
       */
      function computeRetrievability(fsrsState, nowMs = Date.now()) {
        if (!fsrsState || !fsrsState.last_review) return 0.9;
        const lastMs = new Date(fsrsState.last_review).getTime();
        if (Number.isNaN(lastMs)) return 0.9;
        const elapsedDays = Math.max(0, (nowMs - lastMs) / MS_PER_DAY);
        const S = Math.max(0.15, Number(fsrsState.stability) || 1.0);
        return Math.pow(1 + FSRS_FACTOR * (elapsedDays / S), FSRS_DECAY);
      }

      /**
       * Create initial FSRS state for a newly captured card (tomorrow AND >= 6h later)
       */
      function createInitialFsrsState(nowMs = Date.now()) {
        const dueMs = Math.max(startOfTodayMs() + MS_PER_DAY, nowMs + MIN_FIRST_REVIEW_DELAY_MS);
        const dueIso = new Date(dueMs).toISOString();
        return {
          stability: 1.0,
          difficulty: 5.0,
          elapsed_days: 0,
          scheduled_days: 1,
          reps: 0,
          lapses: 0,
          state: 0, // 0=New, 1=Learning, 2=Review, 3=Relearning
          last_review: new Date(nowMs).toISOString(),
          due: dueIso
        };
      }

      /**
       * Balanced 2-button FSRS-4.5 scheduler (eliminates binary Ease/Difficulty Hell):
       * 'good' -> Rating 3 (想起来了)
       * 'again' -> Rating 1 (有点模糊)
       */
      function scheduleFsrsCard(prev, ratingKey, nowMs = Date.now()) {
        const G = ratingKey === 'good' ? 3 : 1;
        const base = prev && typeof prev === 'object' ? prev : createInitialFsrsState(nowMs - MS_PER_DAY);

        const lastMs = base.last_review ? new Date(base.last_review).getTime() : (nowMs - MS_PER_DAY);
        const elapsedDays = Number(Math.max(0, (nowMs - lastMs) / MS_PER_DAY).toFixed(2));
        const prevReps = Number(base.reps) || 0;
        const prevLapses = Number(base.lapses) || 0;

        let S, D, scheduledDays, nextState;

        if (prevReps === 0 || base.state === 0) {
          if (G === 3) {
            S = FSRS_W[2]; // ~3.13 days
            D = 5.0;       // Neutral midpoint for 2-button scale
            scheduledDays = Math.max(1, Math.round(S));
            nextState = 2;
          } else {
            S = FSRS_W[0]; // ~0.41 days
            D = 6.2;
            scheduledDays = 1;
            nextState = 1;
          }
        } else {
          const prevS = Math.max(0.25, Number(base.stability) || 1.0);
          const prevD = clamp(Number(base.difficulty) || 5.0, 1.5, 9.5);
          const R = Math.pow(1 + FSRS_FACTOR * (elapsedDays / prevS), FSRS_DECAY);

          if (G === 3) {
            // Smooth difficulty recovery & gentle mastery progression
            const targetD = 4.5;
            const stepBonus = prevD > 4.5 ? 0.25 : 0.12;
            D = clamp(0.18 * targetD + 0.82 * prevD - stepBonus, 1.5, 9.5);

            const inc = Math.exp(FSRS_W[8]) *
              (11 - D) *
              Math.pow(prevS, -FSRS_W[9]) *
              (Math.exp(FSRS_W[10] * (1 - R)) - 1);
            S = clamp(prevS * (1 + Math.max(0.25, inc)), 1.0, 365);
            const minNextDay = Math.min(365, Math.max(2, Math.round(prevS) + 1));
            scheduledDays = clamp(Math.round(S), minNextDay, 365);
            nextState = 2;
          } else {
            // Gentle lapse penalty without trapping card in permanent high difficulty
            D = clamp(prevD + 1.15, 1.5, 9.5);

            const sf = FSRS_W[11] *
              Math.pow(D, -FSRS_W[12]) *
              (Math.pow(prevS + 1, FSRS_W[13]) - 1) *
              Math.exp(FSRS_W[14] * (1 - R));
            S = clamp(Math.min(prevS * 0.7, sf), 0.35, 30);
            scheduledDays = 1;
            nextState = 3;
          }
        }

        const dueIso = new Date(startOfTodayMs() + scheduledDays * MS_PER_DAY).toISOString();
        return {
          stability: Number(S.toFixed(2)),
          difficulty: Number(D.toFixed(2)),
          elapsed_days: elapsedDays,
          scheduled_days: scheduledDays,
          reps: prevReps + 1,
          lapses: G === 1 ? prevLapses + 1 : prevLapses,
          state: nextState,
          last_review: new Date(nowMs).toISOString(),
          due: dueIso
        };
      }

      /**
       * Derive today's usage records strictly from cloud-backed activity_logs
       * (Survives page refreshes, PWA restarts, and multi-device switching)
       */
      function getTodayCloudStats() {
        const todayStart = startOfTodayMs();
        const todayKey = localDateKey();
        const reviewedTodayIds = new Set();
        let reviewedTodayCount = 0;
        let sunkenShownToday = 0;

        for (const log of state.activityLogs) {
          if (log.event_type !== 'review' || log._undone) continue;
          const p = log.payload || {};
          const matchDay = p.session_date
            ? p.session_date === todayKey
            : (log.created_at && new Date(log.created_at).getTime() >= todayStart);
          if (!matchDay) continue;

          reviewedTodayCount++;
          if (log.card_id) reviewedTodayIds.add(log.card_id);
          if (p.tier === 'tier4') sunkenShownToday++;
        }

        return {
          reviewedTodayCount,
          reviewedTodayIds,
          sunkenShownToday
        };
      }

      /**
       * Partition due cards into the 4 anti-avalanche priority tiers
       */
      function classifyTiers(excludeSet) {
        const now = Date.now();
        const todayStart = startOfTodayMs();
        const todayEnd = endOfTodayMs();

        const tier1 = []; // Due today & fresh (scheduled_days <= 7 or reps <= 2)
        const tier2 = []; // Due today & stable
        const tier3 = []; // Historical overdue reservoir, R >= 0.30 (semi-ripe)
        const tier4 = []; // Historical overdue reservoir, R < 0.30 (sunken)

        for (const card of state.cards) {
          if (excludeSet.has(card.id)) continue;
          const dueMs = card.due_at ? new Date(card.due_at).getTime() : todayStart;
          if (dueMs > todayEnd) continue; // Future card, not due yet

          const fsrs = card.fsrs_state || {};
          const sched = Number(fsrs.scheduled_days) || 1;
          const reps = Number(fsrs.reps) || 0;
          const R = computeRetrievability(fsrs, now);

          if (dueMs >= todayStart) {
            if (sched <= 7 || reps <= 2) {
              tier1.push({ card, sched, dueMs, R });
            } else {
              tier2.push({ card, sched, dueMs, R });
            }
          } else {
            if (R >= 0.30) {
              tier3.push({ card, R, dueMs });
            } else {
              tier4.push({ card, R, dueMs });
            }
          }
        }

        tier1.sort((a, b) => a.sched - b.sched || a.dueMs - b.dueMs);
        tier2.sort((a, b) => a.dueMs - b.dueMs);
        tier3.sort((a, b) => b.R - a.R);
        tier4.sort((a, b) => b.R - a.R);

        return {
          tier1: tier1.map(x => x.card),
          tier2: tier2.map(x => x.card),
          tier3: tier3.map(x => x.card),
          tier4: tier4.map(x => x.card)
        };
      }

      /**
       * Build today's clean queue honoring cloud-persisted daily cap,
       * post-break semi-ripe rescue, silent 1-in-4 mixing, and 1-2/day sunken revival.
       */
      function buildTodayQueue() {
        const cap = clamp(Number(state.prefs.daily_limit) || 50, 5, 150);
        const mix = Boolean(state.prefs.mix_backlog);
        const stats = getTodayCloudStats();
        const remainingQuota = Math.max(0, cap - stats.reviewedTodayCount);

        const { tier1, tier2, tier3, tier4 } = classifyTiers(stats.reviewedTodayIds);
        const allAvailableCount = tier1.length + tier2.length + tier3.length + tier4.length;

        state.review.inExtraBatch = false;

        if (remainingQuota === 0) {
          state.review.queue = [];
          state.review.index = 0;
          state.review.hasReservoir = allAvailableCount > 0;
          resetCardTurnState();
          return;
        }

        const todayDue = [
          ...tier1.map(c => ({ id: c.id, tier: 'tier1' })),
          ...tier2.map(c => ({ id: c.id, tier: 'tier2' }))
        ];

        const queue = [];
        let t3Idx = 0;
        let t4Idx = 0;
        let todayCount = 0;
        let sunkenPlanned = stats.sunkenShownToday;

        // 1. Add strictly today-due cards, silently mixing 1 Tier-3 every 4 cards
        for (const item of todayDue) {
          if (queue.length >= remainingQuota) break;
          queue.push({ id: item.id, tier: item.tier, extraBatch: false });
          todayCount++;
          if (mix && todayCount % 4 === 0 && t3Idx < tier3.length && queue.length < remainingQuota) {
            queue.push({ id: tier3[t3Idx++].id, tier: 'tier3', extraBatch: false });
          }
        }

        // 2. Valley-fill & Post-break rescue:
        //    - If returning after skipping days (todayDue == 0), gently rescue high-R semi-ripe cards up to 30% of cap (min 10)
        //    - Otherwise top up to 5-card minimum floor
        const targetFill = todayDue.length === 0
          ? Math.min(remainingQuota, Math.max(10, Math.round(cap * 0.3)))
          : Math.min(5, remainingQuota);

        while (queue.length < targetFill && t3Idx < tier3.length) {
          queue.push({ id: tier3[t3Idx++].id, tier: 'tier3', extraBatch: false });
        }

        // 3. Slow sunken revival: allow 1-2 Tier-4 sunken cards per day across sessions
        if (mix && tier4.length > 0 && sunkenPlanned < 2) {
          const sunkenAllowed = Math.min(2 - sunkenPlanned, tier4.length);
          for (let k = 0; k < sunkenAllowed; k++) {
            const sunkenItem = { id: tier4[t4Idx].id, tier: 'tier4', extraBatch: false };
            if (queue.length < remainingQuota) {
              // Place after initial warm-up cards if possible
              const insertPos = queue.length >= 4 ? queue.length - 1 : queue.length;
              queue.splice(insertPos, 0, sunkenItem);
              t4Idx++;
              sunkenPlanned++;
            } else if (queue.length >= 10) {
              // Gently swap one non-Tier-1 slot near the back so sunken cards actually revive
              let swapIdx = -1;
              for (let j = queue.length - 1; j >= 5; j--) {
                if (queue[j].tier === 'tier3' || queue[j].tier === 'tier2') {
                  swapIdx = j;
                  break;
                }
              }
              if (swapIdx >= 0) {
                queue[swapIdx] = sunkenItem;
                t4Idx++;
                sunkenPlanned++;
              }
            }
          }
        }

        // Boolean-only reservoir check (STRICTLY never expose overdue counts!)
        const queuedIds = new Set(queue.map(q => q.id));
        state.review.hasReservoir = [...tier1, ...tier2, ...tier3, ...tier4].some(c => !queuedIds.has(c.id));

        state.review.queue = queue;
        state.review.index = 0;
        resetCardTurnState();
      }

      /**
       * Voluntary extra batch: "顺手再捞 10 张"
       */
      function pullExtraTenCards() {
        const stats = getTodayCloudStats();
        const { tier1, tier2, tier3, tier4 } = classifyTiers(stats.reviewedTodayIds);
        const batch = [];
        let sunkenPlanned = stats.sunkenShownToday;

        for (const c of tier1) {
          if (batch.length >= 10) break;
          batch.push({ id: c.id, tier: 'tier1', extraBatch: true });
        }
        for (const c of tier2) {
          if (batch.length >= 10) break;
          batch.push({ id: c.id, tier: 'tier2', extraBatch: true });
        }
        for (const c of tier3) {
          if (batch.length >= 10) break;
          batch.push({ id: c.id, tier: 'tier3', extraBatch: true });
        }
        for (const c of tier4) {
          if (batch.length >= 10) break;
          if (sunkenPlanned >= 2) break;
          batch.push({ id: c.id, tier: 'tier4', extraBatch: true });
          sunkenPlanned++;
        }

        if (batch.length === 0) {
          state.review.hasReservoir = false;
          showToast('蓄水池暂时已经清空啦');
          renderReviewTab();
          return;
        }

        const picked = new Set(batch.map(x => x.id));
        state.review.hasReservoir = [...tier1, ...tier2, ...tier3, ...tier4].some(c => !picked.has(c.id));
        state.review.queue = batch;
        state.review.index = 0;
        state.review.inExtraBatch = true;
        resetCardTurnState();
        renderReviewTab();
      }

      function resetCardTurnState() {
        state.review.phase = 'front';
        state.review.frontAccMs = 0;
        state.review.backAccMs = 0;
        state.review.segStartMs = (!document.hidden && state.activeTab === 'review') ? Date.now() : 0;
        state.review.editedThisReview = false;
        state.review.editedSlotIndex = null;
        state.review.editedHistoryIdx = null;
        state.review.activeTest = null;
        state.review.activeTestLoading = false;
        state.review.activeTestTriggered = false;
        state.review.scaffoldQuestions = null;
        state.review.scaffoldLoading = false;
        state.review.scaffoldTriggered = false;
      }

      // =====================================================================
      // 7. NATIVE FETCH SUPABASE AUTH, POSTGREST & OPTIMISTIC SYNC QUEUE
      // =====================================================================
      function cleanBaseUrl(url) {
        return String(url || '').trim().replace(/\/+$/, '');
      }

      function translateSupabaseError(status, bodyText) {
        const msg = String(bodyText || '').toLowerCase();
        if (msg.includes('invalid login credentials') || msg.includes('invalid_grant')) {
          return '邮箱或密码不正确，请检查后再试。';
        }
        if (msg.includes('email not confirmed')) {
          return '该邮箱尚未在 Supabase 后台确认（勾选 Auto Confirm User 即可）。';
        }
        if (msg.includes('invalid api key') || status === 401) {
          return 'Supabase Anon Key 无效或登录已过期，请核对配置或重新登录。';
        }
        if (msg.includes('relation') && msg.includes('does not exist')) {
          return '数据库尚未建表，请先在 Supabase SQL Editor 运行建表脚本。';
        }
        if (msg.includes('row-level security') || status === 403) {
          return '没有权限操作数据，请检查 Supabase 的 RLS 安全策略是否已正确执行。';
        }
        if (status === 0) {
          return '网络连接失败，请检查 Supabase Project URL 格式或当前手机网络。';
        }
        return `云端请求失败 (${status})，请稍后重试。`;
      }

      async function sbPasswordLogin(url, anonKey, email, password) {
        const endpoint = `${cleanBaseUrl(url)}/auth/v1/token?grant_type=password`;
        let resp;
        try {
          resp = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'apikey': anonKey.trim(),
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email.trim(), password })
          });
        } catch (_) {
          throw new Error(translateSupabaseError(0, ''));
        }

        const text = await resp.text();
        if (!resp.ok) {
          throw new Error(translateSupabaseError(resp.status, text));
        }

        const data = JSON.parse(text);
        const expiresAt = data.expires_at
          ? data.expires_at * 1000
          : Date.now() + (data.expires_in || 3600) * 1000;

        return {
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          expires_at: expiresAt,
          user: {
            id: data.user?.id || '',
            email: data.user?.email || email.trim()
          }
        };
      }

      let refreshPromise = null;
      async function ensureValidAccessToken(forceRefresh = false) {
        if (!state.session || !state.sbConfig.url || !state.sbConfig.anonKey) {
          throw new Error('会话未就绪');
        }

        const now = Date.now();
        const needsRefresh = forceRefresh || !state.session.expires_at || (state.session.expires_at - now < 120000);
        if (!needsRefresh) return state.session.access_token;

        if (!state.session.refresh_token) {
          handleSessionExpired();
          throw new Error('登录已过期，请重新登录');
        }

        if (!refreshPromise) {
          refreshPromise = (async () => {
            const endpoint = `${cleanBaseUrl(state.sbConfig.url)}/auth/v1/token?grant_type=refresh_token`;
            const resp = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'apikey': state.sbConfig.anonKey,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ refresh_token: state.session.refresh_token })
            });
            if (!resp.ok) {
              handleSessionExpired();
              throw new Error('登录状态已失效，请重新登录');
            }
            const data = await resp.json();
            const expiresAt = data.expires_at
              ? data.expires_at * 1000
              : Date.now() + (data.expires_in || 3600) * 1000;

            state.session = {
              access_token: data.access_token,
              refresh_token: data.refresh_token || state.session.refresh_token,
              expires_at: expiresAt,
              user: {
                id: data.user?.id || state.session.user?.id || '',
                email: data.user?.email || state.session.user?.email || ''
              }
            };
            saveJsonStorage(STORAGE_KEYS.SESSION, state.session);
            return state.session.access_token;
          })().finally(() => {
            refreshPromise = null;
          });
        }

        return refreshPromise;
      }

      function handleSessionExpired() {
        const uid = currentUserId();
        clearPrivateUserStorage(uid);
        state.session = null;
        localStorage.removeItem(STORAGE_KEYS.SESSION);
        state.cards = [];
        state.activityLogs = [];
        state.syncQueue = [];
        state.review.undoStack = [];
        state.appMounted = false;
        showAuthWall('登录状态已过期，请重新安全登录。');
      }

      async function sbLogout() {
        const uid = currentUserId();
        try {
          if (state.session?.access_token && state.sbConfig.url && state.sbConfig.anonKey) {
            await fetch(`${cleanBaseUrl(state.sbConfig.url)}/auth/v1/logout`, {
              method: 'POST',
              headers: {
                'apikey': state.sbConfig.anonKey,
                'Authorization': `Bearer ${state.session.access_token}`
              }
            });
          }
        } catch (_) {}
        clearPrivateUserStorage(uid);
        state.session = null;
        localStorage.removeItem(STORAGE_KEYS.SESSION);
        state.cards = [];
        state.activityLogs = [];
        state.syncQueue = [];
        state.review.undoStack = [];
        state.appMounted = false;
        showAuthWall();
        showToast('已安全退出登录');
      }

      async function sbRest(path, options = {}, retried = false) {
        const token = await ensureValidAccessToken(retried);
        const url = `${cleanBaseUrl(state.sbConfig.url)}/rest/v1/${path}`;
        const headers = {
          'apikey': state.sbConfig.anonKey,
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          ...(options.headers || {})
        };

        let resp;
        try {
          resp = await fetch(url, {
            method: options.method || 'GET',
            headers,
            body: options.body !== undefined ? JSON.stringify(options.body) : undefined
          });
        } catch (_) {
          setSyncStatus('error');
          throw new Error('网络不太顺畅，未能连接云端数据库');
        }

        if (resp.status === 401 && !retried) {
          return sbRest(path, options, true);
        }

        const text = await resp.text();
        if (!resp.ok) {
          setSyncStatus('error');
          throw new Error(translateSupabaseError(resp.status, text));
        }

        if (!text) return null;
        try {
          return JSON.parse(text);
        } catch (_) {
          return null;
        }
      }

      // --- Paginated Cloud Fetchers (Never truncated at 500 rows) ---
      async function fetchPaginatedTable(baseQuery, maxRows = 5000, pageSize = 1000) {
        const all = [];
        for (let offset = 0; offset < maxRows; offset += pageSize) {
          const sep = baseQuery.includes('?') ? '&' : '?';
          const chunk = await sbRest(`${baseQuery}${sep}limit=${pageSize}&offset=${offset}`);
          if (!Array.isArray(chunk) || chunk.length === 0) break;
          all.push(...chunk);
          if (chunk.length < pageSize) break;
        }
        return all;
      }

      async function fetchAllUserData() {
        setSyncStatus('syncing');
        const userId = state.session.user.id;
        const [cardsData, prefsData, logsData] = await Promise.all([
          fetchPaginatedTable('cards?select=*&order=created_at.desc', 5000, 1000),
          sbRest(`user_prefs?user_id=eq.${encodeURIComponent(userId)}&select=*`),
          fetchPaginatedTable('activity_logs?select=*&order=created_at.desc', 5000, 1000)
        ]);

        state.cards = Array.isArray(cardsData) ? cardsData : [];
        state.activityLogs = Array.isArray(logsData) ? logsData : [];

        if (Array.isArray(prefsData) && prefsData.length > 0) {
          const p = prefsData[0];
          state.prefs = {
            daily_limit: Number(p.daily_limit) || 50,
            mix_backlog: p.mix_backlog !== undefined ? Boolean(p.mix_backlog) : true,
            theme: p.theme === 'dark' ? 'dark' : 'light'
          };
          applyTheme(state.prefs.theme);
        } else {
          enqueueSyncOp({ type: 'save_prefs' });
        }

        persistUserCache();
        setSyncStatus('ok');
      }

      // --- Background Optimistic Sync Queue ---
      function enqueueSyncOp(op) {
        state.syncQueue.push({
          opId: makeClientId(),
          createdAt: Date.now(),
          ...op
        });
        persistSyncQueue();
        flushSyncQueue();
      }

      async function flushSyncQueue() {
        if (state.syncFlushing || !state.session?.access_token) return;
        if (state.syncQueue.length === 0) {
          setSyncStatus('ok');
          return;
        }

        state.syncFlushing = true;
        setSyncStatus('syncing');

        try {
          while (state.syncQueue.length > 0) {
            const op = state.syncQueue[0];
            if (op.type === 'patch_card') {
              await sbRest(`cards?id=eq.${encodeURIComponent(op.cardId)}`, {
                method: 'PATCH',
                body: op.patch
              });
            } else if (op.type === 'delete_card') {
              await sbRest(`cards?id=eq.${encodeURIComponent(op.cardId)}`, {
                method: 'DELETE'
              });
            } else if (op.type === 'insert_log') {
              const rows = await sbRest('activity_logs', {
                method: 'POST',
                headers: { 'Prefer': 'return=representation' },
                body: op.row
              });
              const created = Array.isArray(rows) ? rows[0] : rows;
              if (created?.id && op.clientId) {
                const localLog = state.activityLogs.find(l => l._clientId === op.clientId);
                if (localLog) {
                  localLog.id = created.id;
                  // If user already undid this log before it finished syncing, immediately delete it in cloud
                  if (localLog._undone) {
                    state.syncQueue.push({
                      opId: makeClientId(),
                      type: 'delete_log',
                      logId: created.id,
                      createdAt: Date.now()
                    });
                  }
                }
              }
            } else if (op.type === 'delete_log') {
              if (op.logId) {
                await sbRest(`activity_logs?id=eq.${encodeURIComponent(op.logId)}`, {
                  method: 'DELETE'
                });
              }
            } else if (op.type === 'save_prefs') {
              await sbRest('user_prefs?on_conflict=user_id', {
                method: 'POST',
                headers: { 'Prefer': 'resolution=merge-duplicates' },
                body: {
                  user_id: state.session.user.id,
                  daily_limit: Number(state.prefs.daily_limit) || 50,
                  mix_backlog: Boolean(state.prefs.mix_backlog),
                  theme: state.prefs.theme
                }
              });
            }

            state.syncQueue.shift();
            persistSyncQueue();
            persistUserCache();
          }
          setSyncStatus('ok');
        } catch (_) {
          setSyncStatus('error');
        } finally {
          state.syncFlushing = false;
        }
      }

      // --- Data Operations matching exact Supabase schema ---
      async function insertCardToCloud(cardPayload) {
        setSyncStatus('syncing');
        const body = {
          user_id: state.session.user.id,
          ...cardPayload
        };
        const rows = await sbRest('cards', {
          method: 'POST',
          headers: { 'Prefer': 'return=representation' },
          body
        });
        const created = Array.isArray(rows) ? rows[0] : rows;
        if (created) {
          state.cards.unshift(created);
          persistUserCache();
        }
        setSyncStatus('ok');
        return created;
      }

      function updateCardOptimistic(cardId, patch) {
        const body = { ...patch, updated_at: new Date().toISOString() };
        const idx = state.cards.findIndex(c => c.id === cardId);
        if (idx >= 0) {
          state.cards[idx] = { ...state.cards[idx], ...body };
          persistUserCache();
        }
        enqueueSyncOp({ type: 'patch_card', cardId, patch: body });
        return idx >= 0 ? state.cards[idx] : null;
      }

      function deleteCardOptimistic(cardId) {
        state.cards = state.cards.filter(c => c.id !== cardId);
        // Clean references on other cards locally
        state.cards.forEach(c => {
          if (c.cross_link_id === cardId) {
            c.cross_link_id = null;
            c.cross_link_hint = null;
          }
        });
        // Adjust review queue index safely if deleting current or earlier item
        const qIdx = state.review.queue.findIndex(item => item.id === cardId);
        if (qIdx >= 0) {
          state.review.queue.splice(qIdx, 1);
          if (qIdx < state.review.index) {
            state.review.index = Math.max(0, state.review.index - 1);
          } else if (qIdx === state.review.index) {
            resetCardTurnState();
          }
        }
        persistUserCache();
        enqueueSyncOp({ type: 'delete_card', cardId });
      }

      function logActivityCloud(eventType, cardId, payload) {
        if (!state.session?.user?.id) return null;
        const clientId = makeClientId();
        const row = {
          user_id: state.session.user.id,
          event_type: eventType,
          card_id: cardId || null,
          payload: payload || {}
        };
        const localRecord = {
          ...row,
          _clientId: clientId,
          created_at: new Date().toISOString()
        };
        state.activityLogs.unshift(localRecord);
        persistUserCache();
        enqueueSyncOp({ type: 'insert_log', row, clientId });
        return clientId;
      }

      function undoActivityLogCloud(clientId) {
        if (!clientId) return;
        const idx = state.activityLogs.findIndex(l => l._clientId === clientId);
        if (idx >= 0) {
          const log = state.activityLogs[idx];
          log._undone = true;
          const dbId = log.id;
          state.activityLogs.splice(idx, 1);
          persistUserCache();

          // If still queued for insert, remove it before hitting server; otherwise delete in cloud
          const pendingIdx = state.syncQueue.findIndex(op => op.type === 'insert_log' && op.clientId === clientId);
          if (pendingIdx >= 0) {
            state.syncQueue.splice(pendingIdx, 1);
            persistSyncQueue();
          } else if (dbId) {
            enqueueSyncOp({ type: 'delete_log', logId: dbId });
          }
        }
      }
